name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project and coverage file
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/src" "$P/coverage"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' 'export function add(a: number, b: number): number {' '  return a + b;' '}' 'console.log(add(1, 2));' > "$P/src/index.ts"
          # Istanbul coverage recorded under a different checkout root (/ci/build)
          cat > "$P/coverage/coverage-final.json" <<'EOF'
          {
            "/ci/build/src/index.ts": {
              "path": "/ci/build/src/index.ts",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}},
                "1": {"start": {"line": 4, "column": 0}, "end": {"line": 4, "column": 23}}
              },
              "fnMap": {
                "0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}},
                      "loc": {"start": {"line": 1, "column": 49}, "end": {"line": 3, "column": 1}}, "line": 1}
              },
              "branchMap": {},
              "s": {"0": 1, "1": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF
          sed -i 's/^          //' "$P/coverage/coverage-final.json"
          jq empty "$P/coverage/coverage-final.json"

      - id: action
        uses: .
        with:
          command: health
          root: fx-project
          coverage: ${{ github.workspace }}/fx-project/coverage/coverage-final.json
          coverage-root: /ci/build
          max-crap: '30'
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert health outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
