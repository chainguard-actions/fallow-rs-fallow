name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul coverage file
        run: |
          mkdir -p fallow-cov
          cat > fallow-cov/coverage-final.json <<'EOF'
          {
            "/ci-build/src/helper.ts": {
              "path": "/ci-build/src/helper.ts",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 19}},
                "1": {"start": {"line": 6, "column": 2}, "end": {"line": 6, "column": 19}}
              },
              "fnMap": {
                "0": {"name": "usedHelper", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 26}}, "loc": {"start": {"line": 1, "column": 50}, "end": {"line": 3, "column": 1}}, "line": 1},
                "1": {"name": "neverUsedHelper", "decl": {"start": {"line": 5, "column": 16}, "end": {"line": 5, "column": 31}}, "loc": {"start": {"line": 5, "column": 55}, "end": {"line": 7, "column": 1}}, "line": 5}
              },
              "branchMap": {},
              "s": {"0": 1, "1": 0},
              "f": {"0": 1, "1": 0},
              "b": {}
            }
          }
          EOF
          jq empty fallow-cov/coverage-final.json
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          coverage: ${{ github.workspace }}/fallow-cov/coverage-final.json
          coverage-root: /ci-build
          max-crap: '5'
      - name: Assert health ran with coverage
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
