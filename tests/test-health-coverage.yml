name: Test health with Istanbul coverage for CRAP scoring
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fallow-cov"
          cat > "$GITHUB_WORKSPACE/fallow-cov/coverage-final.json" <<'EOF'
          {
            "/ci-build/src/math.ts": {
              "path": "/ci-build/src/math.ts",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}},
                "1": {"start": {"line": 6, "column": 2}, "end": {"line": 6, "column": 15}}
              },
              "fnMap": {
                "0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 50}, "end": {"line": 3, "column": 1}}, "line": 1},
                "1": {"name": "subtractNeverUsed", "decl": {"start": {"line": 5, "column": 16}, "end": {"line": 5, "column": 33}}, "loc": {"start": {"line": 5, "column": 64}, "end": {"line": 7, "column": 1}}, "line": 5}
              },
              "branchMap": {},
              "s": {"0": 5, "1": 0},
              "f": {"0": 5, "1": 0},
              "b": {}
            }
          }
          EOF
          jq empty "$GITHUB_WORKSPACE/fallow-cov/coverage-final.json"
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          coverage: ${{ github.workspace }}/fallow-cov/coverage-final.json
          coverage-root: /ci-build
          artifacts-dir: fallow-artifacts-health-coverage
      - name: Assert health results produced
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
