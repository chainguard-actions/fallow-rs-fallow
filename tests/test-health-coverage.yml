name: Test health with Istanbul coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Create Istanbul coverage-final.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cov"
          ROOT="$GITHUB_WORKSPACE/tests/fixtures/simple-js"
          jq -n --arg f "$ROOT/complex.js" '{
            ($f): {
              path: $f,
              statementMap: {"0": {start: {line: 8, column: 12}, end: {line: 8, column: 37}}},
              fnMap: {"0": {name: "complexFunction", decl: {start: {line: 2, column: 16}, end: {line: 2, column: 31}}, loc: {start: {line: 2, column: 46}, end: {line: 24, column: 1}}, line: 2}},
              branchMap: {},
              s: {"0": 1},
              f: {"0": 1},
              b: {}
            }
          }' > "$GITHUB_WORKSPACE/cov/coverage-final.json"
          cat "$GITHUB_WORKSPACE/cov/coverage-final.json"

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          coverage: ${{ github.workspace }}/cov/coverage-final.json
          coverage-root: ${{ github.workspace }}/tests/fixtures/simple-js
          max-crap: '30'

      - name: Assert coverage run completed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
