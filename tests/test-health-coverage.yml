name: Test health command with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project and coverage file
        run: |
          mkdir -p proj/src proj/coverage
          cat > proj/package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js","type":"module"}
          EOF
          cat > proj/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > proj/src/math.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          EOF
          cat > proj/coverage/coverage-final.json <<'EOF'
          {
            "/ci/build/src/math.js": {
              "path": "/ci/build/src/math.js",
              "statementMap": {"0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 3, "column": 1}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: proj
          coverage: ${{ github.workspace }}/proj/coverage/coverage-final.json
          coverage-root: /ci/build
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
