name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write minimal Istanbul coverage file
        run: |
          mkdir -p "$RUNNER_TEMP/cov"
          cat > "$RUNNER_TEMP/cov/coverage-final.json" <<'EOF'
          {
            "/ci-build/src/math.ts": {
              "path": "/ci-build/src/math.ts",
              "statementMap": {},
              "fnMap": {},
              "branchMap": {},
              "s": {},
              "f": {},
              "b": {}
            }
          }
          EOF
          echo "COV_FILE=$RUNNER_TEMP/cov/coverage-final.json" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.43.1'
          format: json
          coverage: ${{ env.COV_FILE }}
          coverage-root: /ci-build
          max-crap: '30'
          fail-on-issues: 'false'
      - name: Assert coverage-aware health ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq . "$RESULTS" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
