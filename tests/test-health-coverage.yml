name: Test health with Istanbul coverage and coverage-root rebasing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project and Istanbul coverage file
        run: |
          set -e
          D=fx-coverage
          rm -rf "$D"
          mkdir -p "$D/src" "$D/coverage"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-coverage","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          export function add(a, b) {
            if (a > b) {
              return a - b;
            }
            return a + b;
          }
          console.log(add(1, 2));
          EOF
          cat > "$D/coverage/coverage-final.json" <<'EOF'
          {
            "/ci-build/project/src/index.js": {
              "path": "/ci-build/project/src/index.js",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 4, "column": 3}},
                "1": {"start": {"line": 3, "column": 4}, "end": {"line": 3, "column": 17}},
                "2": {"start": {"line": 5, "column": 2}, "end": {"line": 5, "column": 15}},
                "3": {"start": {"line": 7, "column": 0}, "end": {"line": 7, "column": 23}}
              },
              "fnMap": {
                "0": {
                  "name": "add",
                  "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}},
                  "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 6, "column": 1}},
                  "line": 1
                }
              },
              "branchMap": {
                "0": {
                  "loc": {"start": {"line": 2, "column": 2}, "end": {"line": 4, "column": 3}},
                  "type": "if",
                  "locations": [
                    {"start": {"line": 2, "column": 2}, "end": {"line": 4, "column": 3}},
                    {"start": {"line": 2, "column": 2}, "end": {"line": 4, "column": 3}}
                  ],
                  "line": 2
                }
              },
              "s": {"0": 1, "1": 0, "2": 1, "3": 1},
              "f": {"0": 1},
              "b": {"0": [0, 1]}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-coverage
          coverage: ${{ github.workspace }}/fx-coverage/coverage/coverage-final.json
          coverage-root: /ci-build/project
          artifacts-dir: fx-coverage-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs and forwarded flags
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file '$RESULTS'"; exit 1; }
          ARGS_FILE=fx-coverage-artifacts/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--coverage " "--coverage-root /ci-build/project"; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected '$flag' in analysis args"
              exit 1
            fi
          done
          echo "PASS"
