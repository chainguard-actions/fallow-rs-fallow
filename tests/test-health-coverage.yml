name: Test health command with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project and Istanbul coverage file
        run: |
          rm -rf sample-app sample-cov && mkdir -p sample-app/src sample-cov
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample-app/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          EOF
          cat > sample-app/src/index.js <<'EOF'
          import { add } from './math.js';
          export function main() { return add(1, 2); }
          EOF
          cat > sample-cov/coverage-final.json <<'EOF'
          {
            "/ci-build/src/math.js": {
              "path": "/ci-build/src/math.js",
              "statementMap": {"0": {"start": {"line": 1, "column": 30}, "end": {"line": 1, "column": 43}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 1, "column": 45}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF
          jq empty sample-cov/coverage-final.json

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          coverage: ${{ github.workspace }}/sample-cov/coverage-final.json
          coverage-root: /ci-build
          max-crap: '30'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number and results valid
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
