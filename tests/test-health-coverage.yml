name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project and Istanbul coverage data
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-coverage"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "coverage-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            if (a > b) { return a - b; }
            return a + b;
          }
          console.log(add(1, 2));
          EOF
          cat > "$P/coverage-final.json" <<'EOF'
          {
            "/ci-build/src/index.js": {
              "path": "/ci-build/src/index.js",
              "statementMap": {
                "0": { "start": { "line": 2, "column": 2 }, "end": { "line": 2, "column": 32 } },
                "1": { "start": { "line": 3, "column": 2 }, "end": { "line": 3, "column": 15 } }
              },
              "fnMap": {
                "0": {
                  "name": "add",
                  "decl": { "start": { "line": 1, "column": 16 }, "end": { "line": 1, "column": 19 } },
                  "loc": { "start": { "line": 1, "column": 26 }, "end": { "line": 4, "column": 1 } },
                  "line": 1
                }
              },
              "branchMap": {},
              "s": { "0": 1, "1": 1 },
              "f": { "0": 1 },
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-proj-coverage
          format: json
          coverage: ${{ github.workspace }}/fallow-proj-coverage/coverage-final.json
          coverage-root: /ci-build
          max-crap: '30'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
