name: Test health command with Istanbul coverage input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project and Istanbul coverage-final.json
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/health-coverage-project"
          mkdir -p "$P/src" "$P/coverage"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "health-coverage-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF
          FILE="$P/src/index.js"
          jq -n --arg f "$FILE" '{($f): {
            path: $f,
            statementMap: {"0": {start: {line: 2, column: 2}, end: {line: 2, column: 15}}},
            fnMap: {"0": {name: "add", decl: {start: {line: 1, column: 16}, end: {line: 1, column: 19}},
                          loc: {start: {line: 1, column: 25}, end: {line: 3, column: 1}}, line: 1}},
            branchMap: {},
            s: {"0": 1},
            f: {"0": 1},
            b: {}
          }}' > "$P/coverage/coverage-final.json"
          cat "$P/coverage/coverage-final.json"
          echo "COV_ROOT=$P" >> "$GITHUB_ENV"

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/health-coverage-project
          format: json
          coverage: ${{ env.COV_ROOT }}/coverage/coverage-final.json
          coverage-root: ${{ env.COV_ROOT }}
          max-crap: '30'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
