name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project and Istanbul coverage file
        run: |
          ROOT="$GITHUB_WORKSPACE/tests/fixtures/health-coverage"
          mkdir -p "$ROOT/src" "$GITHUB_WORKSPACE/coverage-data"
          cat > "$ROOT/package.json" <<'EOF'
          {
            "name": "health-coverage",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$ROOT/src/index.js" <<'EOF'
          export function pick(a, b) {
            if (a > b) {
              return a;
            }
            return b;
          }
          pick(1, 2);
          EOF
          F="$ROOT/src/index.js"
          cat > "$GITHUB_WORKSPACE/coverage-data/coverage-final.json" <<EOF
          {
            "$F": {
              "path": "$F",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 4, "column": 3}},
                "1": {"start": {"line": 3, "column": 4}, "end": {"line": 3, "column": 13}},
                "2": {"start": {"line": 5, "column": 2}, "end": {"line": 5, "column": 11}}
              },
              "fnMap": {
                "0": {"name": "pick", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 20}},
                      "loc": {"start": {"line": 1, "column": 27}, "end": {"line": 6, "column": 1}}, "line": 1}
              },
              "branchMap": {},
              "s": {"0": 1, "1": 0, "2": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF
          jq empty "$GITHUB_WORKSPACE/coverage-data/coverage-final.json"

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/health-coverage
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          coverage: ${{ github.workspace }}/coverage-data/coverage-final.json
          coverage-root: ${{ github.workspace }}/tests/fixtures/health-coverage
          max-crap: '30'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
