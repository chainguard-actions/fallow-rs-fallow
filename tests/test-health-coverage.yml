name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fallow-cov"
          cat > "$GITHUB_WORKSPACE/fallow-cov/coverage-final.json" <<'EOF'
          {
            "/ci/build/src/math.ts": {
              "path": "/ci/build/src/math.ts",
              "statementMap": {},
              "fnMap": {},
              "branchMap": {},
              "s": {},
              "f": {},
              "b": {}
            }
          }
          EOF
          jq -e . "$GITHUB_WORKSPACE/fallow-cov/coverage-final.json"
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          coverage: ${{ github.workspace }}/fallow-cov/coverage-final.json
          coverage-root: /ci/build
          max-crap: '30'
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-coverage
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
