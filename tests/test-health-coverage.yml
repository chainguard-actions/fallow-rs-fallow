name: Test health command with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project and Istanbul coverage file
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/coverage-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "coverage-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function pick(a, b) {
            if (a > b) {
              return a;
            }
            return b;
          }
          pick(1, 2);
          EOF
          cat > "$P/coverage-final.json" <<'EOF'
          {
            "/build/app/src/index.js": {
              "path": "/build/app/src/index.js",
              "statementMap": {
                "0": { "start": { "line": 2, "column": 2 }, "end": { "line": 4, "column": 3 } },
                "1": { "start": { "line": 3, "column": 4 }, "end": { "line": 3, "column": 13 } },
                "2": { "start": { "line": 5, "column": 2 }, "end": { "line": 5, "column": 11 } }
              },
              "fnMap": {
                "0": {
                  "name": "pick",
                  "decl": { "start": { "line": 1, "column": 16 }, "end": { "line": 1, "column": 20 } },
                  "loc": { "start": { "line": 1, "column": 27 }, "end": { "line": 6, "column": 1 } },
                  "line": 1
                }
              },
              "branchMap": {
                "0": {
                  "loc": { "start": { "line": 2, "column": 2 }, "end": { "line": 4, "column": 3 } },
                  "type": "if",
                  "locations": [
                    { "start": { "line": 2, "column": 2 }, "end": { "line": 4, "column": 3 } },
                    { "start": { "line": 2, "column": 2 }, "end": { "line": 4, "column": 3 } }
                  ],
                  "line": 2
                }
              },
              "s": { "0": 1, "1": 0, "2": 1 },
              "f": { "0": 1 },
              "b": { "0": [0, 1] }
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/coverage-project
          format: json
          coverage: tests/fixtures/coverage-project/coverage-final.json
          coverage-root: /build/app
          max-crap: '30'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
