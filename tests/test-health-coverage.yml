name: Test health with Istanbul coverage and CRAP threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Create Istanbul coverage file
        run: |
          FILE="$GITHUB_WORKSPACE/tests/fixtures/simple-js/complex.js"
          mkdir -p "$RUNNER_TEMP/cov"
          cat > "$RUNNER_TEMP/cov/coverage-final.json" <<EOF
          {
            "$FILE": {
              "path": "$FILE",
              "statementMap": {
                "0": {"start": {"line": 3, "column": 2}, "end": {"line": 23, "column": 3}}
              },
              "fnMap": {
                "0": {
                  "name": "complexFunction",
                  "decl": {"start": {"line": 2, "column": 16}, "end": {"line": 2, "column": 31}},
                  "loc": {"start": {"line": 2, "column": 47}, "end": {"line": 24, "column": 1}},
                  "line": 2
                }
              },
              "branchMap": {},
              "s": {"0": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF
          jq empty "$RUNNER_TEMP/cov/coverage-final.json"

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          coverage: ${{ runner.temp }}/cov/coverage-final.json
          coverage-root: ${{ github.workspace }}/tests/fixtures/simple-js
          max-crap: '30'

      - name: Assert health with coverage produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid: $RESULTS"
            exit 1
          fi
          echo "PASS"
