name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project and coverage data
        run: |
          mkdir -p fallow-sample/src fallow-sample/coverage
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          echo 'export function add(a, b) { return a + b; }' > fallow-sample/src/index.js
          cat > fallow-sample/coverage/coverage-final.json <<'EOF'
          {
            "/ci/build/src/index.js": {
              "path": "/ci/build/src/index.js",
              "statementMap": {"0": {"start": {"line": 1, "column": 28}, "end": {"line": 1, "column": 41}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 44}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 3},
              "f": {"0": 3},
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-sample
          coverage: ${{ github.workspace }}/fallow-sample/coverage/coverage-final.json
          coverage-root: /ci/build
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results valid and issues numeric
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
