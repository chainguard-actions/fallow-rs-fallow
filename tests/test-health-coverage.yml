name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project with coverage data
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/health-coverage"
          mkdir -p "$P/src" "$P/coverage"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "health-coverage",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            if (a > b) {
              return a - b;
            }
            return a + b;
          }
          add(1, 2);
          EOF
          cat > "$P/coverage/coverage-final.json" <<EOF
          {
            "/ci/build/src/index.js": {
              "path": "/ci/build/src/index.js",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 4, "column": 3}},
                "1": {"start": {"line": 3, "column": 4}, "end": {"line": 3, "column": 17}},
                "2": {"start": {"line": 5, "column": 2}, "end": {"line": 5, "column": 15}}
              },
              "fnMap": {
                "0": {
                  "name": "add",
                  "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}},
                  "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 6, "column": 1}},
                  "line": 1
                }
              },
              "branchMap": {},
              "s": {"0": 1, "1": 0, "2": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: act-fixtures/health-coverage
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          coverage: ${{ github.workspace }}/act-fixtures/health-coverage/coverage/coverage-final.json
          coverage-root: /ci/build

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
