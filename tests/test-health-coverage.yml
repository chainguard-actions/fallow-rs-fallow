name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project and coverage data
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-coverage"
          rm -rf "$D"
          mkdir -p "$D/src" "$D/coverage"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-coverage","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > "$D/src/math.js" <<'EOF'
          export function add(a, b) {
            if (a > b) { return a + b; }
            return b + a;
          }
          EOF
          cat > "$D/coverage/coverage-final.json" <<'EOF'
          {
            "/ci/build/src/math.js": {
              "path": "/ci/build/src/math.js",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 40}},
                "1": {"start": {"line": 3, "column": 2}, "end": {"line": 3, "column": 15}}
              },
              "fnMap": {
                "0": {
                  "name": "add",
                  "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}},
                  "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 4, "column": 1}},
                  "line": 1
                }
              },
              "branchMap": {},
              "s": {"0": 1, "1": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-coverage
          coverage: fx-coverage/coverage/coverage-final.json
          coverage-root: /ci/build
          max-crap: '30'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
