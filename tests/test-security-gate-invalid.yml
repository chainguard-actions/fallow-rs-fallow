name: Test security command rejects an invalid security-gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          security-gate: bogus
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert the action rejected the invalid gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for security-gate 'bogus', got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation fails"
            exit 1
          fi
          echo "PASS: invalid security-gate rejected"
