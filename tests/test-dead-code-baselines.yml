name: Test dead-code save and compare baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          artifacts-dir: fallow-artifacts-save
      - name: Assert baselines were saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          ls -la "$GITHUB_WORKSPACE/fallow-baselines" || true
          for f in dead-code.json regression.json; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
            jq empty "$GITHUB_WORKSPACE/fallow-baselines/$f" || { echo "FAIL: $f invalid JSON"; exit 1; }
          done
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-regression: 'true'
          artifacts-dir: fallow-artifacts-compare
      - name: Assert baseline suppressed all known issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected baseline to suppress all issues"
            exit 1
          fi
          echo "PASS"
