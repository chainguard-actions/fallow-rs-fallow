name: Test dupes command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty dupes baseline
        run: |
          echo '{}' > "$GITHUB_WORKSPACE/.fallow-dupes-baseline.json"
      - id: action
        uses: .
        with:
          command: dupes
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          min-tokens: '50'
          min-lines: '5'
          threshold: '0'
          dupes-baseline: '.fallow-dupes-baseline.json'
          auto-changed-since: 'false'
          threads: '2'
      - name: Assert action ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          echo "PASS: dupes command with extended inputs completed"
