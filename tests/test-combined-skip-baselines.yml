name: Test combined run with skip and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/fallow-combined-baselines"
          mkdir -p "$GITHUB_WORKSPACE/fallow-combined-baselines"
      - id: health-save
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-combined-baselines/health.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-health-save
      - id: dupes-save
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-combined-baselines/dupes.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-dupes-save
      - name: Assert health and dupes baselines exist
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-combined-baselines"
          for f in health.json dupes.json; do
            [ -s "$GITHUB_WORKSPACE/fallow-combined-baselines/$f" ] || { echo "FAIL: $f missing"; exit 1; }
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          skip: architecture
          health-baseline: ${{ github.workspace }}/fallow-combined-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-combined-baselines/dupes.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-combined-skip
      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
