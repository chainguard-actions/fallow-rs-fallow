name: Test min-severity rejected outside health command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-min-severity-wrong
          min-severity: high
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for min-severity on dead-code"
            exit 1
          fi
          echo "PASS"
