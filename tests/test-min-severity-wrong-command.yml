name: Test min-severity is rejected outside the health command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Let the bundled verifier resolve detect-libc from the global fallow install
        run: |
          G="$(npm root -g)"
          echo "NODE_PATH=$G/fallow/node_modules:$G" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: tests/fixtures/clean
          version: 3.43.0
          auto-changed-since: 'false'
          sarif: 'false'
          min-severity: high
      - name: Assert action rejected min-severity on dupes
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for min-severity with command dupes"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have produced an issues count"
            exit 1
          fi
          echo "PASS"
