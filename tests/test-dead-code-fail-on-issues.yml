name: Test dead-code fails the step when issues are found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.44.0
          fail-on-issues: 'true'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert the action failed because of issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since the fixture has unused code"
            exit 1
          fi
          echo "PASS"
