name: Test invalid audit gate is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-test/audit"
          mkdir -p "$P/src"
          echo '{"name":"audit","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      # gate accepts only new-only or all; anything else exits 2 before analysis.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: fallow-test/audit
          format: json
          gate: bogus
          dead-code-baseline: fallow-test/audit/dead-code-baseline.json
          health-baseline: fallow-test/audit/health-baseline.json
          dupes-baseline: fallow-test/audit/dupes-baseline.json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
