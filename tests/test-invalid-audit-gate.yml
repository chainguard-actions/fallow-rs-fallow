name: Test audit rejects an invalid gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-gate
          gate: bogus
          worsened: warn
          dead-code-baseline: baselines/dead-code.json
          health-baseline: baselines/health.json
          dupes-baseline: baselines/dupes.json
      - name: Assert action failed on invalid gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for gate=bogus"
            exit 1
          fi
          echo "PASS"
