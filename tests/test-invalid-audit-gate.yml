name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          gate: everything
          dead-code-baseline: fallow-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-invalid-gate

      - name: Assert action failed input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME verdict: '$VERDICT' issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for gate=everything, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VERDICT" ] || [ -n "$ISSUES" ]; then
            echo "FAIL: audit should not have produced a verdict"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-invalid-gate
