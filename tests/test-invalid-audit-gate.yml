name: Test invalid audit gate input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          gate: sometimes
          worsened: warn
          dead-code-baseline: fallow-dead-code-baseline.json
          health-baseline: fallow-health-baseline.json
          dupes-baseline: fallow-dupes-baseline.json
          only: dead-code,health,dupes
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-gate
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES' verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate value"
            exit 1
          fi
          if [ -n "$ISSUES" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
