name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Let the bundled verifier resolve detect-libc from the global fallow install
        run: |
          G="$(npm root -g)"
          echo "NODE_PATH=$G/fallow/node_modules:$G" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/with-issues
          version: 3.43.0
          auto-changed-since: 'false'
          sarif: 'false'
          gate: bogus
          worsened: warn
          dead-code-baseline: does-not-exist-dead-code.json
          health-baseline: does-not-exist-health.json
          dupes-baseline: does-not-exist-dupes.json
          coverage: does-not-exist/coverage-final.json
          coverage-root: /tmp
          max-crap: '30'
      - name: Assert action rejected the invalid gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for gate=bogus"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have produced an issues count"
            exit 1
          fi
          echo "PASS"
