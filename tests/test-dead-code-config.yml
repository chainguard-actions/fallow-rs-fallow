name: Test dead-code with config and issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project with config
        run: |
          mkdir -p /tmp/fallow-dc-config
          cat > /tmp/fallow-dc-config/package.json <<'EOF'
          {
            "name": "dc-config-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dc-config/index.js <<'EOF'
          export function usedFn() { return 1; }
          export function unusedFn() { return 2; }
          EOF
          cat > /tmp/fallow-dc-config/.fallowrc.json <<'EOF'
          {
            "ignore": []
          }
          EOF
      - id: dead-code
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-dc-config
          config: /tmp/fallow-dc-config/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          issue-types: 'unused-exports,unused-files'
          changed-since: 'HEAD~1'
          auto-changed-since: 'false'
      - name: Assert dead-code step ran
        env:
          OUTCOME: ${{ steps.dead-code.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
