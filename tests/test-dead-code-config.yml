name: Test dead-code with config, issue-types and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          issue-types: unused-files
          threads: '2'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert unused file reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected a numeric issue count >= 1"
            exit 1
          fi
          f="$RESULTS"; [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ] || ! jq -e . "$f" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! grep -q "orphan" "$f"; then
            echo "FAIL: expected orphan.ts as unused file"
            head -c 4000 "$f"
            exit 1
          fi
          echo "PASS"
