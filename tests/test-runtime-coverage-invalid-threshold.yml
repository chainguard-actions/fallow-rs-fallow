name: Test runtime-coverage inputs reject a non-numeric low-traffic-threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          rm -rf fallow-fixture
          mkdir -p fallow-fixture/src fallow-fixture/v8
          cd fallow-fixture
          cat > package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          console.log('hi');
          EOF
          echo '{"result":[]}' > v8/coverage.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fallow-fixture
          runtime-coverage: fallow-fixture/v8
          min-invocations-hot: '10'
          min-observation-volume: '5'
          low-traffic-threshold: not-a-number
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert the action rejected the invalid threshold
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid low-traffic-threshold, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation fails, got '$ISSUES'"
            exit 1
          fi
          echo "PASS: invalid low-traffic-threshold rejected"
