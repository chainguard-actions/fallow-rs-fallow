name: Test runtime coverage inputs reject a non-numeric low-traffic-threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a runtime coverage input
        run: |
          mkdir -p fallow-test-runtime
          echo '{}' > fallow-test-runtime/coverage-final.json

      # min-invocations-hot and min-observation-volume are valid integers;
      # low-traffic-threshold is invalid, so the analyze step must exit 2
      # during input validation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          runtime-coverage: fallow-test-runtime/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: 'not-a-number'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert the action failed on validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid low-traffic-threshold"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation fails"
            exit 1
          fi
          echo "PASS"
