name: Test workspace-scoped run rejects non-numeric top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-top
          workspace: web
          changed-workspaces: origin/main
          top: abc
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-numeric top"
            exit 1
          fi
          echo "PASS"
