name: Test health snapshot save then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snapshot
          save-snapshot: 'true'
      - name: Assert snapshot saved
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          D="$GITHUB_WORKSPACE/tests/fixtures/sample-project/.fallow/snapshots"
          ls -la "$D" || true
          if [ -z "$(ls -A "$D" 2>/dev/null)" ]; then
            echo "FAIL: no snapshot written to $D"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-trend
          trend: 'true'
      - name: Assert trend run succeeded
        env:
          OUTCOME: ${{ steps.trend.outcome }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
