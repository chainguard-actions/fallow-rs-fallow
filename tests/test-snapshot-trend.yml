name: Test save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-snapshot: 'true'
      - name: Assert snapshot written
        run: |
          echo "snapshot files:"
          find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f -not -path '*/.git/*' | tee /tmp/snaps.txt
          if [ ! -s /tmp/snaps.txt ]; then
            echo "FAIL: no snapshot file was written"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          trend: 'true'
      - name: Assert trend run succeeded
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: trend results missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
