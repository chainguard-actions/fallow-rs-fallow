name: Test health snapshot save and trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          score: 'true'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert snapshot written
        run: |
          found=$(find "$GITHUB_WORKSPACE" -path '*/.fallow/snapshots/*' -type f 2>/dev/null | head -n 5)
          echo "snapshots: $found"
          if [ -z "$found" ]; then
            echo "FAIL: no snapshot file written under .fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          score: 'true'
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert trend run output
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
