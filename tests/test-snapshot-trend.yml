name: Test save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          save-snapshot: ${{ github.workspace }}/fallow-snapshot.json
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert snapshot saved
        run: |
          ls -la "$GITHUB_WORKSPACE" || true
          if [ ! -s "$GITHUB_WORKSPACE/fallow-snapshot.json" ]; then
            echo "FAIL: snapshot file not written"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          save-snapshot: ''
          trend: 'true'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert trend run completed
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
