name: Test health snapshot then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare snapshot directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-project/.fallow/snapshots"
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-snapshot: ${{ github.workspace }}/tests/fixtures/clean-project/.fallow/snapshots/act-test-snapshot.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert snapshot was saved
        run: |
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/clean-project/.fallow/snapshots" || true
          COUNT=$(find "$GITHUB_WORKSPACE/tests/fixtures/clean-project/.fallow" -type f -name '*.json' 2>/dev/null | wc -l)
          echo "snapshot files: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: no snapshot file written"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert trend run produced output
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
