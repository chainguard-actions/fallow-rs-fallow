name: Test health save-snapshot then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D=fx-trend
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-trend","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          export function add(a, b) { if (a > b) { return a - b; } return a + b; }
          console.log(add(1, 2));
          EOF

      - id: snapshot
        uses: .
        with:
          command: health
          root: fx-trend
          save-snapshot: 'true'
          artifacts-dir: fx-trend-artifacts-snap
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert snapshot saved
        run: |
          grep -q -- "--save-snapshot" fx-trend-artifacts-snap/fallow-analysis-args.sh || { echo "FAIL: --save-snapshot not forwarded"; exit 1; }
          ls -la fx-trend/.fallow/snapshots 2>/dev/null || true
          COUNT=$(find fx-trend/.fallow -path '*snapshots*' -type f 2>/dev/null | wc -l)
          echo "snapshot files: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected a snapshot under fx-trend/.fallow/snapshots"
            exit 1
          fi
          echo "PASS"

      - id: action
        uses: .
        with:
          command: health
          root: fx-trend
          trend: 'true'
          artifacts-dir: fx-trend-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert trend run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file"; exit 1; }
          grep -q -- "--trend" fx-trend-artifacts/fallow-analysis-args.sh || { echo "FAIL: --trend not forwarded"; exit 1; }
          echo "PASS"
