name: Test snapshot and trend inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-snapshot-project
          cat > /tmp/fallow-snapshot-project/package.json <<'EOF'
          {
            "name": "snapshot-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-snapshot-project/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) return a;
            return b;
          }
          EOF
      - name: Run health with save-snapshot
        id: save-snapshot
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-snapshot-project
          format: json
          fail-on-issues: 'false'
          score: 'true'
          save-snapshot: /tmp/fallow-snapshots
          auto-changed-since: 'false'
      - name: Assert save-snapshot step ran
        env:
          OUTCOME: ${{ steps.save-snapshot.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save-snapshot step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Run health with trend (comparing against saved snapshot)
        id: with-trend
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-snapshot-project
          format: json
          fail-on-issues: 'false'
          score: 'true'
          trend: 'true'
          save-snapshot: /tmp/fallow-snapshots
          auto-changed-since: 'false'
      - name: Assert with-trend step ran
        env:
          OUTCOME: ${{ steps.with-trend.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: trend step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
