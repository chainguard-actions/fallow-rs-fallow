name: Test save-snapshot then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snap
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          score: 'true'
          save-snapshot: ${{ github.workspace }}/fallow-snapshots/snap1.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snap
      - name: Assert snapshot saved
        run: |
          ls -laR "$GITHUB_WORKSPACE/fallow-snapshots" 2>/dev/null || true
          ls -laR "$GITHUB_WORKSPACE/tests/fixtures/sample-project/.fallow/snapshots" 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/fallow-snapshots/snap1.json" ] \
             || [ -n "$(find "$GITHUB_WORKSPACE/fallow-snapshots" "$GITHUB_WORKSPACE/tests/fixtures/sample-project/.fallow/snapshots" -type f 2>/dev/null | head -1)" ]; then
            echo "PASS: snapshot written"
          else
            echo "FAIL: no snapshot file written"
            exit 1
          fi
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          score: 'true'
          trend: 'true'
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-trend
      - name: Assert trend run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
