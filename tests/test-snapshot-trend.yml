name: Test snapshot and trend inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First run: save a snapshot
      - id: save
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          score: 'true'
          save-snapshot: /tmp/fallow-snapshots

      - name: Assert save step ran
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "save outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save-snapshot step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Second run: compare against snapshot with trend
      - id: trend
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          score: 'true'
          save-snapshot: /tmp/fallow-snapshots
          trend: 'true'

      - name: Assert trend step ran
        env:
          OUTCOME: ${{ steps.trend.outcome }}
        run: |
          echo "trend outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: trend step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
