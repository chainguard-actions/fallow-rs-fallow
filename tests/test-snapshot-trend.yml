name: Test health save-snapshot followed by trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project
        run: |
          P="$GITHUB_WORKSPACE/fx-snapshot-proj"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-snapshot-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a > b ? a + b : b - a;
          }
          console.log(add(1, 2));
          EOF

      - id: snapshot
        uses: .
        with:
          command: health
          root: fx-snapshot-proj
          score: 'true'
          save-snapshot: 'true'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert a snapshot was saved
        run: |
          found=$(find "$GITHUB_WORKSPACE/fx-snapshot-proj" "$GITHUB_WORKSPACE/.fallow" -path '*snapshots*' -type f 2>/dev/null | head -5)
          echo "snapshots: $found"
          if [ -z "$found" ]; then
            echo "FAIL: no snapshot file found"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          root: fx-snapshot-proj
          score: 'true'
          trend: 'true'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
