name: Test health snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-snapshot: 'true'
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          trend: 'true'
      - name: Assert snapshot and trend runs succeeded
        env:
          SNAP_ISSUES: ${{ steps.snapshot.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
          TREND_RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES"
          echo "trend issues: $TREND_ISSUES"
          ls -laR tests/fixtures/dead-code-project/.fallow 2>/dev/null || true
          for v in "$SNAP_ISSUES" "$TREND_ISSUES"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output '$v' is not a number"
              exit 1
            fi
          done
          if [ -z "$TREND_RESULTS" ] || [ ! -f "$TREND_RESULTS" ]; then
            echo "FAIL: trend results file missing"
            exit 1
          fi
          echo "PASS"
