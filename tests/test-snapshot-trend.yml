name: Test health save-snapshot followed by trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert snapshot saved
        run: |
          ls -la tests/fixtures/clean-project/.fallow/snapshots || true
          if ! ls tests/fixtures/clean-project/.fallow/snapshots/* > /dev/null 2>&1; then
            echo "FAIL: no snapshot saved under .fallow/snapshots"
            exit 1
          fi
          echo "PASS: snapshot saved"
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert trend run output
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
      - name: Clean up snapshots
        if: always()
        run: rm -rf tests/fixtures/clean-project/.fallow/snapshots
