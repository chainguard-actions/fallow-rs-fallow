name: Test non-integer min-invocations-hot is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          runtime-coverage: tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: lots
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-hot
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected min-invocations-hot=lots to be rejected"
            exit 1
          fi
          echo "PASS"
