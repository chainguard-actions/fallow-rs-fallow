name: Test dead-code with issue-types filter and config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          config: ${{ github.workspace }}/tests/fixtures/fallowrc/.fallowrc.json
          version: 3.44.0
          fail-on-issues: 'false'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          issue-types: unused-files,unused-exports
      - name: Assert issues found
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected unused file/export issues (orphan.ts / subtract)"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results missing"
            exit 1
          fi
          echo "PASS"
