name: Test dead-code with explicit config and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dead-code
          config: .fallowrc.json
          issue-types: unused-files,unused-exports
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results valid
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS issues: $ISSUES"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          echo "PASS"

      - name: Assert analysis args include the config and issue-type flags
        run: |
          ARGS_FILE="$GITHUB_WORKSPACE/fallow-analysis-args.sh"
          cat "$ARGS_FILE"
          for flag in "--config" "--unused-files" "--unused-exports"; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected $flag in analysis args"
              exit 1
            fi
          done
          echo "PASS"
