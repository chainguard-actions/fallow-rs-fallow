name: Test dead-code with issue-types filter and explicit config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project with config
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src/ignored"
          cat > "$S/package.json" <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$S/.fallowrc.json" <<'EOF'
          {"ignorePatterns": ["src/ignored/**"]}
          EOF
          cat > "$S/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$S/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          cat > "$S/src/orphan.js" <<'EOF'
          export const orphan = 1;
          EOF
          cat > "$S/src/ignored/skip.js" <<'EOF'
          export const skipped = 1;
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          config: ${{ github.workspace }}/fallow-sample/.fallowrc.json
          issue-types: unused-files, unused-exports
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues detected and results valid
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if grep -q 'skip.js' "$RESULTS"; then
            echo "FAIL: ignored file src/ignored/skip.js appears in results (config not applied)"
            exit 1
          fi
          echo "PASS"
