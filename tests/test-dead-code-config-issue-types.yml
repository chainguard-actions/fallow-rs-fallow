name: Test dead-code with config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with unused exports and a config file
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-config"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "config-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          cat > "$P/custom-fallow.json" <<'EOF'
          {
            "ignorePatterns": ["ignored/**"]
          }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-proj-config
          config: ${{ github.workspace }}/fallow-proj-config/custom-fallow.json
          issue-types: 'unused-exports, unused-files'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert unused export reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected unusedHelper to be reported"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"
