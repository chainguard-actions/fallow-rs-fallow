name: Test dead-code with explicit config and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-config
          type-aware: 'false'
          issue-types: unused-files,unused-exports
      - name: Assert unused code reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least 1 unused-files/unused-exports issue"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ] || ! jq empty "$f"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! grep -qE 'orphan|unusedSubtract' "$f"; then
            echo "FAIL: results do not mention orphan.ts or unusedSubtract"
            exit 1
          fi
          echo "PASS"
