name: Test runtime coverage threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy runtime coverage file
        run: |
          echo '{}' > /tmp/runtime-coverage.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          fail-on-issues: 'false'
          runtime-coverage: /tmp/runtime-coverage.json
          low-traffic-threshold: '0.01'
          min-invocations-hot: '50'
          min-observation-volume: '100'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with runtime coverage threshold inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
