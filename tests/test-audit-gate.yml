name: Test audit with gate and worsened
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          changed-since: HEAD
          gate: new-only
          worsened: warn
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "new-only" ]; then
            echo "FAIL: expected gate 'new-only'"
            exit 1
          fi
          echo "PASS"
