name: Test audit with gate all and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: dc-baseline
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/bl-dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: health-baseline
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/bl-health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: dupes-baseline
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baselines exist
        run: |
          for f in bl-dead-code.json bl-health.json bl-dupes.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ github.workspace }}/bl-dead-code.json
          health-baseline: ${{ github.workspace }}/bl-health.json
          dupes-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
          annotations: 'false'

      - name: Assert audit produced a verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          ISSUES: ${{ steps.action.outputs.issues }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "verdict: $VERDICT"
          echo "issues: $ISSUES"
          echo "gate: $GATE"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          echo "PASS"
