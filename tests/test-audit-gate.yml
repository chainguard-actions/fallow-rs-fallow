name: Test audit command with gate all, only and dead-code-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture git project with two commits
        run: |
          set -e
          rm -rf fallow-fixture baselines
          mkdir -p fallow-fixture/src baselines
          cd fallow-fixture
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > src/used.js <<'EOF'
          export function used() { return 1; }
          EOF
          git add -A
          git commit -q -m "initial"
          cat > src/used.js <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF
          git add -A
          git commit -q -m "add unused export"

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-fixture
          save-baseline: ${{ github.workspace }}/baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: action
        uses: .
        with:
          command: audit
          root: fallow-fixture
          changed-since: HEAD~1
          gate: all
          only: dead-code
          dead-code-baseline: ${{ github.workspace }}/baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert audit outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected integer issues, got '$ISSUES'"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: expected verdict pass/warn/fail, got '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
