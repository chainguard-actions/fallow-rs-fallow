name: Test audit command with gate all and dead-code-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with git history
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P" "$GITHUB_WORKSPACE/fx-baselines"
          mkdir -p "$P/src" "$GITHUB_WORKSPACE/fx-baselines"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' 'import { a } from "./lib";' 'console.log(a());' > "$P/src/index.ts"
          printf '%s\n' 'export function a(): number { return 1; }' > "$P/src/lib.ts"
          cd "$P"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm initial
          printf '%s\n' 'export function introducedUnused(): number { return 2; }' >> src/lib.ts
          git add -A
          git commit -qm "add unused export"

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-project
          save-baseline: ${{ github.workspace }}/fx-baselines/dead-code.json
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: action
        uses: .
        with:
          command: audit
          root: fx-project
          gate: all
          dead-code-baseline: ${{ github.workspace }}/fx-baselines/dead-code.json
          changed-since: HEAD~1
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert audit outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "issues: $ISSUES verdict: $VERDICT gate: $GATE"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict must be pass/warn/fail, got '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          echo "PASS"
