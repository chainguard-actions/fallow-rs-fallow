name: Test audit gate and security-gate inputs
on:
  workflow_dispatch:
jobs:
  test-audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          gate: new-only
      - name: Assert action ran with gate input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE_OUT: ${{ steps.action.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "gate: $GATE_OUT"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
  test-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          security-gate: new
      - name: Assert action ran with security-gate input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
