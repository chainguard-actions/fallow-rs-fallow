name: Test audit with gate and dead-code-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FX: fallow-test-audit-gate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create fixture JS project
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$FX"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {"name":"fallow-test-project","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > "$P/src/used.js" <<'EOF'
          export function used() {
            return 42;
          }
          export function unusedExport() {
            return 'never imported';
          }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: ${{ env.FX }}
          save-baseline: ${{ github.workspace }}/${{ env.FX }}/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: action
        uses: .
        with:
          command: audit
          root: ${{ env.FX }}
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ github.workspace }}/${{ env.FX }}/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: '$VERDICT' gate: '$GATE' issues: '$ISSUES'"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict must be pass/warn/fail, got '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not an integer: '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/$FX"
