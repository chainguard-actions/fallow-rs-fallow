name: Test audit command with gate, changed-since and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/audit-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "audit-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF

      - id: dc
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/audit-project
          format: json
          save-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - id: hl
        uses: .
        with:
          command: health
          root: tests/fixtures/audit-project
          format: json
          save-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/health-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - id: dp
        uses: .
        with:
          command: dupes
          root: tests/fixtures/audit-project
          format: json
          save-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baselines exist
        run: |
          for b in dead-code health dupes; do
            F="$GITHUB_WORKSPACE/tests/fixtures/audit-project/$b-baseline.json"
            if [ ! -f "$F" ]; then
              echo "FAIL: missing $F"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/audit-project
          format: json
          gate: all
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dupes-baseline.json
          max-crap: '30'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert audit verdict and count
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          echo "PASS"
