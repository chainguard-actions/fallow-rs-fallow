name: Test audit command with gate all and worsened warn
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: '3.37.0'
          changed-since: HEAD
          gate: all
          worsened: warn
          fail-on-issues: 'false'
          type-aware: 'false'
      - name: Assert audit outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          echo "PASS"
