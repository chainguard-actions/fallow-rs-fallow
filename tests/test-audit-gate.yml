name: Test audit command with gate and worsened
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: '3.43.1'
          format: json
          changed-since: HEAD
          gate: all
          worsened: warn
          fail-on-issues: 'false'
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: '$VERDICT' gate: '$GATE' issues: '$ISSUES'"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict must be pass/warn/fail"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not numeric"
            exit 1
          fi
          echo "PASS"
