name: Test audit command with gate and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-audit-baselines"
      - id: dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-dc
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
      - id: health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-health
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
      - id: dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-dupes
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
      - name: Show baselines
        run: ls -la "$GITHUB_WORKSPACE/fallow-audit-baselines"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
          ISSUES: ${{ steps.audit.outputs.issues }}
          GATE: ${{ steps.audit.outputs.gate }}
        run: |
          echo "verdict: $VERDICT"
          echo "issues: $ISSUES"
          echo "gate: $GATE"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          echo "PASS"
