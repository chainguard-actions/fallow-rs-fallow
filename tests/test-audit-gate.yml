name: Test audit gate inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action-audit
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: .
          format: json
          fail-on-issues: 'false'
          gate: 'new-only'
      - name: Assert audit action ran
        env:
          OUTCOME: ${{ steps.action-audit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with gate input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-security
        uses: .
        continue-on-error: true
        with:
          command: security
          root: .
          format: json
          fail-on-issues: 'false'
          security-gate: 'new'
      - name: Assert security action ran
        env:
          OUTCOME: ${{ steps.action-security.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with security-gate input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
