name: Test input validation rejects bad values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          echo 'export const x = 1;' > fallow-sample/src/index.js

      # Each of these is rejected by analyze.sh validation (exit 2) before fallow runs.
      - id: bad_gate
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: fallow-sample
          gate: bogus
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: bad_security_gate
        uses: .
        continue-on-error: true
        with:
          command: security
          root: fallow-sample
          security-gate: bogus
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: min_score_wrong_cmd
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: fallow-sample
          min-score: '50'
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: min_severity_wrong_cmd
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: fallow-sample
          min-severity: high
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: audit_generic_baseline
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: fallow-sample
          baseline: some-baseline.json
          dead-code-baseline: dead-code-baseline.json
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: bad_runtime_numbers
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fallow-sample
          runtime-coverage: coverage-dir
          min-invocations-hot: not-a-number
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: bad_observation_volume
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fallow-sample
          min-observation-volume: abc
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: bad_low_traffic
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fallow-sample
          low-traffic-threshold: lots
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - id: bad_changed_workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: fallow-sample
          changed-workspaces: refs/does-not-exist-xyz-123
          auto-changed-since: 'false'
          sarif: 'false'
          format: json

      - name: Assert every invalid invocation failed
        env:
          O1: ${{ steps.bad_gate.outcome }}
          O2: ${{ steps.bad_security_gate.outcome }}
          O3: ${{ steps.min_score_wrong_cmd.outcome }}
          O4: ${{ steps.min_severity_wrong_cmd.outcome }}
          O5: ${{ steps.audit_generic_baseline.outcome }}
          O6: ${{ steps.bad_runtime_numbers.outcome }}
          O7: ${{ steps.bad_observation_volume.outcome }}
          O8: ${{ steps.bad_low_traffic.outcome }}
          O9: ${{ steps.bad_changed_workspaces.outcome }}
        run: |
          rc=0
          for pair in "bad_gate:$O1" "bad_security_gate:$O2" "min_score_wrong_cmd:$O3" \
                      "min_severity_wrong_cmd:$O4" "audit_generic_baseline:$O5" \
                      "bad_runtime_numbers:$O6" "bad_observation_volume:$O7" \
                      "bad_low_traffic:$O8" "bad_changed_workspaces:$O9"; do
            name="${pair%%:*}"; outcome="${pair#*:}"
            echo "$name -> $outcome"
            if [ "$outcome" != "failure" ]; then
              echo "FAIL: $name expected failure, got '$outcome'"
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] && echo "PASS: all invalid inputs rejected"
          exit $rc
