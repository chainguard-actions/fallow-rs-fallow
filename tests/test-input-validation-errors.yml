name: Test input validation rejects invalid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Each step below is expected to be rejected by analyze.sh input
      # validation (exit 2) before any analysis output is written.
      - id: bad-security-gate
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: security
          root: tests/fixtures/simple-js
          format: json
          security-gate: bogus
          auto-changed-since: 'false'
          annotations: 'false'

      - id: bad-audit-gate
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          gate: bogus
          auto-changed-since: 'false'
          annotations: 'false'

      - id: min-score-wrong-command
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          min-score: '50'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: bad-min-invocations-hot
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: abc
          auto-changed-since: 'false'
          annotations: 'false'

      - id: bad-min-observation-volume
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          min-observation-volume: '-5'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: bad-low-traffic-threshold
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          low-traffic-threshold: abc
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert every invalid configuration was rejected
        env:
          O1: ${{ steps.bad-security-gate.outcome }}
          I1: ${{ steps.bad-security-gate.outputs.issues }}
          O2: ${{ steps.bad-audit-gate.outcome }}
          I2: ${{ steps.bad-audit-gate.outputs.issues }}
          O3: ${{ steps.min-score-wrong-command.outcome }}
          I3: ${{ steps.min-score-wrong-command.outputs.issues }}
          O4: ${{ steps.bad-min-invocations-hot.outcome }}
          I4: ${{ steps.bad-min-invocations-hot.outputs.issues }}
          O5: ${{ steps.bad-min-observation-volume.outcome }}
          I5: ${{ steps.bad-min-observation-volume.outputs.issues }}
          O6: ${{ steps.bad-low-traffic-threshold.outcome }}
          I6: ${{ steps.bad-low-traffic-threshold.outputs.issues }}
        run: |
          fail=0
          check() {
            local name=$1 outcome=$2 issues=$3
            echo "$name: outcome=$outcome issues='$issues'"
            if [ "$outcome" != "failure" ]; then
              echo "FAIL: $name expected failure, got '$outcome'"
              fail=1
            elif [ -n "$issues" ]; then
              echo "FAIL: $name failed after analysis (issues='$issues'), not at validation"
              fail=1
            else
              echo "PASS: $name rejected"
            fi
          }
          check security-gate "$O1" "$I1"
          check audit-gate "$O2" "$I2"
          check min-score-on-dead-code "$O3" "$I3"
          check min-invocations-hot "$O4" "$I4"
          check min-observation-volume "$O5" "$I5"
          check low-traffic-threshold "$O6" "$I6"
          exit $fail
