name: Test security command with security-gate new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: security
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          changed-since: HEAD
          security-gate: new
          artifacts-dir: fallow-artifacts-security
      - name: Assert security gate applied
        env:
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          if [ "$GATE" != "new" ]; then
            echo "FAIL: expected gate 'new'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -ne 0 ]; then
            echo "FAIL: expected 0 security candidates on clean fixture"
            exit 1
          fi
          echo "PASS"
