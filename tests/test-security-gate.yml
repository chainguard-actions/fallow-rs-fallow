name: Test security command with security-gate new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: security
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          changed-since: HEAD
          security-gate: new
      - name: Assert security gate applied and passed
        env:
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          if [ "$GATE" != "new" ]; then
            echo "FAIL: expected gate 'new'"
            exit 1
          fi
          case ",$GATES_FAILED," in
            *,security,*) echo "FAIL: security gate should pass on fixture with no changes"; exit 1 ;;
          esac
          echo "PASS"
