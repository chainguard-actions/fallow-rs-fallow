name: Test security command with security-gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # The "new" gate needs changed lines; with changed-since: HEAD nothing
      # changed. Accept success with a numeric count, or a clean failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          changed-since: HEAD
          security-gate: new
          artifacts-dir: fallow-artifacts-security
      - name: Assert security outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "gate: $GATE"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            if [ -n "$GATE" ] && [ "$GATE" != "new" ]; then
              echo "FAIL: expected gate 'new', got '$GATE'"
              exit 1
            fi
            echo "PASS: security gate ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: security gate failed cleanly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
