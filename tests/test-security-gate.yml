name: Test security command with security-gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # The "new" gate depends on changed-line context that a
      # workflow_dispatch run may not provide, so failure is tolerated.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          changed-since: HEAD
          fail-on-issues: 'false'
          security-gate: new
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES gate: $GATE"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: succeeded but issues output is not a number"
              exit 1
            fi
            echo "PASS: security analysis completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: security gate failed without PR context"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
