name: Test security command with new-candidate gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: security
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          changed-since: HEAD
          security-gate: new
      - name: Assert security gate applied
        env:
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          if [ "$GATE" != "new" ]; then
            echo "FAIL: expected gate 'new'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
