name: Test security command with security-gate new
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: security
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-security
          type-aware: 'false'
          changed-since: HEAD
          security-gate: new
      - name: Assert gate and issue count
        env:
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "gate: $GATE issues: $ISSUES"
          if [ "$GATE" != "new" ]; then
            echo "FAIL: expected security gate 'new'"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 security candidates on a clean project"
            exit 1
          fi
          echo "PASS"
