name: Test security command with security-gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: security
          root: tests/fixtures/dirty-project
          security-gate: new
          changed-since: HEAD
          version: '3.41.0'
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert security results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "issues: $ISSUES gate: $GATE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output not numeric"
            exit 1
          fi
          if [ -n "$GATE" ] && [ "$GATE" != "new" ]; then
            echo "FAIL: unexpected gate '$GATE'"
            exit 1
          fi
          echo "PASS"
