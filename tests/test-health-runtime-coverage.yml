name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul runtime coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fallow-runtime-cov"
          cat > "$GITHUB_WORKSPACE/fallow-runtime-cov/coverage-final.json" <<'EOF'
          {
            "/ci-build/src/math.ts": {
              "path": "/ci-build/src/math.ts",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}}
              },
              "fnMap": {
                "0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 50}, "end": {"line": 3, "column": 1}}, "line": 1}
              },
              "branchMap": {},
              "s": {"0": 250},
              "f": {"0": 250},
              "b": {}
            }
          }
          EOF
      # Runtime coverage is a paid feature of fallow; without a license the CLI
      # may refuse it. Accept a clean failure, but validate outputs on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/fallow-runtime-cov/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '10'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          artifacts-dir: fallow-artifacts-health-runtime
      - name: Assert runtime coverage run outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: action succeeded but issues output is not a number"
              exit 1
            fi
            echo "PASS: runtime coverage analysis ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (paid feature unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
