name: Test health with runtime coverage (paid feature)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # runtime-coverage is a licensed Fallow feature; without a license the
      # CLI may reject it. Either the run succeeds with valid outputs, or it
      # fails cleanly.
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'

      - name: Assert action ran (valid outputs, or failed gracefully without license)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: action succeeded but issues output is not a number"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: action succeeded but results file missing/invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (runtime coverage requires a license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
