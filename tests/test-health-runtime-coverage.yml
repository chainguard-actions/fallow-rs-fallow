name: Test health with runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Create Istanbul coverage input for runtime coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rtcov"
          ROOT="$GITHUB_WORKSPACE/tests/fixtures/simple-js"
          jq -n --arg f "$ROOT/complex.js" '{
            ($f): {
              path: $f,
              statementMap: {"0": {start: {line: 8, column: 12}, end: {line: 8, column: 37}}},
              fnMap: {"0": {name: "complexFunction", decl: {start: {line: 2, column: 16}, end: {line: 2, column: 31}}, loc: {start: {line: 2, column: 46}, end: {line: 24, column: 1}}, line: 2}},
              branchMap: {},
              s: {"0": 500},
              f: {"0": 500},
              b: {}
            }
          }' > "$GITHUB_WORKSPACE/rtcov/coverage-final.json"

      # Runtime coverage is a paid (license-gated) fallow feature, which the
      # harness cannot provide. The action may fail on the missing license;
      # accept that, but validate the outputs strictly when it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          runtime-coverage: ${{ github.workspace }}/rtcov/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'

      - name: Assert runtime coverage run (output set, or failed gracefully without license)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues not numeric: '$ISSUES'"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (runtime coverage license unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
