name: Test health runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-runtime-cov
      # Runtime coverage is a paid (licensed) fallow feature; without a
      # license the CLI may refuse it. Validate output strictly on success,
      # and on failure verify the action got as far as running fallow.
      - name: Assert runtime coverage ran or was refused by the CLI
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
              echo "FAIL: results file missing"
              exit 1
            fi
            jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            fallow --version || { echo "FAIL: fallow was not installed"; exit 1; }
            if [ ! -f fallow-artifacts-runtime-cov/fallow-stderr.log ] && [ ! -f fallow-artifacts-runtime-cov/fallow-results.json ]; then
              echo "FAIL: analysis never ran (no artifacts)"
              ls -la fallow-artifacts-runtime-cov || true
              exit 1
            fi
            cat fallow-artifacts-runtime-cov/fallow-stderr.log 2>/dev/null || true
            echo "PASS: CLI ran and refused runtime coverage (likely license-gated)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
