name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with runtime coverage data
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/runtime-coverage-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "runtime-coverage-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF
          cat > "$P/coverage-final.json" <<EOF
          {
            "$P/src/index.js": {
              "path": "$P/src/index.js",
              "statementMap": {
                "0": { "start": { "line": 2, "column": 2 }, "end": { "line": 2, "column": 15 } }
              },
              "fnMap": {
                "0": {
                  "name": "add",
                  "decl": { "start": { "line": 1, "column": 16 }, "end": { "line": 1, "column": 19 } },
                  "loc": { "start": { "line": 1, "column": 26 }, "end": { "line": 3, "column": 1 } },
                  "line": 1
                }
              },
              "branchMap": {},
              "s": { "0": 150 },
              "f": { "0": 150 },
              "b": {}
            }
          }
          EOF

      # Runtime coverage is a paid (license-gated) feature; without a license
      # the CLI may refuse it, so tolerate a failure but validate a success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/runtime-coverage-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/runtime-coverage-project/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'

      - name: Assert action ran (or failed gracefully without a license)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: success but issues is not a number: '$ISSUES'"
              exit 1
            fi
            echo "PASS: issues=$ISSUES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (license-gated feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
