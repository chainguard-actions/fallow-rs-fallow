name: Test health with runtime coverage thresholds
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # runtime-coverage is a paid (licensed) feature; without a license the CLI
      # may refuse it. Accept either a successful run with valid outputs or a
      # clean failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/project
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert outcome
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "args: $FALLOW_ANALYSIS_ARGS_JSON"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: succeeded but issues is not a number: '$ISSUES'"
              exit 1
            fi
            echo "PASS: runtime coverage run succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (licensed feature unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
