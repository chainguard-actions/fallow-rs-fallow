name: Test health with runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Runtime coverage is a paid (licensed) feature of the fallow CLI. Without
      # a license the CLI may refuse the flag, so accept a graceful failure but
      # validate outputs strictly whenever it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/project
          min-invocations-hot: '10'
          min-observation-volume: '5'
          low-traffic-threshold: '0.01'

      - name: Assert action ran (outputs set, or failed gracefully without license)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: action succeeded but issues is not a number: '$ISSUES'"
              exit 1
            fi
            echo "PASS: issues=$ISSUES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage unavailable (license required), failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
