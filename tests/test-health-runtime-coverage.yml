name: Test health with runtime coverage tuning inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Runtime coverage is a paid feature of fallow; without a license the CLI
      # may refuse it. The step must still get past the action's own input
      # validation and actually invoke fallow (which writes fallow-stderr.log).
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-runtime
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: '10'
          min-observation-volume: '5'
          low-traffic-threshold: '0.01'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number: '$ISSUES'"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ ! -f fallow-runtime/fallow-analysis-args.sh ]; then
              echo "FAIL: action failed before invoking fallow (input validation rejected valid values?)"
              ls -la fallow-runtime || true
              exit 1
            fi
            cat fallow-runtime/fallow-analysis-args.sh
            if ! grep -q -- '--runtime-coverage' fallow-runtime/fallow-analysis-args.sh; then
              echo "FAIL: --runtime-coverage was not forwarded to fallow"
              exit 1
            fi
            cat fallow-runtime/fallow-stderr.log 2>/dev/null || true
            echo "PASS: fallow was invoked; runtime coverage refused by CLI (paid feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
