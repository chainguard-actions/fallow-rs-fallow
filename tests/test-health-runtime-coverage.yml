name: Test health with runtime coverage input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Create Istanbul runtime coverage file
        run: |
          FILE="$GITHUB_WORKSPACE/tests/fixtures/simple-js/complex.js"
          mkdir -p "$RUNNER_TEMP/rtcov"
          cat > "$RUNNER_TEMP/rtcov/coverage-final.json" <<EOF
          {
            "$FILE": {
              "path": "$FILE",
              "statementMap": {},
              "fnMap": {
                "0": {
                  "name": "complexFunction",
                  "decl": {"start": {"line": 2, "column": 16}, "end": {"line": 2, "column": 31}},
                  "loc": {"start": {"line": 2, "column": 47}, "end": {"line": 24, "column": 1}},
                  "line": 2
                }
              },
              "branchMap": {},
              "s": {},
              "f": {"0": 250},
              "b": {}
            }
          }
          EOF
          jq empty "$RUNNER_TEMP/rtcov/coverage-final.json"

      # Runtime coverage is a paid/licensed fallow feature: without a license
      # the CLI may refuse it. Accept either a validated success or a failure.
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          runtime-coverage: ${{ runner.temp }}/rtcov/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'

      - name: Assert action ran (validated output, or failed on license gate)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: success but issues is not numeric: '$ISSUES'"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: success but results file missing/invalid: $RESULTS"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (licensed feature unavailable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
