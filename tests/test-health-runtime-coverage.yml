name: Test health runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create runtime coverage input (Istanbul format)
        run: |
          mkdir -p fallow-runtime
          ROOT="$GITHUB_WORKSPACE/tests/fixtures/dirty-project"
          cat > fallow-runtime/coverage-final.json <<EOF
          {
            "$ROOT/src/helper.ts": {
              "path": "$ROOT/src/helper.ts",
              "statementMap": {"0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 19}}},
              "fnMap": {"0": {"name": "usedHelper", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 26}}, "loc": {"start": {"line": 1, "column": 50}, "end": {"line": 3, "column": 1}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 500},
              "f": {"0": 500},
              "b": {}
            }
          }
          EOF
          jq empty fallow-runtime/coverage-final.json
      # Runtime coverage is a paid (license-gated) feature of fallow. Without a
      # license the CLI may refuse it, so accept a graceful failure but keep the
      # success branch strict.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          runtime-coverage: ${{ github.workspace }}/fallow-runtime/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert runtime coverage ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: action succeeded but results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis produced results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage refused gracefully (license-gated feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
