name: Test health with runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid (licensed) fallow feature; without a license
      # the CLI may refuse it, so assert on the outcome rather than force success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/project
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-runtime-coverage
      - name: Assert runtime coverage run succeeded or was refused cleanly
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
              echo "FAIL: action succeeded but results file missing"
              exit 1
            fi
            jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage refused (licensed feature unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
