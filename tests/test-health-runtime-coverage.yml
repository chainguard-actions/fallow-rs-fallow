name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid feature: without a license the CLI may
      # refuse it. Accept a clean failure, but validate results on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '2'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          artifacts-dir: fallow-artifacts-runtime-coverage
      - name: Assert runtime coverage run outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            case "$RESULTS" in
              /*) FILE="$RESULTS" ;;
              *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
            esac
            if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
              echo "FAIL: results file missing"
              exit 1
            fi
            jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (paid feature unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
