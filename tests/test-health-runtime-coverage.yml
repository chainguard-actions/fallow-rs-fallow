name: Test health with runtime coverage tuning inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/runtime-data"
          cat > "$GITHUB_WORKSPACE/runtime-data/coverage-final.json" <<'EOF'
          {
            "/ci/build/src/math.ts": {
              "path": "/ci/build/src/math.ts",
              "statementMap": {
                "0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}}
              },
              "fnMap": {
                "0": {
                  "name": "add",
                  "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}},
                  "loc": {"start": {"line": 1, "column": 0}, "end": {"line": 3, "column": 1}},
                  "line": 1
                }
              },
              "branchMap": {},
              "s": {"0": 250},
              "f": {"0": 250},
              "b": {}
            }
          }
          EOF
      # Runtime coverage is a paid fallow feature: without a license the CLI
      # may refuse it. Accept success (with strict output checks) or a
      # graceful failure; anything else is fatal.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-runtime
          type-aware: 'false'
          runtime-coverage: ${{ github.workspace }}/runtime-data/coverage-final.json
          coverage-root: /ci/build
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues is not a non-negative integer"
              exit 1
            fi
            f="$RESULTS"
            [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
            if [ ! -f "$f" ] || ! jq empty "$f"; then
              echo "FAIL: results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage run succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (unlicensed paid feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
