name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create runtime coverage input (Istanbul format)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.rtcov"
          ROOT="$GITHUB_WORKSPACE/tests/fixtures/clean-project"
          cat > "$GITHUB_WORKSPACE/.rtcov/coverage-final.json" <<EOF
          {
            "$ROOT/src/math.js": {
              "path": "$ROOT/src/math.js",
              "statementMap": {"0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 3, "column": 1}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 250},
              "f": {"0": 250},
              "b": {}
            }
          }
          EOF
          jq -e . "$GITHUB_WORKSPACE/.rtcov/coverage-final.json" > /dev/null
      # Runtime coverage is a paid/licensed feature: without a license the CLI
      # may refuse to run it. Accept either a successful analysis with valid
      # results, or a clean failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          runtime-coverage: ${{ github.workspace }}/.rtcov/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert runtime coverage outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            F="$RESULTS"
            [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
            if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
              echo "FAIL: results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage failed cleanly (license-gated feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
