name: Test health runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-runtime
          runtime-coverage: tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '5'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert runtime coverage run (results, or a reported CLI failure for the paid feature)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues is not numeric"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
              echo "FAIL: results file missing or invalid JSON"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            if ! command -v fallow > /dev/null 2>&1 && [ ! -d fallow-out-runtime ]; then
              echo "FAIL: action failed before fallow was installed / ran"
              exit 1
            fi
            ls -la fallow-out-runtime || true
            cat fallow-out-runtime/fallow-stderr.log 2>/dev/null || true
            echo "PASS: runtime coverage (paid feature) rejected by the CLI after install"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
