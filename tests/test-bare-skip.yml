name: Test combined run with skip selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-skip"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-skip","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(2));
          EOF
          echo 'export function used(n) { return n * 2; }' > "$D/src/util.js"

      - id: action
        uses: .
        with:
          root: fx-skip
          skip: dupes,health
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert skipped analyses absent
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          jq 'keys' "$RESULTS"
          if [ "$(jq -r '(.dupes // null) == null and (.health // null) == null' "$RESULTS")" != "true" ]; then
            echo "FAIL: dupes/health sections should be absent when skipped"
            exit 1
          fi
          echo "PASS"
