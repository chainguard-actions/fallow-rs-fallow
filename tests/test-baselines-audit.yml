name: Test saving baselines and audit with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save-dead
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/health.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
      - name: Assert baselines written
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for b in dead-code health dupes; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$b.json" ]; then
              echo "FAIL: $b baseline not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'true'
          annotations: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected baseline to suppress all known issues"
            exit 1
          fi
          echo "PASS"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          changed-since: HEAD
          fail-on-issues: 'false'
          annotations: 'false'
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
          GATE: ${{ steps.audit.outputs.gate }}
          ISSUES: ${{ steps.audit.outputs.issues }}
        run: |
          echo "verdict: $VERDICT gate: $GATE issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          echo "PASS"
