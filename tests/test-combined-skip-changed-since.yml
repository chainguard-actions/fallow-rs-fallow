name: Test combined run with skip and changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          import { add } from './util.js';
          console.log(add(1, 2));
          EOF
          cat > fallow-sample/src/util.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          export function unusedHelper(x) {
            return x * 2;
          }
          EOF

      - id: action
        uses: .
        with:
          command: ''
          root: fallow-sample
          skip: dupes,health
          changed-since: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results valid and issues numeric
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
