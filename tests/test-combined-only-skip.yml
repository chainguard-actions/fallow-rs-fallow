name: Test combined run with only and skip selectors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create demo project
        run: |
          mkdir -p demo-combined/src
          cat > demo-combined/package.json <<'EOF'
          {"name":"demo-combined","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > demo-combined/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          echo 'export function add(a, b) { return a + b; }' > demo-combined/src/math.js

      - id: only
        uses: .
        with:
          root: demo-combined
          only: dead-code,dupes
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert only run
        env:
          ISSUES: ${{ steps.only.outputs.issues }}
          RESULTS: ${{ steps.only.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          cat fallow-analysis-args.sh
          if ! grep -q -- '--only' fallow-analysis-args.sh; then
            echo "FAIL: --only not forwarded"
            exit 1
          fi
          echo "PASS"

      - id: skip
        uses: .
        with:
          root: demo-combined
          skip: health
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert skip run
        env:
          ISSUES: ${{ steps.skip.outputs.issues }}
          RESULTS: ${{ steps.skip.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          cat fallow-analysis-args.sh
          if ! grep -q -- '--skip' fallow-analysis-args.sh; then
            echo "FAIL: --skip not forwarded"
            exit 1
          fi
          echo "PASS"
