name: Test combined run with only and skip selectors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: only
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          only: dead-code
          artifacts-dir: fallow-artifacts-only
      - id: skip
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          skip: dupes,health
          artifacts-dir: fallow-artifacts-skip
      - name: Assert both selector runs produced results
        env:
          ONLY_ISSUES: ${{ steps.only.outputs.issues }}
          ONLY_RESULTS: ${{ steps.only.outputs.results }}
          SKIP_ISSUES: ${{ steps.skip.outputs.issues }}
          SKIP_RESULTS: ${{ steps.skip.outputs.results }}
        run: |
          echo "only: issues=$ONLY_ISSUES results=$ONLY_RESULTS"
          echo "skip: issues=$SKIP_ISSUES results=$SKIP_RESULTS"
          for v in "$ONLY_ISSUES" "$SKIP_ISSUES"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output '$v' is not a number"
              exit 1
            fi
          done
          for R in "$ONLY_RESULTS" "$SKIP_RESULTS"; do
            case "$R" in
              /*) FILE="$R" ;;
              *) FILE="$GITHUB_WORKSPACE/$R" ;;
            esac
            if [ -z "$R" ] || [ ! -s "$FILE" ]; then
              echo "FAIL: results file '$R' missing"
              exit 1
            fi
            jq empty "$FILE" || { echo "FAIL: invalid JSON in $FILE"; exit 1; }
          done
          OFILE="$ONLY_RESULTS"
          [ "${OFILE#/}" = "$OFILE" ] && OFILE="$GITHUB_WORKSPACE/$OFILE"
          if ! grep -q orphan "$OFILE"; then
            echo "FAIL: dead-code-only run should report orphan.ts"
            exit 1
          fi
          echo "PASS"
