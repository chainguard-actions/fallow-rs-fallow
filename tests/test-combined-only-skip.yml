name: Test combined run with only and skip selectors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: only
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          only: dead-code
      - id: skip
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          skip: dupes,health
      - name: Assert both runs produced results
        env:
          ONLY_ISSUES: ${{ steps.only.outputs.issues }}
          ONLY_RESULTS: ${{ steps.only.outputs.results }}
          SKIP_ISSUES: ${{ steps.skip.outputs.issues }}
          SKIP_RESULTS: ${{ steps.skip.outputs.results }}
        run: |
          echo "only issues: $ONLY_ISSUES  skip issues: $SKIP_ISSUES"
          for v in "$ONLY_ISSUES" "$SKIP_ISSUES"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues '$v' not numeric"
              exit 1
            fi
          done
          for f in "$ONLY_RESULTS" "$SKIP_RESULTS"; do
            if [ -z "$f" ] || ! jq empty "$f"; then
              echo "FAIL: results '$f' missing or invalid"
              exit 1
            fi
          done
          if ! grep -q orphan "$ONLY_RESULTS"; then
            echo "FAIL: dead-code-only run did not report orphan.ts"
            exit 1
          fi
          echo "PASS"
