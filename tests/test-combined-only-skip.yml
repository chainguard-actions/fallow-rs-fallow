name: Test combined run with only and skip selectors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: only
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          only: dead-code
      - name: Assert only dead-code ran and found issues
        env:
          ISSUES: ${{ steps.only.outputs.issues }}
          RESULTS: ${{ steps.only.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if ! grep -q orphan "$RESULTS"; then
            echo "FAIL: expected orphan.ts in dead-code results"
            exit 1
          fi
          echo "PASS"
      - id: skip
        uses: .
        with:
          root: tests/fixtures/clean-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          skip: dupes,health
      - name: Assert skip run produced results
        env:
          RESULTS: ${{ steps.skip.outputs.results }}
          OUTCOME: ${{ steps.skip.outcome }}
        run: |
          echo "outcome: $OUTCOME results: $RESULTS"
          if [ "$OUTCOME" != "success" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: skip run failed or results missing"
            exit 1
          fi
          echo "PASS"
