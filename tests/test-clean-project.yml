name: Test clean project passes with zero issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: 3.45.0
          issue-types: unused-files,unused-exports
          auto-changed-since: 'false'
      - name: Assert zero issues
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "verdict: '$VERDICT'"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues"
            cat "$RESULTS" || true
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty for non-audit commands"
            exit 1
          fi
          echo "PASS"
