name: Test dead-code detects unused code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert issues were detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one issue (orphan file / unused export)"
            exit 1
          fi
          echo "PASS"
      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ]; then
            echo "FAIL: results file not found"
            exit 1
          fi
          if ! jq -e . "$f" > /dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          if ! grep -q "orphan" "$f"; then
            echo "FAIL: expected orphan.ts to be reported"
            head -c 4000 "$f"
            exit 1
          fi
          echo "PASS"
