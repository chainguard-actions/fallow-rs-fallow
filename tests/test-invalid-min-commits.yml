name: Test health rejects a non-integer min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/act-fixtures/clean-project
          hotspots: 'true'
          since: 90d
          min-commits: three
          artifacts-dir: fallow-out-min-commits-invalid
      - name: Assert validation failure before analysis
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: non-integer min-commits must fail the action"
            exit 1
          fi
          if [ -f "fallow-out-min-commits-invalid/fallow-analysis-args.sh" ]; then
            echo "FAIL: fallow should not run when validation fails"
            exit 1
          fi
          echo "PASS"
