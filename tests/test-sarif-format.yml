name: Test SARIF format output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/js-project
          format: sarif
          sarif: 'false'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert sarif output is set
        env:
          SARIF: ${{ steps.action.outputs.sarif }}
        run: |
          echo "sarif: $SARIF"
          if [ -z "$SARIF" ]; then
            echo "FAIL: sarif output is empty"
            exit 1
          fi
          echo "PASS: sarif output is set to $SARIF"

      - name: Assert sarif file exists and is valid JSON
        env:
          SARIF: ${{ steps.action.outputs.sarif }}
        run: |
          echo "Checking sarif file: $SARIF"
          if [ ! -f "$SARIF" ]; then
            echo "FAIL: sarif file does not exist at $SARIF"
            exit 1
          fi
          if ! jq empty "$SARIF" 2>/dev/null; then
            echo "FAIL: sarif file is not valid JSON"
            exit 1
          fi
          # Verify it has the SARIF schema structure
          SCHEMA=$(jq -r '."$schema" // ""' "$SARIF")
          echo "SARIF schema: $SCHEMA"
          if ! echo "$SCHEMA" | grep -qi "sarif"; then
            echo "FAIL: sarif file does not have a SARIF schema reference"
            exit 1
          fi
          echo "PASS: sarif file exists and has valid SARIF structure"

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a non-negative integer: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues output is a valid number: $ISSUES"
