name: Test SARIF format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for SARIF output test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/sarif-project/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sarif-project/package.json" <<'EOF'
          {
            "name": "sarif-test-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/sarif-project/src/index.js" <<'EOF'
          export function usedFn() { return 1; }
          export function unusedFn() { return 2; }
          usedFn();
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sarif-project
          format: sarif
          sarif: 'false'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          no-cache: 'true'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected issues to be a number, got: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert sarif output is set and file exists
        env:
          SARIF_PATH: ${{ steps.action.outputs.sarif }}
        run: |
          echo "sarif path: $SARIF_PATH"
          if [ -z "$SARIF_PATH" ]; then
            echo "NOTE: sarif output is empty (may be expected when no issues found)"
          else
            if [ ! -f "$SARIF_PATH" ]; then
              echo "FAIL: sarif file does not exist at: $SARIF_PATH"
              exit 1
            fi
            if ! jq empty "$SARIF_PATH" 2>/dev/null; then
              echo "FAIL: sarif file is not valid JSON"
              exit 1
            fi
            echo "PASS: sarif file exists and is valid JSON"
          fi
          echo "PASS"
