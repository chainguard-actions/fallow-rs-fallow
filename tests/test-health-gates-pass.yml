name: Test health min-score and min-severity gates pass with lenient thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          max-cyclomatic: '100'
          max-cognitive: '100'
          max-crap: '1000'
          min-severity: critical
          min-score: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert no findings and gates did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
          PASSED: ${{ steps.action.outputs.gates-passed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: '$FAILED'"
          echo "gates-passed: '$PASSED'"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 findings with lenient thresholds"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "FAIL: expected no failed gates"
            exit 1
          fi
          echo "PASS"
