name: Test only selector in combined mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Run combined mode with only dead-code analysis
      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          # No command = combined mode; only= restricts which analyses run
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          only: dead-code

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues (dead-code only): $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: combined mode with only=dead-code produced numeric output: $ISSUES"

      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file exists and is valid JSON"

      - name: Assert combined results structure has check section
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          # Combined mode results have a 'check' section for dead-code
          CHECK=$(jq -r '.check // empty' "$RESULTS" 2>/dev/null || true)
          echo "check section present: $([ -n "$CHECK" ] && echo yes || echo no)"
          if [ -z "$CHECK" ]; then
            echo "WARN: check section not found in combined results (may vary by fallow version)"
          else
            echo "PASS: check section found in combined results"
          fi
          echo "PASS: only selector test completed"
