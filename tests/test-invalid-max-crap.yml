name: Test invalid max-crap input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          coverage: tests/fixtures/coverage-final.json
          coverage-root: tests/fixtures/sample-project
          max-crap: high
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-crap
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-numeric max-crap"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
