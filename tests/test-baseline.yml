name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline file saved
        run: |
          ls -la "$GITHUB_WORKSPACE" | grep -i baseline || true
          if [ ! -s "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$GITHUB_WORKSPACE/fallow-baseline.json" || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline was loaded and absorbs existing issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BEFORE: ${{ steps.save.outputs.issues }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          echo "issues before baseline: $BEFORE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$BEFORE" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues outputs are not numeric"
            exit 1
          fi
          if [ "$ISSUES" -ge "$BEFORE" ] && [ "$BEFORE" -gt 0 ]; then
            echo "FAIL: expected baseline to suppress known issues"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          echo "PASS"
