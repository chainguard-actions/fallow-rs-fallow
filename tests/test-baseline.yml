name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test-save-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline.json
          regression-baseline: /tmp/fallow-regression-baseline.json
          save-regression-baseline: /tmp/fallow-regression-baseline.json
          dead-code-baseline: /tmp/fallow-dead-code-baseline.json
          health-baseline: /tmp/fallow-health-baseline.json
          dupes-baseline: /tmp/fallow-dupes-baseline.json
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-load-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy baseline file
        run: |
          echo '{}' > /tmp/fallow-test-baseline.json
      - id: action
        uses: .
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          baseline: /tmp/fallow-test-baseline.json
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
