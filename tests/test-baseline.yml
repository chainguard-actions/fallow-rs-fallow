name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline file was saved
        run: |
          ls -la "$GITHUB_WORKSPACE" | grep fallow-test-baseline || true
          if [ ! -f "$GITHUB_WORKSPACE/fallow-test-baseline.json" ]; then
            echo "FAIL: baseline file not saved"
            exit 1
          fi
          jq empty "$GITHUB_WORKSPACE/fallow-test-baseline.json" || { echo "FAIL: baseline is not JSON"; exit 1; }
          echo "PASS: baseline saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          baseline: ${{ github.workspace }}/fallow-test-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed all known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues with baseline: $ISSUES"
          echo "issues when saving: $SAVED_ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$' || ! echo "$SAVED_ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues outputs are not numbers"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline comparison reported more issues than the baseline run"
            exit 1
          fi
          echo "PASS"
