name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues (first run): $ISSUES"
          ls -la "$GITHUB_WORKSPACE/fallow-baseline.json" || true
          if [ ! -s "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$GITHUB_WORKSPACE/fallow-baseline.json" || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline suppressed known issues
        env:
          FIRST: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
        run: |
          echo "first: $FIRST second: $ISSUES baseline-entries: $ENTRIES"
          if [ "$FIRST" -lt 1 ]; then
            echo "FAIL: first run should have found issues"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected baseline to suppress all known issues"
            exit 1
          fi
          echo "PASS"
