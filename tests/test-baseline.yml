name: Test save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          save-baseline: ${{ runner.temp }}/fallow-baseline.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline saved
        run: |
          if [ ! -s "$RUNNER_TEMP/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          cat "$RUNNER_TEMP/fallow-baseline.json" | head -c 2000
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          baseline: ${{ runner.temp }}/fallow-baseline.json
          version: '3.37.0'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppresses issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          PATH_OUT: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $PATH_OUT"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          echo "PASS"
