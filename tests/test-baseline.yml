name: Test dead-code save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$RUNNER_TEMP/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ runner.temp }}/fallow-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline saved
        env:
          BASELINE: ${{ runner.temp }}/fallow-baselines/dead-code.json
        run: |
          if [ ! -f "$BASELINE" ]; then
            echo "FAIL: baseline file not written at $BASELINE"
            exit 1
          fi
          jq -e . "$BASELINE" > /dev/null || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ runner.temp }}/fallow-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppressed known issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
        run: |
          echo "issues before: $BEFORE"
          echo "issues with baseline: $AFTER"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issue counts are not numbers"
            exit 1
          fi
          if [ "$BEFORE" -lt 1 ]; then
            echo "FAIL: expected issues in dead-code fixture before baseline"
            exit 1
          fi
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "FAIL: baseline run reported more issues than without baseline"
            exit 1
          fi
          echo "PASS"
