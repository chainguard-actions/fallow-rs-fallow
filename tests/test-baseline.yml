name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline file saved
        run: |
          ls -la "$GITHUB_WORKSPACE" | grep fallow || true
          if [ ! -f "$GITHUB_WORKSPACE/fallow-test-baseline.json" ]; then
            echo "FAIL: baseline file not saved"
            exit 1
          fi
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline run outputs
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues with baseline: $ISSUES (before: $SAVED_ISSUES)"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues than the baseline-save run"
            exit 1
          fi
          echo "PASS"
