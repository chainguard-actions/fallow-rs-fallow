name: Test dead-code baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
      - name: Assert baseline file written
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          ls -la "$GITHUB_WORKSPACE" | grep -i baseline || true
          if [ ! -s "$F" ]; then
            echo "FAIL: baseline file not written at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$F"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'true'
          format: json
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-stale-entries: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          echo "PASS"
