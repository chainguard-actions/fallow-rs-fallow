name: Test save-baseline then baseline comparison (dead-code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with unused code
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/dc-baseline"
          mkdir -p "$R/src"
          cat > "$R/package.json" <<'EOF'
          {
            "name": "dc-baseline",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$R/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$R/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dc-baseline
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/baselines/dead-code-baseline.json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/baselines/dead-code-baseline.json"
          ls -la "$GITHUB_WORKSPACE/baselines" || true
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline not saved at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dc-baseline
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          baseline: ${{ github.workspace }}/baselines/dead-code-baseline.json

      - name: Assert baseline did not add issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          RESULTS: ${{ steps.load.outputs.results }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues with baseline: $ISSUES"
          echo "issues when saving: $SAVED_ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues outputs are not numbers"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues than the saving run"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
