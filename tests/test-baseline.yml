name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p /tmp/fallow-baseline-test
          cat > /tmp/fallow-baseline-test/package.json <<'EOF'
          {
            "name": "baseline-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-baseline-test/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      - name: Create baseline directory
        run: mkdir -p /tmp/fallow-baseline-dir

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-baseline-test
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline-dir/dead-code-baseline.json
          baseline: /tmp/fallow-baseline-dir/dead-code-baseline.json
          dead-code-baseline: /tmp/fallow-baseline-dir/dead-code-baseline.json
          health-baseline: /tmp/fallow-baseline-dir/health-baseline.json
          dupes-baseline: /tmp/fallow-baseline-dir/dupes-baseline.json
          auto-changed-since: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
