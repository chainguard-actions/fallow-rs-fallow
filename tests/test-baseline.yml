name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline not saved at $f"
            exit 1
          fi
          if ! jq -e . "$f" > /dev/null; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed all findings
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-stale-entries: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after loading a baseline from the same run"
            exit 1
          fi
          echo "PASS"
