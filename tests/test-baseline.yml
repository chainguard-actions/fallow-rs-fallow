name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline saved
        run: |
          ls -la "$GITHUB_WORKSPACE" | grep -i baseline || true
          if [ ! -f "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq -e . "$GITHUB_WORKSPACE/fallow-baseline.json" > /dev/null || { echo "FAIL: baseline is not JSON"; exit 1; }
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline comparison ran
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES entries: $ENTRIES stale: $STALE path: $BPATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "$FALLOW_ANALYSIS_ARGS_JSON" | jq -e 'index("--baseline") != null' > /dev/null \
            || { echo "FAIL: --baseline missing"; exit 1; }
          echo "PASS"
