name: Test save-baseline then baseline suppresses known issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline file written
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baseline.json" || true
          if [ ! -s "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'true'
          format: json
          baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline suppressed issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          echo "PASS"
