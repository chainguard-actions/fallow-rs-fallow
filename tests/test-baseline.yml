name: Test dead-code baseline save then load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          ls -la "$GITHUB_WORKSPACE/fallow-baselines" || true
          if [ ! -s "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baseline suppressed known issues
        env:
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.load.outputs.issues }}
        run: |
          echo "issues before baseline: $SAVE_ISSUES"
          echo "issues with baseline: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi          if [[ "$SAVE_ISSUES" =~ ^[0-9]+$ ]] && [ "$ISSUES" -gt "$SAVE_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues than the run that saved it"
            exit 1
          fii
          echo "PASS"
