name: Test save-baseline then baseline comparison (dead-code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/baseline-project"
          mkdir -p "$P/src"
          echo '{"name":"baseline-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not found at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$F"
          echo "PASS"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          format: json
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          PATH_OUT: ${{ steps.action.outputs.baseline-path }}
        run: |
          echo "saved run issues: $SAVED_ISSUES"
          echo "baseline run issues: $ISSUES"
          echo "baseline-path: $PATH_OUT"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against the baseline"
            exit 1
          fi
          echo "PASS"
