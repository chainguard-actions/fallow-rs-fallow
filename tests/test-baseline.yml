name: Test saving and loading baselines and regression baselines
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline files were saved
        run: |
          ls -la "$GITHUB_WORKSPACE"
          for f in fallow-baseline.json fallow-regression.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
            echo "--- $f"
            cat "$GITHUB_WORKSPACE/$f"
          done
          echo "PASS: baselines saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          baseline: ${{ github.workspace }}/fallow-baseline.json
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline was loaded
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues (with baseline): $ISSUES"
          echo "issues (save run): $SAVED_ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if echo "$SAVED_ISSUES" | grep -qE '^[0-9]+$' && [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: loading the baseline increased the issue count"
            exit 1
          fi
          echo "PASS"
