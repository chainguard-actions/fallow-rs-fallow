name: Test save-baseline then load baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
      - name: Assert baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: baseline file missing or invalid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-load
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
      - name: Assert baseline suppressed all issues
        env:
          OUTCOME: ${{ steps.load.outcome }}
          ISSUES: ${{ steps.load.outputs.issues }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          EXPECTED: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES path: $BPATH entries: $ENTRIES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: with baseline, fail-on-issues should pass"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path mismatch"
            exit 1
          fi
          echo "PASS"
