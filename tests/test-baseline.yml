name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove stale baseline
        run: rm -f "$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -s "$F" ] || ! jq empty "$F"; then
            echo "FAIL: baseline file missing or invalid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          version: '3.38.0'
          fail-on-issues: 'true'
          type-aware: 'false'
          format: json
      - name: Assert baseline comparison
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED: ${{ github.workspace }}/fallow-dead-code-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: all issues should be suppressed by the baseline"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not a number"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path does not match input"
            exit 1
          fi
          echo "PASS"
