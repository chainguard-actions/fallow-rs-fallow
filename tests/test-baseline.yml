name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          save-baseline: ${{ github.workspace }}/fallow-dc-baseline.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dc-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          cat "$F"
          jq -e . "$F" > /dev/null || { echo "FAIL: baseline not valid JSON"; exit 1; }
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          baseline: ${{ github.workspace }}/fallow-dc-baseline.json
          version: '3.37.0'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppressed known issues
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.action.outputs.issues }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
          BPATH: ${{ steps.action.outputs.baseline-path }}
        run: |
          echo "saved-run issues: $SAVED_ISSUES"
          echo "baseline-run issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-path: $BPATH"
          if ! [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]] || [ "$SAVED_ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues in the save run"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against the baseline"
            exit 1
          fi
          echo "PASS"
