name: Test save-baseline and baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq -e . "$f" > /dev/null || { echo "FAIL: baseline is not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baseline comparison
        env:
          FIRST: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
        run: |
          echo "first issues: $FIRST"
          echo "issues with baseline: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$FIRST" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issue counts not numeric"
            exit 1
          fi
          if [ "$ISSUES" -gt "$FIRST" ]; then
            echo "FAIL: baseline run reported more issues than the original run"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
