name: Test saving and loading baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline-dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline files saved
        run: |
          for f in fallow-baseline-dead-code.json fallow-regression-baseline.json; do
            if [ ! -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not saved"
              exit 1
            fi
            jq empty "$GITHUB_WORKSPACE/$f" || { echo "FAIL: $f invalid JSON"; exit 1; }
            echo "saved $f:"; cat "$GITHUB_WORKSPACE/$f"
          done
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baseline-dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-regression: 'true'
          tolerance: '0'
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baseline loaded without regression
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          echo "baseline-path: $BPATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
