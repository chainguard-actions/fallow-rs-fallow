name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/baseline-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "baseline-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/tests/fixtures/baseline-project/fallow-baseline.json

      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/baseline-project/fallow-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not saved at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$F"
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          baseline: ${{ github.workspace }}/tests/fixtures/baseline-project/fallow-baseline.json

      - name: Assert baseline was used
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED: ${{ github.workspace }}/tests/fixtures/baseline-project/fallow-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$BASELINE_PATH" != "$EXPECTED" ]; then
            echo "FAIL: expected baseline-path '$EXPECTED'"
            exit 1
          fi
          echo "PASS"
