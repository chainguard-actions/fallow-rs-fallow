name: Test dead-code save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ ! -f "$GITHUB_WORKSPACE/fallow-test-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq -e . "$GITHUB_WORKSPACE/fallow-test-baseline.json" > /dev/null || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline comparison
        env:
          FIRST: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
        run: |
          echo "first issues: $FIRST"
          echo "issues with baseline: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES stale: $STALE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -gt "$FIRST" ]; then
            echo "FAIL: baseline run reported more issues than the run that saved it"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "$GITHUB_WORKSPACE/fallow-test-baseline.json" ]; then
            echo "FAIL: unexpected baseline-path"
            exit 1
          fi
          echo "PASS"
