name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not JSON"; exit 1; }
          cat "$F"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-compare
      - name: Assert baselined run has no new issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after applying baseline"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path does not match the input"
            exit 1
          fi
          echo "PASS"
