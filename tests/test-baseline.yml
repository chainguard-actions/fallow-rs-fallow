name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/baseline-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "baseline-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          format: json
          save-baseline: ${{ github.workspace }}/tests/fixtures/baseline-project/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/baseline-project/fallow-baseline.json"
          if [ ! -f "$F" ] || ! jq empty "$F"; then
            echo "FAIL: baseline file missing or invalid at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          format: json
          baseline: ${{ github.workspace }}/tests/fixtures/baseline-project/fallow-baseline.json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED: ${{ github.workspace }}/tests/fixtures/baseline-project/fallow-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after baseline, got '$ISSUES'"
            exit 1
          fi
          if [ "$BPATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path should echo the baseline input"
            exit 1
          fi
          echo "PASS"
