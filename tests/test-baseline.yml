name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -s "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: baseline file missing or invalid"
            exit 1
          fi
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          version: '3.37.0'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppresses known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES entries: $ENTRIES stale: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against freshly saved baseline"
            exit 1
          fi
          echo "PASS"
