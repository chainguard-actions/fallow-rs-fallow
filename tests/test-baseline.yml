name: Test save-baseline then baseline for dead-code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: '3.43.1'
          format: json
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
      - name: Assert baseline file saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          ls -la "$GITHUB_WORKSPACE" || true
          if [ ! -f "$GITHUB_WORKSPACE/fallow-dead-code-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq . "$GITHUB_WORKSPACE/fallow-dead-code-baseline.json" > /dev/null || { echo "FAIL: baseline is not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: '3.43.1'
          format: json
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
      - name: Assert baseline suppresses known issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "before: $BEFORE after: $AFTER baseline-path: '$BASELINE_PATH'"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues outputs must be numeric"
            exit 1
          fi
          if [ "$BEFORE" -lt 1 ]; then
            echo "FAIL: expected issues before baselining"
            exit 1
          fi
          if [ "$AFTER" -ge "$BEFORE" ]; then
            echo "FAIL: baseline should reduce reported issues"
            exit 1
          fi
          echo "PASS"
