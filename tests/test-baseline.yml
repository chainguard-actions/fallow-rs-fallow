name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with unused code
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/baseline-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "baseline-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline not saved at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/baseline-project
          baseline: ${{ github.workspace }}/fallow-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline comparison did not increase issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "issues: $ISSUES saved-run issues: $SAVED_ISSUES outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with baseline"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issue counts"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues than the run that saved it"
            exit 1
          fi
          echo "PASS"
