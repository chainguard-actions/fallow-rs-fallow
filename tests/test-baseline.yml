name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create baseline files
        run: |
          mkdir -p /tmp/fallow-baselines
          echo '{}' > /tmp/fallow-baselines/dead-code-baseline.json
          echo '{}' > /tmp/fallow-baselines/health-baseline.json
          echo '{}' > /tmp/fallow-baselines/dupes-baseline.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          fail-on-issues: 'false'
          format: json
          baseline: /tmp/fallow-baselines/dead-code-baseline.json
          save-baseline: /tmp/fallow-baselines/saved-baseline.json
          dead-code-baseline: /tmp/fallow-baselines/dead-code-baseline.json
          health-baseline: /tmp/fallow-baselines/health-baseline.json
          dupes-baseline: /tmp/fallow-baselines/dupes-baseline.json
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
