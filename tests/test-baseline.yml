name: Test save-baseline then baseline suppresses findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline not JSON"; exit 1; }
          cat "$F"
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baseline suppresses known issues
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.action.outputs.issues }}
          BPATH: ${{ steps.action.outputs.baseline-path }}
        run: |
          echo "issues before baseline: $SAVED_ISSUES"
          echo "issues with baseline: $ISSUES"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against fresh baseline"
            exit 1
          fi
          echo "PASS"
