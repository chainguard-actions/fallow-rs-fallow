name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline file written
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq -e . "$F" > /dev/null || { echo "FAIL: baseline not JSON"; exit 1; }
          head -c 1000 "$F"; echo
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-stale-baseline: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselined run has no new issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline entries: $ENTRIES"
          echo "stale entries: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after baselining"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          echo "PASS"
