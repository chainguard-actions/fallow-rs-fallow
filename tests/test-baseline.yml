name: Test save-baseline and baseline round trip
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline not saved at $F"
            exit 1
          fi
          cat "$F"
          jq -e . "$F" > /dev/null || { echo "FAIL: baseline not valid JSON"; exit 1; }
          echo "PASS"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline applied
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          BPATH: ${{ steps.action.outputs.baseline-path }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
          EXPECTED: ${{ github.workspace }}/fallow-dead-code-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after baselining, got '$ISSUES'"
            exit 1
          fi
          if [ "$BPATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path expected '$EXPECTED'"
            exit 1
          fi
          echo "PASS"
