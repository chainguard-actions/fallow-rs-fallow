name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/fallow-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline file saved
        env:
          BASELINE: ${{ runner.temp }}/fallow-baseline.json
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          ls -la "$(dirname "$BASELINE")" || true
          if [ ! -s "$BASELINE" ]; then
            echo "FAIL: baseline file not saved at $BASELINE"
            exit 1
          fi
          cat "$BASELINE"
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          baseline: ${{ runner.temp }}/fallow-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline does not increase issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues ($ISSUES) than the saved run ($SAVED_ISSUES)"
            exit 1
          fi
          echo "PASS"
