name: Test save-baseline then baseline suppresses findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare output dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-out"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-out/dead-code-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baseline file saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-out/dead-code-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline file not written"
            ls -la "$GITHUB_WORKSPACE/fallow-out" || true
            exit 1
          fi
          jq -e . "$f" > /dev/null || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          baseline: ${{ github.workspace }}/fallow-out/dead-code-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baseline reduced issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.action.outputs.issues }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
        run: |
          echo "before: $BEFORE after: $AFTER baseline-entries: $ENTRIES"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues outputs not numeric"
            exit 1
          fi
          if [ "$BEFORE" -lt 1 ]; then
            echo "FAIL: expected issues before baseline"
            exit 1
          fi
          if [ "$AFTER" -ge "$BEFORE" ]; then
            echo "FAIL: baseline did not suppress existing findings"
            exit 1
          fi
          echo "PASS"
