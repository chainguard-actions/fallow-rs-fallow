name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not created"
            exit 1
          fi
          jq -e . "$F" > /dev/null || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS: baseline saved"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppresses existing issues
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
        run: |
          echo "saved issues: $SAVED_ISSUES, compare issues: $ISSUES, outcome: $OUTCOME, entries: $ENTRIES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: comparison run with baseline should succeed (fail-on-issues default true)"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          echo "PASS"
