name: Test coverage-based CRAP scoring rejects a non-numeric max-crap
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          coverage: coverage/coverage-final.json
          coverage-root: /home/runner/work/app
          max-crap: very-high
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-invalid-max-crap

      - name: Assert action failed input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for max-crap=very-high, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-invalid-max-crap
