name: Test combined run with health-baseline and dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D" "$GITHUB_WORKSPACE/fallow-test-baselines"
          mkdir -p "$D/src" "$GITHUB_WORKSPACE/fallow-test-baselines"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          cat > "$D/src/index.ts" <<'EOF'
          export function main(n: number): number {
            if (n > 1) {
              return n - 1;
            }
            return n;
          }
          main(2);
          EOF

      - id: health-save
        uses: .
        with:
          command: health
          root: fallow-test-sample
          save-baseline: ${{ github.workspace }}/fallow-test-baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: dupes-save
        uses: .
        with:
          command: dupes
          root: fallow-test-sample
          save-baseline: ${{ github.workspace }}/fallow-test-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert section baselines exist
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-test-baselines"
          for f in health.json dupes.json; do
            if [ ! -f "$GITHUB_WORKSPACE/fallow-test-baselines/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          root: fallow-test-sample
          health-baseline: ${{ github.workspace }}/fallow-test-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-test-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
