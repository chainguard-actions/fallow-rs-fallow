name: Test combined run with health-baseline, dupes-baseline and skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: health-save
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-section-baselines/health.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-health-save
      - id: dupes-save
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-section-baselines/dupes.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-dupes-save
      - name: Assert section baselines saved
        run: |
          for f in health dupes; do
            F="$GITHUB_WORKSPACE/fallow-section-baselines/$f.json"
            if [ ! -f "$F" ]; then
              echo "FAIL: $F missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: combined
        uses: .
        with:
          root: tests/fixtures/sample-project
          health-baseline: ${{ github.workspace }}/fallow-section-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-section-baselines/dupes.json
          skip: architecture
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-combined-baselines
      - name: Assert combined outputs
        env:
          ISSUES: ${{ steps.combined.outputs.issues }}
          RESULTS: ${{ steps.combined.outputs.results }}
          VERDICT: ${{ steps.combined.outputs.verdict }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty outside audit"
            exit 1
          fi
          echo "PASS"
