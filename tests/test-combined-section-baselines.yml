name: Test combined run with skip, health-baseline and dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Prepare output dir
        run: mkdir -p fallow-out-sections

      - id: save-health
        uses: .
        with:
          command: health
          save-baseline: fallow-out-sections/health-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-sections

      - id: save-dupes
        uses: .
        with:
          command: dupes
          save-baseline: fallow-out-sections/dupes-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-sections

      - name: Assert section baselines exist
        run: |
          ls -la fallow-out-sections
          for f in health-baseline.json dupes-baseline.json; do
            if [ ! -s "fallow-out-sections/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: combined
        uses: .
        with:
          skip: architecture
          health-baseline: fallow-out-sections/health-baseline.json
          dupes-baseline: fallow-out-sections/dupes-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-sections

      - name: Assert combined run results
        env:
          ISSUES: ${{ steps.combined.outputs.issues }}
          RESULTS: ${{ steps.combined.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          ARGS_FILE=fallow-out-sections/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--skip architecture" "--health-baseline" "--dupes-baseline"; do
            grep -qF -- "$flag" "$ARGS_FILE" || { echo "FAIL: missing $flag"; exit 1; }
          done
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-sections
