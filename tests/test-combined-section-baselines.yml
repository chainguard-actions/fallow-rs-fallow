name: Test combined run with health-baseline and dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          rm -rf sample-app sample-baselines && mkdir -p sample-app/src sample-baselines
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample-app/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          EOF
          cat > sample-app/src/index.js <<'EOF'
          import { add } from './math.js';
          export function main() { return add(1, 2); }
          EOF

      - id: save-health
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          save-baseline: ${{ github.workspace }}/sample-baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: dupes
          save-baseline: ${{ github.workspace }}/sample-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert section baselines were saved
        run: |
          ls -la "$GITHUB_WORKSPACE/sample-baselines"
          for f in health dupes; do
            if [ ! -f "$GITHUB_WORKSPACE/sample-baselines/$f.json" ]; then
              echo "FAIL: $f baseline missing"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          health-baseline: ${{ github.workspace }}/sample-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/sample-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
