name: Test combined run with health-baseline and dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src"
          cat > "$S/package.json" <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$S/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(3));
          EOF
          cat > "$S/src/util.js" <<'EOF'
          export function used(x) { if (x > 1) { return x * 2; } return x; }
          export function unusedHelper() { return 2; }
          EOF
          rm -f "$GITHUB_WORKSPACE"/fallow-*-bl.json

      - id: save-health
        uses: .
        with:
          command: health
          root: fallow-sample
          save-baseline: ${{ github.workspace }}/fallow-health-bl.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: fallow-sample
          save-baseline: ${{ github.workspace }}/fallow-dupes-bl.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dead
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          save-baseline: ${{ github.workspace }}/fallow-dead-bl.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baselines exist
        run: |
          for f in health dupes dead; do
            F="$GITHUB_WORKSPACE/fallow-$f-bl.json"
            if [ ! -f "$F" ]; then
              echo "FAIL: missing $F"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          root: fallow-sample
          baseline: ${{ github.workspace }}/fallow-dead-bl.json
          health-baseline: ${{ github.workspace }}/fallow-health-bl.json
          dupes-baseline: ${{ github.workspace }}/fallow-dupes-bl.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
