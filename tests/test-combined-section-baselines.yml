name: Test combined run with health-baseline, dupes-baseline and only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          export function main(a, b) {
            if (a > b) {
              return a - b;
            }
            return b - a;
          }
          EOF

      - id: save_health
        uses: .
        with:
          command: health
          root: fallow-sample
          save-baseline: ${{ github.workspace }}/fallow-health-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save_dupes
        uses: .
        with:
          command: dupes
          root: fallow-sample
          save-baseline: ${{ github.workspace }}/fallow-dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert both baselines were saved
        run: |
          for f in fallow-health-baseline.json fallow-dupes-baseline.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f was not saved"
              exit 1
            fi
          done
          echo "PASS"

      - id: combined
        uses: .
        with:
          command: ''
          root: fallow-sample
          only: health,dupes
          health-baseline: ${{ github.workspace }}/fallow-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/fallow-dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.combined.outputs.issues }}
          RESULTS: ${{ steps.combined.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
