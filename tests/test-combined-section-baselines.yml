name: Test combined run with skip, health-baseline and dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          rm -rf fallow-fixture baselines
          mkdir -p fallow-fixture/src baselines
          cd fallow-fixture
          cat > package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { classify } from './complex.js';
          console.log(classify(5));
          EOF
          cat > src/complex.js <<'EOF'
          export function classify(n) {
            if (n < 0) { return 'neg'; }
            if (n === 0) { return 'zero'; }
            return 'pos';
          }
          EOF

      - id: save-health
        uses: .
        with:
          command: health
          root: fallow-fixture
          save-baseline: ${{ github.workspace }}/baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: fallow-fixture
          save-baseline: ${{ github.workspace }}/baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert section baselines exist
        run: |
          ls -la baselines
          for f in baselines/health.json baselines/dupes.json; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          root: fallow-fixture
          skip: architecture
          health-baseline: ${{ github.workspace }}/baselines/health.json
          dupes-baseline: ${{ github.workspace }}/baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected integer issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
