name: Test combined run with health-baseline, dupes-baseline and skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P" "$GITHUB_WORKSPACE/fx-baselines"
          mkdir -p "$P/src" "$GITHUB_WORKSPACE/fx-baselines"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' 'import { a } from "./lib";' 'console.log(a(3));' > "$P/src/index.ts"
          printf '%s\n' \
            'export function a(n: number): number {' \
            '  if (n > 1) { if (n > 2) { if (n > 3) { return 3; } return 2; } return 1; }' \
            '  return 0;' \
            '}' > "$P/src/lib.ts"

      - id: save-health
        uses: .
        with:
          command: health
          root: fx-project
          save-baseline: ${{ github.workspace }}/fx-baselines/health.json
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: fx-project
          save-baseline: ${{ github.workspace }}/fx-baselines/dupes.json
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert section baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fx-baselines"
          for f in health.json dupes.json; do
            if [ ! -f "$GITHUB_WORKSPACE/fx-baselines/$f" ]; then
              echo "FAIL: $f not saved"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          root: fx-project
          health-baseline: ${{ github.workspace }}/fx-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fx-baselines/dupes.json
          skip: architecture
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results invalid"
            exit 1
          fi
          jq -c 'keys' "$RESULTS"
          echo "PASS"
