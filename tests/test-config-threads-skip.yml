name: Test config, threads, and skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal fallow config file
      - name: Create fallow config
        run: |
          cat > /tmp/.fallowrc.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          root: .
          format: json
          fail-on-issues: 'false'
          config: /tmp/.fallowrc.json
          threads: '2'
          skip: 'dupes,health'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config, threads, and skip inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
