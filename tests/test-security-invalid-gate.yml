name: Test security rejects an invalid security-gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/security-project"
          mkdir -p "$R/src"
          echo '{"name":"security-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$R/package.json"
          echo 'export const x = 1;' > "$R/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/security-project
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          security-gate: bogus

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid security-gate"
            exit 1
          fi
          if [ -n "$RESULTS" ]; then
            echo "FAIL: expected no results output when validation fails"
            exit 1
          fi
          echo "PASS"
