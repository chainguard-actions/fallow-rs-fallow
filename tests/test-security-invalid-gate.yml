name: Test security rejects an invalid security-gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/security-project"
          mkdir -p "$P/src"
          echo '{ "name": "security-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/security-project
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          security-gate: bogus

      - name: Assert the action rejected the invalid security-gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid security-gate"
            exit 1
          fi
          echo "PASS"
