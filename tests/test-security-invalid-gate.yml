name: Test security rejects an invalid security-gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/security"
          mkdir -p "$P/src"
          echo '{"name":"security","version":"1.0.0","type":"module"}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: act-fixtures/security
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          security-gate: bogus

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid security-gate"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation rejects inputs"
            exit 1
          fi
          echo "PASS"
