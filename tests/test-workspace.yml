name: Test dead-code scoped to a single workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/workspace-mono"
          mkdir -p "$P/packages/pkg-a" "$P/packages/pkg-b"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "workspace-mono",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          {
            "name": "pkg-$n",
            "version": "1.0.0",
            "type": "module",
            "main": "index.js"
          }
          EOF
            cat > "$P/packages/pkg-$n/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
            cat > "$P/packages/pkg-$n/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/workspace-mono
          format: json
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert scoped results reference only pkg-a
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'packages/pkg-b/' "$RESULTS"; then
            echo "FAIL: results include findings from pkg-b"
            exit 1
          fi
          echo "PASS"
