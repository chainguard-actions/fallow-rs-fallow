name: Test dead-code scoped to one workspace in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal npm workspaces monorepo
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/monorepo"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "monorepo",
            "version": "1.0.0",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          {
            "name": "pkg-$n",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
            cat > "$P/packages/pkg-$n/src/index.js" <<'EOF'
          export function used() { return 1; }
          export function helper() { return used(); }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: act-fixtures/monorepo
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          workspace: pkg-a

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if jq -r '.. | .path? // empty' "$RESULTS" 2>/dev/null | grep -q 'pkg-b/src/'; then
            echo "FAIL: results include findings from pkg-b outside the selected workspace"
            exit 1
          fi
          echo "PASS"
