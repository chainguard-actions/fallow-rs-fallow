name: Test dead-code scoped to a single workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.38.1'
          type-aware: 'false'
          workspace: pkg-a
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-workspace
      - name: Assert workspace-scoped results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          if grep -q 'pkg-b/src' "$RESULTS"; then
            echo "FAIL: results leak findings from pkg-b"
            exit 1
          fi
          echo "PASS"
