name: Test dead-code scoped to one workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/workspace-monorepo"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "workspace-monorepo", "private": true, "workspaces": ["packages/*"] }
          EOF
          for pkg in web admin; do
            printf '{ "name": "%s", "version": "1.0.0", "type": "module", "main": "src/index.js" }\n' "$pkg" > "$P/packages/$pkg/package.json"
            echo "export const $pkg = 1;" > "$P/packages/$pkg/src/index.js"
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/workspace-monorepo
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          workspace: web

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
