name: Test dead-code scoped to a workspace in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with two workspace packages
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/monorepo"
          mkdir -p "$R/packages/web/src" "$R/packages/admin/src"
          cat > "$R/package.json" <<'EOF'
          {
            "name": "monorepo",
            "version": "1.0.0",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for p in web admin; do
            cat > "$R/packages/$p/package.json" <<EOF
          {
            "name": "$p",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
            cat > "$R/packages/$p/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
            cat > "$R/packages/$p/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          workspace: web

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if grep -q 'packages/admin/src/util.js' "$RESULTS"; then
            echo "FAIL: results include the out-of-scope admin workspace"
            exit 1
          fi
          echo "PASS"
