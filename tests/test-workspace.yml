name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample monorepo
        run: |
          rm -rf sample-mono && mkdir -p sample-mono/packages/a sample-mono/packages/b
          cat > sample-mono/package.json <<'EOF'
          {"name":"sample-mono","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in a b; do
            cat > "sample-mono/packages/$p/package.json" <<EOF
          {"name":"@sample/$p","version":"1.0.0","type":"module","main":"index.js"}
          EOF
            cat > "sample-mono/packages/$p/index.js" <<'EOF'
          import { helper } from './helper.js';
          export function main() { return helper(1); }
          EOF
            cat > "sample-mono/packages/$p/helper.js" <<'EOF'
          export function helper(x) { return x + 1; }
          export function unusedHelper(x) { return x * 2; }
          EOF
          done
          find sample-mono -type f

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-mono
          command: dead-code
          workspace: '@sample/a'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert scoped run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'packages/b/' "$RESULTS"; then
            echo "FAIL: results include findings from out-of-scope workspace @sample/b"
            exit 1
          fi
          echo "PASS"
