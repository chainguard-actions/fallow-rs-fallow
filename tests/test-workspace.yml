name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          format: json
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "args: $FALLOW_ANALYSIS_ARGS_JSON"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if jq -r '.. | strings' "$RESULTS" | grep -q 'pkg-b/index.js'; then
            echo "FAIL: results mention pkg-b despite workspace: pkg-a"
            exit 1
          fi
          echo "$FALLOW_ANALYSIS_ARGS_JSON" | jq -e 'index("--workspace") != null' > /dev/null \
            || { echo "FAIL: --workspace missing"; exit 1; }
          echo "PASS"
