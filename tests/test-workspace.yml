name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create npm-workspaces monorepo
        run: |
          P="$GITHUB_WORKSPACE/fx-mono-ws"
          mkdir -p "$P/packages/app/src" "$P/packages/lib/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-mono-root",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for pkg in app lib; do
            cat > "$P/packages/$pkg/package.json" <<EOF
          {
            "name": "@fx/$pkg",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
            cat > "$P/packages/$pkg/src/index.js" <<EOF
          import { helper } from './helper.js';
          console.log(helper());
          EOF
            cat > "$P/packages/$pkg/src/helper.js" <<EOF
          export function helper() { return '$pkg'; }
          export function unused_$pkg() { return 0; }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-mono-ws
          workspace: '@fx/app'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert output scoped to the app workspace
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'packages/lib/src/helper.js' "$RESULTS"; then
            echo "FAIL: findings from @fx/lib leaked into @fx/app scoped output"
            exit 1
          fi
          echo "PASS"
