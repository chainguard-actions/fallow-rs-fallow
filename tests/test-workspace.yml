name: Test dead-code scoped to a single workspace package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create monorepo fixture
        run: |
          set -e
          D=fx-workspace
          rm -rf "$D"
          mkdir -p "$D/packages/pkg-a/src" "$D/packages/pkg-b/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-workspace","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in pkg-a pkg-b; do
            cat > "$D/packages/$p/package.json" <<EOF
          {"name":"$p","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
            cat > "$D/packages/$p/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(1));
          EOF
            cat > "$D/packages/$p/src/util.js" <<'EOF'
          export function used(n) { return n + 1; }
          export function unusedHelper() { return 42; }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-workspace
          workspace: pkg-a
          artifacts-dir: fx-workspace-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert workspace-scoped outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file"; exit 1; }
          grep -q -- "--workspace pkg-a" fx-workspace-artifacts/fallow-analysis-args.sh || { echo "FAIL: --workspace not forwarded"; exit 1; }
          if jq -e '.. | objects | select(has("path")) | .path | strings | select(test("packages/pkg-b/src/util"))' "$RESULTS" > /dev/null 2>&1; then
            echo "FAIL: findings reference pkg-b despite workspace: pkg-a"
            exit 1
          fi
          echo "PASS"
