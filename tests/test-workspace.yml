name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create monorepo fixture
        run: |
          set -e
          rm -rf fallow-mono
          mkdir -p fallow-mono/packages/pkg-a fallow-mono/packages/pkg-b
          cd fallow-mono
          cat > package.json <<'EOF'
          {"name":"mono","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          cat > packages/pkg-a/package.json <<'EOF'
          {"name":"pkg-a","version":"1.0.0","main":"index.js"}
          EOF
          cat > packages/pkg-a/index.js <<'EOF'
          import { helper } from './helper.js';
          export const a = helper();
          EOF
          cat > packages/pkg-a/helper.js <<'EOF'
          export function helper() { return 'a'; }
          export function unusedHelper() { return 'x'; }
          EOF
          cat > packages/pkg-b/package.json <<'EOF'
          {"name":"pkg-b","version":"1.0.0","main":"index.js"}
          EOF
          cat > packages/pkg-b/index.js <<'EOF'
          export const b = 'b';
          EOF
          cat > packages/pkg-b/orphan.js <<'EOF'
          export const orphan = 1;
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-mono
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected integer issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
