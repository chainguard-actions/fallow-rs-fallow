name: Test dead-code scoped to one workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample monorepo
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-monorepo"
          rm -rf "$D"
          mkdir -p "$D/packages/pkg-a" "$D/packages/pkg-b"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in pkg-a pkg-b; do
            printf '{"name":"%s","version":"1.0.0","main":"index.ts"}\n' "$p" > "$D/packages/$p/package.json"
            printf 'export function hello(): string {\n  return "%s";\n}\n' "$p" > "$D/packages/$p/index.ts"
            printf 'export const orphan = 1;\n' > "$D/packages/$p/orphan.ts"
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-test-monorepo
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert workspace-scoped run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'pkg-b/orphan.ts' "$RESULTS"; then
            echo "FAIL: pkg-b finding leaked into pkg-a scoped output"
            exit 1
          fi
          echo "PASS"
