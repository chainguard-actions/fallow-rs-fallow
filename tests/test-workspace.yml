name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          workspace: 'fixture-app'
      - name: Assert output scoped to fixture-app
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if grep -q "orphanlib" "$RESULTS"; then
            echo "FAIL: findings from fixture-lib leaked into workspace-scoped output"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
