name: Test workspace scoping on a small monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a small npm-workspaces monorepo
        run: |
          set -e
          M="$GITHUB_WORKSPACE/act-mono-ws"
          rm -rf "$M"
          mkdir -p "$M/packages/app-a/src" "$M/packages/app-b/src"
          echo '{"name":"act-mono","private":true,"workspaces":["packages/*"]}' > "$M/package.json"
          echo '{"name":"app-a","version":"1.0.0","type":"module","main":"src/index.js"}' > "$M/packages/app-a/package.json"
          echo '{"name":"app-b","version":"1.0.0","type":"module","main":"src/index.js"}' > "$M/packages/app-b/package.json"
          printf 'export const a = 1;\nexport const unusedA = 2;\n' > "$M/packages/app-a/src/index.js"
          printf 'export const b = 1;\n' > "$M/packages/app-b/src/index.js"
          cd "$M"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm "init"

      - id: action
        uses: .
        with:
          command: dead-code
          root: act-mono-ws
          workspace: app-a
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"

      - name: Clean up
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/act-mono-ws"
