name: Test dead-code scoped to a single workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FX: fallow-test-workspace
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture monorepo
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$FX"
          rm -rf "$P"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          echo '{"name":"fallow-test-monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > "$P/package.json"
          for n in a b; do
            echo "{\"name\":\"pkg-$n\",\"version\":\"1.0.0\",\"main\":\"src/index.js\"}" > "$P/packages/pkg-$n/package.json"
            printf "import { helper } from './helper.js';\nconsole.log(helper());\n" > "$P/packages/pkg-$n/src/index.js"
            printf "export function helper() {\n  return '%s';\n}\nexport function unused%s() {\n  return 1;\n}\n" "$n" "$n" > "$P/packages/pkg-$n/src/helper.js"
            echo "export const orphan = '$n';" > "$P/packages/pkg-$n/src/orphan.js"
          done
          find "$P" -type f | sort

      - id: action
        uses: .
        with:
          command: dead-code
          root: ${{ env.FX }}
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results only cover pkg-a
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not an integer: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          B_HITS=$(jq '[.. | strings | select(test("pkg-b/src/[^\"]*\\.js$"))] | length' "$RESULTS")
          echo "pkg-b source file references: $B_HITS"
          if [ "$B_HITS" != "0" ]; then
            echo "FAIL: results mention pkg-b despite workspace: pkg-a"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/$FX"
