name: Test workspace scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          workspace: app-a
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert output scoped to app-a
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          [ -f "$RESULTS" ] && cat "$RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if ! grep -q "orphan-alpha" "$RESULTS"; then
            echo "FAIL: expected app-a orphan in results"
            exit 1
          fi
          if grep -q "orphan-bravo" "$RESULTS"; then
            echo "FAIL: app-b findings should be scoped out"
            exit 1
          fi
          echo "PASS"
