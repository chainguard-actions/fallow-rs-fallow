name: Test workspace and changed-workspaces inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal monorepo-style JS project
        run: |
          mkdir -p /tmp/fallow-ws-project/packages/web
          cat > /tmp/fallow-ws-project/packages/web/index.js << 'EOF'
          export function webHello() { return 'hello from web'; }
          EOF
          cat > /tmp/fallow-ws-project/packages/web/package.json << 'EOF'
          { "name": "web", "version": "1.0.0" }
          EOF
          cat > /tmp/fallow-ws-project/package.json << 'EOF'
          {
            "name": "monorepo",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
      - id: action-workspace
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-ws-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          workspace: 'web'
      - name: Assert workspace action ran
        env:
          OUTCOME: ${{ steps.action-workspace.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: workspace action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-ws-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          changed-workspaces: 'HEAD~1'
      - name: Assert changed-workspaces action ran
        env:
          OUTCOME: ${{ steps.action-changed-workspaces.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: changed-workspaces action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
