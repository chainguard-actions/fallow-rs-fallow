name: Test dead-code scoped to a single monorepo workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create npm workspaces monorepo
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/workspace-monorepo"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "workspace-monorepo",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          {
            "name": "pkg-$n",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
            cat > "$P/packages/pkg-$n/src/index.js" <<'EOF'
          import { helper } from './helper.js';
          export const main = () => helper();
          EOF
            cat > "$P/packages/pkg-$n/src/helper.js" <<'EOF'
          export const helper = () => 1;
          export const unusedHelper = () => 2;
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/workspace-monorepo
          workspace: pkg-a
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
