name: Test dead-code scoped to a single workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/workspace-monorepo"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src"
          echo '{"name":"monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > "$P/package.json"
          for w in web admin; do
            echo "{\"name\":\"$w\",\"version\":\"1.0.0\",\"type\":\"module\",\"main\":\"src/index.js\"}" > "$P/packages/$w/package.json"
            printf 'import { a } from "./util.js";\nconsole.log(a);\n' > "$P/packages/$w/src/index.js"
            printf 'export const a = 1;\nexport const unused = 2;\n' > "$P/packages/$w/src/util.js"
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/workspace-monorepo
          workspace: web
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
