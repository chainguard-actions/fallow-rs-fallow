name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create monorepo fixture
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-mono"
          rm -rf "$D"
          mkdir -p "$D/packages/a/src" "$D/packages/b/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-mono","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in a b; do
            cat > "$D/packages/$p/package.json" <<EOF
          {"name":"@fx/$p","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
            cat > "$D/packages/$p/src/index.js" <<EOF
          import { helper } from './helper.js';
          console.log(helper(1));
          EOF
            cat > "$D/packages/$p/src/helper.js" <<EOF
          export function helper(n) { return n + 1; }
          export function unused_$p(n) { return n - 1; }
          EOF
          done
          find "$D" -type f | sort

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-mono
          workspace: '@fx/a'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert output scoped to workspace a
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'unused_b' "$RESULTS"; then
            echo "FAIL: findings from workspace b leaked into scoped output"
            jq . "$RESULTS" | head -80
            exit 1
          fi
          echo "PASS"
