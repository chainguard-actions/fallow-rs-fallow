name: Test dead-code scoped to a single workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-mono"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "mono-root", "version": "1.0.0", "private": true, "workspaces": ["packages/*"] }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          { "name": "pkg-$n", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
            cat > "$P/packages/pkg-$n/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
            cat > "$P/packages/pkg-$n/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-proj-mono
          workspace: pkg-a
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert scoped results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if grep -q 'pkg-b/src' "$RESULTS"; then
            echo "FAIL: results include pkg-b files despite workspace: pkg-a"
            exit 1
          fi
          echo "PASS"
