name: Test invalid security-gate is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/sample-project
          security-gate: bogus
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-security-gate
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for security-gate 'bogus'"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: no analysis should have run"
            exit 1
          fi
          echo "PASS"
