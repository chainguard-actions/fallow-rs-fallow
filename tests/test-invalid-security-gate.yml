name: Test security command rejects an invalid security-gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          security-gate: newest
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-invalid-security-gate

      - name: Assert action failed input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME gate: '$GATE' issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for security-gate=newest, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$GATE" ] || [ -n "$ISSUES" ]; then
            echo "FAIL: no gate should have been applied"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-invalid-security-gate
