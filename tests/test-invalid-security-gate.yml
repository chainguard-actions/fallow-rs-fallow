name: Test security rejects an invalid security-gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/clean-project
          version: 3.45.0
          auto-changed-since: 'false'
          security-gate: bogus
      - name: Assert action failed during validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected an invalid security-gate to fail the action"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: issues should be empty because analysis never ran"
            exit 1
          fi
          echo "PASS"
