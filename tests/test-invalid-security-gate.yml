name: Test security rejects an invalid security-gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/act-fixtures/sample-project
          security-gate: everything
          artifacts-dir: fallow-out-security-invalid
      - name: Assert validation failure before analysis
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME gate: '$GATE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: invalid security-gate must fail the action"
            exit 1
          fi
          if [ -f "fallow-out-security-invalid/fallow-analysis-args.sh" ]; then
            echo "FAIL: fallow should not run when security-gate is invalid"
            exit 1
          fi
          echo "PASS"
