name: Test health rejects a non-numeric low-traffic-threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/act-fixtures/clean-project
          runtime-coverage: tests/act-fixtures/coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: not-a-number
          artifacts-dir: fallow-out-runtime-invalid
      - name: Assert validation failure before analysis
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: non-numeric low-traffic-threshold must fail the action"
            exit 1
          fi
          if [ -f "fallow-out-runtime-invalid/fallow-analysis-args.sh" ]; then
            echo "FAIL: fallow should not run when validation fails"
            exit 1
          fi
          echo "PASS"
