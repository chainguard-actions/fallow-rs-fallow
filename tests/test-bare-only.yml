name: Test combined run restricted with only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D=fx-only
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-only","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(3));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n + 1; }
          export function unusedHelper() { return 42; }
          EOF

      - id: action
        uses: .
        with:
          root: fx-only
          only: dead-code,health
          artifacts-dir: fx-only-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined-run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file"; exit 1; }
          grep -q -- "--only dead-code,health" fx-only-artifacts/fallow-analysis-args.sh || { echo "FAIL: --only not forwarded"; exit 1; }
          echo "PASS"
