name: Test combined run restricted with only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          only: dead-code
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty outside audit"
            exit 1
          fi
          echo "PASS"
