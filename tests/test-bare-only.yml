name: Test combined run with only selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-only"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-only","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(2));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n * 2; }
          export function unusedHelper(n) { return n + 1; }
          EOF

      - id: action
        uses: .
        with:
          root: fx-only
          only: dead-code
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert only dead-code ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          jq 'keys' "$RESULTS"
          if [ "$(jq -r 'has("check")' "$RESULTS")" != "true" ]; then
            echo "FAIL: expected a 'check' (dead-code) section"
            exit 1
          fi
          if [ "$(jq -r '(.dupes // null) == null' "$RESULTS")" != "true" ]; then
            echo "FAIL: dupes section should be absent with only: dead-code"
            exit 1
          fi
          echo "PASS"
