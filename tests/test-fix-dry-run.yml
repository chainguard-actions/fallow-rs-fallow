name: Test fix command with dry-run (CI safety default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: fix
          dry-run: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number (fix count)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues (fixes proposed): $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected issues to be a non-negative integer, got: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES (fixes proposed in dry-run mode)"

      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file exists and is valid JSON"

      - name: Assert verdict is empty for fix command
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: '$VERDICT'"
          # verdict is only set for audit command
          if [ -n "$VERDICT" ]; then
            echo "FAIL: expected verdict to be empty for fix command, got: '$VERDICT'"
            exit 1
          fi
          echo "PASS: verdict is empty as expected for fix command"
