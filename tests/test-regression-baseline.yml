name: Test dead-code regression baseline save then compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression-rt"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-rt/regression.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regression-save
      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression-rt/regression.json"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: regression baseline missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          regression-baseline: ${{ github.workspace }}/fallow-regression-rt/regression.json
          fail-on-regression: 'true'
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regression-compare
      - name: Assert no regression
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged code should not regress"
            exit 1
          fi
          echo "PASS"
