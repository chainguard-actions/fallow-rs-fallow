name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if echo "$FAILED" | grep -q "regression"; then
            echo "FAIL: regression gate failed on unchanged code"
            exit 1
          fi
          echo "PASS"
