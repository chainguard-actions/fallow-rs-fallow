name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert regression baseline written
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: regression baseline not written at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert no regression detected (same code)
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: compare step did not succeed"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues to still be reported (>=1)"
            exit 1
          fi
          echo "PASS"
