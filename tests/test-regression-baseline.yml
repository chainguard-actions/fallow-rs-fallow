name: Test regression baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-regression
          cat > /tmp/fallow-test-regression/package.json <<'EOF'
          {
            "name": "test-regression-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-regression/index.js <<'EOF'
          export function used() { return 1; }
          export function unused() { return 2; }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-regression
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'false'
          auto-changed-since: 'false'
          regression-baseline: /tmp/nonexistent-regression-baseline.json
          save-regression-baseline: /tmp/fallow-test-regression/regression-baseline-out.json
          annotations: 'false'
      - name: Assert action ran with regression baseline inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with regression baseline inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with nonexistent regression baseline)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
