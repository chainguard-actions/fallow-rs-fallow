name: Test dead-code regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D=fx-regress
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-regress","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(3));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n + 1; }
          export function unusedHelper() { return 42; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-regress
          save-regression-baseline: ${{ github.workspace }}/fx-regress-data/regression.json
          artifacts-dir: fx-regress-artifacts-save
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline was saved
        run: |
          F="$GITHUB_WORKSPACE/fx-regress-data/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: not valid JSON"; exit 1; }
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fx-regress
          regression-baseline: ${{ github.workspace }}/fx-regress-data/regression.json
          fail-on-regression: 'true'
          artifacts-dir: fx-regress-artifacts-compare
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert comparison ran without regression
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          RESULTS: ${{ steps.compare.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file"; exit 1; }
          grep -q -- "--regression-baseline" fx-regress-artifacts-compare/fallow-analysis-args.sh || { echo "FAIL: flag missing"; exit 1; }
          echo "PASS"
