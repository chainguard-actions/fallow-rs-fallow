name: Test regression baseline save and fail-on-regression comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Remove stale regression baseline
        run: rm -f "$GITHUB_WORKSPACE/fallow-regression.json"

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json

      - name: Assert regression baseline was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not written at $f"
            exit 1
          fi
          echo "PASS"

      # Same code, same counts: no regression, so the gate must pass.
      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          fail-on-regression: 'true'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json

      - name: Assert comparison run produced same issue count
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: issue counts differ between identical runs"
            exit 1
          fi
          echo "PASS"
