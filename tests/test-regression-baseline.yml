name: Test regression baseline save and gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          artifacts-dir: fallow-artifacts-reg-save
      - name: Assert regression baseline written
        env:
          RB: ${{ github.workspace }}/fallow-regression/regression.json
        run: |
          if [ ! -s "$RB" ]; then
            echo "FAIL: regression baseline $RB not written"
            exit 1
          fi
          jq empty "$RB" || { echo "FAIL: invalid JSON"; exit 1; }
          cat "$RB"
          echo "PASS"
      - id: gate
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          artifacts-dir: fallow-artifacts-reg-gate
      - name: Assert no regression on unchanged code
        env:
          ISSUES: ${{ steps.gate.outputs.issues }}
          FIRST: ${{ steps.save.outputs.issues }}
        run: |
          echo "first: $FIRST  gate: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" != "$FIRST" ]; then
            echo "FAIL: unchanged code should report the same issue count"
            exit 1
          fi
          echo "PASS"
