name: Test dead-code regression baseline with issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/fallow-test/regression"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "regression-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          used();
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function unused() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-test/regression
          format: json
          issue-types: unused-exports
          save-regression-baseline: ${{ github.workspace }}/fallow-test/regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert save run produced a numeric issue count
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          ls -la "$GITHUB_WORKSPACE/fallow-test/" || true
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fallow-test/regression
          format: json
          issue-types: unused-exports
          regression-baseline: ${{ github.workspace }}/fallow-test/regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert compare run (no code change -> same count)
        env:
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "save issues: $SAVE_ISSUES  compare issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVE_ISSUES" ]; then
            echo "FAIL: issue count changed without code changes"
            exit 1
          fi
          echo "PASS"
