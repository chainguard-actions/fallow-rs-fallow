name: Test dead-code regression baseline with issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          issue-types: unused-files,unused-exports
          save-regression-baseline: ${{ runner.temp }}/regression-baseline.json

      - name: Assert regression baseline was written
        run: |
          F="$RUNNER_TEMP/regression-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          issue-types: unused-files,unused-exports
          fail-on-regression: 'true'
          regression-baseline: ${{ runner.temp }}/regression-baseline.json

      - name: Assert no regression and consistent counts
        env:
          SAVED: ${{ steps.save.outputs.issues }}
          NOW: ${{ steps.compare.outputs.issues }}
        run: |
          echo "saved issues: $SAVED, current issues: $NOW"
          if ! [[ "$NOW" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not numeric: '$NOW'"
            exit 1
          fi
          if [ "$SAVED" != "$NOW" ]; then
            echo "FAIL: issue counts differ between identical runs"
            exit 1
          fi
          echo "PASS"
