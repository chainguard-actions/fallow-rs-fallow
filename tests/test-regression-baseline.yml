name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          artifacts-dir: fallow-artifacts-save-regression
      - name: Assert regression baseline written
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          artifacts-dir: fallow-artifacts-compare-regression
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS: identical run did not regress"
