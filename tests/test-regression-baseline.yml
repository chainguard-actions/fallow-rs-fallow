name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-test-regression/regression-baseline.json
          artifacts-dir: fallow-artifacts-regression-save
      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-test-regression/regression-baseline.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: regression baseline $F not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: regression baseline not valid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-test-regression/regression-baseline.json
          artifacts-dir: fallow-artifacts-regression-compare
      - name: Assert no regression and same counts
        env:
          ISSUES1: ${{ steps.save.outputs.issues }}
          ISSUES2: ${{ steps.compare.outputs.issues }}
        run: |
          echo "save issues: $ISSUES1"
          echo "compare issues: $ISSUES2"
          if ! [[ "$ISSUES2" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES1" != "$ISSUES2" ]; then
            echo "FAIL: issue counts differ between identical runs"
            exit 1
          fi
          echo "PASS"
