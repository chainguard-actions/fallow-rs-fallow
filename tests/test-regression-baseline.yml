name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not created"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          SAVED: ${{ steps.save.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES saved: $SAVED"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged code should not regress"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVED" ]; then
            echo "FAIL: issue counts differ between runs"
            exit 1
          fi
          echo "PASS"
