name: Test regression baseline with fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert regression baseline saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-regression.json" || true
          if [ ! -s "$GITHUB_WORKSPACE/fallow-regression.json" ]; then
            echo "FAIL: regression baseline file not written"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert no regression detected
        env:
          FIRST: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "first: $FIRST second: $ISSUES"
          if [ "$ISSUES" != "$FIRST" ]; then
            echo "FAIL: expected same issue count against unchanged code"
            exit 1
          fi
          echo "PASS"
