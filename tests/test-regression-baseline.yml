name: Test regression baseline save and fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression.json"
          [ -f "$f" ] || { echo "FAIL: regression baseline not written"; exit 1; }
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert no regression (step succeeded)
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected the same known issues to still be reported"
            exit 1
          fi
          echo "PASS"
