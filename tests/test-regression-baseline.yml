name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare baseline directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/.act-regression"
          mkdir -p "$GITHUB_WORKSPACE/.act-regression"

      - id: save
        uses: .
        with:
          command: dead-code
          save-regression-baseline: .act-regression/regression.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline was saved
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/.act-regression/regression.json" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          regression-baseline: .act-regression/regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert comparison ran without regression
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "saved issues: $SAVED_ISSUES, compare issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Clean up
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.act-regression"
