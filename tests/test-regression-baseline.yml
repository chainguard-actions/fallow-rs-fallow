name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with unused code
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/regression-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "regression-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/regression-project
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/regression-project
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert no regression detected
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (no regression against own baseline)"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          echo "PASS"
