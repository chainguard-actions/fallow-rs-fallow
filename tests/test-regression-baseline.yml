name: Test regression baseline save and fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline written
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.check.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES (saved run: $SAVED_ISSUES)"
          if [ "$ISSUES" != "$SAVED_ISSUES" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
