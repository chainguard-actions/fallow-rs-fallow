name: Test save-regression-baseline then fail-on-regression with no regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regression-save
      - name: Assert regression baseline written
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$f" ] || ! jq -e . "$f" > /dev/null; then
            echo "FAIL: regression baseline missing or invalid"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regression-compare
      - name: Assert comparison ran with no regression
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ] || ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected successful comparison"
            exit 1
          fi
          echo "PASS"
