name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert regression baseline file was saved
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/fallow-regression.json" ]; then
            echo "FAIL: regression baseline file not written"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          head -c 2000 "$GITHUB_WORKSPACE/fallow-regression.json"; echo
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert no regression against identical baseline
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: compare step did not succeed"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
