name: Test regression baseline save and fail-on-regression comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          rm -rf sample-app sample-baselines && mkdir -p sample-app/src sample-baselines
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample-app/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function unusedHelper(x) { return x * 2; }
          EOF
          cat > sample-app/src/index.js <<'EOF'
          import { add } from './math.js';
          export function main() { return add(1, 2); }
          EOF

      - id: save
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: dead-code
          save-regression-baseline: ${{ github.workspace }}/sample-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/sample-baselines/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: dead-code
          regression-baseline: ${{ github.workspace }}/sample-baselines/regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert no regression on unchanged code
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with unchanged code"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"
