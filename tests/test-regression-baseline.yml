name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/.fallow-test-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          save-regression-baseline: ${{ github.workspace }}/.fallow-test-regression/regression.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        run: |
          P="$GITHUB_WORKSPACE/.fallow-test-regression/regression.json"
          if [ ! -f "$P" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          head -c 1000 "$P"; echo
          echo "PASS"
      # Same project, same counts: fail-on-regression must not trip.
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          regression-baseline: ${{ github.workspace }}/.fallow-test-regression/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert compare run succeeded
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES (saved run: $SAVED_ISSUES)"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVED_ISSUES" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
