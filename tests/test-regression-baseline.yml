name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json

      - name: Assert regression baseline was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not found at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          fail-on-regression: 'true'
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json

      - name: Assert no regression against identical baseline
        env:
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome: $OUTCOME, saved issues: $SAVE_ISSUES, compared issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: comparison step did not succeed"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVE_ISSUES" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
