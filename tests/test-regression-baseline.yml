name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regr-save
      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regr-check
      - name: Assert no regression and numeric issues
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged code should not regress"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
