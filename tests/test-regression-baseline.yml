name: Test save-regression-baseline then fail-on-regression with no regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: '3.43.1'
          format: json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
      - name: Assert regression baseline saved
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/fallow-regression.json" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          jq . "$GITHUB_WORKSPACE/fallow-regression.json" > /dev/null || { echo "FAIL: not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: '3.43.1'
          format: json
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
      - name: Assert no regression detected
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          GATES_FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "outcome: $OUTCOME gates-failed: '$GATES_FAILED'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged project should not regress"
            exit 1
          fi
          if echo "$GATES_FAILED" | grep -q "regression"; then
            echo "FAIL: regression gate failed unexpectedly"
            exit 1
          fi
          echo "PASS"
