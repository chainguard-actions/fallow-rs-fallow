name: Test save-regression-baseline then fail-on-regression with no regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-test.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-save
      - name: Assert regression baseline written
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression-test.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: invalid JSON"; exit 1; }
          cat "$f"
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          regression-baseline: ${{ github.workspace }}/fallow-regression-test.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-check
      - name: Assert no regression reported
        env:
          ISSUES: ${{ steps.check.outputs.issues }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "issues: $ISSUES"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged project should not regress"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected the dirty project issues to still be reported"
            exit 1
          fi
          echo "PASS"
