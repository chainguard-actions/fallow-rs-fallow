name: Test regression baseline with fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare output dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-out"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-regression-baseline: ${{ github.workspace }}/fallow-out/regression.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-out/regression.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not written"
            ls -la "$GITHUB_WORKSPACE/fallow-out" || true
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          regression-baseline: ${{ github.workspace }}/fallow-out/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output not numeric"
            exit 1
          fi
          echo "PASS: same codebase did not regress against its own baseline"
