name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-regression"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-regression","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(2));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n * 2; }
          export function unusedHelper(n) { return n + 1; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-regression
          save-regression-baseline: fx-regression/regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fx-regression/regression-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fx-regression
          regression-baseline: fx-regression/regression-baseline.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert no regression reported
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES gates-failed: '$FAILED'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: compare step did not succeed"
            exit 1
          fi
          if echo "$FAILED" | grep -q 'regression'; then
            echo "FAIL: unexpected regression against identical baseline"
            exit 1
          fi
          echo "PASS"
