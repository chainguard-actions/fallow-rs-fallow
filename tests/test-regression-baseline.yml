name: Test dead-code save-regression-baseline then regression-baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          mkdir -p proj/src baselines
          cat > proj/package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js","type":"module"}
          EOF
          cat > proj/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > proj/src/math.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          export function unusedHelper() {
            return 42;
          }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: proj
          save-regression-baseline: ${{ github.workspace }}/baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline was saved
        run: |
          ls -la baselines || true
          if [ ! -s baselines/regression.json ]; then
            echo "FAIL: regression baseline file was not written"
            exit 1
          fi
          jq empty baselines/regression.json || { echo "FAIL: regression baseline is not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: proj
          regression-baseline: ${{ github.workspace }}/baselines/regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert comparison ran without regression
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          echo "PASS"
