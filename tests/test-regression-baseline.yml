name: Test dead-code save-regression-baseline then regression comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          save-regression-baseline: fallow-test-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline file was written
        run: |
          if [ ! -f fallow-test-regression.json ]; then
            echo "FAIL: fallow-test-regression.json not written"
            exit 1
          fi
          if ! jq empty fallow-test-regression.json; then
            echo "FAIL: regression baseline is not valid JSON"
            exit 1
          fi
          echo "PASS: regression baseline saved"

      - id: compare
        uses: .
        with:
          command: dead-code
          regression-baseline: fallow-test-regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert comparison ran without regression
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          echo "PASS: no regression against identical baseline"
