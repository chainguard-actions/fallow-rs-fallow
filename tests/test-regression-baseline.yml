name: Test save-regression-baseline then fail-on-regression comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/js-project
          format: json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert regression baseline was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: not valid JSON"; exit 1; }
          echo "PASS"

      # Same code, same counts: fail-on-regression must not trip.
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/js-project
          format: json
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert issue count unchanged and no regression gate failure
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
          GATES_FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "before: $BEFORE after: $AFTER gates-failed: '$GATES_FAILED'"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          if echo "$GATES_FAILED" | grep -q 'regression'; then
            echo "FAIL: regression gate failed with no regression"
            exit 1
          fi
          echo "PASS"
