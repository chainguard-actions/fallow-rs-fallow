name: Test save-regression-baseline then fail-on-regression with regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-save-regression
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-compare-regression
          fail-on-regression: 'true'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
      - name: Assert no regression and same count
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
