name: Test save-regression-baseline then regression check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Let the bundled verifier resolve detect-libc from the global fallow install
        run: |
          G="$(npm root -g)"
          echo "NODE_PATH=$G/fallow/node_modules:$G" >> "$GITHUB_ENV"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/with-issues
          version: 3.43.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          save-regression-baseline: ${{ runner.temp }}/fallow-regression.json
      - name: Assert regression baseline saved
        env:
          FILE: ${{ runner.temp }}/fallow-regression.json
        run: |
          if [ ! -s "$FILE" ]; then
            echo "FAIL: regression baseline not written at $FILE"
            exit 1
          fi
          head -c 2000 "$FILE"; echo
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/with-issues
          version: 3.43.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          fail-on-regression: 'true'
          regression-baseline: ${{ runner.temp }}/fallow-regression.json
      - name: Assert no regression reported
        env:
          ISSUES: ${{ steps.check.outputs.issues }}
          FAILED: ${{ steps.check.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if echo "$FAILED" | grep -q regression; then
            echo "FAIL: regression gate failed against identical baseline"
            exit 1
          fi
          echo "PASS"
