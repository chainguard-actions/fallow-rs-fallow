name: Test dead-code regression baseline (no regression)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert regression baseline file was written
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome=$OUTCOME issues=$ISSUES saved=$SAVED_ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: identical code should not regress"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVED_ISSUES" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
