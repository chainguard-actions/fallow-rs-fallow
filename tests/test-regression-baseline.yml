name: Test regression baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First run: save a regression baseline
      - id: save
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          save-regression-baseline: /tmp/fallow-regression-baseline.json

      - name: Assert save step ran
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "save outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save-regression-baseline step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Second run: load the regression baseline
      - id: load
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'false'
          regression-baseline: /tmp/fallow-regression-baseline.json

      - name: Assert load step ran
        env:
          OUTCOME: ${{ steps.load.outcome }}
        run: |
          echo "load outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: regression-baseline step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
