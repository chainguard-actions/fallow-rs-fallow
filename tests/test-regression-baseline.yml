name: Test regression baseline with fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-test/regression.json
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-regression-save
      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression-test/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          regression-baseline: ${{ github.workspace }}/fallow-regression-test/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-regression-check
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "issues: $ISSUES"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged project should not regress"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected planted issues still reported"
            exit 1
          fi
          echo "PASS"
