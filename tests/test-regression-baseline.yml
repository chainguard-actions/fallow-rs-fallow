name: Test regression baseline save and fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-save-regression
          type-aware: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline file not written"
            exit 1
          fi
          cat "$f"; echo
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-compare-regression
          type-aware: 'false'
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-regression: 'true'
          tolerance: '0'
      - name: Assert no regression on identical code
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: identical code should not regress"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected unused code still reported"
            exit 1
          fi
          echo "PASS"
