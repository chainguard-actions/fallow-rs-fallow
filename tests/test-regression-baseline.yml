name: Test regression baseline save and compare (no regression)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          artifacts-dir: fallow-artifacts-save-regression
      - name: Assert regression baseline saved
        run: |
          p="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -f "$p" ]; then
            echo "FAIL: regression baseline not saved"
            exit 1
          fi
          cat "$p"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          artifacts-dir: fallow-artifacts-compare-regression
      - name: Assert no regression and counts match
        env:
          SAVED: ${{ steps.save.outputs.issues }}
          NOW: ${{ steps.compare.outputs.issues }}
        run: |
          echo "saved issues: $SAVED"
          echo "current issues: $NOW"
          if [ "$SAVED" != "$NOW" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
