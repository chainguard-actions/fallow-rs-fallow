name: Test regression baseline options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'false'
          regression-baseline: /tmp/nonexistent-regression-baseline.json
          save-regression-baseline: /tmp/fallow-regression-baseline-out.json
      - name: Assert action ran (regression baseline inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with regression baseline inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with nonexistent regression baseline)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
