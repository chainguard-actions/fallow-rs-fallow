name: Test regression baseline save then compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare output dir
        run: mkdir -p fallow-out-regression

      - id: save
        uses: .
        with:
          command: dead-code
          save-regression-baseline: fallow-out-regression/regression-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-regression

      - name: Assert regression baseline was saved
        run: |
          ls -la fallow-out-regression
          if [ ! -s fallow-out-regression/regression-baseline.json ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          regression-baseline: fallow-out-regression/regression-baseline.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-regression

      - name: Assert comparison against unchanged code passed
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged code must not regress"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          grep -qF -- "--regression-baseline" fallow-out-regression/fallow-analysis-args.sh || { echo "FAIL: flag not forwarded"; exit 1; }
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-regression
