name: Test dead-code regression baseline (no regression)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regression-save
          save-regression-baseline: fallow-regression-baseline.json
      - name: Assert regression baseline saved
        run: |
          found=$(find "$GITHUB_WORKSPACE" -name fallow-regression-baseline.json -type f | head -n 1)
          echo "regression baseline: $found"
          if [ -z "$found" ]; then
            echo "FAIL: regression baseline file not written"
            exit 1
          fi
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-regression-check
          regression-baseline: fallow-regression-baseline.json
          fail-on-regression: 'true'
      - name: Assert no regression and same count
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.check.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "FAIL: expected identical issue count"
            exit 1
          fi
          echo "PASS"
