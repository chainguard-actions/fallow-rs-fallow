name: Test save-regression-baseline then fail-on-regression
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-regression-baseline: /tmp/fallow-regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert regression baseline saved
        run: |
          if [ ! -f /tmp/fallow-regression-baseline.json ]; then
            echo "FAIL: regression baseline not saved"
            exit 1
          fi
          cat /tmp/fallow-regression-baseline.json
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          regression-baseline: /tmp/fallow-regression-baseline.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert no regression detected
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected no regression"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
