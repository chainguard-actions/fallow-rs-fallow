name: Test save-regression-baseline then regression-baseline
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-regression-baseline: ${{ runner.temp }}/fallow-regression.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert regression baseline saved
        env:
          FILE: ${{ runner.temp }}/fallow-regression.json
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ ! -s "$FILE" ]; then
            echo "FAIL: regression baseline not saved at $FILE"
            exit 1
          fi
          cat "$FILE"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          regression-baseline: ${{ runner.temp }}/fallow-regression.json
          fail-on-regression: 'true'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert no regression against identical baseline
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome $OUTCOME"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
