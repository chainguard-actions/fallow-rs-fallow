name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-save
          type-aware: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not saved"
            exit 1
          fi
          cat "$f"; echo
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-compare
          type-aware: 'false'
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-regression: 'true'
          tolerance: '0'
      - name: Assert compare run succeeded with same issue count
        env:
          SAVED: ${{ steps.save.outputs.issues }}
          NOW: ${{ steps.compare.outputs.issues }}
        run: |
          echo "saved: $SAVED now: $NOW"
          if [ -z "$NOW" ] || [ "$SAVED" != "$NOW" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
