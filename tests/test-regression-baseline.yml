name: Test regression baseline save and compare with issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          issue-types: unused-files,unused-exports,unused-deps
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          artifacts-dir: fallow-artifacts-regression-save
      - name: Assert regression baseline was written
        run: |
          f="$GITHUB_WORKSPACE/fallow-baselines/regression.json"
          if [ ! -s "$f" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: regression baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          issue-types: unused-files,unused-exports,unused-deps
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          artifacts-dir: fallow-artifacts-regression-compare
      - name: Assert no regression and same issue count
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
