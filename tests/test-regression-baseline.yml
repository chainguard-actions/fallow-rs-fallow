name: Test regression baseline options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project and regression baseline
        run: |
          mkdir -p /tmp/fallow-regression-project
          cat > /tmp/fallow-regression-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-regression-project/package.json << 'EOF'
          { "name": "regression-test-project", "version": "1.0.0", "type": "module" }
          EOF
          echo '{}' > /tmp/fallow-regression-baseline.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression-project
          fail-on-issues: 'false'
          fail-on-regression: 'false'
          regression-baseline: /tmp/fallow-regression-baseline.json
          save-regression-baseline: /tmp/fallow-saved-regression-baseline.json
          format: json
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
