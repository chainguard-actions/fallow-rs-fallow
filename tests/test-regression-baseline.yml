name: Test save-regression-baseline then fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          artifacts-dir: fallow-artifacts-regression-save
      - name: Assert regression baseline saved
        run: |
          FILE="$GITHUB_WORKSPACE/fallow-regression-baseline.json"
          if [ ! -s "$FILE" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: not valid JSON"; exit 1; }
          cat "$FILE"
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          artifacts-dir: fallow-artifacts-regression-check
      - name: Assert no regression and results produced
        env:
          ISSUES: ${{ steps.check.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES (saved run: $SAVED_ISSUES)"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVED_ISSUES" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
