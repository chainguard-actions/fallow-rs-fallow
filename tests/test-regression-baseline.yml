name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-save
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
      - name: Assert regression baseline was written
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -s "$f" ]; then
            echo "FAIL: regression baseline not written"
            ls -la "$GITHUB_WORKSPACE/fallow-regression" || true
            exit 1
          fi
          head -c 2000 "$f"; echo
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-compare
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
      - name: Assert no regression against identical baseline
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected the known issues to still be counted"
            exit 1
          fi
          echo "PASS"
