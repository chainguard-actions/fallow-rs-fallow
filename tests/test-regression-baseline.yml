name: Test regression baseline save and no-regression gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-save
          type-aware: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-test-regression.json
      - name: Assert regression baseline written
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/fallow-test-regression.json" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          echo "PASS"
      # Same code, same counts: fail-on-regression must not trip.
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-regression-compare
          type-aware: 'false'
          regression-baseline: ${{ github.workspace }}/fallow-test-regression.json
          fail-on-regression: 'true'
          tolerance: '0'
      - name: Assert compare succeeded
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected no regression"
            exit 1
          fi
          echo "PASS"
