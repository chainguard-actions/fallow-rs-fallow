name: Test regression baseline detects no regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines" && rm -f "$GITHUB_WORKSPACE/fallow-baselines/regression.json"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-baselines/regression.json"
          if [ ! -s "$f" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
      - name: Assert no regression gate failure
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if echo "$FAILED" | grep -q 'regression'; then
            echo "FAIL: regression gate failed on identical code"
            exit 1
          fi
          echo "PASS"
