name: Test save-regression-baseline then regression-baseline (dead-code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with unused code
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/dc-regression"
          mkdir -p "$R/src"
          cat > "$R/package.json" <<'EOF'
          {
            "name": "dc-regression",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$R/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$R/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dc-regression
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-regression-baseline: ${{ github.workspace }}/baselines/regression.json

      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/baselines/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          echo "PASS: regression baseline saved"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dc-regression
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          fail-on-regression: 'true'
          regression-baseline: ${{ github.workspace }}/baselines/regression.json

      - name: Assert comparison passed (no regression)
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with unchanged counts"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          echo "PASS"
