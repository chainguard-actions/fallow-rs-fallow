name: Test save-regression-baseline then fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-save-regression
      - name: Assert regression baseline written
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-check-regression
      - name: Assert no regression detected
        env:
          OUTCOME: ${{ steps.check.outcome }}
          ISSUES: ${{ steps.check.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unchanged code should not regress"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
