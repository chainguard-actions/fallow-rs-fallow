name: Test regression baseline save then fail-on-regression check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-regression-baseline: ${{ runner.temp }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        env:
          BASELINE: ${{ runner.temp }}/fallow-regression.json
        run: |
          if [ ! -s "$BASELINE" ] || ! jq -e . "$BASELINE" > /dev/null; then
            echo "FAIL: regression baseline not saved or invalid JSON"
            exit 1
          fi
          echo "PASS: regression baseline saved"
      # Same code, so counts cannot have regressed: the gate must pass.
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          regression-baseline: ${{ runner.temp }}/fallow-regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: regression gate should pass for unchanged code"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected existing issues to still be counted"
            exit 1
          fi
          echo "PASS"
