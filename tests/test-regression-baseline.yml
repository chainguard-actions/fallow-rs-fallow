name: Test regression baseline save then compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          artifacts-dir: fallow-artifacts-regression-save
      - name: Assert regression baseline saved
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/fallow-regression.json" ]; then
            echo "FAIL: regression baseline not saved"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/fallow-regression.json"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          artifacts-dir: fallow-artifacts-regression-compare
      - name: Assert no regression
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: identical run must not regress"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
