name: Test regression baseline save and fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          artifacts-dir: fallow-artifacts-save-regression
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression/regression.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not saved at $f"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ github.workspace }}/fallow-regression/regression.json
          artifacts-dir: fallow-artifacts-compare-regression
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES (baseline run: $SAVED_ISSUES)"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: issue count grew without code change"
            exit 1
          fi
          echo "PASS"
