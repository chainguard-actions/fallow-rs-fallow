name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-baselines/regression.json"
          if [ ! -s "$f" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          head -c 2000 "$f"; echo
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          RESULTS: ${{ steps.compare.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS: unchanged code did not regress"
