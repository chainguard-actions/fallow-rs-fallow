name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/regression"
          mkdir -p "$P/src"
          echo '{"name":"regression","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          export function used() { return 1; }
          export function unused() { return 2; }
          used();
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: act-fixtures/regression
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-regression-baseline: ${{ github.workspace }}/act-fixtures/regression-out/regression-baseline.json

      - name: Assert regression baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/act-fixtures/regression-out/regression-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: act-fixtures/regression
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          regression-baseline: ${{ github.workspace }}/act-fixtures/regression-out/regression-baseline.json

      - name: Assert no regression against identical code
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when comparing against own regression baseline"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          echo "PASS"
