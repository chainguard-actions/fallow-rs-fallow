name: Test regression baseline round trip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          save-regression-baseline: ${{ runner.temp }}/fallow-regression.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        run: |
          if [ ! -s "$RUNNER_TEMP/fallow-regression.json" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          echo "PASS"
      - id: check
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          regression-baseline: ${{ runner.temp }}/fallow-regression.json
          fail-on-regression: 'true'
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression failure
        env:
          ISSUES: ${{ steps.check.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
