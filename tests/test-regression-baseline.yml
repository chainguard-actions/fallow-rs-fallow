name: Test dead-code regression baseline save then compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          save-regression-baseline: fallow-test-regression.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-test-regression.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not saved at $f"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          regression-baseline: fallow-test-regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert no regression against identical code
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues should be an integer"
            exit 1
          fi
          echo "PASS"
