name: Test regression baseline save and fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$RUNNER_TEMP/fallow-regression"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-regression-baseline: ${{ runner.temp }}/fallow-regression/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        env:
          FILE: ${{ runner.temp }}/fallow-regression/regression.json
        run: |
          if [ ! -f "$FILE" ]; then
            echo "FAIL: regression baseline not written at $FILE"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          regression-baseline: ${{ runner.temp }}/fallow-regression/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression detected
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          GATES_FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if echo "$GATES_FAILED" | grep -qw 'regression'; then
            echo "FAIL: regression gate failed on an unchanged project"
            exit 1
          fi
          echo "PASS"
