name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/regression-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "regression-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/regression-project
          format: json
          save-regression-baseline: ${{ github.workspace }}/tests/fixtures/regression-project/regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert regression baseline was saved
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/regression-project/regression-baseline.json"
          if [ ! -f "$F" ] || ! jq empty "$F"; then
            echo "FAIL: regression baseline missing or invalid at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/regression-project
          format: json
          regression-baseline: ${{ github.workspace }}/tests/fixtures/regression-project/regression-baseline.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert no regression against identical code
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: regression gate tripped on unchanged code"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected the existing unused export to still be counted"
            exit 1
          fi
          echo "PASS"
