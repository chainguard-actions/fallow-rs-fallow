name: Test regression baseline save and compare (no regression)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/.fallow-test-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-regression-baseline: ${{ github.workspace }}/.fallow-test-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline written
        run: |
          F="$GITHUB_WORKSPACE/.fallow-test-baselines/regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          regression-baseline: ${{ github.workspace }}/.fallow-test-baselines/regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert issues counted and no regression failure
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          SAVED: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES (saved run: $SAVED)"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected dead-code issues to be counted"
            exit 1
          fi
          if [ "$ISSUES" != "$SAVED" ]; then
            echo "FAIL: issue count changed between identical runs"
            exit 1
          fi
          echo "PASS"
