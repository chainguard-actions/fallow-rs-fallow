name: Test save-regression-baseline then fail-on-regression with no regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-regression-baseline: ${{ github.workspace }}/fallow-test-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert regression baseline saved
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/fallow-test-regression.json" ]; then
            echo "FAIL: regression baseline file not written"
            exit 1
          fi
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          regression-baseline: ${{ github.workspace }}/fallow-test-regression.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no regression
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          GATES_FAILED: ${{ steps.compare.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case ",$GATES_FAILED," in
            *,regression,*) echo "FAIL: identical code reported as a regression"; exit 1 ;;
          esac
          echo "PASS"
