name: Test regression baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p /tmp/fallow-regression-test
          cat > /tmp/fallow-regression-test/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-regression-test/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
      - name: Save regression baseline
        id: save-regression-baseline
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression-test
          format: json
          fail-on-issues: 'false'
          save-regression-baseline: /tmp/fallow-regression-baseline.json
          auto-changed-since: 'false'
      - name: Assert save-regression-baseline step ran
        env:
          OUTCOME: ${{ steps.save-regression-baseline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save-regression-baseline step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Run with regression-baseline input
        id: with-regression-baseline
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression-test
          format: json
          fail-on-issues: 'false'
          regression-baseline: /tmp/fallow-regression-baseline.json
          fail-on-regression: 'false'
          auto-changed-since: 'false'
      - name: Assert regression-baseline step ran
        env:
          OUTCOME: ${{ steps.with-regression-baseline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: regression-baseline step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
