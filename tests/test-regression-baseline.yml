name: Test save-regression-baseline then regression-baseline with fail-on-regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          import { add } from './util.js';
          console.log(add(1, 2));
          EOF
          cat > fallow-sample/src/util.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          export function unusedHelper(x) {
            return x * 2;
          }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: regression baseline not saved at $f"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert unchanged code does not regress
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: regression check failed on unchanged code"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
