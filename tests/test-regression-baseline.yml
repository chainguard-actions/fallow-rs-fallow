name: Test regression baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          save-regression-baseline: ${{ runner.temp }}/fallow-regression.json
      - name: Assert regression baseline saved
        env:
          RB: ${{ runner.temp }}/fallow-regression.json
        run: |
          if [ ! -s "$RB" ]; then
            echo "FAIL: regression baseline not written at $RB"
            exit 1
          fi
          cat "$RB"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'true'
          tolerance: '0'
          regression-baseline: ${{ runner.temp }}/fallow-regression.json
      - name: Assert no regression against identical baseline
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
        run: |
          echo "issues: $ISSUES outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: compare step did not succeed"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues count >= 1"
            exit 1
          fi
          echo "PASS"
