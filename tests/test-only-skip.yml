name: Test only and skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-only
        uses: .
        continue-on-error: true
        with:
          command: ''
          root: .
          fail-on-issues: 'false'
          format: json
          only: 'dead-code'
          auto-changed-since: 'false'
      - name: Assert only action ran
        env:
          OUTCOME: ${{ steps.action-only.outcome }}
          ISSUES: ${{ steps.action-only.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-skip
        uses: .
        continue-on-error: true
        with:
          command: ''
          root: .
          fail-on-issues: 'false'
          format: json
          skip: 'dupes,health'
          auto-changed-since: 'false'
      - name: Assert skip action ran
        env:
          OUTCOME: ${{ steps.action-skip.outcome }}
          ISSUES: ${{ steps.action-skip.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
