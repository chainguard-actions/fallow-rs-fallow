name: Test combined run with only and skip selectors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: only
        uses: .
        with:
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          only: dead-code,health
          artifacts-dir: fallow-artifacts-only
      - id: skip
        uses: .
        with:
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          skip: dupes
          artifacts-dir: fallow-artifacts-skip
      - name: Assert both runs produced results
        env:
          ONLY_RESULTS: ${{ steps.only.outputs.results }}
          SKIP_RESULTS: ${{ steps.skip.outputs.results }}
          ONLY_ISSUES: ${{ steps.only.outputs.issues }}
          SKIP_ISSUES: ${{ steps.skip.outputs.issues }}
        run: |
          echo "only: $ONLY_RESULTS ($ONLY_ISSUES)"
          echo "skip: $SKIP_RESULTS ($SKIP_ISSUES)"
          for r in "$ONLY_RESULTS" "$SKIP_RESULTS"; do
            if [ -z "$r" ] || [ ! -f "$r" ]; then
              echo "FAIL: results file missing: '$r'"
              exit 1
            fi
            jq empty "$r" || { echo "FAIL: invalid JSON in $r"; exit 1; }
          done
          for n in "$ONLY_ISSUES" "$SKIP_ISSUES"; do
            if ! [[ "$n" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output '$n' is not a number"
              exit 1
            fi
          done
          echo "PASS"
