name: Test combined run with only and skip selectors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: only
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          only: 'dead-code'
      - name: Assert only=dead-code produced results
        env:
          RESULTS: ${{ steps.only.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if ! grep -q "orphan" "$RESULTS"; then
            echo "FAIL: dead-code findings (orphan.ts) missing"
            exit 1
          fi
          echo "PASS"
      - id: skip
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          skip: 'dupes,health'
      - name: Assert skip run produced results
        env:
          RESULTS: ${{ steps.skip.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
