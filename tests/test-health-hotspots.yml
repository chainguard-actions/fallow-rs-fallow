name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with its own git history
        run: |
          P="$GITHUB_WORKSPACE/fallow-test/hotspots"
          mkdir -p "$P/src"
          cd "$P"
          git -c init.defaultBranch=main init -q .
          cat > package.json <<'EOF'
          {
            "name": "hotspots-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          for i in 1 2 3; do
            cat > src/index.js <<EOF
          export function add(a, b) {
            if (a > $i) { return a; }
            return a + b;
          }
          add(1, 2);
          EOF
            git add -A
            git -c user.email=t@example.com -c user.name=Test commit -q -m "commit $i"
          done
          git log --oneline

      - id: action
        uses: .
        with:
          command: health
          root: fallow-test/hotspots
          format: json
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
