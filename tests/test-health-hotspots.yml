name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create project with git history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          P="$GITHUB_WORKSPACE/fx-hotspots-proj"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-hotspots-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          for i in 1 2 3; do
            cat > "$P/src/index.js" <<EOF
          export function f(a, b) {
            if (a > $i) {
              if (b > $i) { return a + b + $i; }
              return a - $i;
            }
            return b;
          }
          console.log(f(1, 2));
          EOF
            git add fx-hotspots-proj
            git commit -q -m "hotspot change $i"
          done
          git log --oneline -n 3

      - id: action
        uses: .
        with:
          command: health
          root: fx-hotspots-proj
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
