name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          export function main(a, b) {
            return a > b ? a : b;
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-sample
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results file is valid JSON and issues numeric
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS issues: $ISSUES"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
