name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with git history
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          cd "$P"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          for i in 1 2 3 4; do
            printf '%s\n' \
              "export function f(a: number): number {" \
              "  if (a > $i) { return a * $i; }" \
              "  for (let j = 0; j < a; j++) { if (j === $i) { return j; } }" \
              "  return a;" \
              "}" \
              "console.log(f($i));" > src/index.ts
            git add -A
            git commit -qm "commit $i"
          done
          git log --oneline

      - id: action
        uses: .
        with:
          command: health
          root: fx-project
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert health outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          jq 'keys' "$RESULTS"
          echo "PASS"
