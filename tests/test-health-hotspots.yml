name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-hotspots"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "hotspots-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            if (a > b) { return a - b; }
            return a + b;
          }
          console.log(add(1, 2));
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-proj-hotspots
          format: json
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON: $RESULTS"
            exit 1
          fi
          echo "PASS"
