name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create fixture project
        run: |
          set -e
          D=fx-hotspots
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-hotspots","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          export function add(a, b) { if (a > b) { return a - b; } return a + b; }
          console.log(add(1, 2));
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-hotspots
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          artifacts-dir: fx-hotspots-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs and forwarded flags
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file '$RESULTS'"; exit 1; }
          ARGS_FILE=fx-hotspots-artifacts/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--hotspots" "--since 1y" "--min-commits 1"; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected '$flag' in analysis args"
              exit 1
            fi
          done
          echo "PASS"
