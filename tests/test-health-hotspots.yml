name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with git history
        run: |
          set -e
          git config --global --add safe.directory '*'
          D="$GITHUB_WORKSPACE/fx-hotspots"
          rm -rf "$D"
          mkdir -p "$D/src"
          cd "$D"
          cat > package.json <<'EOF'
          {"name":"fx-hotspots","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { step } from './busy.js';
          console.log(step(1));
          EOF
          echo 'export function step(n) { if (n > 0) { return n - 1; } return 0; }' > src/busy.js
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm "initial"
          for i in 1 2 3 4; do
            echo "export const v$i = $i;" >> src/busy.js
            git commit -qam "change $i"
          done
          git log --oneline

      - id: action
        uses: .
        with:
          command: health
          root: fx-hotspots
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! grep -qi 'hotspot' "$RESULTS"; then
            echo "FAIL: expected hotspot data in results"
            jq . "$RESULTS" | head -80
            exit 1
          fi
          echo "PASS"
