name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture git project with history
        run: |
          set -e
          rm -rf fallow-fixture
          mkdir -p fallow-fixture/src
          cd fallow-fixture
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { classify } from './complex.js';
          console.log(classify(5));
          EOF
          for i in 1 2 3; do
            cat > src/complex.js <<EOF
          export function classify(n) {
            if (n < 0) { return 'neg'; }
            if (n === 0) { return 'zero'; }
            if (n === $i) { return 'special'; }
            return 'pos';
          }
          EOF
            git add -A
            git commit -q -m "commit $i"
          done
          git log --oneline

      - id: action
        uses: .
        with:
          command: health
          root: fallow-fixture
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected integer issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
