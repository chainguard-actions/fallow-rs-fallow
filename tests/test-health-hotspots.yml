name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/hotspots-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "hotspots-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) { return a + b; }
          add(1, 2);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/hotspots-project
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
