name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with its own git history
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/hotspots-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "hotspots-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cd "$P"
          git init -q
          for i in 1 2 3; do
            cat > src/index.js <<EOF
          export function compute(a, b) {
            if (a > $i) {
              if (b > $i) { return a + b; }
              return a;
            }
            return b;
          }
          compute(1, 2);
          EOF
            git add -A
            git -c user.email=test@example.com -c user.name="Test User" commit -q -m "commit $i"
          done
          git log --oneline

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/hotspots-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          hotspots: 'true'
          since: '1y'
          min-commits: '1'

      - name: Assert results produced
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON: $RESULTS"
            exit 1
          fi
          echo "PASS"
