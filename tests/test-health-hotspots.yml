name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FX: fallow-test-health-hotspots
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create fixture JS project
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$FX"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {"name":"fallow-test-project","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > "$P/src/used.js" <<'EOF'
          export function used() {
            return 42;
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: ${{ env.FX }}
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not an integer: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/$FX"
