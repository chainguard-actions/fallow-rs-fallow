name: Test changed-since and only/skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          changed-since: 'HEAD~1'
          only: 'dead-code'
          skip: ''
          auto-changed-since: 'false'
          threads: '2'
      - name: Assert action ran with changed-since scoping
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          CHANGED_FILES_UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $CHANGED_FILES_UNAVAILABLE"
          echo "PASS: action with changed-since and only inputs completed"
