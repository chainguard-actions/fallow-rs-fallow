name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/act-fixtures/sample-project
          changed-since: HEAD
          fail-on-issues: 'false'
          artifacts-dir: fallow-out-changed-since
      - name: Assert changed-since forwarded
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          CFU: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          ARGS_FILE="fallow-out-changed-since/fallow-analysis-args.sh"
          cat "$ARGS_FILE"
          grep -qF -- "--changed-since HEAD" "$ARGS_FILE" || { echo "FAIL: --changed-since not forwarded"; exit 1; }
          echo "issues: $ISSUES changed-files-unavailable: $CFU"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ "$CFU" != "true" ] && [ "$CFU" != "false" ]; then
            echo "FAIL: changed-files-unavailable must be true/false"
            exit 1
          fi
          echo "PASS"
