name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with its own git history
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src
          cd fx
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo '{"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}' > package.json
          cat > src/index.js <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          echo 'export function used() { return 1; }' > src/lib.js
          git add -A
          git commit -q -m "base"
          git tag fx-base
          echo 'export function brandNewUnused() { return 2; }' >> src/lib.js
          git add -A
          git commit -q -m "change"

      - id: action
        uses: .
        with:
          root: fx
          command: dead-code
          changed-since: fx-base
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
