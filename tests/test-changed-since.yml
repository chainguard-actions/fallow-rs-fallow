name: Test changed-since scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with a base commit and a change
        run: |
          P="$GITHUB_WORKSPACE/fallow-test/changed-since"
          mkdir -p "$P/src"
          cd "$P"
          git -c init.defaultBranch=main init -q .
          echo '{"name":"changed-since","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > package.json
          printf 'import { used } from "./lib.js";\nused();\n' > src/index.js
          printf 'export function used() { return 1; }\n' > src/lib.js
          git add -A
          git -c user.email=t@example.com -c user.name=Test commit -q -m base
          git tag base
          printf 'export function used() { return 1; }\nexport function unused() { return 2; }\n' > src/lib.js
          git add -A
          git -c user.email=t@example.com -c user.name=Test commit -q -m change
          git log --oneline

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-test/changed-since
          format: json
          changed-since: base
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $UNAVAILABLE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ "$UNAVAILABLE" != "true" ] && [ "$UNAVAILABLE" != "false" ]; then
            echo "FAIL: changed-files-unavailable must be true/false"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
