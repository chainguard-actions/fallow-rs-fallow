name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create and commit project, then change one file
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          P="$GITHUB_WORKSPACE/fx-changed-proj"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-changed-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          EOF
          git add fx-changed-proj
          git commit -q -m "base project"
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function newlyUnused() { return 2; }
          EOF
          git add fx-changed-proj
          git commit -q -m "add unused export"

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-changed-proj
          changed-since: HEAD~1
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert scoped analysis ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $UNAVAILABLE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if [ "$UNAVAILABLE" != "false" ]; then
            echo "FAIL: changed files should be resolvable from local git"
            exit 1
          fi
          echo "PASS"
