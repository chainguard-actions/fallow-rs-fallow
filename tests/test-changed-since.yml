name: Test changed-since scopes to changed files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          changed-since: HEAD
      - name: Assert no issues reported for unchanged files
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAPPLIED: ${{ steps.action.outputs.requests-unapplied }}
        run: |
          echo "issues: $ISSUES requests-unapplied: $UNAPPLIED"
          if [ -n "$UNAPPLIED" ]; then
            echo "FAIL: changed-since was not applied: $UNAPPLIED"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues when nothing changed since HEAD"
            exit 1
          fi
          echo "PASS"
