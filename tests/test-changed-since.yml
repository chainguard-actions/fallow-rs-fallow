name: Test changed-since scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          changed-since: HEAD
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert scoped analysis completed
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "results: $RESULTS issues: $ISSUES changed-files-unavailable: $UNAVAILABLE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$f" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
