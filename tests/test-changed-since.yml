name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/changed-since-project"
          mkdir -p "$P/src"
          echo '{"name":"changed-since-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/changed-since-project
          format: json
          changed-since: HEAD
          fail-on-issues: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $UNAVAILABLE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ "$UNAVAILABLE" != "true" ] && [ "$UNAVAILABLE" != "false" ]; then
            echo "FAIL: changed-files-unavailable should be true/false, got '$UNAVAILABLE'"
            exit 1
          fi
          echo "PASS"
