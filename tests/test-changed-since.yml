name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: dead-code
          changed-since: HEAD
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "results: $RESULTS issues: $ISSUES changed-files-unavailable: $UNAVAILABLE"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          if [ "$UNAVAILABLE" != "false" ]; then
            echo "FAIL: expected changed-files-unavailable=false outside PR context"
            exit 1
          fi
          if ! grep -q -- '--changed-since' "$GITHUB_WORKSPACE/fallow-analysis-args.sh"; then
            echo "FAIL: expected --changed-since in analysis args"
            exit 1
          fi
          echo "PASS"
