name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project in its own git repository
        run: |
          git config --global --add safe.directory '*'
          rm -rf sample-app && mkdir -p sample-app/src
          cd sample-app
          cat > package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { add } from './math.js';
          export function main() { return add(1, 2); }
          EOF
          echo "export function add(a, b) { return a + b; }" > src/math.js
          git init -q .
          git add -A
          git -c user.email=t@example.com -c user.name=Test commit -q -m base
          cat > src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function unusedHelper(x) { return x * 2; }
          EOF
          git add -A
          git -c user.email=t@example.com -c user.name=Test commit -q -m change
          git log --oneline

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: dead-code
          changed-since: HEAD~1
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert scoped run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES results: $RESULTS changed-files-unavailable: $UNAVAILABLE"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
