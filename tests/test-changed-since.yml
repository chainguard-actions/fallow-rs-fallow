name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-changed"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "changed-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-proj-changed
          changed-since: HEAD
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert run completed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES changed-files-unavailable: $UNAVAILABLE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
