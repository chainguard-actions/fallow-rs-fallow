name: Test changed-since HEAD scopes out every finding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: '3.43.1'
          format: json
          changed-since: HEAD
          fail-on-issues: 'false'
      - name: Assert scoped run reports no issues
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
          UNAPPLIED: ${{ steps.action.outputs.requests-unapplied }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $UNAVAILABLE"
          echo "requests-unapplied: '$UNAPPLIED'"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not numeric"
            exit 1
          fi
          if [ -n "$UNAPPLIED" ]; then
            echo "FAIL: changed-since HEAD should apply cleanly"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: no files changed since HEAD, so no issues expected"
            exit 1
          fi
          echo "PASS"
