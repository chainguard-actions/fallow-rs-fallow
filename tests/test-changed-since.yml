name: Test changed-since input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-project/index.js <<'EOF'
          export function used() { return 42; }
          EOF
      - name: Run with changed-since input
        id: changed-since
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          changed-since: HEAD
          auto-changed-since: 'false'
      - name: Assert changed-since step ran
        env:
          OUTCOME: ${{ steps.changed-since.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: changed-since step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
