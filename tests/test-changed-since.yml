name: Test changed-since input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get a valid git ref for changed-since
        id: git-ref
        run: |
          # Use HEAD~1 if it exists, otherwise use HEAD itself
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            REF=$(git rev-parse HEAD~1)
          else
            REF=$(git rev-parse HEAD)
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using ref: $REF"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          changed-since: ${{ steps.git-ref.outputs.ref }}
          auto-changed-since: 'false'

      - name: Assert changed-since run completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
