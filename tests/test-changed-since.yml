name: Test changed-since scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project with git history
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src"
          cd "$S"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > package.json <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { used } from './old.js';
          console.log(used());
          EOF
          cat > src/old.js <<'EOF'
          export function used() { return 1; }
          export function oldUnused() { return 2; }
          EOF
          git add -A
          git commit -q -m "initial"
          git tag fallow-base
          cat > src/new.js <<'EOF'
          export function newUnused() { return 3; }
          EOF
          git add -A
          git commit -q -m "add new file"

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          changed-since: fallow-base
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results scoped to changed files
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "changed-files-unavailable: $UNAVAILABLE"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if grep -q 'oldUnused' "$RESULTS"; then
            echo "FAIL: results include findings from unchanged src/old.js"
            exit 1
          fi
          echo "PASS"
