name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create fixture project
        run: |
          set -e
          D=fx-changed
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-changed","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(3));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n + 1; }
          export function unusedHelper() { return 42; }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-changed
          changed-since: HEAD
          artifacts-dir: fx-changed-artifacts
          fail-on-issues: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert scoped run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $UNAVAILABLE"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ "$UNAVAILABLE" != "false" ]; then
            echo "FAIL: expected changed-files-unavailable=false (no PR API call)"
            exit 1
          fi
          grep -q -- "--changed-since HEAD" fx-changed-artifacts/fallow-analysis-args.sh || { echo "FAIL: --changed-since not forwarded"; exit 1; }
          echo "PASS"
