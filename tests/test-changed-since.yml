name: Test changed-since scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: full
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          changed-since: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert scoped run reports no more than full run
        env:
          FULL: ${{ steps.full.outputs.issues }}
          SCOPED: ${{ steps.action.outputs.issues }}
          UNAPPLIED: ${{ steps.action.outputs.requests-unapplied }}
        run: |
          echo "full issues: $FULL"
          echo "scoped issues: $SCOPED"
          echo "requests-unapplied: $UNAPPLIED"
          if ! [[ "$FULL" =~ ^[0-9]+$ ]] || ! [[ "$SCOPED" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issue counts are not numbers"
            exit 1
          fi
          if [ "$SCOPED" -gt "$FULL" ]; then
            echo "FAIL: changed-since run reported more issues than the full run"
            exit 1
          fi
          echo "PASS"
