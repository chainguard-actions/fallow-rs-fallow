name: Test changed-since input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for changed-since analysis
        run: |
          mkdir -p /tmp/fallow-changed-project
          cat > /tmp/fallow-changed-project/package.json <<'EOF'
          {
            "name": "changed-test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-changed-project/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      - name: Get a git ref to use as changed-since
        id: git-ref
        run: |
          REF=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Run dead-code with changed-since
        id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-changed-project
          format: json
          fail-on-issues: 'false'
          changed-since: ${{ steps.git-ref.outputs.ref }}
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
