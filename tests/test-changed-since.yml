name: Test explicit changed-since scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          artifacts-dir: fallow-out-changed
          changed-since: HEAD
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "changed-files-unavailable: $UNAVAILABLE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          case "$UNAVAILABLE" in
            true|false) ;;
            *) echo "FAIL: changed-files-unavailable must be true/false"; exit 1 ;;
          esac
          if ! grep -q -- '--changed-since' fallow-out-changed/fallow-analysis-args.sh; then
            echo "FAIL: --changed-since not forwarded"
            exit 1
          fi
          echo "PASS"
