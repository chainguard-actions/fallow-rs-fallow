name: Test changed-since scopes findings to changed files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-changed-since
          type-aware: 'false'
          changed-since: HEAD
      - name: Assert no findings reported when nothing changed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues scoped to files changed since HEAD"
            exit 1
          fi
          echo "PASS"
