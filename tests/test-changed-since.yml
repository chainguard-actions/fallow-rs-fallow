name: Test dead-code scoped with changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/dc-changed"
          mkdir -p "$R/src"
          cat > "$R/package.json" <<'EOF'
          {
            "name": "dc-changed",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$R/src/index.js" <<'EOF'
          export function unusedThing() { return 1; }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dc-changed
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          changed-since: HEAD

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
