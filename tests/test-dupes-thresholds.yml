name: Test duplication analysis with thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-dupes-thresh
          cat > /tmp/fallow-dupes-thresh/package.json <<'EOF'
          {
            "name": "dupes-thresh-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dupes-thresh/index.js <<'EOF'
          export function functionA(x, y) {
            const result = x + y;
            const doubled = result * 2;
            return doubled;
          }
          export function functionB(x, y) {
            const result = x + y;
            const doubled = result * 2;
            return doubled;
          }
          EOF
      - id: dupes
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-thresh
          format: json
          fail-on-issues: 'false'
          min-tokens: '20'
          min-lines: '3'
          threshold: '50'
          auto-changed-since: 'false'
      - name: Assert dupes step ran
        env:
          OUTCOME: ${{ steps.dupes.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
