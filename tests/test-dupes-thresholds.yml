name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          cat > "$D/src/index.ts" <<'EOF'
          import { formatA } from './format-a';
          import { formatB } from './format-b';
          export function main(): string {
            return formatA([1, 2, 3]) + formatB([4, 5, 6]);
          }
          main();
          EOF
          for n in a b; do
          cat > "$D/src/format-$n.ts" <<EOF
          export function format${n^^}(values: number[]): string {
            const out: string[] = [];
            for (const value of values) {
              if (value > 10) {
                out.push('big:' + value.toString());
              } else if (value > 5) {
                out.push('medium:' + value.toString());
              } else {
                out.push('small:' + value.toString());
              }
            }
            const joined = out.join(',');
            const trimmed = joined.trim();
            return '[' + trimmed + ']';
          }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: fallow-test-sample
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
