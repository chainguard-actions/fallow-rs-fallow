name: Test duplication threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project with duplicated code
        run: |
          mkdir -p /tmp/fallow-dupes-thresh
          cat > /tmp/fallow-dupes-thresh/package.json <<'EOF'
          {
            "name": "dupes-thresh-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dupes-thresh/a.js <<'EOF'
          export function processData(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push(item.value * 2);
              }
            }
            return result;
          }
          EOF
          cat > /tmp/fallow-dupes-thresh/b.js <<'EOF'
          export function handleData(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push(item.value * 2);
              }
            }
            return result;
          }
          EOF
      - name: Run dupes with thresholds
        id: dupes-thresh
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-thresh
          format: json
          fail-on-issues: 'false'
          threshold: '0'
          min-tokens: '50'
          min-lines: '3'
          auto-changed-since: 'false'
      - name: Assert dupes-thresh step ran
        env:
          OUTCOME: ${{ steps.dupes-thresh.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: dupes-thresh step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
