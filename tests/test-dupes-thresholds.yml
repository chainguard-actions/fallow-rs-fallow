name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with duplicated code
        run: |
          set -e
          D=fx-dupes
          rm -rf "$D"
          mkdir -p "$D/src/a" "$D/src/b"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-dupes","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { sumA } from './a/sum.js';
          import { sumB } from './b/sum.js';
          console.log(sumA([1, 2]), sumB([3, 4]));
          EOF
          for x in A B; do
            lower=$(echo "$x" | tr 'A-Z' 'a-z')
            cat > "$D/src/$lower/sum.js" <<EOF
          export function sum${x}(items) {
            let total = 0;
            for (const item of items) {
              if (typeof item === 'number' && item > 0) {
                total = total + item * 2;
              } else if (typeof item === 'string') {
                total = total + parseInt(item, 10);
              } else {
                total = total - 1;
              }
            }
            const result = { total, count: items.length, average: total / items.length };
            return result;
          }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: fx-dupes
          min-tokens: '10'
          min-lines: '3'
          threshold: '100'
          top: '5'
          artifacts-dir: fx-dupes-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs and forwarded flags
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file '$RESULTS'"; exit 1; }
          ARGS_FILE=fx-dupes-artifacts/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--min-tokens 10" "--min-lines 3" "--threshold 100" "--top 5"; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected '$flag' in analysis args"
              exit 1
            fi
          done
          echo "PASS"
