name: Test dupes with token/line minimums and threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.37.0'
          min-tokens: '30'
          min-lines: '3'
          threshold: '50'
          top: '5'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no duplication and threshold gate not failed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 clone groups"
            exit 1
          fi
          if echo "$GATES_FAILED" | grep -q 'duplication-threshold'; then
            echo "FAIL: duplication-threshold gate failed"
            exit 1
          fi
          echo "PASS"
