name: Test dupes command with token/line/threshold/top inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project with duplicated code
        run: |
          rm -rf sample-app && mkdir -p sample-app/src
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          for f in a b; do
          cat > "sample-app/src/$f.js" <<'EOF'
          export function compute(items) {
            let total = 0;
            for (const item of items) {
              if (item.enabled) {
                total += item.price * item.quantity;
              } else {
                total -= item.discount || 0;
              }
            }
            return Math.round(total * 100) / 100;
          }
          EOF
          done
          cat > sample-app/src/index.js <<'EOF'
          import { compute as ca } from './a.js';
          import { compute as cb } from './b.js';
          export function main() { return ca([]) + cb([]); }
          EOF

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: dupes
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
