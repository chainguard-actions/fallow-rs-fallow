name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with duplicated code
        run: |
          P="$GITHUB_WORKSPACE/fx-dupes-proj"
          mkdir -p "$P/src/a" "$P/src/b"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-dupes-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { calcA } from './a/calc.js';
          import { calcB } from './b/calc.js';
          console.log(calcA([1, 2, 3]), calcB([4, 5, 6]));
          EOF
          for d in a b; do
            up=$(echo "$d" | tr a-z A-Z)
            cat > "$P/src/$d/calc.js" <<EOF
          export function calc${up}(items) {
            let total = 0;
            let count = 0;
            for (const item of items) {
              if (item > 10) {
                total += item * 2;
              } else if (item > 5) {
                total += item + 3;
              } else {
                total += item - 1;
              }
              count += 1;
            }
            const average = count === 0 ? 0 : total / count;
            const result = { total, count, average };
            console.log('result', result.total, result.count, result.average);
            return result;
          }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: fx-dupes-proj
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '5'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ "$ISSUES" -gt 5 ]; then
            echo "FAIL: top=5 should cap the reported clone groups"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
