name: Test dupes threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS files for duplication analysis
        run: |
          mkdir -p /tmp/fallow-dupes-project
          cat > /tmp/fallow-dupes-project/a.js << 'EOF'
          export function hello() { return 'hello world'; }
          export function greet(name) { return 'hello ' + name; }
          EOF
          cat > /tmp/fallow-dupes-project/b.js << 'EOF'
          export function hello() { return 'hello world'; }
          export function greet(name) { return 'hello ' + name; }
          EOF
          cat > /tmp/fallow-dupes-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-project
          fail-on-issues: 'false'
          format: json
          annotations: 'false'
          auto-changed-since: 'false'
          threshold: '0'
          min-tokens: '10'
          min-lines: '2'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
