name: Test dupes command with token/line thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project with duplicated code
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src"
          cat > "$S/package.json" <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          for n in one two; do
            cat > "$S/src/$n.js" <<'EOF'
          export function process(items) {
            const out = [];
            for (const item of items) {
              if (item.enabled && item.value > 10) {
                out.push({ id: item.id, value: item.value * 2, label: `item-${item.id}` });
              } else if (item.value < 0) {
                out.push({ id: item.id, value: 0, label: 'negative' });
              } else {
                out.push({ id: item.id, value: item.value, label: 'plain' });
              }
            }
            return out.sort((a, b) => a.value - b.value);
          }
          EOF
          done
          cat > "$S/src/index.js" <<'EOF'
          import { process as p1 } from './one.js';
          import { process as p2 } from './two.js';
          console.log(p1([]), p2([]));
          EOF

      - id: action
        uses: .
        with:
          command: dupes
          root: fallow-sample
          min-tokens: '10'
          min-lines: '2'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results valid
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
