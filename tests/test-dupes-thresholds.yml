name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FX: fallow-test-dupes-thresholds
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture JS project with duplicated code
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$FX"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {"name":"fallow-test-project","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { dupA } from './dup-a.js';
          import { dupB } from './dup-b.js';
          console.log(dupA([1, 2, 3]), dupB([4, 5, 6]));
          EOF
          for name in A B; do
            lower=$(echo "$name" | tr AB ab)
            cat > "$P/src/dup-$lower.js" <<EOF
          export function dup${name}(items) {
            const result = [];
            for (const item of items) {
              if (item % 2 === 0) {
                result.push(item * 2);
              } else {
                result.push(item * 3);
              }
            }
            const total = result.reduce((acc, value) => acc + value, 0);
            const average = total / result.length;
            const max = Math.max(...result);
            const min = Math.min(...result);
            return { total, average, max, min, count: result.length };
          }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: ${{ env.FX }}
          min-tokens: '10'
          min-lines: '3'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not an integer: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one clone group for dup-a.js/dup-b.js"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/$FX"
