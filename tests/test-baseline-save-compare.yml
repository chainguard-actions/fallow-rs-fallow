name: Test save-baseline then baseline comparison (dead-code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P" "$GITHUB_WORKSPACE/fx-baselines"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src" "$GITHUB_WORKSPACE/fx-baselines"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","workspaces":["packages/*"]}' > "$P/package.json"
          printf '%s\n' '{"name":"web","version":"1.0.0","main":"src/index.ts"}' > "$P/packages/web/package.json"
          printf '%s\n' '{"name":"admin","version":"1.0.0","main":"src/index.ts"}' > "$P/packages/admin/package.json"
          printf '%s\n' 'import { used } from "./util";' 'console.log(used(1));' > "$P/packages/web/src/index.ts"
          printf '%s\n' 'export function used(x: number): number { return x + 1; }' 'export function neverUsed(): string { return "unused"; }' > "$P/packages/web/src/util.ts"
          printf '%s\n' 'console.log("admin");' > "$P/packages/admin/src/index.ts"

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-project
          save-baseline: ${{ github.workspace }}/fx-baselines/dead-code.json
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fx-baselines/dead-code.json"
          ls -la "$GITHUB_WORKSPACE/fx-baselines" || true
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline file is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fx-project
          baseline: ${{ github.workspace }}/fx-baselines/dead-code.json
          version: '3.34.0'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline outputs
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          EXPECTED_PATH: ${{ github.workspace }}/fx-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against a fresh baseline, got '$ISSUES'"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path '$BASELINE_PATH' != '$EXPECTED_PATH'"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! echo "$ENTRIES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: baseline-entries is not numeric: '$ENTRIES'"
            exit 1
          fi
          echo "PASS"
