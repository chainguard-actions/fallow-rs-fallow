name: Test explicit config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          issue-types: unused-files
      - name: Assert only unused files were reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected orphan.js to be reported as an unused file"
            exit 1
          fi
          if ! grep -q 'orphan' "$RESULTS"; then
            echo "FAIL: results do not mention orphan.js"
            head -c 4000 "$RESULTS"
            exit 1
          fi
          echo "PASS"
