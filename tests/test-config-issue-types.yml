name: Test dead-code with explicit config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project and config
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          import { add } from './util.js';
          console.log(add(1, 2));
          EOF
          cat > fallow-sample/src/util.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          export function unusedHelper(x) {
            return x * 2;
          }
          EOF
          echo 'export const orphan = 1;' > fallow-sample/src/orphan.js
          echo '{"ignorePatterns": ["src/orphan.js"]}' > fallow-sample/fallow-test-config.json

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          config: ${{ github.workspace }}/fallow-sample/fallow-test-config.json
          issue-types: unused-files,unused-exports
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results are valid and the ignored file is not reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if grep -q 'orphan.js' "$RESULTS"; then
            echo "FAIL: orphan.js is ignored by the config but was reported"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
