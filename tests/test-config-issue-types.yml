name: Test dead-code with explicit config and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D=fx-config
          rm -rf "$D"
          mkdir -p "$D/src" "$D/cfg"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-config","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(3));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n + 1; }
          export function unusedHelper() { return 42; }
          EOF
          cat > "$D/src/orphan.js" <<'EOF'
          export const orphan = 1;
          EOF
          cat > "$D/cfg/.fallowrc.json" <<'EOF'
          {"ignorePatterns": ["dist/**"]}
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-config
          config: ${{ github.workspace }}/fx-config/cfg/.fallowrc.json
          issue-types: unused-files,unused-exports
          artifacts-dir: fx-config-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON and args include filters
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          ARGS_FILE=fx-config-artifacts/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in -- --config --unused-files --unused-exports; do
            [ "$flag" = "--" ] && continue
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected $flag in analysis args"
              exit 1
            fi
          done
          echo "PASS"
