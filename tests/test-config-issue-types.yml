name: Test dead-code with explicit config, issue-types and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project with a config file
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/config-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "config-test-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          echo '{}' > "$P/.fallowrc.json"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/config-project
          config: ${{ github.workspace }}/tests/fixtures/config-project/.fallowrc.json
          issue-types: unused-exports,unused-files
          threads: '2'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output is a number and results are valid JSON
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
