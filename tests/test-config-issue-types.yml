name: Test config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create demo project with fallow config
        run: |
          mkdir -p demo-config/src
          cat > demo-config/package.json <<'EOF'
          {"name":"demo-config","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > demo-config/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > demo-config/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function unusedHelper(a) { return a * 2; }
          EOF
          cat > demo-config/src/orphan.js <<'EOF'
          export const orphan = 1;
          EOF
          cat > demo-config/.fallowrc.json <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/fallow-rs/fallow/main/schema.json",
            "entry": ["src/index.js"]
          }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: demo-config
          config: ${{ github.workspace }}/demo-config/.fallowrc.json
          issue-types: unused-files,unused-exports
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results not valid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert issue-types and config were forwarded to fallow
        run: |
          ARGS_FILE="fallow-analysis-args.sh"
          if [ ! -f "$ARGS_FILE" ]; then
            echo "FAIL: $ARGS_FILE not found"
            exit 1
          fi
          cat "$ARGS_FILE"
          for flag in '--unused-files' '--unused-exports' '--config'; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected $flag in analysis args"
              exit 1
            fi
          done
          echo "PASS"
