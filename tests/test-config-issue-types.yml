name: Test dead-code with explicit config and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          issue-types: unused-files
          version: 3.40.0
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-config
      - name: Assert unused file reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least 1 unused file"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          head -c 3000 "$f"; echo
          if ! grep -q 'orphan' "$f"; then
            echo "FAIL: results do not mention orphan.ts"
            exit 1
          fi
          echo "PASS"
