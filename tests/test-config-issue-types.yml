name: Test dead-code with config file and issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          config: ${{ github.workspace }}/tests/fixtures/configs/dirty-ignore.json
          issue-types: unused-files,unused-deps
          version: '3.38.1'
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-config
      - name: Assert config ignores were honoured
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          if grep -q 'orphan.js' "$RESULTS"; then
            echo "FAIL: orphan.js should be ignored via config ignorePatterns"
            cat "$RESULTS"
            exit 1
          fi
          if grep -q '"left-pad"' "$RESULTS"; then
            echo "FAIL: left-pad should be ignored via config ignoreDependencies"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
