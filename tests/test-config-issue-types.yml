name: Test dead-code with custom config, issue-types and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with a custom config file
        run: |
          P="$GITHUB_WORKSPACE/fx-config-proj"
          mkdir -p "$P/src/ignored"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-config-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function neverUsed() { return 2; }
          EOF
          cat > "$P/src/orphan.js" <<'EOF'
          export const orphan = 42;
          EOF
          cat > "$P/src/ignored/dead.js" <<'EOF'
          export const deadButIgnored = 1;
          EOF
          cat > "$P/custom-fallow.json" <<'EOF'
          {
            "ignorePatterns": ["src/ignored/**"]
          }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-config-proj
          config: ${{ github.workspace }}/fx-config-proj/custom-fallow.json
          issue-types: unused-files, unused-exports
          threads: '2'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          echo "PASS"

      - name: Assert results valid and ignored file not reported
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results not valid JSON"
            exit 1
          fi
          if grep -q 'ignored/dead.js' "$RESULTS"; then
            echo "FAIL: file excluded by custom config was reported"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
