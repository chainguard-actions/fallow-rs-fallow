name: Test explicit config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with config
        run: |
          set -e
          rm -rf fallow-fixture
          mkdir -p fallow-fixture/src
          cd fallow-fixture
          cat > package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > src/used.js <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF
          cat > src/orphan.js <<'EOF'
          export const orphan = 42;
          EOF
          cat > .fallowrc.json <<'EOF'
          {
            "entry": ["src/index.js"]
          }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-fixture
          config: fallow-fixture/.fallowrc.json
          issue-types: unused-files,unused-exports
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected integer issues, got '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results not valid JSON"
            exit 1
          fi
          echo "PASS"
