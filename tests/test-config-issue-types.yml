name: Test dead-code with config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          config: ${{ github.workspace }}/tests/fixtures/fallowrc/.fallowrc.json
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          issue-types: 'unused-files'
      - name: Assert only unused-files reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused file (orphan.ts)"
            exit 1
          fi
          if ! grep -q "orphan" "$RESULTS"; then
            echo "FAIL: orphan.ts not in results"
            cat "$RESULTS"
            exit 1
          fi
          if grep -q "neverUsedHelper" "$RESULTS"; then
            echo "FAIL: unused export reported despite issue-types=unused-files"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
