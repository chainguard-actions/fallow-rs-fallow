name: Test explicit config file with issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          version: '3.38.1'
          type-aware: 'false'
          issue-types: unused-files
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-issue-types
      - name: Assert only unused files are reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected the orphan file to be reported"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! grep -q 'orphan' "$RESULTS"; then
            echo "FAIL: orphan.js not reported as unused file"
            cat "$RESULTS"
            exit 1
          fi
          if grep -q 'left-pad' "$RESULTS"; then
            echo "FAIL: unused dependency reported despite issue-types=unused-files"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
