name: Test dead-code with explicit config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          mkdir -p sample/src
          cat > sample/package.json <<'EOF'
          {"name":"sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > sample/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function unusedHelper() { return 0; }
          EOF
          cat > sample/src/orphan.js <<'EOF'
          export const orphan = 1;
          EOF
          cat > sample/.fallowrc.json <<'EOF'
          {"entry": ["src/index.js"]}
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: sample
          config: ${{ github.workspace }}/sample/.fallowrc.json
          issue-types: unused-files,unused-exports
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          cat "$RESULTS" | head -c 3000
          echo "PASS"
