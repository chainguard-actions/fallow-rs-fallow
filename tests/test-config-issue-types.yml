name: Test dead-code with config file and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-config"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-config","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(2));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n * 2; }
          export function unusedHelper(n) { return n + 1; }
          EOF
          cat > "$D/src/orphan.js" <<'EOF'
          export const orphanValue = 42;
          EOF
          cat > "$D/.fallowrc.json" <<'EOF'
          {
            "entry": ["src/index.js"],
            "ignorePatterns": ["**/ignored/**"]
          }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-config
          config: fx-config/.fallowrc.json
          issue-types: unused-exports,unused-files
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused export/file"
            exit 1
          fi
          echo "PASS"

      - name: Assert results JSON mentions the unused export or file
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! grep -qE 'unusedHelper|orphan' "$RESULTS"; then
            echo "FAIL: expected unusedHelper or orphan.js in results"
            jq . "$RESULTS" | head -100
            exit 1
          fi
          echo "PASS"
