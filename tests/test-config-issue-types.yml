name: Test explicit config and issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          config: ${{ github.workspace }}/tests/fixtures/fallow-config/.fallowrc.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-config
          issue-types: unused-files
      - name: Assert unused file reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected orphan.ts to be reported as an unused file"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          ARGS_FILE=fallow-out-config/fallow-analysis-args.sh
          cat "$ARGS_FILE" || true
          if ! grep -q -- '--config' "$ARGS_FILE" || ! grep -q -- '--unused-files' "$ARGS_FILE"; then
            echo "FAIL: --config / --unused-files not forwarded"
            exit 1
          fi
          echo "PASS"
