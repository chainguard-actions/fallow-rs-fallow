name: Test analysis selector inputs (only, skip)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-selectors
          cat > /tmp/fallow-test-selectors/package.json <<'EOF'
          {
            "name": "test-selectors-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-selectors/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
      - id: action-only
        uses: .
        continue-on-error: true
        with:
          command: ''
          root: /tmp/fallow-test-selectors
          format: json
          fail-on-issues: 'false'
          only: 'dead-code'
          auto-changed-since: 'false'
      - name: Assert only selector ran
        env:
          OUTCOME: ${{ steps.action-only.outcome }}
        run: |
          echo "outcome (only): $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with only selector (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-skip
        uses: .
        continue-on-error: true
        with:
          command: ''
          root: /tmp/fallow-test-selectors
          format: json
          fail-on-issues: 'false'
          skip: 'dupes,health'
          auto-changed-since: 'false'
      - name: Assert skip selector ran
        env:
          OUTCOME: ${{ steps.action-skip.outcome }}
        run: |
          echo "outcome (skip): $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with skip selector (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
