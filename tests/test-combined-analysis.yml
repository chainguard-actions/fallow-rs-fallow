name: Test combined (all analyses) mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run with no command (default: all analyses)
      - id: action
        uses: .
        with:
          root: tests/fixtures/js-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at $RESULTS"
            exit 1
          fi
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file exists and is valid JSON"

      - name: Assert combined results contain expected sections
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "Checking combined results structure"
          # Combined mode should have check (dead-code) section or be a valid combined envelope
          # The combined envelope has .check, .dupes, and .health sections
          HAS_CHECK=$(jq 'has("check")' "$RESULTS" 2>/dev/null || echo "false")
          HAS_DUPES=$(jq 'has("dupes")' "$RESULTS" 2>/dev/null || echo "false")
          HAS_HEALTH=$(jq 'has("health")' "$RESULTS" 2>/dev/null || echo "false")
          echo "has check: $HAS_CHECK"
          echo "has dupes: $HAS_DUPES"
          echo "has health: $HAS_HEALTH"
          if [ "$HAS_CHECK" != "true" ] && [ "$HAS_DUPES" != "true" ] && [ "$HAS_HEALTH" != "true" ]; then
            echo "FAIL: combined results missing expected sections (check, dupes, health)"
            jq 'keys' "$RESULTS"
            exit 1
          fi
          echo "PASS: combined results contain expected sections"

      - name: Assert changed-files-unavailable output is set
        env:
          CHANGED_FILES_UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "changed-files-unavailable: $CHANGED_FILES_UNAVAILABLE"
          # This output should always be emitted (true or false)
          if [ -z "$CHANGED_FILES_UNAVAILABLE" ]; then
            echo "NOTE: changed-files-unavailable output is empty (may be older fallow version)"
          else
            echo "PASS: changed-files-unavailable=$CHANGED_FILES_UNAVAILABLE"
          fi
