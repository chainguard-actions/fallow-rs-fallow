name: Test combined analysis (all analyses)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          # No command = run all analyses (dead-code + dupes + health)
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "total issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: combined analysis produced numeric issue count: $ISSUES"

      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file exists and is valid JSON"

      - name: Assert verdict is empty for combined command
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: '$VERDICT'"
          # verdict is only set for audit command
          if [ -n "$VERDICT" ]; then
            echo "FAIL: expected empty verdict for combined mode, got: '$VERDICT'"
            exit 1
          fi
          echo "PASS: verdict is empty as expected for combined mode"

      - name: Assert changed-files-unavailable output is set
        env:
          CHANGED_FILES_UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "changed-files-unavailable: '$CHANGED_FILES_UNAVAILABLE'"
          # This output should always be emitted
          if [ -z "$CHANGED_FILES_UNAVAILABLE" ]; then
            echo "WARN: changed-files-unavailable output is empty (may be older fallow version)"
          else
            echo "PASS: changed-files-unavailable=$CHANGED_FILES_UNAVAILABLE"
          fi
