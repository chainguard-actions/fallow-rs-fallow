name: Test health score, snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-health-snapshot
          score: 'true'
          min-score: '0'
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          save-snapshot: ${{ github.workspace }}/fallow-snapshots/snap.json
      - name: Assert snapshot run succeeded
        env:
          ISSUES: ${{ steps.snapshot.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/fallow-snapshots" tests/fixtures/clean-project/.fallow 2>/dev/null || true
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-health-trend
          score: 'true'
          trend: 'true'
      - name: Assert trend run succeeded
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          echo "PASS"
