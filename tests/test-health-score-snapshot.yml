name: Test health score, snapshot save and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare snapshot dir
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/dirty-project/.fallow/snapshots"
      - id: snap
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          min-score: '0'
          save-snapshot: ${{ github.workspace }}/tests/fixtures/dirty-project/.fallow/snapshots/act-snapshot.json
      - name: Assert score run succeeded and produced results
        env:
          RESULTS: ${{ steps.snap.outputs.results }}
        run: |
          echo "results: $RESULTS"
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$f" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/dirty-project/.fallow/snapshots" || true
          echo "PASS"
      - id: trend
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          score: 'true'
          trend: 'true'
      - name: Assert trend run outcome
        env:
          OUTCOME: ${{ steps.trend.outcome }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            f="$RESULTS"
            [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
            if [ -z "$RESULTS" ] || [ ! -f "$f" ]; then
              echo "FAIL: trend run succeeded but results file missing"
              exit 1
            fi
            echo "PASS: trend run produced results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: trend run failed (no comparable snapshot found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
