name: Test health min-score, save-snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          min-score: '0'
          save-snapshot: 'true'
      - name: Assert snapshot saved
        env:
          RESULTS: ${{ steps.snapshot.outputs.results }}
        run: |
          echo "results: $RESULTS"
          ls -laR tests/fixtures/dirty-project/.fallow || true
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! ls tests/fixtures/dirty-project/.fallow/snapshots/* >/dev/null 2>&1 \
             && ! ls .fallow/snapshots/* >/dev/null 2>&1; then
            echo "FAIL: no snapshot written under .fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          score: 'true'
          trend: 'true'
      - name: Assert trend run succeeded
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
