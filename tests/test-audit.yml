name: Test audit command with gate and security-gate inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS file for audit analysis
        run: |
          mkdir -p /tmp/fallow-audit-project
          cat > /tmp/fallow-audit-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          export function world() { return 'world'; }
          EOF
          cat > /tmp/fallow-audit-project/package.json << 'EOF'
          { "name": "audit-project", "version": "1.0.0" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-audit-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          gate: 'new-only'
          security-gate: 'new'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
