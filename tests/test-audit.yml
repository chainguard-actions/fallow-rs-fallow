name: Test audit with baselines and gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: dc
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: health
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          save-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines saved
        run: |
          for f in dead-code health dupes; do
            p="$GITHUB_WORKSPACE/fallow-baselines/$f.json"
            if [ ! -s "$p" ]; then
              echo "FAIL: $p not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          changed-since: HEAD
          gate: new-only
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          fail-on-issues: 'true'
          type-aware: 'false'
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          if [ "$VERDICT" != "pass" ] && [ "$VERDICT" != "warn" ]; then
            echo "FAIL: expected pass/warn verdict for an unchanged tree"
            exit 1
          fi
          if [ "$GATE" != "new-only" ]; then
            echo "FAIL: expected gate 'new-only'"
            exit 1
          fi
          echo "PASS"
