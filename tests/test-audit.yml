name: Test audit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project for audit
        run: |
          mkdir -p /tmp/fallow-audit-project
          cat > /tmp/fallow-audit-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          export function world() { return 'world'; }
          EOF
          cat > /tmp/fallow-audit-project/package.json << 'EOF'
          { "name": "audit-test", "version": "1.0.0", "type": "module" }
          EOF
          # Create minimal baseline files for audit command
          echo '{}' > /tmp/fallow-audit-project/dead-code-baseline.json
          echo '{}' > /tmp/fallow-audit-project/health-baseline.json
          echo '{}' > /tmp/fallow-audit-project/dupes-baseline.json

      - id: action-audit
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-audit-project
          format: json
          fail-on-issues: 'false'
          gate: 'new-only'
          security-gate: 'new'
          dead-code-baseline: /tmp/fallow-audit-project/dead-code-baseline.json
          health-baseline: /tmp/fallow-audit-project/health-baseline.json
          dupes-baseline: /tmp/fallow-audit-project/dupes-baseline.json
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert audit step ran
        env:
          OUTCOME: ${{ steps.action-audit.outcome }}
          VERDICT: ${{ steps.action-audit.outputs.verdict }}
          GATE: ${{ steps.action-audit.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with audit gate inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
