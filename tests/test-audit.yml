name: Test audit command with gate and dead-code baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/.fallow-test-audit"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          save-baseline: ${{ github.workspace }}/.fallow-test-audit/dead-code.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/.fallow-test-audit/dead-code.json
          version: '3.37.0'
          fail-on-issues: 'false'
          type-aware: 'false'
      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict '$VERDICT' is not pass/warn/fail"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
