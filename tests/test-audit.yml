name: Test audit command with gate and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with git history
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/audit-project"
          mkdir -p "$P/src"
          cd "$P"
          cat > package.json <<'EOF'
          {
            "name": "audit-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > src/index.js <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > src/lib.js <<'EOF'
          export function used() { return 1; }
          EOF
          printf 'fallow-results*\nfallow-*.log\nfallow-*.sh\n*.baseline.json\n.fallow/\n' > .gitignore
          git init -q
          git add -A
          git -c user.email=test@example.com -c user.name="Test User" commit -q -m initial
          echo "export function helper() { return 3; }" >> src/lib.js
          git add -A
          git -c user.email=test@example.com -c user.name="Test User" commit -q -m "add helper"

      - id: dc-baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/audit-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dead-code.baseline.json

      - id: health-baseline
        uses: .
        with:
          command: health
          root: tests/fixtures/audit-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/health.baseline.json

      - id: dupes-baseline
        uses: .
        with:
          command: dupes
          root: tests/fixtures/audit-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dupes.baseline.json

      - name: Assert baselines were saved
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/audit-project"
          for f in dead-code health dupes; do
            if [ ! -f "$P/$f.baseline.json" ]; then
              echo "FAIL: missing $f baseline"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/audit-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          changed-since: HEAD~1
          gate: all
          dead-code-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dead-code.baseline.json
          health-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/health.baseline.json
          dupes-baseline: ${{ github.workspace }}/tests/fixtures/audit-project/dupes.baseline.json

      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          echo "PASS"
