name: Test audit with per-analysis baselines and gate all
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-audit-baselines"
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-dc
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-health
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-dupes
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
      - name: Assert baselines saved
        run: |
          for f in dead-code health dupes; do
            P="$GITHUB_WORKSPACE/fallow-audit-baselines/$f.json"
            if [ ! -f "$P" ]; then
              echo "FAIL: $P missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
      - name: Assert audit verdict
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME verdict: $VERDICT gate: $GATE issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: audit with fail-on-issues false should not fail"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          echo "PASS"
