name: Test audit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: .
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          gate: 'new-only'
          security-gate: 'new'
          dead-code-baseline: ''
          health-baseline: ''
          dupes-baseline: ''
          format: 'json'
          annotations: 'false'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verdict '$VERDICT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on this repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
