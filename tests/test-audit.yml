name: Test audit and gate inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for audit
        run: |
          mkdir -p /tmp/fallow-audit-test
          cat > /tmp/fallow-audit-test/package.json << 'EOF'
          {
            "name": "audit-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-audit-test/index.js << 'EOF'
          export function used() { return 42; }
          export function helper() { return 'ok'; }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-audit-test
          format: json
          fail-on-issues: 'false'
          gate: 'new-only'
          security-gate: 'new'
          dead-code-baseline: ''
          health-baseline: ''
          dupes-baseline: ''
          changed-since: 'HEAD'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
