name: Test changed-workspaces with a missing ref is a hard error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal npm workspaces monorepo
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/monorepo-cw"
          mkdir -p "$P/packages/pkg-a/src"
          echo '{"name":"monorepo-cw","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > "$P/package.json"
          echo '{"name":"pkg-a","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/packages/pkg-a/package.json"
          echo 'export const x = 1;' > "$P/packages/pkg-a/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: act-fixtures/monorepo-cw
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          changed-workspaces: refs/heads/this-ref-does-not-exist-xyz

      - name: Assert action failed on the missing ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected a hard error for a missing changed-workspaces ref"
            exit 1
          fi
          echo "PASS"
