name: Test changed-workspaces with a missing ref fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Documented: a missing ref is a hard error (exit 2), not a silent
      # full-scope fallback.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          changed-workspaces: refs/heads/fallow-does-not-exist-xyz
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing changed-workspaces ref"
            exit 1
          fi
          echo "PASS"
