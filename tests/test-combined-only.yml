name: Test combined run with only selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' 'import { a } from "./lib";' 'console.log(a());' > "$P/src/index.ts"
          printf '%s\n' 'export function a(): number { return 1; }' 'export function unusedThing(): number { return 2; }' > "$P/src/lib.ts"

      - id: action
        uses: .
        with:
          root: fx-project
          only: dead-code,dupes
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined results limited to selected analyses
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results invalid"
            exit 1
          fi
          echo "top-level keys:"; jq -c 'keys' "$RESULTS"
          HEALTH=$(jq -r 'if (.health // null) == null then "absent" else "present" end' "$RESULTS")
          echo "health section: $HEALTH"
          if [ "$HEALTH" = "present" ]; then
            echo "FAIL: health section present although only=dead-code,dupes"
            exit 1
          fi
          echo "PASS"
