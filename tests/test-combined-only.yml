name: Test combined mode with only selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          root: tests/fixtures/js-project
          only: dead-code,health
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert issues numeric and dupes section absent
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          jq 'keys' "$RESULTS"
          if [ "$(jq -r '.dupes != null' "$RESULTS")" = "true" ]; then
            echo "FAIL: dupes section present despite only: dead-code,health"
            exit 1
          fi
          if [ "$(jq -r '(.check != null) or (.health != null)' "$RESULTS")" != "true" ]; then
            echo "FAIL: expected check or health section"
            exit 1
          fi
          echo "PASS"
