name: Test combined run with only selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/dead-code-project
          only: dead-code
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert dead-code findings reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          jq -e . "$F" > /dev/null || { echo "FAIL: results not valid JSON"; exit 1; }
          if ! grep -qE 'orphan|unusedHelper' "$F"; then
            echo "FAIL: expected dead-code findings in results"
            head -c 3000 "$F"
            exit 1
          fi
          echo "PASS"
