name: Test dupes (code duplication) analysis
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          dupes-mode: mild
          no-cache: 'true'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file exists
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          echo "PASS: results file exists"
