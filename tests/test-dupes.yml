name: Test dupes command detects clones
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.44.0
          fail-on-issues: 'false'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          min-lines: '5'
          min-tokens: '20'
      - name: Assert clone groups detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one clone group (format-a.ts / format-b.ts)"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e '.stats.clone_groups' "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing stats.clone_groups"
            exit 1
          fi
          echo "PASS"
