name: Test input validation rejects invalid configurations
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # audit rejects the generic baseline input; per-analysis baselines are allowed
      - id: audit_baseline
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          baseline: generic-baseline.json
          dead-code-baseline: dead-code-baseline.json
          health-baseline: health-baseline.json
          dupes-baseline: dupes-baseline.json
          gate: all
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      # invalid audit gate value
      - id: bad_gate
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          gate: sometimes
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      # invalid security gate value
      - id: bad_security_gate
        uses: .
        continue-on-error: true
        with:
          command: security
          root: tests/fixtures/simple-js
          format: json
          security-gate: everything
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      # non-numeric runtime coverage tuning values
      - id: bad_runtime_coverage
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          runtime-coverage: coverage-dir
          min-invocations-hot: lots
          min-observation-volume: '10'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      - id: bad_low_traffic
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          low-traffic-threshold: tiny
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      - id: bad_observation_volume
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          min-observation-volume: '-5'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      # coverage paths with an invalid max-crap value
      - id: bad_max_crap
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          coverage: coverage/coverage-final.json
          coverage-root: /ci/project
          max-crap: high
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      # missing changed-workspaces ref is a hard error (and conflicts with workspace)
      - id: bad_workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          workspace: no-such-package
          changed-workspaces: refs/heads/no-such-ref-fallow-test
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'

      - name: Assert every invalid configuration failed
        env:
          AUDIT_BASELINE: ${{ steps.audit_baseline.outcome }}
          BAD_GATE: ${{ steps.bad_gate.outcome }}
          BAD_SECURITY_GATE: ${{ steps.bad_security_gate.outcome }}
          BAD_RUNTIME_COVERAGE: ${{ steps.bad_runtime_coverage.outcome }}
          BAD_LOW_TRAFFIC: ${{ steps.bad_low_traffic.outcome }}
          BAD_OBSERVATION_VOLUME: ${{ steps.bad_observation_volume.outcome }}
          BAD_MAX_CRAP: ${{ steps.bad_max_crap.outcome }}
          BAD_WORKSPACES: ${{ steps.bad_workspaces.outcome }}
        run: |
          rc=0
          for name in AUDIT_BASELINE BAD_GATE BAD_SECURITY_GATE BAD_RUNTIME_COVERAGE \
                      BAD_LOW_TRAFFIC BAD_OBSERVATION_VOLUME BAD_MAX_CRAP BAD_WORKSPACES; do
            val="${!name}"
            echo "$name outcome: $val"
            if [ "$val" != "failure" ]; then
              echo "FAIL: $name expected outcome 'failure', got '$val'"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: all invalid configurations were rejected"
