name: Test health min-score and min-severity gates pass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # min-score 0 can never be undercut, min-severity critical is not reached
      # by the small fixture with default thresholds, so the step must succeed.
      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          min-score: '0'
          min-severity: critical
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert gates passed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
          PASSED: ${{ steps.action.outputs.gates-passed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: '$FAILED'"
          echo "gates-passed: '$PASSED'"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
