name: Test health command with min-score gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # min-score 0 can never be undercut, so the gate must pass.
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/js-project
          format: json
          min-score: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results contain a health score
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq 'keys' "$RESULTS"
          SCORE=$(jq -r '.health_score.score // .health_score // empty' "$RESULTS" 2>/dev/null | head -1)
          echo "score: $SCORE"
          if ! jq -e 'has("health_score") or (.. | objects | has("score"))' "$RESULTS" >/dev/null 2>&1; then
            echo "FAIL: min-score implies --score but no score found in results"
            exit 1
          fi
          echo "PASS"

      - name: Assert min-score gate did not fail
        env:
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "gates-failed: '$GATES_FAILED'"
          if echo "$GATES_FAILED" | grep -q 'score'; then
            echo "FAIL: min-score 0 gate failed"
            exit 1
          fi
          echo "PASS"
