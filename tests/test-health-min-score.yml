name: Test health with min-score gate (score never below 0)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D=fx-minscore
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-minscore","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          export function add(a, b) { return a + b; }
          console.log(add(1, 2));
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-minscore
          min-score: '0'
          artifacts-dir: fx-minscore-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs and forwarded flags
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: '$FAILED'"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file '$RESULTS'"; exit 1; }
          ARGS_FILE=fx-minscore-artifacts/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--min-score 0" "--complexity"; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected '$flag' in analysis args"
              exit 1
            fi
          done
          echo "PASS"
