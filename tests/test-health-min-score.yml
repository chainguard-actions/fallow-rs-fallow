name: Test health min-score gate passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          min-score: '0'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert min-score gate did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
          GATES_PASSED: ${{ steps.action.outputs.gates-passed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          echo "gates-passed: $GATES_PASSED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if echo "$GATES_FAILED" | grep -q 'health-min-score'; then
            echo "FAIL: health-min-score gate failed with min-score 0"
            exit 1
          fi
          echo "PASS"
