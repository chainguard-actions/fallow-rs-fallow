name: Test health min-score and min-severity gates (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          min-score: '0'
          min-severity: critical

      - name: Assert gate flags forwarded and results valid
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          cat fallow-analysis-args.sh
          grep -q -- '--min-score' fallow-analysis-args.sh || { echo "FAIL: --min-score not forwarded"; exit 1; }
          grep -q -- '--min-severity' fallow-analysis-args.sh || { echo "FAIL: --min-severity not forwarded"; exit 1; }
          grep -q -- '--complexity' fallow-analysis-args.sh || { echo "FAIL: --complexity not implied by min-score"; exit 1; }
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid: $RESULTS"
            exit 1
          fi
          echo "PASS"
