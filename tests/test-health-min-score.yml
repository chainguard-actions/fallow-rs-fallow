name: Test health min-score gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # min-score 0 can never be undercut, so the run must pass.
      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          min-score: '0'

      - name: Assert issues is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"

      - name: Assert health score is present in results
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! grep -qi 'score' "$RESULTS"; then
            echo "FAIL: expected a health score in results (min-score implies --score)"
            exit 1
          fi
          echo "PASS"

      - name: Assert min-score gate did not fail
        env:
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "gates-failed: '$FAILED'"
          if echo "$FAILED" | grep -q 'health-min-score'; then
            echo "FAIL: health-min-score gate failed with min-score 0"
            exit 1
          fi
          echo "PASS"
