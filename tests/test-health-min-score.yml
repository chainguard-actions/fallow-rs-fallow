name: Test health min-score gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          min-score: '0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert score computed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! grep -qi "score" "$RESULTS"; then
            echo "FAIL: expected a health score in results"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
