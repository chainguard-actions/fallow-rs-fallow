name: Test health min-score and min-severity gates pass on simple code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          min-score: '0'
          min-severity: critical
      - name: Assert gates did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "gates-failed: $GATES_FAILED"
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing or empty"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
