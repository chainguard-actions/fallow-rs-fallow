name: Test health gates min-score and min-severity (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/health-gates/src"
          mkdir -p "$P"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/health-gates/package.json" <<'EOF'
          {
            "name": "health-gates",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/health-gates
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          min-score: '0'
          min-severity: critical

      - name: Assert action succeeded with results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
