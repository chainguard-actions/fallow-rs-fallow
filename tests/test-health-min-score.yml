name: Test health command with min-score gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          min-score: '1'
          artifacts-dir: fallow-artifacts-min-score
      - name: Assert min-score gate passed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
