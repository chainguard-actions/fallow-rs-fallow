name: Test health min-score and min-severity gates pass
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          min-score: '0'
          min-severity: critical
      - name: Assert gates did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
          PASSED: ${{ steps.action.outputs.gates-passed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          echo "gates-passed: $PASSED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if echo "$FAILED" | grep -qE 'health-min-score|health-min-severity'; then
            echo "FAIL: min-score/min-severity gate failed unexpectedly"
            exit 1
          fi
          echo "PASS"
