name: Test health min-score gate that passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.46.0'
          fail-on-issues: 'false'
          min-score: '0'
          artifacts-dir: fallow-artifacts-min-score
      - name: Assert min-score run succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES gates-failed: '$FAILED'"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          case ",$FAILED," in
            *health-min-score*) echo "FAIL: min-score 0 should never fail"; exit 1 ;;
          esac
          echo "PASS"
