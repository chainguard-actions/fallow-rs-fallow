name: Test health min-score gate passes at zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          min-score: '0'

      - name: Assert score computed and gate passed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES gates-failed: '$GATES_FAILED'"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! jq -e '[.. | objects | select(has("score"))] | length > 0' "$RESULTS" > /dev/null; then
            echo "FAIL: expected a health score in results (min-score implies --score)"
            jq . "$RESULTS" | head -50
            exit 1
          fi
          echo "PASS"
