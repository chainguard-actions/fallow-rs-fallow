name: Test health min-score gate (passing threshold)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          min-score: '0'
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-min-score
      - name: Assert results contain a health score
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if ! grep -qi 'score' "$RESULTS"; then
            echo "FAIL: expected a score in results"
            exit 1
          fi
          echo "PASS"
