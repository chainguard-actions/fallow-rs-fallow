name: Test health min-score gate passes at zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          min-score: '0'
          version: '3.38.0'
          fail-on-issues: 'true'
          type-aware: 'false'
          format: json
      - name: Assert score computed and gate did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "gates-failed: $GATES_FAILED"
          if [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! grep -qi "score" "$RESULTS"; then
            echo "FAIL: expected a health score in results (min-score implies --score)"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
