name: Test health min-score gate passes at zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          min-score: '0'
      - name: Assert min-score gate did not fail
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
          GATES_PASSED: ${{ steps.action.outputs.gates-passed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          echo "gates-passed: $GATES_PASSED"
          case ",$GATES_FAILED," in
            *,health-min-score,*) echo "FAIL: health-min-score gate failed with min-score 0"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
