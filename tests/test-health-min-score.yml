name: Test health min-score gate with zero threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-min-score
          min-score: '0'
      - name: Assert success and results JSON
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: score can never be below 0"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
