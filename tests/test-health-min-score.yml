name: Test health min-score gate passes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          score: 'true'
          min-score: '0'
          artifacts-dir: fallow-artifacts-min-score
      - name: Assert health score in results
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "results: $RESULTS"
          echo "gates-failed: $FAILED"
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          if ! grep -qi "score" "$FILE"; then
            echo "FAIL: expected a health score in results"
            exit 1
          fi
          echo "PASS"
