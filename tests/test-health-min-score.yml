name: Test health min-score gate passes at zero
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          min-score: '0'
      - name: Assert score computed
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "results: $RESULTS gates-failed: $FAILED"
          if [ ! -s "$RESULTS" ]; then
            echo "FAIL: results missing"
            exit 1
          fi
          if ! grep -qi 'score' "$RESULTS"; then
            echo "FAIL: expected a health score in results"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
