name: Test health min-score and min-severity gates (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create simple fixture project
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src
          cat > fx/package.json <<'EOF'
          {"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > fx/src/index.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          console.log(add(1, 2));
          EOF

      - id: action
        uses: .
        with:
          root: fx
          command: health
          min-score: '0'
          min-severity: critical
          max-cyclomatic: '1000'
          max-cognitive: '1000'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action succeeded with numeric issues
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
