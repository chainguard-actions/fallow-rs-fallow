name: Test saving and loading baselines on the combined run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save-dead
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-save-dead
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          artifacts-dir: fallow-artifacts-save-health
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          artifacts-dir: fallow-artifacts-save-dupes
      - name: Assert baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for f in dead-code health dupes; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$f.json" ]; then
              echo "FAIL: $f baseline not written"
              exit 1
            fi
            jq empty "$GITHUB_WORKSPACE/fallow-baselines/$f.json" || { echo "FAIL: $f baseline invalid JSON"; exit 1; }
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          artifacts-dir: fallow-artifacts-load-baselines
      - name: Assert combined run used the baseline
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
          STALE: ${{ steps.action.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
