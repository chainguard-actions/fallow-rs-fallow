name: Test combined run with per-analysis baselines and skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$RUNNER_TEMP/fallow-combined"
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ runner.temp }}/fallow-combined/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ runner.temp }}/fallow-combined/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines saved
        run: |
          for f in health dupes; do
            if [ ! -f "$RUNNER_TEMP/fallow-combined/$f.json" ]; then
              echo "FAIL: $f baseline not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/clean-project
          version: '3.37.0'
          health-baseline: ${{ runner.temp }}/fallow-combined/health.json
          dupes-baseline: ${{ runner.temp }}/fallow-combined/dupes.json
          skip: architecture
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert combined run produced output
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
