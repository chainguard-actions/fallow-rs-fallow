name: Test combined run with skip and health/dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare output dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-out"
      - id: health-save
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-out/health-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - id: dupes-save
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-out/dupes-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-out"
          for f in health-baseline.json dupes-baseline.json; do
            [ -f "$GITHUB_WORKSPACE/fallow-out/$f" ] || { echo "FAIL: $f missing"; exit 1; }
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/dirty-project
          skip: architecture
          health-baseline: ${{ github.workspace }}/fallow-out/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/fallow-out/dupes-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert combined results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output not numeric"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid results JSON"; exit 1; }
          echo "PASS"
