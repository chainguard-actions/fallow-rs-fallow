name: Test combined run with saved dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/.fallow-test-baselines"
      - id: save-dead
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/.fallow-test-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          args: --save-baseline ${{ github.workspace }}/.fallow-test-baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/.fallow-test-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines written
        run: |
          ls -la "$GITHUB_WORKSPACE/.fallow-test-baselines"
          for f in dead-code health dupes; do
            if [ ! -f "$GITHUB_WORKSPACE/.fallow-test-baselines/$f.json" ]; then
              echo "FAIL: $f baseline not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ github.workspace }}/.fallow-test-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/.fallow-test-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/.fallow-test-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
          BPATH: ${{ steps.action.outputs.baseline-path }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-path: $BPATH"
          echo "results: $RESULTS"
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          if [ -n "$BPATH" ] && [[ "$BPATH" != *dead-code.json ]]; then
            echo "FAIL: baseline-path does not name the supplied baseline"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
