name: Test combined run with health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          save-baseline: ${{ github.workspace }}/health-baseline.json
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          save-baseline: ${{ github.workspace }}/dupes-baseline.json
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert baselines written
        run: |
          for f in health-baseline.json dupes-baseline.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: combined
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          health-baseline: ${{ github.workspace }}/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/dupes-baseline.json
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert combined run completed
        env:
          ISSUES: ${{ steps.combined.outputs.issues }}
          RESULTS: ${{ steps.combined.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
