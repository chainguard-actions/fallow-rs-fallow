name: Test combined run with health and dupes baselines and skip
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/fallow-health-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/fallow-dupes-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baselines saved
        env:
          HB: ${{ runner.temp }}/fallow-health-baseline.json
          DB: ${{ runner.temp }}/fallow-dupes-baseline.json
        run: |
          for f in "$HB" "$DB"; do
            if [ ! -s "$f" ]; then
              echo "FAIL: baseline not saved at $f"
              exit 1
            fi
          done
          echo "PASS: baselines saved"

      - id: action
        uses: .
        with:
          root: tests/fixtures/simple-js
          health-baseline: ${{ runner.temp }}/fallow-health-baseline.json
          dupes-baseline: ${{ runner.temp }}/fallow-dupes-baseline.json
          skip: architecture
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert combined run outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing at: $RESULTS"
            exit 1
          fi
          echo "PASS"
