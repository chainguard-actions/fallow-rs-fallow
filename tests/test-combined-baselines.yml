name: Test combined run with health/dupes baselines and only selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: health-save
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-health-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - id: dupes-save
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-dupes-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baselines saved
        run: |
          for f in fallow-health-baseline.json fallow-dupes-baseline.json; do
            [ -f "$GITHUB_WORKSPACE/$f" ] || { echo "FAIL: $f not written"; exit 1; }
            jq -e . "$GITHUB_WORKSPACE/$f" > /dev/null || { echo "FAIL: $f invalid JSON"; exit 1; }
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/dirty-project
          only: dead-code,dupes,health
          health-baseline: ${{ github.workspace }}/fallow-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/fallow-dupes-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          f="$RESULTS"; [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          [ -f "$f" ] || { echo "FAIL: results file missing"; exit 1; }
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
