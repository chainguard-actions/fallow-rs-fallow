name: Test combined run with only selector and health/dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-combined/health-baseline.json
          artifacts-dir: fallow-artifacts-combined-health
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-combined/dupes-baseline.json
          artifacts-dir: fallow-artifacts-combined-dupes
      - name: Assert per-analysis baselines saved
        run: |
          for f in health-baseline.json dupes-baseline.json; do
            F="$GITHUB_WORKSPACE/fallow-test-combined/$f"
            if [ ! -s "$F" ]; then
              echo "FAIL: $F not written"
              exit 1
            fi
            jq empty "$F" || { echo "FAIL: $F not valid JSON"; exit 1; }
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          only: dead-code,health,dupes
          health-baseline: ${{ github.workspace }}/fallow-test-combined/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/fallow-test-combined/dupes-baseline.json
          artifacts-dir: fallow-artifacts-combined-run
      - name: Assert combined results produced
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
