name: Test combined run with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: mkdir -p "$GITHUB_WORKSPACE/fallow-combined-baselines"
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-combined-baselines/health.json
          artifacts-dir: fallow-artifacts-cb-health
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-combined-baselines/dupes.json
          artifacts-dir: fallow-artifacts-cb-dupes
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-combined-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-cb-deadcode
      - name: Assert baselines saved
        run: |
          for f in health dupes dead-code; do
            F="$GITHUB_WORKSPACE/fallow-combined-baselines/$f.json"
            if [ ! -s "$F" ]; then
              echo "FAIL: $F not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-combined-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-combined-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-combined-baselines/dupes.json
          artifacts-dir: fallow-artifacts-cb-combined
      - name: Assert combined baselined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
