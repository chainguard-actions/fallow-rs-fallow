name: Test combined run with health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-health-baseline.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-dupes-baseline.json
      - name: Assert baselines saved
        run: |
          for f in fallow-health-baseline.json fallow-dupes-baseline.json; do
            if [ ! -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          health-baseline: ${{ github.workspace }}/fallow-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/fallow-dupes-baseline.json
      - name: Assert combined run used baselines
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
