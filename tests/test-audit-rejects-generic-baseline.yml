name: Test audit command rejects the generic baseline input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          rm -rf sample-app && mkdir -p sample-app/src
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          echo "export function main() { return 1; }" > sample-app/src/index.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.34.0'
          root: sample-app
          command: audit
          gate: all
          baseline: generic-baseline.json
          dead-code-baseline: dead-code-baseline.json
          health-baseline: health-baseline.json
          dupes-baseline: dupes-baseline.json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert audit refused the generic baseline input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME verdict: '$VERDICT' issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when baseline is passed to audit"
            exit 1
          fi
          if [ -n "$VERDICT" ] || [ -n "$ISSUES" ]; then
            echo "FAIL: expected no verdict/issues when validation fails"
            exit 1
          fi
          echo "PASS"
