name: Test audit rejects the generic baseline input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-reject
          baseline: fallow-baselines/dead-code.json
          dead-code-baseline: fallow-baselines/dead-code.json
          health-baseline: fallow-baselines/health.json
          dupes-baseline: fallow-baselines/dupes.json
          gate: all
          worsened: warn
      - name: Assert action failed with no analysis outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES' verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected audit with baseline input to fail"
            exit 1
          fi
          if [ -n "$ISSUES" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: no analysis should have run"
            exit 1
          fi
          echo "PASS"
