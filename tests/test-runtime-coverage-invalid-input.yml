name: Test runtime coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project and V8 coverage dir
        run: |
          rm -rf sample-app && mkdir -p sample-app/src sample-app/v8-coverage
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          echo "export function main() { return 1; }" > sample-app/src/index.js
          echo '{"result":[]}' > sample-app/v8-coverage/coverage-1.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          runtime-coverage: sample-app/v8-coverage
          min-invocations-hot: 'not-a-number'
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid min-invocations-hot"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation fails"
            exit 1
          fi
          echo "PASS"
