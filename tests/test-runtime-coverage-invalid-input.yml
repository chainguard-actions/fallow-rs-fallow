name: Test runtime-coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D"
          mkdir -p "$D/src" "$D/v8-coverage"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          echo 'export const x = 1;' > "$D/src/index.ts"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fallow-test-sample
          runtime-coverage: ${{ github.workspace }}/fallow-test-sample/v8-coverage
          min-invocations-hot: 'not-a-number'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer min-invocations-hot"
            exit 1
          fi
          echo "PASS"
