name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First run: save a baseline
      - id: save
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline.json
          dead-code-baseline: ''
          health-baseline: ''
          dupes-baseline: ''

      - name: Assert save step ran
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "save outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Second run: load the baseline (may not exist if first run failed, that's OK)
      - id: load
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          baseline: /tmp/fallow-baseline.json

      - name: Assert load step ran
        env:
          OUTCOME: ${{ steps.load.outcome }}
        run: |
          echo "load outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: load step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
