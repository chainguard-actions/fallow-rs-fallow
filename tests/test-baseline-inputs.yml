name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-project/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      - name: Run dead-code with save-baseline and save-regression-baseline
        id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline.json
          save-regression-baseline: /tmp/fallow-regression-baseline.json
          dead-code-baseline: ''
          health-baseline: ''
          dupes-baseline: ''
          regression-baseline: ''
          baseline: ''
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
