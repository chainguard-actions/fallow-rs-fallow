name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create dummy baseline files
        run: |
          echo '{}' > /tmp/dead-code-baseline.json
          echo '{}' > /tmp/health-baseline.json
          echo '{}' > /tmp/dupes-baseline.json
          echo '{}' > /tmp/regression-baseline.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          fail-on-issues: 'false'
          baseline: /tmp/dead-code-baseline.json
          save-baseline: /tmp/saved-baseline.json
          dead-code-baseline: /tmp/dead-code-baseline.json
          health-baseline: /tmp/health-baseline.json
          dupes-baseline: /tmp/dupes-baseline.json
          regression-baseline: /tmp/regression-baseline.json
          save-regression-baseline: /tmp/saved-regression-baseline.json
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
