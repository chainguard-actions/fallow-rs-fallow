name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First run: save a baseline
      - id: save-run
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline.json
          save-regression-baseline: /tmp/fallow-regression-baseline.json
          auto-changed-since: 'false'

      - name: Assert save-baseline run completed
        env:
          OUTCOME: ${{ steps.save-run.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Second run: load baseline and regression-baseline
      - id: baseline-run
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          baseline: /tmp/fallow-baseline.json
          regression-baseline: /tmp/fallow-regression-baseline.json
          dead-code-baseline: /tmp/fallow-baseline.json
          health-baseline: /tmp/fallow-baseline.json
          dupes-baseline: /tmp/fallow-baseline.json
          auto-changed-since: 'false'

      - name: Assert baseline-run completed
        env:
          OUTCOME: ${{ steps.baseline-run.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
