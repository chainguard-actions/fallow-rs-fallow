name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty baseline files
        run: |
          echo '{}' > "$GITHUB_WORKSPACE/.fallow-baseline.json"
          echo '{}' > "$GITHUB_WORKSPACE/.fallow-regression-baseline.json"
      - id: action
        uses: .
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          fail-on-stale-baseline: 'false'
          baseline: '.fallow-baseline.json'
          regression-baseline: '.fallow-regression-baseline.json'
          auto-changed-since: 'false'
          threads: '2'
      - name: Assert baseline outputs are set
        env:
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "baseline-path: $BASELINE_PATH"
          echo "issues: $ISSUES"
          echo "PASS: dead-code command with baseline inputs completed"
