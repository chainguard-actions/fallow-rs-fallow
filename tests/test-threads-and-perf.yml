name: Test threads and performance inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-threads-project
          cat > /tmp/fallow-threads-project/package.json <<'EOF'
          {
            "name": "threads-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-threads-project/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
      - name: Run with threads input
        id: with-threads
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-threads-project
          format: json
          fail-on-issues: 'false'
          threads: '2'
          auto-changed-since: 'false'
      - name: Assert with-threads step ran
        env:
          OUTCOME: ${{ steps.with-threads.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: threads step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
