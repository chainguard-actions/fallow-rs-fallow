name: Test baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written at $F"
            exit 1
          fi
          cat "$F"
          if ! jq empty "$F"; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          echo "PASS"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline suppressed all known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED: ${{ github.workspace }}/fallow-test-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after loading baseline, got '$ISSUES'"
            exit 1
          fi
          if [ "$BPATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path expected '$EXPECTED'"
            exit 1
          fi
          echo "PASS"
