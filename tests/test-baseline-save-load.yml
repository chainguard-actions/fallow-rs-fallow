name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-save-baseline
      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          cat "$F"
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-load-baseline
      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "saved run issues: $SAVED_ISSUES"
          echo "baseline run issues: $ISSUES"
          echo "baseline entries: $ENTRIES stale: $STALE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -ge "$SAVED_ISSUES" ] && [ "$SAVED_ISSUES" -gt 0 ]; then
            echo "FAIL: baseline did not reduce issue count"
            exit 1
          fi
          echo "PASS"
