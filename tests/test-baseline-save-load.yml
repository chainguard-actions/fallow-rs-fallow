name: Test dead-code baseline save then load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare output dir
        run: mkdir -p fallow-out-baseline

      - id: save
        uses: .
        with:
          command: dead-code
          save-baseline: fallow-out-baseline/dead-code-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-baseline

      - name: Assert baseline file was saved
        run: |
          ls -la fallow-out-baseline
          if [ ! -s fallow-out-baseline/dead-code-baseline.json ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty fallow-out-baseline/dead-code-baseline.json || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          baseline: fallow-out-baseline/dead-code-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-baseline

      - name: Assert baseline outputs
        env:
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          GATE_TRIPS: ${{ steps.load.outputs.baseline-gate-trips }}
        run: |
          echo "baseline-path: $BASELINE_PATH"
          echo "issues: $ISSUES"
          echo "baseline-gate-trips: $GATE_TRIPS"
          if [ "$BASELINE_PATH" != "fallow-out-baseline/dead-code-baseline.json" ]; then
            echo "FAIL: baseline-path does not echo the baseline input"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          # A baseline freshly saved from the same code can only suppress findings.
          if [ "$ISSUES" -gt "$SAVE_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues ($ISSUES) than the saving run ($SAVE_ISSUES)"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-baseline
