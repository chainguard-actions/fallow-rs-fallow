name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-save-baseline
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
      - name: Assert baseline file saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          cat "$f"; echo
          jq empty "$f" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          artifacts-dir: fallow-artifacts-load-baseline
          type-aware: 'false'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-stale-baseline: 'true'
      - name: Assert baseline suppresses known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against the freshly saved baseline"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          echo "PASS"
