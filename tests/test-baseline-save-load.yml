name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-baselines/dead-code-baseline.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-test-baselines/dead-code-baseline.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: baseline file $F not written"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline not valid JSON"; exit 1; }
          cat "$F"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-test-baselines/dead-code-baseline.json
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baseline suppressed known issues
        env:
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues before baseline: $SAVE_ISSUES"
          echo "issues with baseline: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! [[ "$SAVE_ISSUES" =~ ^[0-9]+$ ]] || [ "$SAVE_ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues before baseline"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues when comparing against the saved baseline"
            exit 1
          fi
          echo "PASS"
