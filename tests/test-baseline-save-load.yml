name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-save-baseline
      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline not saved at $f"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'true'
          fail-on-stale-baseline: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-load-baseline
      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against fresh baseline"
            exit 1
          fi
          echo "PASS"
