name: Test baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-project/index.js <<'EOF'
          export function usedFunction() {
            return 42;
          }
          export function unusedFunction() {
            return 0;
          }
          EOF
      - id: save-baseline
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline.json
          auto-changed-since: 'false'
      - name: Assert save-baseline step ran
        env:
          OUTCOME: ${{ steps.save-baseline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: load-baseline
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          baseline: /tmp/fallow-baseline.json
          auto-changed-since: 'false'
      - name: Assert load-baseline step ran
        env:
          OUTCOME: ${{ steps.load-baseline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
