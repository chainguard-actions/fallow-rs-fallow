name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Remove stale baseline
        run: rm -f "$GITHUB_WORKSPACE/fallow-test-baseline.json"

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline file not written at $f"
            exit 1
          fi
          if ! jq empty "$f"; then
            echo "FAIL: baseline file is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline suppresses all known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES entries: '$ENTRIES' stale: '$STALE'"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against freshly saved baseline"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: fresh baseline should have no stale entries"
            exit 1
          fi
          echo "PASS"
