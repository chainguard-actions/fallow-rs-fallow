name: Test dead-code baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-dc-baseline.json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dc-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not created at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline file is not valid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS: baseline saved"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          baseline: ${{ github.workspace }}/fallow-dc-baseline.json

      - name: Assert baseline was applied
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: all findings should be suppressed by the baseline, got $ISSUES"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric: '$ENTRIES'"
            exit 1
          fi
          echo "PASS"
