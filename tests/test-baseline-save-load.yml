name: Test dead-code save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D=fx-baseline
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-baseline","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(3));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n + 1; }
          export function unusedHelper() { return 42; }
          EOF
          cat > "$D/src/orphan.js" <<'EOF'
          export const orphan = 1;
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-baseline
          save-baseline: ${{ github.workspace }}/fx-baseline-data/baseline.json
          artifacts-dir: fx-baseline-artifacts-save
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fx-baseline-data/baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline not saved at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$F"
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: fx-baseline
          baseline: ${{ github.workspace }}/fx-baseline-data/baseline.json
          artifacts-dir: fx-baseline-artifacts-load
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline comparison outputs
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BEFORE: ${{ steps.save.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          EXPECTED: ${{ github.workspace }}/fx-baseline-data/baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against fresh baseline, got '$ISSUES'"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path '$BASELINE_PATH' != '$EXPECTED'"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! echo "$ENTRIES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: baseline-entries not numeric: '$ENTRIES'"
            exit 1
          fi
          echo "PASS"
