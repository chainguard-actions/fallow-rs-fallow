name: Test saving and loading baselines (incl. regression baseline)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project
        run: |
          P="$GITHUB_WORKSPACE/fx-baseline-proj"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-baseline-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function neverUsed() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-baseline-proj
          save-baseline: ${{ github.workspace }}/fx-baseline-proj/dead-code-baseline.json
          save-regression-baseline: ${{ github.workspace }}/fx-baseline-proj/regression-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline files were written
        run: |
          for f in dead-code-baseline.json regression-baseline.json; do
            path="$GITHUB_WORKSPACE/fx-baseline-proj/$f"
            if [ ! -f "$path" ]; then
              echo "FAIL: $path not created"
              exit 1
            fi
            if ! jq empty "$path"; then
              echo "FAIL: $path is not valid JSON"
              exit 1
            fi
            echo "PASS: $f exists"
          done

      - id: load
        uses: .
        with:
          command: dead-code
          root: fx-baseline-proj
          baseline: ${{ github.workspace }}/fx-baseline-proj/dead-code-baseline.json
          regression-baseline: ${{ github.workspace }}/fx-baseline-proj/regression-baseline.json
          format: json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed all known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/fx-baseline-proj/dead-code-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after loading baseline"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path should echo the baseline input"
            exit 1
          fi
          echo "PASS"
