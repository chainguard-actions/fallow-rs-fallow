name: Test dead-code save-baseline then baseline (and regression baselines)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D" "$GITHUB_WORKSPACE/fallow-test-baselines"
          mkdir -p "$D/src" "$GITHUB_WORKSPACE/fallow-test-baselines"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          cat > "$D/src/index.ts" <<'EOF'
          import { used } from './util';
          export function main(): number {
            return used();
          }
          main();
          EOF
          cat > "$D/src/util.ts" <<'EOF'
          export function used(): number {
            return 1;
          }
          export function unusedHelper(): number {
            return 2;
          }
          EOF
          cat > "$D/src/orphan.ts" <<'EOF'
          export const orphan = 42;
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-test-sample
          save-baseline: ${{ github.workspace }}/fallow-test-baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-test-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline files were written
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-test-baselines"
          for f in dead-code.json regression.json; do
            p="$GITHUB_WORKSPACE/fallow-test-baselines/$f"
            if [ ! -s "$p" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
            if ! jq empty "$p"; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: fallow-test-sample
          baseline: ${{ github.workspace }}/fallow-test-baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-test-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline run succeeded
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          OUTCOME: ${{ steps.load.outcome }}
        run: |
          echo "outcome: $OUTCOME save issues: $SAVE_ISSUES load issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if echo "$SAVE_ISSUES" | grep -qE '^[0-9]+$' && [ "$ISSUES" -gt "$SAVE_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues ($ISSUES) than the saved run ($SAVE_ISSUES)"
            exit 1
          fi
          echo "PASS"
