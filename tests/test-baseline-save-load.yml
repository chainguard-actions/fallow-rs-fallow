name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-baseline.json"
          if [ ! -f "$f" ] || ! jq empty "$f"; then
            echo "FAIL: baseline file missing or invalid"
            exit 1
          fi
          cat "$f"
          echo "PASS"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline suppresses known issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.load.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if ! [[ "$AFTER" =~ ^[0-9]+$ ]] || ! [[ "$BEFORE" =~ ^[0-9]+$ ]]; then
            echo "FAIL: non-numeric issue counts"
            exit 1
          fi
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "FAIL: baseline run reported more issues than the original"
            exit 1
          fi
          echo "PASS"
