name: Test save and load dead-code baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert baseline files saved
        run: |
          for f in "$GITHUB_WORKSPACE/fallow-baseline.json" "$GITHUB_WORKSPACE/fallow-regression.json"; do
            echo "checking $f"
            if [ ! -f "$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
            if ! jq -e . "$f" > /dev/null; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-load
          baseline: ${{ github.workspace }}/fallow-baseline.json
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
      - name: Assert baseline loaded
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED: ${{ github.workspace }}/fallow-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path should be '$EXPECTED'"
            exit 1
          fi
          echo "PASS"
