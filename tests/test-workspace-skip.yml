name: Test combined run scoped to a workspace with skipped analyses
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/monorepo
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          workspace: pkg-a
          skip: dupes,health
      - name: Assert scoped results produced
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q "pkg-b/src" "$RESULTS"; then
            echo "FAIL: findings from pkg-b leaked into pkg-a scoped output"
            exit 1
          fi
          echo "PASS"
