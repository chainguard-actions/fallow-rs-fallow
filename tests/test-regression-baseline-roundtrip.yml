name: Test save-regression-baseline then regression-baseline gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src"
          cat > "$S/package.json" <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$S/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$S/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          rm -f "$GITHUB_WORKSPACE/fallow-regression-baseline.json"

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          save-regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert regression baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not written at $F"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          regression-baseline: ${{ github.workspace }}/fallow-regression-baseline.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert no regression on unchanged tree
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: regression gate failed on an unchanged tree"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          echo "PASS"
