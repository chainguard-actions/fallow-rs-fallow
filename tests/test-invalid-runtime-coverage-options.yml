name: Test non-integer min-invocations-hot is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          coverage: tests/fixtures/coverage-final.json
          coverage-root: /build
          runtime-coverage: tests/fixtures/runtime-coverage
          min-invocations-hot: 'many'
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-rc
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer min-invocations-hot"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
