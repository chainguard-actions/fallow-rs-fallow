name: Test gate and security-gate inputs
on:
  workflow_dispatch:
jobs:
  test-audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: .
          format: json
          fail-on-issues: 'false'
          gate: new-only
          auto-changed-since: 'false'

      - name: Assert action ran with gate input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GATE_OUT: ${{ steps.action.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gate: $GATE_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with gate input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: security
          root: .
          format: json
          fail-on-issues: 'false'
          security-gate: new
          auto-changed-since: 'false'

      - name: Assert action ran with security-gate input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with security-gate input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
