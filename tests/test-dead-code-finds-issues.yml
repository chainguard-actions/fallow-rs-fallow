name: Test dead-code finds unused code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/act-fixtures/sample-project
          fail-on-issues: 'false'
          artifacts-dir: fallow-out-deadcode
      - name: Assert issues count is positive
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused code issue"
            exit 1
          fi
          echo "PASS"
      - name: Assert results file is valid JSON and mentions the orphan file
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ "$RESULTS" != "fallow-out-deadcode/fallow-results.json" ]; then
            echo "FAIL: unexpected results path"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq -e '.total_issues >= 1' "$RESULTS" || { echo "FAIL: total_issues < 1"; exit 1; }
          if ! grep -q 'orphan' "$RESULTS"; then
            echo "FAIL: orphan.ts not reported"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
      - name: Assert verdict is empty for non-audit command
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          CFU: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "verdict: '$VERDICT' changed-files-unavailable: '$CFU'"
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty"
            exit 1
          fi
          if [ "$CFU" != "false" ] && [ "$CFU" != "true" ]; then
            echo "FAIL: changed-files-unavailable should be true/false"
            exit 1
          fi
          echo "PASS"
