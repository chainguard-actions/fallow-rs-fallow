name: Test dead-code finds unused code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-deadcode
      - name: Assert issues detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one dead-code issue (orphan.ts / unused export)"
            exit 1
          fi
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output empty"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ ! -s "$FILE" ]; then
            echo "FAIL: results file $FILE missing or empty"
            exit 1
          fi
          if ! jq empty "$FILE"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          if ! grep -q "orphan" "$FILE"; then
            echo "FAIL: expected orphan.ts to be reported"
            cat "$FILE"
            exit 1
          fi
          echo "PASS"
