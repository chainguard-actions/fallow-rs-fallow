name: Test health min-score and min-severity gates (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          max-cyclomatic: '1000'
          max-cognitive: '1000'
          min-score: '0'
          min-severity: critical
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results produced
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          echo "PASS"
