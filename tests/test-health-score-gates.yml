name: Test health command with min-score and min-severity gates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          mkdir -p proj/src
          cat > proj/package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js","type":"module"}
          EOF
          cat > proj/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > proj/src/math.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: proj
          min-score: '0'
          min-severity: critical
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert run succeeded with readable results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "gates-failed: '$FAILED'"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
