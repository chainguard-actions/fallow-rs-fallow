name: Test changed-workspaces input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-test-cw/packages/web
          cat > /tmp/fallow-test-cw/package.json <<'EOF'
          {
            "name": "test-cw-root",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-test-cw/packages/web/package.json <<'EOF'
          {
            "name": "web",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-cw/packages/web/index.js <<'EOF'
          export function webFunc() { return 'web'; }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-cw
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD~1'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # changed-workspaces may fail if git history is insufficient or no workspaces changed
          # but the action should have run (not skipped)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
