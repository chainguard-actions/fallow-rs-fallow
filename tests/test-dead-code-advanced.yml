name: Test dead-code advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS file for analysis
        run: |
          mkdir -p /tmp/fallow-dc-project
          cat > /tmp/fallow-dc-project/index.js << 'EOF'
          export function used() { return 'used'; }
          function unused() { return 'unused'; }
          EOF
          cat > /tmp/fallow-dc-project/package.json << 'EOF'
          { "name": "dc-project", "version": "1.0.0" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-dc-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          changed-since: 'HEAD~1'
          issue-types: 'unused-exports,unused-files'
          save-regression-baseline: /tmp/fallow-regression-baseline.json
          regression-baseline: /tmp/fallow-regression-baseline.json
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
