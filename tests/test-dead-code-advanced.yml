name: Test dead-code advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for dead-code analysis
        run: |
          mkdir -p /tmp/fallow-dc-test
          cat > /tmp/fallow-dc-test/package.json <<'EOF'
          {
            "name": "dc-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dc-test/index.js <<'EOF'
          export function used() { return 42; }
          export function alsoUnused() { return 0; }
          EOF

      - name: Create regression baseline directory
        run: mkdir -p /tmp/fallow-dc-baselines

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-dc-test
          format: json
          fail-on-issues: 'false'
          issue-types: 'unused-exports,unused-files'
          changed-since: 'HEAD'
          save-regression-baseline: /tmp/fallow-dc-baselines/regression.json
          regression-baseline: /tmp/fallow-dc-baselines/regression.json
          auto-changed-since: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
