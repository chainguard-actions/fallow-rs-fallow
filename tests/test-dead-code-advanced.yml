name: Test dead-code advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          issue-types: 'unused-exports,unused-files'
          changed-since: 'HEAD~1'
          save-baseline: ''
          baseline: ''
          regression-baseline: ''
          save-regression-baseline: ''
          threads: '2'
          config: ''
          skip: ''
          only: ''
          format: 'json'
          annotations: 'false'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on this repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
