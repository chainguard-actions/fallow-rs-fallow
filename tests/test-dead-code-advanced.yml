name: Test dead-code advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project and config file
        run: |
          mkdir -p /tmp/fallow-dc-project
          cat > /tmp/fallow-dc-project/index.js << 'EOF'
          export function used() { return 'used'; }
          export function notUsed() { return 'not used'; }
          EOF
          cat > /tmp/fallow-dc-project/package.json << 'EOF'
          { "name": "dc-test", "version": "1.0.0", "type": "module" }
          EOF
          # Create a fallow config file
          cat > /tmp/fallow-dc-project/.fallowrc.json << 'EOF'
          {
            "entry": ["index.js"],
            "ignore": []
          }
          EOF

      - id: action-issue-types
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-dc-project
          config: /tmp/fallow-dc-project/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          issue-types: 'unused-exports,unused-files'
          threads: '2'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert issue-types/config/threads step ran
        env:
          OUTCOME: ${{ steps.action-issue-types.outcome }}
          ISSUES: ${{ steps.action-issue-types.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with issue-types/config/threads (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Create a JS project for only/skip test
        run: |
          mkdir -p /tmp/fallow-only-project
          cat > /tmp/fallow-only-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-only-project/package.json << 'EOF'
          { "name": "only-test", "version": "1.0.0", "type": "module" }
          EOF

      - id: action-only
        uses: .
        continue-on-error: true
        with:
          root: /tmp/fallow-only-project
          format: json
          fail-on-issues: 'false'
          only: 'dead-code'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert only step ran
        env:
          OUTCOME: ${{ steps.action-only.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with only input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-skip
        uses: .
        continue-on-error: true
        with:
          root: /tmp/fallow-only-project
          format: json
          fail-on-issues: 'false'
          skip: 'dupes,health'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert skip step ran
        env:
          OUTCOME: ${{ steps.action-skip.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with skip input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
