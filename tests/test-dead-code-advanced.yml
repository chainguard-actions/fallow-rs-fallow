name: Test dead-code advanced inputs
on:
  workflow_dispatch:
jobs:
  test-issue-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/js-dc-adv/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-dc-adv/package.json" <<'EOF'
          {
            "name": "test-dc-adv-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-dc-adv/src/index.js" <<'EOF'
          export function usedFunction() {
            return 42;
          }
          export function unusedFunction() {
            return 'never called';
          }
          usedFunction();
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/js-dc-adv
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          issue-types: 'unused-exports,unused-files'
          config: ''
          baseline: ''
          save-baseline: ''
          regression-baseline: ''
          save-regression-baseline: ''
          threads: '2'
          no-cache: 'true'

      - name: Assert action ran (dead-code advanced inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected on minimal fixture)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-only-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/js-only-skip/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-only-skip/package.json" <<'EOF'
          {
            "name": "test-only-skip-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-only-skip/src/index.js" <<'EOF'
          export function usedFunction() {
            return 42;
          }
          usedFunction();
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ''
          root: tests/fixtures/js-only-skip
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          only: 'dead-code'
          skip: 'dupes'
          threads: '2'
          no-cache: 'true'

      - name: Assert action ran (only/skip inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected on minimal fixture)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
