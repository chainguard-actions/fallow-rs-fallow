name: Test changed-workspaces and regression baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-regression
          cat > /tmp/fallow-regression/package.json <<'EOF'
          {
            "name": "regression-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-regression/index.js <<'EOF'
          export function usedFn() { return 1; }
          export function unusedFn() { return 2; }
          EOF
      - id: save-regression
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression
          format: json
          fail-on-issues: 'false'
          save-regression-baseline: /tmp/regression-baseline.json
          auto-changed-since: 'false'
      - name: Assert save-regression step ran
        env:
          OUTCOME: ${{ steps.save-regression.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: load-regression
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression
          format: json
          fail-on-issues: 'false'
          regression-baseline: /tmp/regression-baseline.json
          auto-changed-since: 'false'
      - name: Assert load-regression step ran
        env:
          OUTCOME: ${{ steps.load-regression.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Create a minimal monorepo for changed-workspaces
        run: |
          mkdir -p /tmp/fallow-cw-mono/packages/app
          cat > /tmp/fallow-cw-mono/package.json <<'EOF'
          {
            "name": "cw-mono",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-cw-mono/packages/app/package.json <<'EOF'
          {
            "name": "app",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-cw-mono/packages/app/index.js <<'EOF'
          export function appMain() { return 'app'; }
          EOF
      - id: changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-cw-mono
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD~1'
          auto-changed-since: 'false'
      - name: Assert changed-workspaces step ran
        env:
          OUTCOME: ${{ steps.changed-workspaces.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
