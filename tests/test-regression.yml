name: Test regression baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project for regression baseline test
        run: |
          mkdir -p /tmp/fallow-regression-project
          cat > /tmp/fallow-regression-project/index.js << 'EOF'
          export function used() { return 'used'; }
          export function alsoUnused() { return 'also unused'; }
          EOF
          cat > /tmp/fallow-regression-project/package.json << 'EOF'
          { "name": "regression-test", "version": "1.0.0", "type": "module" }
          EOF
          mkdir -p /tmp/fallow-regression-baselines

      - id: action-save-regression-baseline
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression-project
          format: json
          fail-on-issues: 'false'
          save-regression-baseline: /tmp/fallow-regression-baselines/regression.json
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert save-regression-baseline step ran
        env:
          OUTCOME: ${{ steps.action-save-regression-baseline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with save-regression-baseline (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Create a stub regression baseline file for loading
        run: |
          echo '{}' > /tmp/fallow-regression-baselines/stub.json

      - id: action-regression-baseline
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-regression-project
          format: json
          fail-on-issues: 'false'
          fail-on-regression: 'false'
          regression-baseline: /tmp/fallow-regression-baselines/stub.json
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert regression-baseline step ran
        env:
          OUTCOME: ${{ steps.action-regression-baseline.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with regression-baseline (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
