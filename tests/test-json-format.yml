name: Test JSON format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dead-code
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          artifacts-dir: fallow-test-artifacts

      - name: Assert results file is valid JSON with expected structure
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          # Validate JSON structure
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          # Check that total_issues field exists (dead-code command)
          TOTAL=$(jq -r '.total_issues // empty' "$RESULTS")
          echo "total_issues: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "FAIL: results JSON missing total_issues field"
            exit 1
          fi
          echo "PASS: results file has valid JSON structure with total_issues=$TOTAL"

      - name: Assert artifacts directory was used
        run: |
          echo "Checking artifacts directory fallow-test-artifacts"
          if [ ! -d "fallow-test-artifacts" ]; then
            echo "FAIL: artifacts directory was not created"
            exit 1
          fi
          echo "PASS: artifacts directory exists"
          ls -la fallow-test-artifacts/ || true
