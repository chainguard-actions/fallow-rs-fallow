name: Test combined run limited with only and changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          only: dead-code
          changed-since: HEAD
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"

      - name: Assert args include --only and --changed-since
        run: |
          f="$GITHUB_WORKSPACE/fallow-analysis-args.sh"
          if [ ! -f "$f" ]; then
            echo "NOTE: args file not found, skipping"
            exit 0
          fi
          cat "$f"
          grep -q -- '--only' "$f" || { echo "FAIL: --only missing"; exit 1; }
          grep -q -- '--changed-since' "$f" || { echo "FAIL: --changed-since missing"; exit 1; }
          echo "PASS"
