name: Test dead-code restricted to unused-files with custom config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          config: ${{ github.workspace }}/tests/fixtures/fallow-config/.fallowrc.json
          version: '3.46.0'
          fail-on-issues: 'false'
          issue-types: unused-files
          artifacts-dir: fallow-artifacts-issue-types
      - name: Assert only unused files reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused file"
            exit 1
          fi
          if ! grep -q "orphan" "$RESULTS"; then
            echo "FAIL: expected orphan.ts to be reported as unused"
            exit 1
          fi
          if grep -q "neverCalledHelper" "$RESULTS"; then
            echo "FAIL: unused exports should be filtered out by issue-types"
            exit 1
          fi
          echo "PASS"
