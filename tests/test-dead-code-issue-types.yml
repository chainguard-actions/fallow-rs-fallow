name: Test dead-code with issue-types filter and explicit config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          config: ${{ github.workspace }}/tests/fixtures/fallow-config/.fallowrc.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-issue-types
          issue-types: unused-files
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          ARGS_FILE=fallow-out-issue-types/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          grep -q -- "--unused-files" "$ARGS_FILE" || { echo "FAIL: --unused-files not forwarded"; exit 1; }
          grep -q -- "--config" "$ARGS_FILE" || { echo "FAIL: --config not forwarded"; exit 1; }
          echo "PASS"
