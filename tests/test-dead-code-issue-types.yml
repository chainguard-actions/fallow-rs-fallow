name: Test dead-code with issue-types, explicit config and changed-since
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project with an unused export and a config file
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/dead-code-types"
          mkdir -p "$P/src"
          echo '{"name":"dead-code-types","version":"1.0.0","type":"module","main":"src/index.js","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function neverUsed() { return 2; }
          EOF
          echo '{}' > "$P/.fallowrc.json"

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-fixtures/dead-code-types
          config: fallow-fixtures/dead-code-types/.fallowrc.json
          format: json
          issue-types: unused-exports, unused-files
          changed-since: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output and results file
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
