name: Test dead-code command filtered by issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dead-code
          issue-types: 'unused-files, unused-exports'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-issue-types

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert issue-type flags were forwarded (whitespace trimmed)
        run: |
          ARGS_FILE=fallow-out-issue-types/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--unused-files" "--unused-exports"; do
            if ! grep -qE -- "(^| |\()${flag}( |\))" "$ARGS_FILE"; then
              echo "FAIL: missing '$flag'"
              exit 1
            fi
          done
          if grep -qF -- "--unused-deps" "$ARGS_FILE"; then
            echo "FAIL: unexpected --unused-deps flag"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-issue-types
