name: Test dead-code command with issue-types and an explicit config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export and a config file
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/issue-types-project"
          mkdir -p "$P/src"
          echo '{"name":"issue-types-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          echo '{}' > "$P/.fallowrc.json"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/issue-types-project
          config: tests/fixtures/issue-types-project/.fallowrc.json
          format: json
          issue-types: unused-exports,unused-files
          threads: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
