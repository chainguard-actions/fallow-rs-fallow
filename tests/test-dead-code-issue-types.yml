name: Test dead-code with issue-types, config file and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with unused code and a config file
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/dc-types"
          mkdir -p "$R/src"
          cat > "$R/package.json" <<'EOF'
          {
            "name": "dc-types",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$R/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$R/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          cat > "$R/src/orphan.js" <<'EOF'
          export const orphan = 3;
          EOF
          echo '{}' > "$R/.fallowrc.json"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dc-types
          config: ${{ github.workspace }}/tests/fixtures/dc-types/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          issue-types: unused-exports,unused-files
          threads: '2'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
