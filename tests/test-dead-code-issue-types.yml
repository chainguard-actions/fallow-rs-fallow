name: Test dead-code with issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with an unused file and export
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src
          echo '{"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}' > fx/package.json
          cat > fx/src/index.js <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > fx/src/lib.js <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF
          echo 'export const orphan = 3;' > fx/src/orphan.js

      - id: action
        uses: .
        with:
          root: fx
          command: dead-code
          issue-types: 'unused-files, unused-exports'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused file/export"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
