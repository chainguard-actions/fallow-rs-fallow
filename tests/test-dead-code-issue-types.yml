name: Test dead-code with issue-types, config file and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export and a config file
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/issue-types-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "issue-types-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF
          echo '{}' > "$P/.fallowrc.json"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/issue-types-project
          config: ${{ github.workspace }}/tests/fixtures/issue-types-project/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          threads: '2'
          issue-types: 'unused-exports, unused-files'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON: $RESULTS"
            exit 1
          fi
          echo "PASS"
