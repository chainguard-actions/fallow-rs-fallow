name: Test baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS file to analyze
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
      - name: Create empty baseline files
        run: |
          echo '{}' > /tmp/fallow-baseline.json
          echo '{}' > /tmp/fallow-health-baseline.json
          echo '{}' > /tmp/fallow-dupes-baseline.json
          echo '{}' > /tmp/fallow-dead-code-baseline.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          baseline: /tmp/fallow-baseline.json
          save-baseline: /tmp/fallow-saved-baseline.json
          health-baseline: /tmp/fallow-health-baseline.json
          dupes-baseline: /tmp/fallow-dupes-baseline.json
          dead-code-baseline: /tmp/fallow-dead-code-baseline.json
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
