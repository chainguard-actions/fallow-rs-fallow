name: Test saving and loading baselines on the combined run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/.fallow-test-baselines"
      - id: save-dc
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          save-baseline: ${{ github.workspace }}/.fallow-test-baselines/dead-code.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          save-baseline: ${{ github.workspace }}/.fallow-test-baselines/health.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dead-code-project
          save-baseline: ${{ github.workspace }}/.fallow-test-baselines/dupes.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines were saved
        run: |
          for f in dead-code health dupes; do
            P="$GITHUB_WORKSPACE/.fallow-test-baselines/$f.json"
            if [ ! -f "$P" ]; then
              echo "FAIL: baseline $P not written"
              exit 1
            fi
            echo "--- $f ---"; head -c 1000 "$P"; echo
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          root: tests/fixtures/dead-code-project
          baseline: ${{ github.workspace }}/.fallow-test-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/.fallow-test-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/.fallow-test-baselines/dupes.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert combined run loaded the baseline
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
          BASELINE_ENTRIES: ${{ steps.action.outputs.baseline-entries }}
          EXPECTED_PATH: ${{ github.workspace }}/.fallow-test-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $BASELINE_ENTRIES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path '$BASELINE_PATH' does not match input"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
