name: Test audit command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty baseline files for audit
        run: |
          echo '{}' > "$GITHUB_WORKSPACE/.fallow-dead-code-baseline.json"
          echo '{}' > "$GITHUB_WORKSPACE/.fallow-health-baseline.json"
          echo '{}' > "$GITHUB_WORKSPACE/.fallow-dupes-baseline.json"
      - id: action
        uses: .
        with:
          command: audit
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          gate: 'new-only'
          security-gate: 'new'
          dead-code-baseline: '.fallow-dead-code-baseline.json'
          health-baseline: '.fallow-health-baseline.json'
          dupes-baseline: '.fallow-dupes-baseline.json'
          auto-changed-since: 'false'
          threads: '2'
      - name: Assert audit outputs
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          echo "PASS: audit command with extended inputs completed"
