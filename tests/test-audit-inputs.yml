name: Test audit-specific inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-audit
          cat > /tmp/fallow-test-audit/package.json <<'EOF'
          {
            "name": "test-audit-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-audit/index.js <<'EOF'
          export function used() { return 1; }
          export function unused() { return 2; }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-test-audit
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          gate: 'new-only'
          security-gate: 'new'
          issue-types: 'unused-exports,unused-files'
          annotations: 'false'
      - name: Assert action ran with audit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with audit inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (audit may require PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
