name: Test audit command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-audit
          cat > /tmp/fallow-test-audit/package.json <<'EOF'
          {
            "name": "test-audit-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-audit/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
          echo '{}' > /tmp/fallow-dead-code-baseline.json
          echo '{}' > /tmp/fallow-health-baseline.json
          echo '{}' > /tmp/fallow-dupes-baseline.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-test-audit
          format: json
          fail-on-issues: 'false'
          gate: 'new-only'
          security-gate: 'new'
          dead-code-baseline: /tmp/fallow-dead-code-baseline.json
          health-baseline: /tmp/fallow-health-baseline.json
          dupes-baseline: /tmp/fallow-dupes-baseline.json
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
