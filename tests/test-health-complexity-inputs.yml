name: Test health complexity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-health
          cat > /tmp/fallow-test-health/package.json <<'EOF'
          {
            "name": "test-health-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-health/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) return a;
            return b;
          }
          export function complex(a, b, c, d) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) return a + b + c + d;
                  else return a + b + c;
                } else return a + b;
              } else return a;
            }
            return 0;
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-health
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '10'
          max-cognitive: '8'
          max-crap: '25.0'
          min-severity: 'moderate'
          sort: 'cyclomatic'
          top: '10'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
