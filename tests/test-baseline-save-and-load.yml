name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Remove any stale baseline
        run: rm -f "$GITHUB_WORKSPACE/fallow-test-baseline.json"

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -s "$F" ]; then
            echo "FAIL: baseline file not written at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline file is not valid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          baseline: ${{ github.workspace }}/fallow-test-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline run does not report more issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.load.outputs.issues }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "before: $BEFORE after: $AFTER baseline-path: $BPATH entries: $ENTRIES"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issue counts are not numeric"
            exit 1
          fi
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "FAIL: baseline run reported more issues than the run that saved it"
            exit 1
          fi
          echo "PASS"
