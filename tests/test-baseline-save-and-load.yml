name: Test dead-code baseline save then load (with regression baseline)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          mkdir -p sample/src baselines
          cat > sample/package.json <<'EOF'
          {"name":"sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > sample/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function unusedHelper() { return 0; }
          EOF
          cat > sample/src/orphan.js <<'EOF'
          export const orphan = 1;
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: sample
          save-baseline: ${{ github.workspace }}/baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baselines were saved
        run: |
          ls -la baselines || true
          for f in baselines/dead-code.json baselines/regression.json; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
            jq empty "$f" || { echo "FAIL: $f is not valid JSON"; exit 1; }
          done
          echo "PASS: baselines saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: sample
          baseline: ${{ github.workspace }}/baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert load run produced results
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          RESULTS: ${{ steps.load.outputs.results }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path '$BASELINE_PATH' != '$EXPECTED_PATH'"
            exit 1
          fi
          echo "PASS"
