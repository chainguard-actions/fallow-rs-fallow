name: Test dead-code baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Clean baseline path
        run: rm -f /tmp/fallow-dead-code-baseline.json

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-save
          save-baseline: /tmp/fallow-dead-code-baseline.json

      - name: Assert baseline file was saved
        run: |
          ls -la /tmp/fallow-dead-code-baseline.json || true
          if [ ! -s /tmp/fallow-dead-code-baseline.json ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          if ! jq empty /tmp/fallow-dead-code-baseline.json; then
            echo "FAIL: baseline file is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-load
          baseline: /tmp/fallow-dead-code-baseline.json

      - name: Assert baseline was loaded
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          RESULTS: ${{ steps.load.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid: $RESULTS"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "/tmp/fallow-dead-code-baseline.json" ]; then
            echo "FAIL: unexpected baseline-path '$BASELINE_PATH'"
            exit 1
          fi
          echo "PASS"
