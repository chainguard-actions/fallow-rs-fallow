name: Test health rejects a non-integer min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-min-commits
          hotspots: 'true'
          since: 6m
          min-commits: three
          save-snapshot: 'true'
          trend: 'true'
      - name: Assert action failed at validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for min-commits=three"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have produced an issue count"
            exit 1
          fi
          echo "PASS"
