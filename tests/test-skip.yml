name: Test combined run with skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          skip: dupes,health
      - name: Assert dead-code still ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid JSON"
            exit 1
          fi
          if ! grep -q "orphan" "$RESULTS"; then
            echo "FAIL: dead-code analysis should still report orphan.ts"
            exit 1
          fi
          echo "PASS"
