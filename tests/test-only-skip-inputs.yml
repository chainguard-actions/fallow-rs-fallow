name: Test only and skip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-only
        uses: .
        with:
          command: ''
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          only: 'dead-code'
        continue-on-error: true
      - name: Assert only input ran
        env:
          OUTCOME: ${{ steps.action-only.outcome }}
        run: |
          echo "outcome (only): $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with only input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or no JS/TS files)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-skip
        uses: .
        with:
          command: ''
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          skip: 'dupes,health'
        continue-on-error: true
      - name: Assert skip input ran
        env:
          OUTCOME: ${{ steps.action-skip.outcome }}
        run: |
          echo "outcome (skip): $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or no JS/TS files)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
