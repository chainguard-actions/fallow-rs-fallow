name: Test non-integer min-tokens is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.46.0'
          min-tokens: abc
          artifacts-dir: fallow-artifacts-bad-numeric
      - name: Assert validation rejected the input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on invalid min-tokens"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
