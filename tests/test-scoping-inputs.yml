name: Test scoping inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for scoping analysis
        run: |
          mkdir -p /tmp/fallow-scope-project
          cat > /tmp/fallow-scope-project/package.json <<'EOF'
          {
            "name": "scope-test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-scope-project/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      - name: Run analysis with only and skip inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: ''
          root: /tmp/fallow-scope-project
          format: json
          fail-on-issues: 'false'
          only: 'dead-code'
          skip: 'health'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
