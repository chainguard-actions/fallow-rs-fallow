name: Test health with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '1'
          max-cognitive: '1'
          max-crap: '5'
          max-file-lines: '3'
          sort: cognitive
          top: '10'
          threads: '2'
      - name: Assert health results produced
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing or empty"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results is not valid JSON"
            exit 1
          fi
          echo "PASS"
