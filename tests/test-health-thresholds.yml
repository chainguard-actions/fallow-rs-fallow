name: Test health thresholds and min-severity gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          max-cyclomatic: '50'
          max-cognitive: '50'
          max-crap: '30.0'
          sort: cognitive
          min-severity: critical
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-health-thresholds
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
