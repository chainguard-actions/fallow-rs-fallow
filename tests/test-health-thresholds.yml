name: Test health threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '40.0'
          min-severity: 'high'
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '5'
          score: 'true'
      - name: Assert action ran (health threshold inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with health threshold inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable with these threshold inputs)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
