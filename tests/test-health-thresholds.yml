name: Test health thresholds, sorting and hotspot window
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          max-cyclomatic: '10'
          max-cognitive: '8'
          max-crap: '25.5'
          top: '5'
          sort: cognitive
          hotspots: 'true'
          since: '1y'
          min-commits: '1'
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing: '$RESULTS'"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
