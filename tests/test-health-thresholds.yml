name: Test health command with threshold, sort and top options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          import { add, classify } from './util.js';
          console.log(add(1, 2), classify(5));
          EOF
          cat > fallow-sample/src/util.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          export function classify(n) {
            if (n < 0) {
              return 'negative';
            } else if (n === 0) {
              return 'zero';
            } else if (n < 10) {
              return 'small';
            }
            return 'large';
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-sample
          max-cyclomatic: '10'
          max-cognitive: '8'
          max-crap: '30.5'
          top: '5'
          sort: cognitive
          min-severity: critical
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: invalid JSON"
            exit 1
          fi
          echo "PASS"
