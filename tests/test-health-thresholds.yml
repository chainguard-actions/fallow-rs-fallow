name: Test health complexity thresholds and severity gate
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          max-cyclomatic: '10'
          max-cognitive: '8'
          max-crap: '30'
          sort: cognitive
          min-severity: critical
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert trivial fixture has no complexity findings
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 findings for trivial functions"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing at: $RESULTS"
            exit 1
          fi
          echo "PASS"
