name: Test health threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-health-thresh
          cat > /tmp/fallow-test-health-thresh/package.json <<'EOF'
          {
            "name": "test-health-thresh-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-health-thresh/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) { return a; }
            return b;
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-health-thresh
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '50'
          min-severity: 'high'
          min-score: '0'
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '1'
          annotations: 'false'
      - name: Assert action ran with health threshold inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with health threshold inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
