name: Test health with custom complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.44.0
          fail-on-issues: 'false'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          max-cyclomatic: '1'
          max-cognitive: '1'
          max-crap: '5.5'
          max-file-lines: '5'
          top: '3'
          sort: cognitive
          threads: '2'
      - name: Assert health outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results is not valid JSON"
            exit 1
          fi
          echo "PASS"
