name: Test health command with complexity thresholds and score gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          max-cyclomatic: '30'
          max-cognitive: '25'
          max-crap: '45.5'
          top: '5'
          sort: cognitive
          min-score: '0'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results is not valid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert analysis args carry the threshold flags
        run: |
          f="$GITHUB_WORKSPACE/fallow-analysis-args.sh"
          if [ ! -f "$f" ]; then
            echo "NOTE: args file not found at $f, skipping flag check"
            exit 0
          fi
          cat "$f"
          for flag in --max-cyclomatic --max-cognitive --max-crap --top --sort --min-score; do
            if ! grep -q -- "$flag" "$f"; then
              echo "FAIL: expected $flag in analysis args"
              exit 1
            fi
          done
          echo "PASS"
