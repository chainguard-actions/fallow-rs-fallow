name: Test health thresholds with explicit config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          config: tests/fixtures/fallow-config/.fallowrc.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-health-thresholds
          max-cyclomatic: '10'
          max-cognitive: '10'
          max-crap: '30.0'
          top: '5'
          sort: cognitive
          min-severity: critical
          threads: '2'
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          case "$RESULTS" in
            *fallow-out-health-thresholds/*) ;;
            *) echo "FAIL: results not under artifacts-dir"; exit 1 ;;
          esac
          echo "PASS"
