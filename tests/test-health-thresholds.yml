name: Test health thresholds (max-cyclomatic, max-cognitive, max-crap, sort, top)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with a complex function
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' \
            'export function classify(a: number, b: number, c: number): string {' \
            '  if (a > 0) {' \
            '    if (b > 0) {' \
            '      if (c > 0) { return "ppp"; } else if (c < -5) { return "ppn5"; } else { return "ppn"; }' \
            '    } else if (b < -10) {' \
            '      for (let i = 0; i < a; i++) { if (i % 2 === 0 && c > i) { return "loop"; } }' \
            '    }' \
            '  } else if (a < -100 || b > 100) {' \
            '    while (a < 0) { a++; if (a === -50) { break; } }' \
            '  }' \
            '  return a > b ? "a" : b > c ? "b" : "c";' \
            '}' \
            'console.log(classify(1, 2, 3));' > "$P/src/index.ts"

      - id: action
        uses: .
        with:
          command: health
          root: fx-project
          max-cyclomatic: '2'
          max-cognitive: '2'
          max-crap: '30'
          sort: cognitive
          top:          top: '10'
ion: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert health outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          jq '.summary // {}' "$RESULTS"
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected the complex function to exceed max-cyclomatic=2 / max-cognitive=2"
            exit 1
          fi
          echo "PASS"
