name: Test health command with complexity thresholds, sort, top and hotspots window
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: health
          max-cyclomatic: '40'
          max-cognitive: '30'
          max-crap: '60.5'
          sort: cognitive
          top: '10'
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
