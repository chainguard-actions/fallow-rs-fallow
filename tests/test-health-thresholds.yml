name: Test health command with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-health
          type-aware: 'false'
          max-cyclomatic: '5'
          max-cognitive: '5'
          max-crap: '10'
          max-file-lines: '500'
          top: '5'
          sort: cognitive
          threads: '2'
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ]; then
            echo "FAIL: results file not found"
            exit 1
          fi
          if ! jq empty "$f"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
