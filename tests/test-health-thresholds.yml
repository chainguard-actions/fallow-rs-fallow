name: Test health command with complexity thresholds, top and sort
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with a complex function
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/thresholds-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "thresholds-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function complexFunction(a, b, c, d, e) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) {
                    if (e > 0) {
                      return a + b + c + d + e;
                    } else if (e < -10) {
                      return a;
                    }
                    return a + b + c + d;
                  }
                  return a + b + c;
                }
                return a + b;
              }
              return a;
            }
            return 0;
          }
          complexFunction(1, 2, 3, 4, 5);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/thresholds-project
          format: json
          max-cyclomatic: '3'
          max-cognitive: '3'
          max-crap: '10'
          top: '5'
          sort: cognitive
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output is a positive number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected issues to be a number, got: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected low thresholds to flag the complex function"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
