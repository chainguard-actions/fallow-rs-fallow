name: Test health thresholds with explicit config, threads, top and sort
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          format: json
          max-cyclomatic: '3'
          max-cognitive: '3'
          max-crap: '10'
          top: '5'
          sort: cognitive
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert issues is a number and results are valid JSON
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results not valid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert low thresholds flag the complex function
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one complexity finding with max-cognitive=3"
            exit 1
          fi
          echo "PASS: $ISSUES findings"
