name: Test health with low complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          max-cyclomatic: '2'
          max-cognitive: '2'
          sort: cognitive
          top: '5'
          threads: '2'

      - name: Assert complexity findings were reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one finding with max-cyclomatic=2 (complexFunction is deeply nested)"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid: $RESULTS"
            exit 1
          fi
          echo "PASS: $ISSUES findings"
