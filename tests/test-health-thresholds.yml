name: Test health command with complexity thresholds, sort, top and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/health-thresholds"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "health-thresholds",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function branchy(a, b, c, d) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  return d > 0 ? 4 : 3;
                }
                return 2;
              }
              return 1;
            }
            return 0;
          }
          branchy(1, 2, 3, 4);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: act-fixtures/health-thresholds
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          max-cyclomatic: '2'
          max-cognitive: '2'
          max-crap: '30.0'
          sort: cognitive
          top: '5'
          threads: '2'

      - name: Assert issues output and results file
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert threshold flags were passed to fallow
        run: |
          ARGS_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name 'fallow-analysis-args.sh' | head -1)
          echo "args file: $ARGS_FILE"
          if [ -z "$ARGS_FILE" ]; then
            echo "SKIP: args file not found"
            exit 0
          fi
          cat "$ARGS_FILE"
          for flag in --max-cyclomatic --max-cognitive --max-crap --sort --top --threads; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected $flag in analysis args"
              exit 1
            fi
          done
          echo "PASS"
