name: Test health command with custom thresholds and config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          config: .fallowrc.json
          max-cyclomatic: '30'
          max-cognitive: '25'
          max-crap: '45.5'
          top: '5'
          sort: cognitive
          min-score: '0'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-health-thresholds

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON in the artifacts dir
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *fallow-out-health-thresholds*) ;;
            *) echo "FAIL: results not under artifacts-dir"; exit 1 ;;
          esac
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert threshold flags were forwarded to fallow
        run: |
          ARGS_FILE=fallow-out-health-thresholds/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--max-cyclomatic 30" "--max-cognitive 25" "--max-crap 45.5" "--top 5" "--sort cognitive" "--min-score 0" "--config .fallowrc.json"; do
            if ! grep -qF -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: missing '$flag' in analysis args"
              exit 1
            fi
          done
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-health-thresholds
