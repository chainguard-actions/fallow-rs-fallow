name: Test health command with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src"
          cat > "$S/package.json" <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$S/src/index.js" <<'EOF'
          import { classify } from './complex.js';
          console.log(classify(1, 2, 3));
          EOF
          cat > "$S/src/complex.js" <<'EOF'
          export function classify(a, b, c) {
            let r = 0;
            if (a > 0) {
              if (b > 0) {
                for (let i = 0; i < c; i++) {
                  if (i % 2 === 0 && a > b) { r += i; } else if (i % 3 === 0 || b > c) { r -= i; } else { r *= 2; }
                }
              } else if (b < -10) {
                r = a ? b : c;
              }
            } else {
              switch (c) { case 1: r = 1; break; case 2: r = 2; break; default: r = 3; }
            }
            return r;
          }
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-sample
          max-cyclomatic: '30'
          max-cognitive: '25'
          max-crap: '40.5'
          top: '5'
          sort: cognitive
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues is a number and results valid JSON
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
