name: Test health threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-health
          cat > /tmp/fallow-test-health/package.json <<'EOF'
          {
            "name": "test-health",
            "version": "1.0.0",
            "scripts": { "start": "node index.js" }
          }
          EOF
          cat > /tmp/fallow-test-health/index.js <<'EOF'
          function compute(a, b, c, d, e) {
            if (a) { if (b) { if (c) { if (d) { return e; } } } }
            return 0;
          }
          module.exports = { compute };
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-health
          fail-on-issues: 'false'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          min-severity: 'moderate'
          min-score: '0'
          sort: 'cyclomatic'
          top: '10'
          min-commits: '1'
          since: '1y'
          save-snapshot: /tmp/fallow-snapshot
          trend: 'false'
          format: json
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
