name: Test health thresholds and sorting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          max-cyclomatic: '2'
          max-cognitive: '2'
          max-crap: '30.0'
          top: '3'
          sort: cognitive
          threads: '2'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert args forwarded and results valid
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          ARGS_FILE="$(dirname "$RESULTS")/fallow-analysis-args.sh"
          if [ -f "$ARGS_FILE" ]; then
            cat "$ARGS_FILE"
            for flag in --max-cyclomatic --max-cognitive --max-crap --top --sort --threads; do
              if ! grep -q -- "$flag" "$ARGS_FILE"; then
                echo "FAIL: $flag not forwarded"
                exit 1
              fi
            done
          fi
          echo "PASS"
