name: Test health with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          max-file-lines: '500'
          min-severity: critical
          top: '5'
          sort: cognitive
          threads: '2'
      - name: Assert health ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: trivial fixture should have no complexity findings"
            cat "$RESULTS"
            exit 1
          fi
          if [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
