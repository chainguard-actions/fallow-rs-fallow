name: Test health thresholds and hotspots
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          max-file-lines: '500'
          top: '10'
          sort: cognitive
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          min-severity: critical
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert health ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
