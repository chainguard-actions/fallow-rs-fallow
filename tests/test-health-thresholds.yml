name: Test health command with complexity threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/health-thresholds-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "health-thresholds-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function classify(a, b, c, d) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) { return 4; } else { return 3; }
                } else if (c < -10) {
                  return -3;
                } else {
                  return 2;
                }
              } else if (b < -10) {
                return -2;
              } else {
                return 1;
              }
            } else if (a < -10) {
              return -1;
            }
            return 0;
          }
          classify(1, 2, 3, 4);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/health-thresholds-project
          format: json
          max-cyclomatic: '3'
          max-cognitive: '3'
          max-crap: '30'
          top: '5'
          sort: cognitive
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: invalid JSON"
            exit 1
          fi
          echo "PASS"
