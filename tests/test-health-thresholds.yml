name: Test health command with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          type-aware: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-health-thresholds
          max-cyclomatic: '10'
          max-cognitive: '10'
          max-crap: '30'
          max-file-lines: '500'
          sort: cognitive
          top: '5'
          min-severity: critical
          threads: '2'
      - name: Assert issues is an integer and results exist
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ]; then
            echo "FAIL: results file not found"
            exit 1
          fi
          head -c 2000 "$f"; echo
          echo "PASS"
