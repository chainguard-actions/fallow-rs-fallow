name: Test health command with custom thresholds, sort, top and min-severity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Thresholds are set so high that no function can reach them, so the
      # min-severity gate has nothing to fire on and the step must succeed.
      - id: action
        uses: .
        with:
          command: health
          max-cyclomatic: '1000'
          max-cognitive: '1000'
          max-crap: '100000000'
          top: '5'
          sort: cognitive
          min-severity: critical
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON and args carried the thresholds
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          ARGS_FILE="$GITHUB_WORKSPACE/fallow-analysis-args.sh"
          if [ -f "$ARGS_FILE" ]; then
            cat "$ARGS_FILE"
            for flag in --max-cyclomatic --max-cognitive --max-crap --top --sort --min-severity; do
              if ! grep -q -- "$flag" "$ARGS_FILE"; then
                echo "FAIL: expected $flag in analysis args"
                exit 1
              fi
            done
          fi
          echo "PASS"
