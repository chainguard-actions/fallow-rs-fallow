name: Test health command with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/project-unused
          version: 3.42.0
          type-aware: 'false'
          fail-on-issues: 'false'
          max-cyclomatic: '50'
          max-cognitive: '50'
          max-crap: '100'
          max-file-lines: '500'
          top: '5'
          sort: cognitive
          min-severity: critical
          threads: '2'
      - name: Assert health ran and produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq . "$RESULTS" > /dev/null || { echo "FAIL: results not valid JSON"; exit 1; }
          echo "PASS"
