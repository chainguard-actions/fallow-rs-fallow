name: Test health command with thresholds, sorting and hotspots
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/health-thresholds"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "health-thresholds-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function branchy(a, b, c) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) { return a + b + c; }
                return a + b;
              }
              return a;
            }
            return 0;
          }
          branchy(1, 2, 3);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fallow-fixtures/health-thresholds
          format: json
          max-cyclomatic: '2'
          max-cognitive: '2'
          max-crap: '30.0'
          top: '5'
          sort: cognitive
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results not valid JSON"
            exit 1
          fi
          echo "PASS"
