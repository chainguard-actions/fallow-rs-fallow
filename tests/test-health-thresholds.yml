name: Test health thresholds and sorting inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          max-cyclomatic: '10'
          max-cognitive: '8'
          max-crap: '30'
          top: '5'
          sort: cognitive
          since: 1y
          min-commits: '1'
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert issues output is a number and results file exists
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing at: $RESULTS"
            exit 1
          fi
          echo "PASS"

      - name: Assert flags were forwarded to fallow
        run: |
          ARGS_FILE="$GITHUB_WORKSPACE/fallow-analysis-args.sh"
          if [ ! -f "$ARGS_FILE" ]; then
            echo "SKIP: args file not found at $ARGS_FILE"
            exit 0
          fi
          cat "$ARGS_FILE"
          for flag in --max-cyclomatic --max-cognitive --max-crap --top --sort --since --min-commits --threads; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: $flag not forwarded"
              exit 1
            fi
          done
          echo "PASS: all flags forwarded"
