name: Test health command with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Let the bundled verifier resolve detect-libc from the global fallow install
        run: |
          G="$(npm root -g)"
          echo "NODE_PATH=$G/fallow/node_modules:$G" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/with-issues
          version: 3.43.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          max-cyclomatic: '10'
          max-cognitive: '10'
          max-crap: '30.0'
          max-file-lines: '500'
          top: '5'
          sort: cognitive
          threads: '2'
      - name: Assert health results written
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          head -c 2000 "$RESULTS"; echo
          if ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
