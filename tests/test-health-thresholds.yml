name: Test health command with complexity thresholds, sort and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          rm -rf sample-app && mkdir -p sample-app/src
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample-app/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function classify(n) {
            if (n < 0) { return 'negative'; }
            if (n === 0) { return 'zero'; }
            return 'positive';
          }
          EOF
          cat > sample-app/src/index.js <<'EOF'
          import { add, classify } from './math.js';
          export function main() { return classify(add(1, 2)); }
          EOF

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          max-cyclomatic: '30'
          max-cognitive: '25'
          max-crap: '45.5'
          sort: cognitive
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
