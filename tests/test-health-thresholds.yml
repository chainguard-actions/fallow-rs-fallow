name: Test health command with complexity thresholds, top and sort
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src
          cat > fx/package.json <<'EOF'
          {"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > fx/src/index.js <<'EOF'
          export function classify(a, b, c) {
            if (a > 0) {
              if (b > 0) { return c > 0 ? 'ppp' : 'ppn'; }
              else if (b < 0) { return c > 0 ? 'pnp' : 'pnn'; }
              return 'p0';
            } else if (a < 0) {
              for (let i = 0; i < b; i++) { if (i % 2 === 0 && c) { return 'loop'; } }
              return 'n';
            }
            return 'zero';
          }
          console.log(classify(1, 2, 3));
          EOF

      - id: action
        uses: .
        with:
          root: fx
          command: health
          max-cyclomatic: '3'
          max-cognitive: '3'
          max-crap: '45.5'
          top: '5'
          sort: cognitive
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results is not valid JSON"
            exit 1
          fi
          echo "PASS"
