name: Test health command with complexity thresholds, sort, top and threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          sort: cognitive
          top: '5'
          threads: '2'
          min-severity: critical
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert health output
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "gates-failed: $GATES_FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: trivial project should have no complexity findings at these thresholds"
            exit 1
          fi
          case ",$GATES_FAILED," in
            *,health-min-severity,*) echo "FAIL: min-severity gate failed on trivial project"; exit 1 ;;
          esac
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
