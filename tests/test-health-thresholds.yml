name: Test health threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '30'
          max-cognitive: '20'
          max-crap: '50'
          min-severity: 'high'
          min-score: ''
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '3'
          save-snapshot: ''
          trend: ''
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
