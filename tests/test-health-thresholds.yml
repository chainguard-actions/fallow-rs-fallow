name: Test health command with complexity thresholds and sorting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '40'
          top: '5'
          sort: cognitive
          since: 1y
          min-commits: '2'
          min-observation-volume: '100'
          low-traffic-threshold: '0.1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results is not valid JSON"
            exit 1
          fi
          echo "PASS"
