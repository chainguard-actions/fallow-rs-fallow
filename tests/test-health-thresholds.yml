name: Test health with custom complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with a complex function
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/health-thresholds-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "health-thresholds-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function complexFunction(a, b, c, d, e) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) {
                    if (e > 0) { return a + b + c + d + e; }
                    return a + b + c + d;
                  }
                  return a + b + c;
                }
                return a + b;
              }
              return a;
            }
            return 0;
          }
          complexFunction(1, 2, 3, 4, 5);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/health-thresholds-project
          max-cyclomatic: '2'
          max-cognitive: '2'
          max-crap: '30'
          sort: cognitive
          top: '10'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert complexity finding reported with low thresholds
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
