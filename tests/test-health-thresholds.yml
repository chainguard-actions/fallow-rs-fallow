name: Test health with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '50'
          max-cognitive: '50'
          max-crap: '100'
          max-file-lines: '1000'
          min-severity: 'critical'
          top: '5'
          sort: 'cognitive'
          threads: '2'
      - name: Assert health ran and produced JSON results
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing or empty"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
