name: Test health analysis with custom thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          max-cyclomatic: '3'
          max-cognitive: '3'
          max-crap: '30'
          sort: cognitive
          top: '5'
          threads: '2'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert threshold flags were forwarded to fallow
        run: |
          ARGS_FILE="fallow-analysis-args.sh"
          if [ ! -f "$ARGS_FILE" ]; then
            echo "FAIL: $ARGS_FILE not found"
            exit 1
          fi
          cat "$ARGS_FILE"
          for flag in --max-cyclomatic --max-cognitive --max-crap --sort --top --threads; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: $flag not forwarded"
              exit 1
            fi
          done
          echo "PASS: all threshold flags forwarded"
