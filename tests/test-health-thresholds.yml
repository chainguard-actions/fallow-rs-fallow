name: Test health with explicit thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/act-fixtures/clean-project
          fail-on-issues: 'true'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30.0'
          max-file-lines: '500'
          top: '5'
          sort: cognitive
          min-severity: critical
          threads: '2'
          artifacts-dir: fallow-out-health-thresholds
      - name: Assert flags forwarded to fallow
        run: |
          ARGS_FILE="fallow-out-health-thresholds/fallow-analysis-args.sh"
          if [ ! -f "$ARGS_FILE" ]; then
            echo "FAIL: args file missing"
            exit 1
          fi
          cat "$ARGS_FILE"
          for flag in "--max-cyclomatic 20" "--max-cognitive 15" "--max-crap 30.0" \
                      "--max-file-lines 500" "--top 5" "--sort cognitive" \
                      "--min-severity critical" "--threads 2"; do
            if ! grep -qF -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected '$flag' in fallow args"
              exit 1
            fi
          done
          echo "PASS"
      - name: Assert no findings on trivial project
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues"
            [ -f "$RESULTS" ] && cat "$RESULTS"
            exit 1
          fi
          jq -e '.' "$RESULTS" > /dev/null || { echo "FAIL: results not valid JSON"; exit 1; }
          echo "PASS"
