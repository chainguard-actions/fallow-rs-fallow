name: Test health with complexity thresholds, sort, top and min-severity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          max-cyclomatic: '10'
          max-cognitive: '8'
          max-crap: '25'
          sort: cognitive
          top: '5'
          min-severity: critical
          version: '3.37.0'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert simple project passes thresholds
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "gates-failed: $FAILED"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 complexity findings for trivial code"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          jq -e . "$F" > /dev/null || { echo "FAIL: results not valid JSON"; exit 1; }
          echo "PASS"
