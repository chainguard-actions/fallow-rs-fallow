name: Test health with complexity thresholds, top, sort, min-severity and threads
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30.0'
          top: '5'
          sort: cognitive
          min-severity: critical
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing: '$RESULTS'"
            exit 1
          fi
          jq -e . "$RESULTS" > /dev/null || { echo "FAIL: results is not valid JSON"; exit 1; }
          echo "PASS"

      - name: Assert threshold flags were passed to fallow
        run: |
          echo "FALLOW_ANALYSIS_ARGS_JSON=$FALLOW_ANALYSIS_ARGS_JSON"
          for flag in --max-cyclomatic --max-cognitive --max-crap --top --sort --min-severity --threads; do
            if ! echo "$FALLOW_ANALYSIS_ARGS_JSON" | jq -e --arg f "$flag" 'index($f) != null' > /dev/null; then
              echo "FAIL: expected $flag in analysis args"
              exit 1
            fi
          done
          echo "PASS"
