name: Test health command with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          version: 3.40.0
          format: json
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          max-file-lines: '500'
          sort: cognitive
          top: '10'
          min-severity: critical
          threads: '2'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-health
          type-aware: 'false'
      - name: Assert issues output is an integer
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output empty"
            exit 1
          fi
          echo "PASS"
