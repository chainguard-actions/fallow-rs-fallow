name: Test health with complexity thresholds and sort
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with a complex function
        run: |
          set -e
          D=fx-health
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-health","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          export function classify(a, b, c) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) { return 'all'; } else if (c < -10) { return 'ab-neg'; }
                for (let i = 0; i < a; i++) { if (i % 2 === 0 && b > i) { c += i; } else if (i % 3) { c -= 1; } }
              } else if (b < -5 || c > 7) {
                while (a > 0) { a--; if (a === 3) { break; } }
              }
            } else if (a === 0 && (b || c)) {
              switch (b) { case 1: return 'one'; case 2: return 'two'; default: return 'other'; }
            }
            return c > 0 ? 'pos' : 'neg';
          }
          console.log(classify(1, 2, 3));
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-health
          max-cyclomatic: '3'
          max-cognitive: '3'
          max-crap: '10.5'
          sort: cognitive
          artifacts-dir: fx-health-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs and forwarded flags
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          [ -f "$RESULTS" ] && jq empty "$RESULTS" || { echo "FAIL: invalid results file '$RESULTS'"; exit 1; }
          ARGS_FILE=fx-health-artifacts/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--max-cyclomatic 3" "--max-cognitive 3" "--max-crap 10.5" "--sort cognitive"; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: expected '$flag' in analysis args"
              exit 1
            fi
          done
          echo "PASS"
