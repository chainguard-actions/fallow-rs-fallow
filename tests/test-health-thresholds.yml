name: Test health with complexity thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          max-cyclomatic: '10'
          max-cognitive: '10'
          max-crap: '30'
          max-file-lines: '500'
          min-severity: critical
          top: '5'
          sort: cognitive
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert health ran and gate did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          f="$RESULTS"; [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ] || ! jq -e . "$f" > /dev/null; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if echo "$FAILED" | grep -q "health-min-severity"; then
            echo "FAIL: min-severity gate failed on trivial code"
            exit 1
          fi
          echo "PASS"
