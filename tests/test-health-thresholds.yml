name: Test health with complexity thresholds, sort and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project with a complex function
        run: |
          P="$GITHUB_WORKSPACE/fx-health-thr"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-health-thr",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function complexFunction(a, b, c, d, e) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) {
                    if (e > 0) { return a + b + c + d + e; } else { return a + b + c + d; }
                  } else { return a + b + c; }
                } else { return a + b; }
              } else { return a; }
            } else { return 0; }
          }
          console.log(complexFunction(1, 2, 3, 4, 5));
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-health-thr
          max-cyclomatic: '2'
          max-cognitive: '2'
          max-crap: '1000'
          sort: cognitive
          top: '10'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert low thresholds flag the complex function
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected max-cyclomatic=2 to flag complexFunction"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
