name: Test health command with complexity thresholds, sorting and hotspots
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/js-project
          format: json
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '40'
          top: '5'
          sort: cognitive
          min-severity: critical
          hotspots: 'true'
          since: '1y'
          min-commits: '1'
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          jq 'keys' "$RESULTS"
          echo "PASS"

      - name: Assert no critical-severity gate failure on the tiny fixture
        env:
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "gates-failed: '$GATES_FAILED'"
          if echo "$GATES_FAILED" | grep -q 'severity'; then
            echo "FAIL: min-severity critical gate failed on a trivial fixture"
            exit 1
          fi
          echo "PASS"
