name: Test health threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '50'
          min-severity: 'high'
          min-score: '0'
          min-commits: '5'
          min-invocations-hot: '200'
          min-observation-volume: '1000'
          low-traffic-threshold: '0.01'
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          save-snapshot: '/tmp/fallow-snapshot'
          trend: 'false'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with health threshold inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
