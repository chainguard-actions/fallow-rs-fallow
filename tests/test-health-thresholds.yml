name: Test health command thresholds and options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for health analysis
        run: |
          mkdir -p /tmp/fallow-health-project
          cat > /tmp/fallow-health-project/index.js << 'EOF'
          export function complexFunction(a, b, c, d) {
            if (a) { if (b) { if (c) { if (d) { return 1; } return 2; } return 3; } return 4; }
            return 0;
          }
          EOF
          cat > /tmp/fallow-health-project/package.json << 'EOF'
          { "name": "health-test-project", "version": "1.0.0", "type": "module" }
          EOF
          # Create a minimal Istanbul coverage file
          cat > /tmp/fallow-coverage.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-health-project
          fail-on-issues: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '50.0'
          min-severity: 'high'
          min-score: '0'
          sort: 'cyclomatic'
          top: '10'
          coverage: /tmp/fallow-coverage.json
          coverage-root: /tmp/fallow-health-project
          runtime-coverage: /tmp/fallow-coverage.json
          min-invocations-hot: '200'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          since: '1y'
          min-commits: '5'
          save-snapshot: /tmp/fallow-snapshot
          trend: 'false'
          format: json
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
