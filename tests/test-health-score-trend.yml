name: Test health score, snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          min-score: '0'
          save-snapshot: '.fallow/snapshots/first.json'
      - name: Assert snapshot run produced results
        env:
          RESULTS: ${{ steps.snapshot.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid JSON"
            exit 1
          fi
          echo "Snapshot files:"
          find . -path '*/.fallow/snapshots*' -type f 2>/dev/null || true
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          score: 'true'
          trend: 'true'
      - name: Assert trend run succeeded
        env:
          OUTCOME: ${{ steps.trend.outcome }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: trend run did not succeed"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
