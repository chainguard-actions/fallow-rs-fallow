name: Test health score with snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          score: 'true'
          save-snapshot: 'true'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Show snapshot dir
        run: ls -laR tests/fixtures/dirty-project/.fallow || true
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          min-score: '0'
          trend: 'true'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert health score results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid results JSON"; exit 1; }
          if ! grep -qi "score" "$f"; then
            echo "FAIL: expected a health score in results"
            head -c 4000 "$f"
            exit 1
          fi
          echo "PASS"
