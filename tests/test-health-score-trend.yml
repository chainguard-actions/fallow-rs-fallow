name: Test health min-score with snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          min-score: '0'
          save-snapshot: 'true'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert snapshot run passed the score gate
        env:
          ISSUES: ${{ steps.snapshot.outputs.issues }}
          FAILED: ${{ steps.snapshot.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if echo "$FAILED" | grep -q "health-min-score"; then
            echo "FAIL: min-score 0 should never fail"
            exit 1
          fi
          echo "snapshot dir contents:"
          ls -la tests/fixtures/clean-project/.fallow/snapshots 2>/dev/null || ls -la .fallow/snapshots 2>/dev/null || true
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          trend: 'true'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          f="$RESULTS"; [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ] || ! jq -e . "$f" > /dev/null; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
