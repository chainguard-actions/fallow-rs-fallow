name: Test health min-score, snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          min-score: '0'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot
      - name: Assert score gate passed and snapshot saved
        env:
          GATES_FAILED: ${{ steps.snapshot.outputs.gates-failed }}
        run: |
          echo "gates-failed: $GATES_FAILED"
          if echo "$GATES_FAILED" | grep -q "health-min-score"; then
            echo "FAIL: min-score 0 should never fail"
            exit 1
          fi
          DIR="$GITHUB_WORKSPACE/tests/fixtures/sample-project/.fallow/snapshots"
          ls -la "$DIR" || true
          if [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "FAIL: no snapshot written to $DIR"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          trend: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-trend
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
