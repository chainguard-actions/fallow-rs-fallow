name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert baseline file saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-baseline.json"
          [ -f "$f" ] || { echo "FAIL: baseline file not written"; exit 1; }
          jq -e . "$f" > /dev/null || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          baseline: ${{ github.workspace }}/fallow-baseline.json
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'true'
          annotations: 'false'
      - name: Assert baseline suppresses known issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-baseline.json
        run: |
          echo "issues: $ISSUES entries: $ENTRIES stale: $STALE path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries not numeric"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path mismatch"
            exit 1
          fi
          echo "PASS"
