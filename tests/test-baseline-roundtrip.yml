name: Test dead-code baseline and regression baseline round trip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          artifacts-dir: fallow-artifacts-save-baseline
      - name: Assert baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for f in dead-code.json regression.json; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$f" ]; then
              echo "FAIL: $f not saved"
              exit 1
            fi
            jq empty "$GITHUB_WORKSPACE/fallow-baselines/$f" || { echo "FAIL: $f invalid JSON"; exit 1; }
          done
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-regression: 'true'
          artifacts-dir: fallow-artifacts-load-baseline
      - name: Assert baseline loaded and no regression
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path should echo the baseline input"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries not numeric"
            exit 1
          fi
          echo "PASS"
