name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline file saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          if ! jq -e . "$F" > /dev/null; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppressed known issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-dead-code-baseline.json
        run: |
          echo "before: $BEFORE after: $AFTER"
          echo "baseline-path: $BPATH entries: $ENTRIES stale: $STALE"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues outputs are not numbers"
            exit 1
          fi
          if [ "$BEFORE" -lt 1 ]; then
            echo "FAIL: expected issues in dead-code project before baseline"
            exit 1
          fi
          if [ "$AFTER" -ge "$BEFORE" ]; then
            echo "FAIL: baseline did not reduce reported issues"
            exit 1
          fi
          if [ "$BPATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path output should echo the baseline input"
            exit 1
          fi
          echo "PASS"
