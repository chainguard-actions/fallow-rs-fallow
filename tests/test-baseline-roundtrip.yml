name: Test dead-code baseline save and compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          format: json
          issue-types: unused-exports
          threads: '2'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline file was saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -s "$GITHUB_WORKSPACE/fallow-dead-code-baseline.json" ]; then
            echo "FAIL: baseline file was not written"
            exit 1
          fi
          if ! jq empty "$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"; then
            echo "FAIL: baseline file is not valid JSON"
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          echo "PASS: baseline saved"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          format: json
          issue-types: unused-exports
          threads: '2'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-dead-code-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline, got '$ISSUES'"
            exit 1
          fi
          if [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path should echo the input"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries not numeric: '$ENTRIES'"
            exit 1
          fi
          echo "PASS"
