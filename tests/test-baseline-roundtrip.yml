name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json
      - name: Assert baseline file saved
        run: |
          ls -la "$GITHUB_WORKSPACE" | grep -i baseline || true
          if [ ! -s "$GITHUB_WORKSPACE/fallow-test-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          echo "PASS: baseline saved"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json
      - name: Assert baseline suppresses known issues
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.action.outputs.issues }}
          BPATH: ${{ steps.action.outputs.baseline-path }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
          STALE: ${{ steps.action.outputs.baseline-stale-entries }}
          MATCHED: ${{ steps.action.outputs.baseline-matched }}
        run: |
          echo "baseline-matched: $MATCHED"
          echo "issues before baseline: $SAVED_ISSUES"
          echo "issues with baseline: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          if ! [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]] || [ "$SAVED_ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues in the first run"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues when comparing against the baseline"
            exit 1
          fi
          if [ -z "$BPATH" ]; then
            echo "FAIL: baseline-path output empty"
            exit 1
          fi
          echo "PASS"
