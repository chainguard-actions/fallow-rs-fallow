name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline saved
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not saved"
            exit 1
          fi
          jq empty "$GITHUB_WORKSPACE/fallow-baseline.json" || { echo "FAIL: baseline not JSON"; exit 1; }
          cat "$GITHUB_WORKSPACE/fallow-baseline.json"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-baseline.json
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baselined findings suppressed
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.load.outputs.issues }}
        run: |
          echo "issues before baseline: $SAVED_ISSUES"
          echo "issues with baseline: $ISSUES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues once baselined"
            exit 1
          fi
          echo "PASS"
