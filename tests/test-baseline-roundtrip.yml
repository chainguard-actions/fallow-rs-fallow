name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline file saved
        env:
          BASELINE: ${{ runner.temp }}/fallow-dead-code-baseline.json
        run: |
          ls -la "$(dirname "$BASELINE")"
          if [ ! -s "$BASELINE" ]; then
            echo "FAIL: baseline file not saved at $BASELINE"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          baseline: ${{ runner.temp }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "baseline-path: $BASELINE_PATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing at: $RESULTS"
            exit 1
          fi
          echo "PASS"
