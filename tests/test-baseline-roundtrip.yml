name: Test save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline-test.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline file saved
        run: |
          FILE="$GITHUB_WORKSPACE/fallow-baseline-test.json"
          if [ ! -s "$FILE" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: baseline not valid JSON"; exit 1; }
          cat "$FILE"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-baseline-test.json
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against freshly saved baseline"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
