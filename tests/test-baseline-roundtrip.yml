name: Test save-baseline then baseline, and regression baselines (dead-code)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-baseline"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "baseline-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-proj-baseline
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline files were saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          for f in fallow-baseline.json fallow-regression.json; do
            if [ ! -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f was not written"
              ls -la "$GITHUB_WORKSPACE"
              exit 1
            fi
            if ! jq empty "$GITHUB_WORKSPACE/$f"; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS: baselines saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: fallow-proj-baseline
          format: json
          baseline: ${{ github.workspace }}/fallow-baseline.json
          regression-baseline: ${{ github.workspace }}/fallow-regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed existing issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES entries: $ENTRIES path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues after loading the baseline"
            exit 1
          fi
          echo "PASS"
