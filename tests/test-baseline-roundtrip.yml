name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline file was written
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not written at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS: baseline saved"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline sup          ISSUES: ${{ steps.compare.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          OUTCOMEutputs.issues }}
          OUTCOME: ${{ steps.compare.outcome }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "outcome=$OUTCOME issues=$ISSUES entries=$ENTRIES stale=$STALE path=$BPATH"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: comparison run should pass (all findings baselined)"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: expected issues <= $SAVED_ISSUES with baseline, got '$ISSUES'"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: freshly saved baseline should not have stale entries"
            exit 1
          fi
          echo "PASS"
