name: Test dead-code baseline and regression baseline round trip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
      - name: Assert baselines were saved
        run: |
          for f in dead-code.json regression.json; do
            p="$GITHUB_WORKSPACE/fallow-baselines/$f"
            echo "checking $p"
            if [ ! -f "$p" ] || ! jq -e . "$p" > /dev/null; then
              echo "FAIL: $f missing or invalid JSON"
              exit 1
            fi
          done
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-compare
      - name: Assert baseline was loaded
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-path: $BPATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path does not match the baseline input"
            exit 1
          fi
          echo "PASS"
