name: Test dead-code baseline save then compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
      - name: Assert baseline file saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$f" ] || ! jq -e . "$f" > /dev/null; then
            echo "FAIL: baseline file missing or invalid JSON"
            exit 1
          fi
          head -c 500 "$f"; echo
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-compare
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-stale-baseline: 'true'
      - name: Assert baseline outputs
        env:
          OUTCOME: ${{ steps.compare.outcome }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          STALE: ${{ steps.compare.outputs.baseline-stale-entries }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          TRIPS: ${{ steps.compare.outputs.baseline-gate-trips }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES entries: $ENTRIES stale: $STALE trips: $TRIPS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: a freshly saved baseline should suppress all issues and not be stale"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues against the baseline"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          if [ "$TRIPS" = "true" ]; then
            echo "FAIL: stale-baseline gate should not trip"
            exit 1
          fi
          echo "PASS"
