name: Test dead-code baseline and regression baseline save then load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          save-baseline: fallow-test-baseline.json
          save-regression-baseline: fallow-test-regression.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline files were saved
        run: |
          for f in fallow-test-baseline.json fallow-test-regression.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
            if ! jq empty "$GITHUB_WORKSPACE/$f"; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          baseline: fallow-test-baseline.json
          regression-baseline: fallow-test-regression.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline outputs
        env:
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          ISSUES: ${{ steps.load.outputs.issues }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "baseline-path: $BASELINE_PATH issues: $ISSUES stale: '$STALE'"
          if [ "$BASELINE_PATH" != "fallow-test-baseline.json" ]; then
            echo "FAIL: expected baseline-path to echo the input"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: freshly saved baseline should have no stale entries, got $STALE"
            exit 1
          fi
          echo "PASS"
