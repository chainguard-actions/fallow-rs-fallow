name: Test save-baseline then baseline
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline file was saved
        env:
          BASELINE: ${{ runner.temp }}/fallow-dead-code-baseline.json
        run: |
          echo "baseline: $BASELINE"
          if [ ! -s "$BASELINE" ]; then
            echo "FAIL: baseline file was not written"
            exit 1
          fi
          jq -e . "$BASELINE" > /dev/null || { echo "FAIL: baseline is not JSON"; exit 1; }
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          baseline: ${{ runner.temp }}/fallow-dead-code-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baseline suppressed all known issues
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "saved-run issues: $SAVED_ISSUES"
          echo "issues: $ISSUES entries: $ENTRIES stale: $STALE"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline run reports more issues than the run that saved it"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! echo "$ENTRIES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
