name: Test dead-code baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines-rt"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          issue-types: unused-files,unused-exports
          threads: '2'
          save-baseline: ${{ github.workspace }}/fallow-baselines-rt/dead-code.json
          artifacts-dir: fallow-artifacts-bl-save
      - name: Assert baseline file written
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
          BL: ${{ github.workspace }}/fallow-baselines-rt/dead-code.json
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ ! -s "$BL" ]; then
            echo "FAIL: baseline file $BL not written"
            exit 1
          fi
          jq empty "$BL" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$BL"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          issue-types: unused-files,unused-exports
          threads: '2'
          baseline: ${{ github.workspace }}/fallow-baselines-rt/dead-code.json
          artifacts-dir: fallow-artifacts-bl-load
      - name: Assert baseline suppressed known issues
        env:
          FIRST: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "first: $FIRST  with-baseline: $ISSUES  entries: $ENTRIES  stale: $STALE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -gt "$FIRST" ]; then
            echo "FAIL: baseline run reported more issues than the baseline-saving run"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: freshly saved baseline should have no stale entries"
            exit 1
          fi
          echo "PASS"
