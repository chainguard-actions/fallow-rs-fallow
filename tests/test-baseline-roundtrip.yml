name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baseline-rt"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-baseline-rt/baseline.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
      - name: Assert baseline saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baseline-rt/baseline.json"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: baseline file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          baseline: ${{ github.workspace }}/fallow-baseline-rt/baseline.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-load
      - name: Assert baseline suppresses issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.load.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "FAIL: baseline run reported more issues than the run that saved it"
            exit 1
          fi
          echo "PASS"
