name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/project-unused
          version: 3.42.0
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq . "$f" > /dev/null || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$f"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/project-unused
          version: 3.42.0
          type-aware: 'false'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
      - name: Assert baseline was loaded
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          EXPECTED: ${{ github.workspace }}/fallow-dead-code-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$BASELINE_PATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path should echo the baseline input"
            exit 1
          fi
          echo "PASS"
