name: Test save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
      - name: Assert baseline files were saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for f in dead-code.json regression.json; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$f" ]; then
              echo "FAIL: $f was not saved"
              exit 1
            fi
          done
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-compare
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
      - name: Assert comparison outputs
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "saved issues: $SAVED_ISSUES"
          echo "compared issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline comparison reported more issues than the saved run"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: unexpected baseline-path"
            exit 1
          fi
          echo "PASS"
