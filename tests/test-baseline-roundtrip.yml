name: Test dead-code baseline save then compare
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          save-baseline: ${{ runner.temp }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline saved
        env:
          BASELINE: ${{ runner.temp }}/fallow-baseline.json
        run: |
          ls -la "$(dirname "$BASELINE")"
          if [ ! -s "$BASELINE" ] || ! jq -e . "$BASELINE" > /dev/null; then
            echo "FAIL: baseline file not saved or invalid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          baseline: ${{ runner.temp }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baseline suppressed known issues
        env:
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.action.outputs.issues }}
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
          ENTRIES: ${{ steps.action.outputs.baseline-entries }}
        run: |
          echo "issues before baseline: $SAVED_ISSUES"
          echo "issues with baseline: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$SAVED_ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues in the first run"
            exit 1
          fi
          if [ "$ISSUES" -ge "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline did not reduce issue count"
            exit 1
          fi
          echo "PASS"
