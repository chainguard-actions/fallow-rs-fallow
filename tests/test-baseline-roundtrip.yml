name: Test saving and loading dead-code and regression baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          rm -rf fallow-fixture baselines
          mkdir -p fallow-fixture/src baselines
          cd fallow-fixture
          cat > package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > src/used.js <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF
          cat > src/orphan.js <<'EOF'
          export const orphan = 42;
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-fixture
          save-baseline: ${{ github.workspace }}/baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/baselines/regression.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline files were saved
        run: |
          ls -la baselines
          for f in baselines/dead-code.json baselines/regression.json; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
            if ! jq empty "$f"; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS: baselines saved"

      - id: load
        uses: .
        with:
          command: dead-code
          root: fallow-fixture
          baseline: ${{ github.workspace }}/baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/baselines/regression.json
          fail-on-regression: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert load run produced results
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          RESULTS: ${{ steps.load.outputs.results }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          echo "baseline-path: $BASELINE_PATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected integer issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
