name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare baseline directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/.act-baselines"
          mkdir -p "$GITHUB_WORKSPACE/.act-baselines"

      - id: save
        uses: .
        with:
          command: dead-code
          save-baseline: .act-baselines/dead-code.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was saved
        run: |
          ls -la "$GITHUB_WORKSPACE/.act-baselines" || true
          if [ ! -s "$GITHUB_WORKSPACE/.act-baselines/dead-code.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$GITHUB_WORKSPACE/.act-baselines/dead-code.json" || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          baseline: .act-baselines/dead-code.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline run outputs
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: '$BASELINE_PATH'"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != ".act-baselines/dead-code.json" ]; then
            echo "FAIL: unexpected baseline-path '$BASELINE_PATH'"
            exit 1
          fi
          echo "PASS"

      - name: Clean up
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.act-baselines"
