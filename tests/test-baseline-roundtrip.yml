name: Test baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for f in dead-code.json regression.json; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
            jq empty "$GITHUB_WORKSPACE/fallow-baselines/$f" || { echo "FAIL: $f invalid JSON"; exit 1; }
          done
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'true'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression.json
          fail-on-regression: 'true'
          artifacts-dir: fallow-artifacts-baseline-load
      - name: Assert baseline suppresses known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          GATES_FAILED: ${{ steps.load.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "gates-failed: $GATES_FAILED"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues after baseline"
            exit 1
          fi
          if echo "$GATES_FAILED" | grep -q "regression"; then
            echo "FAIL: regression gate failed unexpectedly"
            exit 1
          fi
          echo "PASS"
