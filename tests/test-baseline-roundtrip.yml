name: Test save-baseline then baseline suppresses known issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: 3.45.0
          issue-types: unused-files,unused-exports
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ ! -f "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq . "$GITHUB_WORKSPACE/fallow-baseline.json" > /dev/null || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: 3.45.0
          issue-types: unused-files,unused-exports
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline suppressed issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: '$ENTRIES'"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected baseline to suppress all known issues"
            exit 1
          fi
          echo "PASS"
