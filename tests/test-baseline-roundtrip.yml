name: Test saving and loading a dead-code baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline file was saved
        run: |
          ls -la "$GITHUB_WORKSPACE"
          if [ ! -s "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          head -c 2000 "$GITHUB_WORKSPACE/fallow-baseline.json"; echo
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          baseline: ${{ github.workspace }}/fallow-baseline.json
      - name: Assert baseline suppressed all known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-stale-entries: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against the freshly saved baseline"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          echo "PASS"
