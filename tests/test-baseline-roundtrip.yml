name: Test saving and loading a dead-code baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
      - name: Assert baseline file saved
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/fallow-baseline.json" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq -e . "$GITHUB_WORKSPACE/fallow-baseline.json" > /dev/null || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-load
      - name: Assert baseline loaded
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          SAVED_ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues with baseline: $ISSUES (before: $SAVED_ISSUES)"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [[ "$SAVED_ISSUES" =~ ^[0-9]+$ ]] && [ "$ISSUES" -gt "$SAVED_ISSUES" ]; then
            echo "FAIL: baseline should not increase the issue count"
            exit 1
          fi
          echo "PASS"
