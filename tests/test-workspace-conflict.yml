name: Test workspace and changed-workspaces with a missing ref fails hard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          workspace: web
          changed-workspaces: refs/heads/this-ref-does-not-exist-xyz
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # workspace and changed-workspaces are mutually exclusive, and a
          # missing changed-workspaces ref is a hard error (exit 2).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for conflicting workspace inputs"
            exit 1
          fi
          echo "PASS"
