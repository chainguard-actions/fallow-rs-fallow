name: Test workspace and changed-workspaces conflict is a hard error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: 3.45.0
          issue-types: unused-files,unused-exports
          auto-changed-since: 'false'
          workspace: web
          changed-workspaces: refs/heads/does-not-exist-fallow-test
      - name: Assert action failed with a hard error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # workspace and changed-workspaces are mutually exclusive, and a
          # missing changed-workspaces ref is documented as a hard error (exit 2).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail instead of silently running full scope"
            exit 1
          fi
          echo "PASS"
