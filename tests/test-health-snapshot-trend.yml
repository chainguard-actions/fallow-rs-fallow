name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-trend"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "trend-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            if (a > b) { return a - b; }
            return a + b;
          }
          console.log(add(1, 2));
          EOF

      - id: snapshot
        uses: .
        with:
          command: health
          root: fallow-proj-trend
          format: json
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert a snapshot was saved
        run: |
          find "$GITHUB_WORKSPACE/fallow-proj-trend/.fallow" -type f 2>/dev/null || true
          if [ -z "$(find "$GITHUB_WORKSPACE/fallow-proj-trend/.fallow/snapshots" -type f 2>/dev/null)" ]; then
            echo "FAIL: no snapshot found under .fallow/snapshots"
            exit 1
          fi
          echo "PASS: snapshot saved"

      - id: trend
        uses: .
        with:
          command: health
          root: fallow-proj-trend
          format: json
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert trend run succeeded
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
