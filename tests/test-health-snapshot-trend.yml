name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snapshot
        uses: .
        with:
          command: health
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert snapshot saved
        run: |
          ls -la .fallow/snapshots || true
          if [ -z "$(ls -A .fallow/snapshots 2>/dev/null)" ]; then
            echo "FAIL: no snapshot written under .fallow/snapshots"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert trend run produced results
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq empty "$RESULTS"; then
            echo "FAIL: results not valid JSON"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
