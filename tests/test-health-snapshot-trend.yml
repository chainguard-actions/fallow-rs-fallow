name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snap
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          score: 'true'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot
          type-aware: 'false'
      - name: Show snapshot files
        run: |
          find "$GITHUB_WORKSPACE" -path '*.fallow/snapshots*' -print 2>/dev/null | head -20 || true
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          score: 'true'
          trend: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-trend
          type-aware: 'false'
      - name: Assert both runs produced outputs
        env:
          SNAP_ISSUES: ${{ steps.snap.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES"
          echo "trend issues: $TREND_ISSUES"
          if ! [[ "$SNAP_ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$TREND_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not integers"
            exit 1
          fi
          echo "PASS"
