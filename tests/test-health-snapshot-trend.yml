name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snapshot
          save-snapshot: 'true'
      - name: Assert snapshot run produced results
        env:
          ISSUES: ${{ steps.snapshot.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          grep -q -- "--save-snapshot" fallow-out-snapshot/fallow-analysis-args.sh || { echo "FAIL: --save-snapshot not forwarded"; exit 1; }
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-trend
          trend: 'true'
          since: 1y
          min-commits: '1'
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          ARGS_FILE=fallow-out-trend/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in --trend --since --min-commits; do
            grep -q -- "$flag" "$ARGS_FILE" || { echo "FAIL: $flag not forwarded"; exit 1; }
          done
          echo "PASS"
