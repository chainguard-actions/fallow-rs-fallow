name: Test health save-snapshot followed by trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          rm -rf sample-app && mkdir -p sample-app/src
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample-app/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          EOF
          cat > sample-app/src/index.js <<'EOF'
          import { add } from './math.js';
          export function main() { return add(1, 2); }
          EOF

      - id: snapshot
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Show saved snapshots
        run: |
          find sample-app -path '*snapshots*' -print || true

      - id: trend
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert both runs produced numeric issue counts
        env:
          SNAP_ISSUES: ${{ steps.snapshot.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
          TREND_RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES trend issues: $TREND_ISSUES"
          for v in "$SNAP_ISSUES" "$TREND_ISSUES"; do
            if ! echo "$v" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric issues, got '$v'"
              exit 1
            fi
          done
          if [ ! -f "$TREND_RESULTS" ] || ! jq empty "$TREND_RESULTS"; then
            echo "FAIL: trend results file missing or invalid"
            exit 1
          fi
          echo "PASS"
