name: Test health snapshot save and trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert snapshot written
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "snapshot files:"
          find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f -print || true
          if [ -z "$(find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f -name '*.json' -print -quit)" ]; then
            echo "FAIL: no snapshot json file was written"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
