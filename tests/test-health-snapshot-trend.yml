name: Test health snapshot save then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snapshot
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-trend
      - name: Assert outputs
        env:
          SNAP_ISSUES: ${{ steps.snapshot.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES, trend issues: $TREND_ISSUES"
          if ! [[ "$SNAP_ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$TREND_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
