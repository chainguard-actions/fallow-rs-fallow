name: Test health save-snapshot then trend
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          save-snapshot: 'true'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert snapshot saved
        run: |
          ls -laR tests/fixtures/simple-js/.fallow 2>/dev/null || true
          if ! find tests/fixtures/simple-js/.fallow/snapshots -type f 2>/dev/null | grep -q .; then
            echo "FAIL: no snapshot under tests/fixtures/simple-js/.fallow/snapshots"
            exit 1
          fi
          echo "PASS: snapshot saved"

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          trend: 'true'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert trend run outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing at: $RESULTS"
            exit 1
          fi
          echo "PASS"
