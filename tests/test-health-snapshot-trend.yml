name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Let the bundled verifier resolve detect-libc from the global fallow install
        run: |
          G="$(npm root -g)"
          echo "NODE_PATH=$G/fallow/node_modules:$G" >> "$GITHUB_ENV"
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean
          version: 3.43.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          score: 'true'
          save-snapshot: 'true'
      - name: Assert snapshot run produced results
        env:
          RESULTS: ${{ steps.snapshot.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          ls -la tests/fixtures/clean/.fallow/snapshots 2>/dev/null || echo "(no default snapshot dir listing)"
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean
          version: 3.43.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          trend: 'true'
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
