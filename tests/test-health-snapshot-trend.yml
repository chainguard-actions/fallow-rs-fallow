name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot
          type-aware: 'false'
          save-snapshot: 'true'
      - name: Assert a snapshot was saved
        run: |
          ls -la tests/fixtures/clean-project/.fallow/snapshots 2>/dev/null || true
          ls -la .fallow/snapshots 2>/dev/null || true
          count=$(find "$GITHUB_WORKSPACE" -path '*/.fallow/snapshots/*' -type f 2>/dev/null | wc -l)
          echo "snapshot files: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: no snapshot file saved under .fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-trend
          type-aware: 'false'
          trend: 'true'
      - name: Assert trend run produced results
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "results: $RESULTS"
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ] || ! jq empty "$f"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
