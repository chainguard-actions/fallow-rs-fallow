name: Test health snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clear old snapshots
        run: rm -rf tests/fixtures/dirty-project/.fallow/snapshots
      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          save-snapshot: 'true'
      - name: Assert snapshot written
        run: |
          ls -la tests/fixtures/dirty-project/.fallow/snapshots || true
          found=$(find tests/fixtures/dirty-project/.fallow/snapshots -type f 2>/dev/null | head -n1)
          if [ -z "$found" ]; then
            found=$(find . -path '*/.fallow/snapshots/*' -type f 2>/dev/null | head -n1)
          fi
          echo "snapshot: $found"
          if [ -z "$found" ]; then
            echo "FAIL: no snapshot file was written"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          trend: 'true'
      - name: Assert trend run succeeded
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
