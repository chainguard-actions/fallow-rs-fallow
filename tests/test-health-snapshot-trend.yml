name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: snapshot
        uses: .
        with:
          command: health
          score: 'true'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-snapshot

      - name: Assert a snapshot was written
        run: |
          grep -qE -- "--save-snapshot( |\))" fallow-out-snapshot/fallow-analysis-args.sh || { echo "FAIL: --save-snapshot not forwarded"; exit 1; }
          FOUND=$(find "$GITHUB_WORKSPACE/.fallow" -path '*snapshots*' -type f 2>/dev/null | head -1)
          echo "snapshot: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: no snapshot under .fallow/snapshots"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          score: 'true'
          trend: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-snapshot

      - name: Assert trend run succeeded
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          grep -qF -- "--trend" fallow-out-snapshot/fallow-analysis-args.sh || { echo "FAIL: --trend not forwarded"; exit 1; }
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-snapshot "$GITHUB_WORKSPACE/.fallow/snapshots"
