name: Test health command save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/snapshot-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "snapshot-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF

      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/snapshot-project
          format: json
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert a snapshot was saved
        run: |
          D="$GITHUB_WORKSPACE/tests/fixtures/snapshot-project/.fallow/snapshots"
          ls -la "$D" || true
          if [ -z "$(ls -A "$D" 2>/dev/null)" ]; then
            echo "FAIL: no snapshot saved in $D"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/snapshot-project
          format: json
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
