name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert both runs produced results
        env:
          SNAP_ISSUES: ${{ steps.snapshot.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
          TREND_RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES"
          echo "trend issues: $TREND_ISSUES"
          echo "trend results: $TREND_RESULTS"
          for v in "$SNAP_ISSUES" "$TREND_ISSUES"; do
            if ! echo "$v" | grep -qE '^[0-9]+$'; then
              echo "FAIL: issues output is not a number: '$v'"
              exit 1
            fi
          done
          if [ -z "$TREND_RESULTS" ] || [ ! -f "$TREND_RESULTS" ]; then
            echo "FAIL: trend results file missing"
            exit 1
          fi
          echo "PASS"
