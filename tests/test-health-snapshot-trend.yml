name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-snapshot"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-snapshot","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          echo 'export function add(a, b) { return a > b ? a + b : b + a; }' > "$D/src/math.js"

      - id: save
        uses: .
        with:
          command: health
          root: fx-snapshot
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert snapshot file was written
        run: |
          found=$(find "$GITHUB_WORKSPACE/fx-snapshot/.fallow" -path '*snapshots*' -type f 2>/dev/null | head -5)
          echo "snapshots: $found"
          if [ -z "$found" ]; then
            echo "FAIL: no snapshot written under fx-snapshot/.fallow/snapshots"
            find "$GITHUB_WORKSPACE/fx-snapshot" -maxdepth 4 | head -50
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          root: fx-snapshot
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
