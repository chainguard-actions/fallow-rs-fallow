name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          score: 'true'
          save-snapshot: 'true'

      - name: Assert a snapshot was written
        run: |
          found=$(find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f -name '*.json' 2>/dev/null | head -5)
          echo "snapshots found: $found"
          if [ -z "$found" ]; then
            echo "FAIL: no snapshot file found"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          score: 'true'
          trend: 'true'

      - name: Assert trend run succeeded
        env:
          OUTCOME: ${{ steps.trend.outcome }}
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected trend run to succeed"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
