name: Test health snapshot save then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snapshot-save
          save-snapshot: 'true'
      - name: Assert a snapshot was saved
        run: |
          ls -la tests/fixtures/sample-project/.fallow/snapshots || true
          count=$(find tests/fixtures/sample-project/.fallow/snapshots -type f 2>/dev/null | wc -l)
          echo "snapshot files: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: expected at least one snapshot file"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snapshot-trend
          trend: 'true'
          min-score: '0'
      - name: Assert trend run succeeded
        env:
          OUTCOME: ${{ steps.trend.outcome }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: trend run with min-score 0 should succeed"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
