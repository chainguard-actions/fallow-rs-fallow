name: Test health snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-snapshot: 'true'
          artifacts-dir: fallow-artifacts-snapshot
      - name: Assert snapshot written
        run: |
          ls -la tests/fixtures/sample-project/.fallow/snapshots || true
          if ! ls tests/fixtures/sample-project/.fallow/snapshots/* >/dev/null 2>&1 \
             && ! ls tests/fixtures/sample-project/true >/dev/null 2>&1; then
            echo "FAIL: no snapshot written"
            exit 1
          fi
          echo "PASS"
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          trend: 'true'
          artifacts-dir: fallow-artifacts-trend
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
