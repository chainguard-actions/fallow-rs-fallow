name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/health-trend"
          mkdir -p "$R/src"
          cat > "$R/package.json" <<'EOF'
          {
            "name": "health-trend",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$R/src/index.js" <<'EOF'
          export function pick(a, b) { if (a > b) { return a; } return b; }
          pick(1, 2);
          EOF

      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/health-trend
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          score: 'true'
          save-snapshot: 'true'

      - name: Assert a snapshot was written
        run: |
          FOUND=$(find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f -name '*.json' 2>/dev/null | head -n 5)
          echo "snapshots found:"
          echo "$FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: no snapshot file written"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/health-trend
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          score: 'true'
          trend: 'true'

      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
