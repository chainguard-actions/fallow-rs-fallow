name: Test health snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: snapshot
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          score: 'true'
          save-snapshot: 'true'

      - name: Assert snapshot saved
        run: |
          ls -laR tests/fixtures/simple-js/.fallow 2>/dev/null || true
          if ! find tests/fixtures/simple-js/.fallow -path '*snapshots*' -type f 2>/dev/null | grep -q .; then
            echo "FAIL: no snapshot file found under tests/fixtures/simple-js/.fallow/snapshots"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          score: 'true'
          trend: 'true'

      - name: Assert trend run produced results
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
