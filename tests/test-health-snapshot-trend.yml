name: Test health snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clear stale snapshots
        run: rm -rf tests/fixtures/dirty-project/.fallow/snapshots
      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          save-snapshot: 'true'
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert snapshot saved
        run: |
          ls -la tests/fixtures/dirty-project/.fallow/snapshots || true
          if [ -z "$(ls -A tests/fixtures/dirty-project/.fallow/snapshots 2>/dev/null)" ]; then
            echo "FAIL: no snapshot written to .fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          trend: 'true'
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert trend run produced results
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
