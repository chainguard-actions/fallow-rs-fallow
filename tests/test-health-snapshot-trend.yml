name: Test health snapshot then trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          score: 'true'
          save-snapshot: 'true'
          artifacts-dir: fallow-artifacts-snapshot
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          score: 'true'
          trend: 'true'
          artifacts-dir: fallow-artifacts-trend
      - name: Assert both runs produced results
        env:
          ISSUES1: ${{ steps.snapshot.outputs.issues }}
          ISSUES2: ${{ steps.trend.outputs.issues }}
          RESULTS2: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $ISSUES1"
          echo "trend issues: $ISSUES2"
          echo "trend results: $RESULTS2"
          for v in "$ISSUES1" "$ISSUES2"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output '$v' is not a number"
              exit 1
            fi
          done
          case "$RESULTS2" in
            /*) FILE="$RESULTS2" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS2" ;;
          esac
          if [ -z "$RESULTS2" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: trend results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "snapshot files:"
          find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f 2>/dev/null | head -n 20 || true
          echo "PASS"
