name: Test health snapshot save and trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare snapshot directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/clean-project/.fallow/snapshots"
      - id: save
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-snapshot: ${{ github.workspace }}/tests/fixtures/clean-project/.fallow/snapshots/test-snapshot.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert snapshot written
        run: |
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/clean-project/.fallow/snapshots" || true
          if [ ! -e "$GITHUB_WORKSPACE/tests/fixtures/clean-project/.fallow/snapshots/test-snapshot.json" ]; then
            echo "FAIL: snapshot not written"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert trend run output
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
