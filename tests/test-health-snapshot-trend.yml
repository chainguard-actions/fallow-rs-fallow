name: Test health save-snapshot followed by trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: snapshot
        uses: .
        with:
          command: health
          score: 'true'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert a snapshot was saved
        run: |
          ls -la "$GITHUB_WORKSPACE/.fallow/snapshots" || true
          COUNT=$(find "$GITHUB_WORKSPACE/.fallow/snapshots" -type f 2>/dev/null | wc -l)
          echo "snapshot files: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one snapshot file"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          score: 'true'
          trend: 'true'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert trend run produced results
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "results: $RESULTS issues: $ISSUES"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          echo "PASS"
