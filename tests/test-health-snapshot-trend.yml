name: Test health snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare writable copy of the fixture
        run: |
          rm -rf snapshot-project
          cp -r tests/fixtures/dead-code-project snapshot-project
          chmod -R u+w snapshot-project
      - id: save
        uses: .
        with:
          command: health
          root: snapshot-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-snapshot: 'true'
      - name: Assert snapshot saved
        run: |
          ls -laR snapshot-project/.fallow 2>/dev/null || true
          count=$(find snapshot-project/.fallow/snapshots -type f 2>/dev/null | wc -l)
          echo "snapshot files: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: no snapshot written under snapshot-project/.fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: snapshot-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          trend: 'true'
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
