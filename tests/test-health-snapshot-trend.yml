name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          cat > "$D/src/index.ts" <<'EOF'
          export function main(n: number): number {
            if (n > 1) {
              return n - 1;
            }
            return n;
          }
          main(2);
          EOF

      - id: snapshot
        uses: .
        with:
          command: health
          root: fallow-test-sample
          save-snapshot: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert a snapshot was saved
        run: |
          ls -laR "$GITHUB_WORKSPACE/fallow-test-sample/.fallow" || true
          count=$(find "$GITHUB_WORKSPACE/fallow-test-sample/.fallow" "$GITHUB_WORKSPACE/.fallow" -path '*snapshots*' -type f 2>/dev/null | wc -l)
          echo "snapshot files: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: no snapshot saved under .fallow/snapshots"
            exit 1
          fi
          echo "PASS"

      - id: trend
        uses: .
        with:
          command: health
          root: fallow-test-sample
          trend: 'true'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
