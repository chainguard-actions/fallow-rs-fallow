name: Test health score with snapshot save and trend comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture into a scratch project
        run: |
          rm -rf snapshot-project
          cp -r tests/fixtures/unused-project snapshot-project
      - id: save
        uses: .
        with:
          command: health
          root: snapshot-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot-save
          type-aware: 'false'
          min-score: '0'
          save-snapshot: 'true'
      - name: Assert snapshot was saved
        run: |
          ls -la snapshot-project/.fallow/snapshots || true
          if [ -z "$(ls -A snapshot-project/.fallow/snapshots 2>/dev/null)" ]; then
            echo "FAIL: no snapshot written under snapshot-project/.fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: snapshot-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot-trend
          type-aware: 'false'
          score: 'true'
          trend: 'true'
      - name: Assert trend run produced results
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
          ISSUES: ${{ steps.trend.outputs.issues }}
        run: |
          echo "results: $RESULTS issues: $ISSUES"
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ] || ! jq empty "$f"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          echo "PASS"
