name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy fixture to a scratch project
        run: |
          rm -rf scratch-snapshot
          cp -r tests/fixtures/clean-project scratch-snapshot
      - id: save
        uses: .
        with:
          command: health
          root: scratch-snapshot
          version: '3.38.1'
          type-aware: 'false'
          save-snapshot: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot-save
      - name: Assert snapshot was saved
        run: |
          ls -laR scratch-snapshot/.fallow || true
          if ! ls scratch-snapshot/.fallow/snapshots/* >/dev/null 2>&1; then
            echo "FAIL: no snapshot written under scratch-snapshot/.fallow/snapshots"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: scratch-snapshot
          version: '3.38.1'
          type-aware: 'false'
          trend: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-snapshot-trend
      - name: Assert trend run produced results
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
