name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-snapshot: 'true'
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          trend: 'true'
      - name: Assert both runs produced results
        env:
          SNAP_ISSUES: ${{ steps.snapshot.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
          TREND_RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES"
          echo "trend issues: $TREND_ISSUES"
          echo "trend results: $TREND_RESULTS"
          ls -la tests/fixtures/dead-code-project/.fallow/snapshots 2>/dev/null || true
          if ! [[ "$SNAP_ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$TREND_ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$TREND_RESULTS" ] || [ ! -f "$TREND_RESULTS" ]; then
            echo "FAIL: trend results file missing"
            exit 1
          fi
          echo "PASS"
