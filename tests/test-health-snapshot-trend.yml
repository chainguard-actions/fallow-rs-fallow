name: Test health save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snap
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-snapshot: 'true'
          artifacts-dir: fallow-artifacts-snapshot
      - name: Show snapshot location
        run: |
          find "$GITHUB_WORKSPACE" -path '*snapshots*' -type f 2>/dev/null | head -20 || true
      - id: trend
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          trend: 'true'
          artifacts-dir: fallow-artifacts-trend
      - name: Assert both runs produced results
        env:
          SNAP_ISSUES: ${{ steps.snap.outputs.issues }}
          TREND_ISSUES: ${{ steps.trend.outputs.issues }}
          TREND_RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "snapshot issues: $SNAP_ISSUES"
          echo "trend issues: $TREND_ISSUES"
          echo "trend results: $TREND_RESULTS"
          for v in "$SNAP_ISSUES" "$TREND_ISSUES"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output '$v' is not a number"
              exit 1
            fi
          done
          case "$TREND_RESULTS" in
            /*) FILE="$TREND_RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$TREND_RESULTS" ;;
          esac
          if [ -z "$TREND_RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: trend results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
