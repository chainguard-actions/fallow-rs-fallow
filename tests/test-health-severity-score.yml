name: Test health severity and score gates (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: severity
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          min-severity: critical
          artifacts-dir: fallow-artifacts-severity
      - id: score
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          min-score: '0'
          artifacts-dir: fallow-artifacts-minscore
      - name: Assert both gates passed with results
        env:
          SEV_ISSUES: ${{ steps.severity.outputs.issues }}
          SCORE_ISSUES: ${{ steps.score.outputs.issues }}
          SCORE_RESULTS: ${{ steps.score.outputs.results }}
          GATES_FAILED: ${{ steps.score.outputs.gates-failed }}
        run: |
          echo "severity issues: $SEV_ISSUES"
          echo "score issues: $SCORE_ISSUES"
          echo "score results: $SCORE_RESULTS"
          echo "gates failed: $GATES_FAILED"
          for v in "$SEV_ISSUES" "$SCORE_ISSUES"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output '$v' is not a number"
              exit 1
            fi
          done
          case "$SCORE_RESULTS" in
            /*) FILE="$SCORE_RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$SCORE_RESULTS" ;;
          esac
          if [ -z "$SCORE_RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
