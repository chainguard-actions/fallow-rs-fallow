name: Test health min-score gate with snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snap
        uses: .
        with:
          command: health
          root: tests/act-fixtures/clean-project
          min-score: '0'
          save-snapshot: 'true'
          artifacts-dir: fallow-out-snap
      - name: Assert min-score and snapshot flags forwarded
        env:
          ISSUES: ${{ steps.snap.outputs.issues }}
        run: |
          ARGS_FILE="fallow-out-snap/fallow-analysis-args.sh"
          cat "$ARGS_FILE"
          grep -qF -- "--min-score 0" "$ARGS_FILE" || { echo "FAIL: --min-score not forwarded"; exit 1; }
          grep -qF -- "--complexity" "$ARGS_FILE" || { echo "FAIL: --complexity not implied by min-score"; exit 1; }
          grep -qF -- "--save-snapshot" "$ARGS_FILE" || { echo "FAIL: --save-snapshot not forwarded"; exit 1; }
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          command: health
          root: tests/act-fixtures/clean-project
          trend: 'true'
          fail-on-issues: 'false'
          artifacts-dir: fallow-out-trend
      - name: Assert trend flag forwarded and results produced
        env:
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          ARGS_FILE="fallow-out-trend/fallow-analysis-args.sh"
          cat "$ARGS_FILE"
          grep -qF -- "--trend" "$ARGS_FILE" || { echo "FAIL: --trend not forwarded"; exit 1; }
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq -e '.' "$RESULTS" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
