name: Test dupes command with token/line/threshold options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          dupes-mode: strict
          min-tokens: '30'
          min-lines: '3'
          threshold: '0'
      - name: Assert clone-group count and results
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$f" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
