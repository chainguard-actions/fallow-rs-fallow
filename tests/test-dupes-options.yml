name: Test dupes option inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project for duplication analysis
        run: |
          mkdir -p /tmp/fallow-dupes-opts
          cat > /tmp/fallow-dupes-opts/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dupes-opts/index.js <<'EOF'
          export function blockA(a, b, c) {
            const x = a + b;
            const y = b + c;
            const z = a + c;
            return x + y + z;
          }
          export function blockB(a, b, c) {
            const x = a + b;
            const y = b + c;
            const z = a + c;
            return x + y + z;
          }
          EOF
      - name: Run with min-lines, min-tokens, threshold inputs
        id: with-dupes-opts
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-opts
          format: json
          fail-on-issues: 'false'
          min-lines: '3'
          min-tokens: '20'
          threshold: '0'
          auto-changed-since: 'false'
      - name: Assert dupes options step ran
        env:
          OUTCOME: ${{ steps.with-dupes-opts.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: dupes options step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
