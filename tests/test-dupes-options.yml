name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project with duplicated code
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          for f in a b; do
            cat > "fallow-sample/src/format-$f.js" <<'EOF'
          export function format(items) {
            const out = [];
            for (const item of items) {
              if (item === null || item === undefined) {
                continue;
              }
              const label = String(item).trim().toUpperCase();
              out.push(label + ':' + label.length);
            }
            out.sort();
            return out.join(', ');
          }
          EOF
          done
          cat > fallow-sample/src/index.js <<'EOF'
          import { format as fa } from './format-a.js';
          import { format as fb } from './format-b.js';
          console.log(fa(['x']), fb(['y']));
          EOF

      - id: action
        uses: .
        with:
          command: dupes
          root: fallow-sample
          min-tokens: '10'
          min-lines: '3'
          threshold: '100'
          top: '3'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues numeric and results valid
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
