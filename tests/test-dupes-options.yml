name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with duplicated code
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src
          echo '{"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}' > fx/package.json
          for f in a b; do
            cat > fx/src/$f.js <<'EOF'
          export function process(items) {
            const result = [];
            for (const item of items) {
              if (item.enabled && item.value > 10) {
                result.push({ id: item.id, value: item.value * 2, label: String(item.name).toUpperCase() });
              } else {
                result.push({ id: item.id, value: 0, label: 'disabled' });
              }
            }
            return result.sort((x, y) => x.value - y.value);
          }
          EOF
          done
          cat > fx/src/index.js <<'EOF'
          import { process as pa } from './a.js';
          import { process as pb } from './b.js';
          console.log(pa([]), pb([]));
          EOF

      - id: action
        uses: .
        with:
          root: fx
          command: dupes
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
