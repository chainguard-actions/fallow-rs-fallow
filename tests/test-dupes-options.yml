name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with duplicated code
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-dupes"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-dupes","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { computeA } from './dup-a.js';
          import { computeB } from './dup-b.js';
          console.log(computeA(4), computeB(5));
          EOF
          for name in A B; do
            lower=$(echo "$name" | tr 'A-Z' 'a-z')
            {
              echo "export function compute${name}(input) {"
              echo "  let total = 0;"
              for i in $(seq 1 30); do
                echo "  total += input * ${i} + Math.floor(input / ${i}) - (${i} % 3);"
              done
              echo "  return total;"
              echo "}"
            } > "$D/src/dup-${lower}.js"
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: fx-dupes
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert clone groups detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES gates-failed: '$FAILED'"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one clone group"
            jq . "$RESULTS" | head -80
            exit 1
          fi
          if echo "$FAILED" | grep -q 'duplication-threshold'; then
            echo "FAIL: threshold 100 should never fail"
            exit 1
          fi
          echo "PASS"
