name: Test dupes with min-tokens, min-lines and threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '10'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert dupes ran and threshold gate passed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if echo "$FAILED" | grep -q "duplication-threshold"; then
            echo "FAIL: threshold 100% should never fail"
            exit 1
          fi
          echo "PASS"
