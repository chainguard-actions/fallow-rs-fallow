name: Test dupes option inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project with duplication
        run: |
          mkdir -p /tmp/fallow-test-dupes
          cat > /tmp/fallow-test-dupes/package.json <<'EOF'
          {
            "name": "test-dupes",
            "version": "1.0.0",
            "scripts": { "start": "node a.js" }
          }
          EOF
          cat > /tmp/fallow-test-dupes/a.js <<'EOF'
          function processData(x, y, z) {
            const result = x + y + z;
            const doubled = result * 2;
            return doubled;
          }
          module.exports = { processData };
          EOF
          cat > /tmp/fallow-test-dupes/b.js <<'EOF'
          function processData(x, y, z) {
            const result = x + y + z;
            const doubled = result * 2;
            return doubled;
          }
          module.exports = { processData };
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-test-dupes
          fail-on-issues: 'false'
          min-tokens: '50'
          min-lines: '3'
          threshold: '0'
          format: json
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
