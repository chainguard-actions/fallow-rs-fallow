name: Test dupes command with tuning options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.37.0'
          min-tokens: '30'
          min-lines: '3'
          threshold: '50'
          dupes-mode: strict
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert no clones
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 clone groups"
            exit 1
          fi
          echo "PASS"
