name: Test dupes with token/line minimums and threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'true'
          format: json
          dupes-mode: strict
          min-tokens: '50'
          min-lines: '5'
          threshold: '100'
          top: '10'
      - name: Assert no clone groups
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 clone groups on clean fixture"
            exit 1
          fi
          if [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
