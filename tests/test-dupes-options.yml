name: Test dupes command with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with duplicated code
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/dupes-opts-project"
          mkdir -p "$P/src"
          echo '{"name":"dupes-opts-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          for f in a b; do
          cat > "$P/src/$f.js" <<'EOF'
          export function process(items) {
            const result = [];
            for (let i = 0; i < items.length; i++) {
              const item = items[i];
              if (item.active && item.value > 10) {
                result.push({ id: item.id, value: item.value * 2, label: String(item.name).toUpperCase() });
              }
            }
            return result.sort((x, y) => x.value - y.value);
          }
          EOF
          done
          sed -i 's/process/processA/' "$P/src/a.js"
          sed -i 's/process/processB/' "$P/src/b.js"
          cat > "$P/src/index.js" <<'EOF'
          import { processA } from './a.js';
          import { processB } from './b.js';
          console.log(processA([]), processB([]));
          EOF

      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dupes-opts-project
          format: json
          min-tokens: '10'
          min-lines: '2'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
