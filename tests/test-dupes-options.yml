name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with duplicated code
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/dupes-options"
          mkdir -p "$P/src"
          echo '{"name":"dupes-options","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          for f in a b; do
            cat > "$P/src/$f.js" <<'EOF'
          export function process(items) {
            const result = [];
            for (const item of items) {
              if (item.active && item.value > 10) {
                result.push({ id: item.id, value: item.value * 2, label: String(item.name).toUpperCase() });
              } else if (item.value < 0) {
                result.push({ id: item.id, value: 0, label: 'negative' });
              }
            }
            return result.sort((x, y) => x.value - y.value);
          }
          EOF
          done
          cat > "$P/src/index.js" <<'EOF'
          import { process as pa } from './a.js';
          import { process as pb } from './b.js';
          console.log(pa([]), pb([]));
          EOF

      - id: action
        uses: .
        with:
          command: dupes
          root: act-fixtures/dupes-options
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          min-tokens: '20'
          min-lines: '3'
          threshold: '100'
          top: '3'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
