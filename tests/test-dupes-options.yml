name: Test dupes command with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with duplicated code
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/dupes-options"
          mkdir -p "$P/src"
          echo '{"name":"dupes-options","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          for f in a b; do
            cat > "$P/src/$f.js" <<'EOF'
          export function compute(items) {
            let total = 0;
            for (const item of items) {
              if (item.enabled) {
                total += item.price * item.quantity;
              } else {
                total -= item.discount || 0;
              }
            }
            const tax = total * 0.21;
            const shipping = total > 100 ? 0 : 9.95;
            return total + tax + shipping;
          }
          EOF
          done
          cat > "$P/src/index.js" <<'EOF'
          import { compute } from './a.js';
          import { compute as compute2 } from './b.js';
          console.log(compute([]), compute2([]));
          EOF

      # threshold 100 can never be exceeded, so the run must succeed.
      - id: action
        uses: .
        with:
          command: dupes
          root: fallow-fixtures/dupes-options
          format: json
          min-tokens: '10'
          min-lines: '3'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output and results file
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
