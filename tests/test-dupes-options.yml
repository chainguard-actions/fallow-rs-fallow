name: Test dupes with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with duplicated code
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/dupes-options-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "dupes-options-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/a.js"
          }
          EOF
          for f in a b; do
          cat > "$P/src/$f.js" <<EOF
          export function process_$f(user) {
            const name = user.name.trim();
            const email = user.email.toLowerCase();
            const age = parseInt(user.age, 10);
            if (!name || !email || isNaN(age)) {
              throw new Error('Invalid user data');
            }
            return { name, email, age };
          }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dupes-options-project
          min-tokens: '10'
          min-lines: '3'
          threshold: '100'
          top: '5'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
