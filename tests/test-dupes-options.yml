name: Test dupes command with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/js-project
          format: json
          min-tokens: '30'
          min-lines: '3'
          threshold: '100'
          top: '3'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert dupes results have stats
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing: '$RESULTS'"
            exit 1
          fi
          GROUPS=$(jq -r '.stats.clone_groups' "$RESULTS")
          echo "clone_groups: $GROUPS"
          if ! echo "$GROUPS" | grep -qE '^[0-9]+$'; then
            echo "FAIL: .stats.clone_groups missing"
            exit 1
          fi
          echo "PASS"

      - name: Assert threshold 100 gate did not fail
        env:
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "gates-failed: '$GATES_FAILED'"
          if echo "$GATES_FAILED" | grep -q 'threshold'; then
            echo "FAIL: duplication threshold 100% should never fail"
            exit 1
          fi
          echo "PASS"
