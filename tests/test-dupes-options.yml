name: Test dupes with tuning options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-dupes-options
          min-tokens: '30'
          min-lines: '3'
          threshold: '100'
          top: '10'
      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          ARGS_FILE=fallow-out-dupes-options/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in --min-tokens --min-lines --threshold --top; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: $flag not forwarded"
              exit 1
            fi
          done
          echo "PASS"
