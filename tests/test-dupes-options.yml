name: Test duplication command options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for duplication analysis
        run: |
          mkdir -p /tmp/fallow-dupes-project
          cat > /tmp/fallow-dupes-project/a.js << 'EOF'
          export function doSomething(x) {
            const result = x * 2;
            return result + 1;
          }
          EOF
          cat > /tmp/fallow-dupes-project/b.js << 'EOF'
          export function doSomethingElse(x) {
            const result = x * 2;
            return result + 1;
          }
          EOF
          cat > /tmp/fallow-dupes-project/package.json << 'EOF'
          { "name": "dupes-test-project", "version": "1.0.0", "type": "module" }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-project
          fail-on-issues: 'false'
          min-tokens: '20'
          min-lines: '3'
          threshold: '0'
          format: json
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
