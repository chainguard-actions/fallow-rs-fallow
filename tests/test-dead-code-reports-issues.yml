name: Test dead-code reports issues without failing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/project-unused
          version: 3.42.0
          fail-on-issues: 'false'
          type-aware: 'false'
      - name: Assert issues were detected
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused code issue"
            exit 1
          fi
          echo "PASS"
      - name: Assert results file exists and mentions unused code
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq . "$RESULTS" > /dev/null || { echo "FAIL: results not valid JSON"; exit 1; }
          if ! grep -qE 'orphan|unusedHelper' "$RESULTS"; then
            echo "FAIL: expected orphan.js or unusedHelper in results"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
      - name: Assert verdict empty for non-audit command
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: '$VERDICT'"
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty for dead-code"
            exit 1
          fi
          echo "PASS"
