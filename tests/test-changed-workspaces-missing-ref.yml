name: Test changed-workspaces with a missing ref is a hard error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.46.0'
          fail-on-issues: 'false'
          changed-workspaces: refs/heads/this-ref-does-not-exist-fallow
          artifacts-dir: fallow-artifacts-changed-ws
      - name: Assert the action failed instead of falling back to full scope
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected a hard error for a missing changed-workspaces ref"
            exit 1
          fi
          echo "PASS"
