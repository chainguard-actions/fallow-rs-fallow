name: Test changed-workspaces with a missing ref is a hard error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample monorepo
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-monorepo"
          rm -rf "$D"
          mkdir -p "$D/packages/pkg-a"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          printf '{"name":"pkg-a","version":"1.0.0","main":"index.ts"}\n' > "$D/packages/pkg-a/package.json"
          printf 'export const a = 1;\n' > "$D/packages/pkg-a/index.ts"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: fallow-test-monorepo
          changed-workspaces: refs/heads/fallow-test-ref-that-does-not-exist
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed on missing ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing changed-workspaces ref"
            exit 1
          fi
          echo "PASS"
