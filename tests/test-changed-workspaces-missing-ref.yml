name: Test changed-workspaces with a missing ref is a hard error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.36.0'
          fail-on-issues: 'false'
          changed-workspaces: refs/heads/this-ref-does-not-exist-xyz
          artifacts-dir: fallow-artifacts-changed-workspaces
      - name: Assert action failed on missing ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing changed-workspaces ref (documented exit 2)"
            exit 1
          fi
          echo "PASS"
