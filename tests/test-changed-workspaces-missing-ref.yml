name: Test changed-workspaces with a missing ref fails hard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/cw-monorepo"
          mkdir -p "$R/packages/web/src"
          echo '{"name":"cw-monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > "$R/package.json"
          echo '{"name":"web","version":"1.0.0","type":"module","main":"src/index.js"}' > "$R/packages/web/package.json"
          echo 'export const x = 1;' > "$R/packages/web/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/cw-monorepo
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          changed-workspaces: refs/heads/this-ref-does-not-exist-xyz

      - name: Assert action failed on missing ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing changed-workspaces ref"
            exit 1
          fi
          echo "PASS"
