name: Test changed-workspaces with a missing git ref fails hard
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/changed-ws-monorepo"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "changed-ws-monorepo", "private": true, "workspaces": ["packages/*"] }
          EOF
          for pkg in web admin; do
            printf '{ "name": "%s", "version": "1.0.0", "type": "module", "main": "src/index.js" }\n' "$pkg" > "$P/packages/$pkg/package.json"
            echo "export const $pkg = 1;" > "$P/packages/$pkg/src/index.js"
          done

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/changed-ws-monorepo
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          changed-workspaces: refs/heads/this-ref-does-not-exist-xyz

      - name: Assert the action failed on the missing ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing changed-workspaces ref"
            exit 1
          fi
          echo "PASS"
