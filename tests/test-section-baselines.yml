name: Test combined run with health-baseline and dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare baseline directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/.act-section-bl"
          mkdir -p "$GITHUB_WORKSPACE/.act-section-bl"

      - id: save-health
        uses: .
        with:
          command: health
          save-baseline: .act-section-bl/health.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          command: dupes
          save-baseline: .act-section-bl/dupes.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baselines were saved
        run: |
          for f in health.json dupes.json; do
            if [ ! -s "$GITHUB_WORKSPACE/.act-section-bl/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          health-baseline: .act-section-bl/health.json
          dupes-baseline: .act-section-bl/dupes.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"

      - name: Clean up
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.act-section-bl"
