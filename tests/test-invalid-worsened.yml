name: Test audit rejects an invalid worsened value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/act-fixtures/sample-project
          gate: all
          worsened: sometimes
          artifacts-dir: fallow-out-worsened-invalid
      - name: Assert validation failure before analysis
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: invalid worsened must fail the action"
            exit 1
          fi
          if [ -f "fallow-out-worsened-invalid/fallow-analysis-args.sh" ]; then
            echo "FAIL: fallow should not run when worsened is invalid"
            exit 1
          fi
          echo "PASS"
