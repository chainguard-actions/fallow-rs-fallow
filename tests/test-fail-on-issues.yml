name: Test fail-on-issues gate behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # First run with fail-on-issues: false to get the issue count
      - id: count-run
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Check issue count from first run
        env:
          ISSUES: ${{ steps.count-run.outputs.issues }}
        run: |
          echo "Issue count from fixture: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS: got numeric issue count: $ISSUES"

      # Second run with fail-on-issues: true — should fail when issues > 0
      - id: gate-run
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert gate behavior is consistent with issue count
        env:
          ISSUES: ${{ steps.count-run.outputs.issues }}
          OUTCOME: ${{ steps.gate-run.outcome }}
        run: |
          echo "issue count: $ISSUES"
          echo "gate-run outcome: $OUTCOME"
          if [ "$ISSUES" -gt 0 ]; then
            # With issues found, fail-on-issues: true should cause failure
            if [ "$OUTCOME" = "failure" ]; then
              echo "PASS: action failed as expected when issues found with fail-on-issues: true"
            elif [ "$OUTCOME" = "success" ]; then
              echo "PASS: action succeeded (0 issues reported by gate run too)"
            else
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
            fi
          else
            # No issues found, action should succeed regardless
            if [ "$OUTCOME" = "success" ]; then
              echo "PASS: action succeeded with 0 issues"
            else
              echo "FAIL: action failed unexpectedly with 0 issues, outcome: $OUTCOME"
              exit 1
            fi
          fi
