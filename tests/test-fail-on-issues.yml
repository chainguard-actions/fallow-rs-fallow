name: Test fail-on-issues fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/act-fixtures/sample-project
          fail-on-issues: 'true'
          artifacts-dir: fallow-out-fail
      - name: Assert action failed because issues were found
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected a positive issue count to be published before failing"
            exit 1
          fi
          if [ ! -f fallow-out-fail/fallow-results.json ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
