name: Test security-gate rejects an invalid value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: security
          root: tests/fixtures/simple-js
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          security-gate: bogus-gate

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME results: '$RESULTS'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected invalid security-gate to fail the action"
            exit 1
          fi
          if [ -n "$RESULTS" ]; then
            echo "FAIL: no results should be produced when validation fails"
            exit 1
          fi
          echo "PASS"
