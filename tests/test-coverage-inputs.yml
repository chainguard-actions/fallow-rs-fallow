name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-cov-project
          cat > /tmp/fallow-cov-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-cov-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0" }
          EOF
          # Create a minimal Istanbul coverage-final.json
          cat > /tmp/fallow-coverage.json << 'EOF'
          {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-cov-project
          fail-on-issues: 'false'
          format: json
          annotations: 'false'
          auto-changed-since: 'false'
          coverage: /tmp/fallow-coverage.json
          coverage-root: /tmp/fallow-cov-project
          runtime-coverage: /tmp/fallow-coverage.json
          min-invocations-hot: '50'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
