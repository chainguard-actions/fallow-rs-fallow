name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-test-coverage
          cat > /tmp/fallow-test-coverage/package.json <<'EOF'
          {
            "name": "test-coverage-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-coverage/index.js <<'EOF'
          export function add(a, b) { return a + b; }
          export function subtract(a, b) { return a - b; }
          EOF
          cat > /tmp/fallow-coverage.json <<'EOF'
          {
            "/tmp/fallow-test-coverage/index.js": {
              "path": "/tmp/fallow-test-coverage/index.js",
              "statementMap": {"0": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 40}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 40}}, "loc": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 40}}}},
              "branchMap": {},
              "s": {"0": 5},
              "f": {"0": 5},
              "b": {}
            }
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-coverage
          format: json
          fail-on-issues: 'false'
          coverage: /tmp/fallow-coverage.json
          coverage-root: /tmp/fallow-test-coverage
          runtime-coverage: /tmp/fallow-coverage.json
          min-invocations-hot: '50'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
