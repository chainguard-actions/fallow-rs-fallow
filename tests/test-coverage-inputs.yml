name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-test-coverage
          cat > /tmp/fallow-test-coverage/package.json <<'EOF'
          {
            "name": "test-coverage-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-coverage/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) { return a; }
            return b;
          }
          EOF
          cat > /tmp/fallow-test-coverage/coverage-final.json <<'EOF'
          {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-coverage
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          coverage: /tmp/fallow-test-coverage/coverage-final.json
          coverage-root: /tmp/fallow-test-coverage
          runtime-coverage: /tmp/fallow-test-coverage/coverage-final.json
          min-invocations-hot: '50'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          annotations: 'false'
      - name: Assert action ran with coverage inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with coverage inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (coverage file may not be valid Istanbul format)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
