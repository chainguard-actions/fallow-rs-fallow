name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-coverage-project
          cat > /tmp/fallow-coverage-project/package.json <<'EOF'
          {
            "name": "coverage-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-coverage-project/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) return a;
            return b;
          }
          EOF
          # Create a minimal Istanbul coverage-final.json
          cat > /tmp/fallow-coverage.json <<'EOF'
          {
            "/tmp/fallow-coverage-project/index.js": {
              "path": "/tmp/fallow-coverage-project/index.js",
              "statementMap": {"0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 20}}},
              "fnMap": {"0": {"name": "simple", "decl": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 30}}, "loc": {"start": {"line": 1, "column": 0}, "end": {"line": 4, "column": 1}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 5},
              "f": {"0": 5},
              "b": {}
            }
          }
          EOF
      - name: Run health with coverage inputs
        id: health-coverage
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-coverage-project
          format: json
          fail-on-issues: 'false'
          coverage: /tmp/fallow-coverage.json
          coverage-root: /tmp/fallow-coverage-project
          min-invocations-hot: '50'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          auto-changed-since: 'false'
      - name: Assert health-coverage step ran
        env:
          OUTCOME: ${{ steps.health-coverage.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: health-coverage step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Run health with runtime-coverage input
        id: health-runtime-coverage
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-coverage-project
          format: json
          fail-on-issues: 'false'
          runtime-coverage: /tmp/fallow-coverage.json
          auto-changed-since: 'false'
      - name: Assert health-runtime-coverage step ran
        env:
          OUTCOME: ${{ steps.health-runtime-coverage.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: health-runtime-coverage step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
