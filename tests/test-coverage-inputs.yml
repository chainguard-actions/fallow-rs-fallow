name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-coverage-project
          cat > /tmp/fallow-coverage-project/package.json <<'EOF'
          {
            "name": "coverage-test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-coverage-project/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) {
              return a;
            }
            return b;
          }
          EOF
          cat > /tmp/fallow-coverage-project/coverage-final.json <<'EOF'
          {}
          EOF

      - name: Run health with coverage inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-coverage-project
          format: json
          fail-on-issues: 'false'
          coverage: /tmp/fallow-coverage-project/coverage-final.json
          coverage-root: /tmp/fallow-coverage-project
          runtime-coverage: ''
          min-invocations-hot: '50'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
