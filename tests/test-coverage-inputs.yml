name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          export function world() { return 'world'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-coverage.json << 'EOF'
          {
            "/tmp/fallow-test-project/index.js": {
              "path": "/tmp/fallow-test-project/index.js",
              "statementMap": {},
              "fnMap": {},
              "branchMap": {},
              "s": {},
              "f": {},
              "b": {}
            }
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          coverage: /tmp/fallow-coverage.json
          coverage-root: /tmp/fallow-test-project
          runtime-coverage: /tmp/fallow-coverage.json
          min-invocations-hot: '100'
          min-observation-volume: '1000'
          low-traffic-threshold: '0.01'
      - name: Assert action ran with coverage inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with coverage inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
