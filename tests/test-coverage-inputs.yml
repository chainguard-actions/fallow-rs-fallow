name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal Istanbul coverage-final.json fixture
      - name: Create coverage fixture
        run: |
          mkdir -p /tmp/fallow-coverage
          cat > /tmp/fallow-coverage/coverage-final.json << 'EOF'
          {}
          EOF
          mkdir -p /tmp/fallow-runtime-coverage
          cat > /tmp/fallow-runtime-coverage/coverage-final.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          coverage: /tmp/fallow-coverage/coverage-final.json
          coverage-root: .
          runtime-coverage: /tmp/fallow-runtime-coverage/coverage-final.json
          min-invocations-hot: '50'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          auto-changed-since: 'false'

      - name: Assert coverage inputs run completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
