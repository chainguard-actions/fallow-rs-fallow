name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Istanbul coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.coverage"
          cat > "$GITHUB_WORKSPACE/.coverage/coverage-final.json" <<'EOF'
          {}
          EOF
      - id: action
        uses: .
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          coverage: '.coverage/coverage-final.json'
          coverage-root: '.'
          runtime-coverage: '.coverage/coverage-final.json'
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          auto-changed-since: 'false'
          threads: '2'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage inputs accepted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (coverage file may not be valid)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
