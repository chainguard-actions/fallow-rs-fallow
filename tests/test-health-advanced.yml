name: Test health advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for health analysis
        run: |
          mkdir -p /tmp/fallow-health-test
          cat > /tmp/fallow-health-test/package.json << 'EOF'
          {
            "name": "health-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-health-test/index.js << 'EOF'
          export function simple(a, b) {
            if (a > b) {
              return a;
            } else if (a < b) {
              return b;
            } else {
              return 0;
            }
          }
          export function another(x) {
            return x * 2;
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-health-test
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          min-severity: 'high'
          min-score: ''
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '3'
          save-snapshot: ''
          trend: 'false'
          score: 'true'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
