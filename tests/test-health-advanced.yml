name: Test health advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/js-health/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-health/package.json" <<'EOF'
          {
            "name": "test-health-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-health/src/index.js" <<'EOF'
          export function complexFunction(a, b, c, d, e) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) {
                    if (e > 0) {
                      return a + b + c + d + e;
                    } else {
                      return a + b + c + d;
                    }
                  } else {
                    return a + b + c;
                  }
                } else {
                  return a + b;
                }
              } else {
                return a;
              }
            }
            return 0;
          }
          complexFunction(1, 2, 3, 4, 5);
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/js-health
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '50.0'
          min-severity: 'high'
          min-score: '0'
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '1'
          save-snapshot: ''
          trend: 'false'
          coverage: ''
          coverage-root: ''
          runtime-coverage: ''
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          threads: '2'
          no-cache: 'true'

      - name: Assert action ran (health advanced inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected on minimal fixture)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
