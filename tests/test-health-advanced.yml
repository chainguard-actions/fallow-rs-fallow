name: Test health advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for health analysis
        run: |
          mkdir -p /tmp/fallow-health-project
          cat > /tmp/fallow-health-project/index.js << 'EOF'
          export function simple(a, b) {
            if (a > b) { return a; }
            return b;
          }
          export function complex(a, b, c, d) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) { return a + b + c + d; }
                  return a + b + c;
                }
                return a + b;
              }
              return a;
            }
            return 0;
          }
          EOF
          cat > /tmp/fallow-health-project/package.json << 'EOF'
          { "name": "health-test", "version": "1.0.0", "type": "module" }
          EOF

      - id: action-health-advanced
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-health-project
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          min-severity: 'moderate'
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '3'
          save-snapshot: '/tmp/fallow-snapshot'
          trend: 'false'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert health advanced step ran
        env:
          OUTCOME: ${{ steps.action-health-advanced.outcome }}
          ISSUES: ${{ steps.action-health-advanced.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-min-score
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-health-project
          format: json
          fail-on-issues: 'false'
          min-score: '0'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert min-score step ran
        env:
          OUTCOME: ${{ steps.action-min-score.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with min-score (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
