name: Test advanced health inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() {
            let x = 1;
            if (x > 0) {
              if (x > 1) {
                if (x > 2) {
                  return 'deep';
                }
              }
            }
            return 'hello';
          }
          export function world() { return 'world'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
          mkdir -p /tmp/fallow-snapshots
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          max-cyclomatic: '20'
          max-cognitive: '15'
          max-crap: '30'
          min-severity: moderate
          min-score: '0'
          sort: cyclomatic
          top: '10'
          since: 1y
          min-commits: '1'
          score: 'true'
          save-snapshot: /tmp/fallow-snapshots
      - name: Assert action ran with advanced health inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
  test-trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
          mkdir -p /tmp/fallow-snapshots
      - id: action-trend
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          score: 'true'
          trend: 'true'
          save-snapshot: /tmp/fallow-snapshots
      - name: Assert action ran with trend input
        env:
          OUTCOME: ${{ steps.action-trend.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
