name: Test health advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '40'
          coverage: 'coverage/coverage-final.json'
          coverage-root: '.'
          runtime-coverage: 'coverage/v8'
          min-invocations-hot: '200'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          top: '10'
          sort: 'cyclomatic'
          since: '6m'
          min-commits: '5'
          min-severity: 'high'
          min-score: '50'
          save-snapshot: '.fallow/snapshots'
          trend: 'true'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with health advanced inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
