name: Test health advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for health analysis
        run: |
          mkdir -p /tmp/fallow-health-project
          cat > /tmp/fallow-health-project/package.json <<'EOF'
          {
            "name": "health-test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-health-project/index.js <<'EOF'
          export function simple(a, b) {
            if (a > b) {
              return a;
            } else {
              return b;
            }
          }
          EOF

      - name: Run health with advanced inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-health-project
          format: json
          fail-on-issues: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '50'
          min-severity: 'high'
          min-score: ''
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '1'
          save-snapshot: ''
          trend: ''
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
