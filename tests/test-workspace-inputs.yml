name: Test workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-mono-project/packages/app
          cat > /tmp/fallow-mono-project/package.json <<'EOF'
          {
            "name": "mono-root",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-mono-project/packages/app/package.json <<'EOF'
          {
            "name": "app",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-mono-project/packages/app/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      - name: Run dead-code with workspace input
        id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono-project
          format: json
          fail-on-issues: 'false'
          workspace: 'app'
          changed-workspaces: ''
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
