name: Test workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal monorepo-style project
        run: |
          mkdir -p /tmp/fallow-mono-project/packages/web
          mkdir -p /tmp/fallow-mono-project/packages/admin
          cat > /tmp/fallow-mono-project/packages/web/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-mono-project/packages/web/package.json << 'EOF'
          { "name": "web", "version": "1.0.0" }
          EOF
          cat > /tmp/fallow-mono-project/packages/admin/index.js << 'EOF'
          export function admin() { return 'admin'; }
          EOF
          cat > /tmp/fallow-mono-project/packages/admin/package.json << 'EOF'
          { "name": "admin", "version": "1.0.0" }
          EOF
          cat > /tmp/fallow-mono-project/package.json << 'EOF'
          { "name": "monorepo", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono-project
          fail-on-issues: 'false'
          format: json
          annotations: 'false'
          auto-changed-since: 'false'
          workspace: 'web'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
