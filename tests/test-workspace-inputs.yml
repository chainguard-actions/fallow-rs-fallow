name: Test workspace inputs
on:
  workflow_dispatch:
jobs:
  test-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Test workspace input (scope to a named workspace)
      - id: workspace-run
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          workspace: '*'
          auto-changed-since: 'false'

      - name: Assert workspace run completed
        env:
          OUTCOME: ${{ steps.workspace-run.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Test changed-workspaces input
      - id: changed-workspaces-run
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD~1'
          auto-changed-since: 'false'

      - name: Assert changed-workspaces run completed
        env:
          OUTCOME: ${{ steps.changed-workspaces-run.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
