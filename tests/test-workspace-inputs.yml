name: Test workspace inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-test-workspace/packages/web
          mkdir -p /tmp/fallow-test-workspace/packages/admin
          cat > /tmp/fallow-test-workspace/package.json <<'EOF'
          {
            "name": "test-workspace-root",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-test-workspace/packages/web/package.json <<'EOF'
          {
            "name": "web",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-workspace/packages/web/index.js <<'EOF'
          export function webUsed() { return 1; }
          export function webUnused() { return 2; }
          EOF
          cat > /tmp/fallow-test-workspace/packages/admin/package.json <<'EOF'
          {
            "name": "admin",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-workspace/packages/admin/index.js <<'EOF'
          export function adminUsed() { return 1; }
          export function adminUnused() { return 2; }
          EOF
      - id: action-workspace
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-workspace
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          workspace: 'web'
          annotations: 'false'
      - name: Assert workspace-scoped action ran
        env:
          OUTCOME: ${{ steps.action-workspace.outcome }}
          ISSUES: ${{ steps.action-workspace.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with workspace input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-workspace
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          changed-workspaces: 'HEAD~1'
          annotations: 'false'
      - name: Assert changed-workspaces action ran
        env:
          OUTCOME: ${{ steps.action-changed-workspaces.outcome }}
          ISSUES: ${{ steps.action-changed-workspaces.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with changed-workspaces input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected if git history is shallow or no changes)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
