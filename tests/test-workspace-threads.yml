name: Test workspace and threads inputs
on:
  workflow_dispatch:
jobs:
  test-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-mono/packages/web
          mkdir -p /tmp/fallow-mono/packages/admin
          cat > /tmp/fallow-mono/packages/web/index.js << 'EOF'
          export function webHello() { return 'web hello'; }
          EOF
          cat > /tmp/fallow-mono/packages/web/package.json << 'EOF'
          { "name": "web", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-mono/packages/admin/index.js << 'EOF'
          export function adminHello() { return 'admin hello'; }
          EOF
          cat > /tmp/fallow-mono/packages/admin/package.json << 'EOF'
          { "name": "admin", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-mono/package.json << 'EOF'
          { "name": "mono", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          workspace: web
          threads: '2'
      - name: Assert action ran with workspace and threads inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
