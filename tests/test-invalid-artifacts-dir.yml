name: Test artifacts-dir outside workspace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/act-fixtures/clean-project
          artifacts-dir: ../outside
      - name: Assert action failed and produced no results
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for artifacts-dir outside workspace"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have published issues"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/../outside/fallow-results.json" ]; then
            echo "FAIL: results were written outside the workspace"
            exit 1
          fi
          echo "PASS"
