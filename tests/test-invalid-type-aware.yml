name: Test invalid type-aware input is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: '3.39.0'
          type-aware: 'maybe'
          auto-changed-since: 'false'
      - name: Assert the action failed on the invalid type-aware value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for type-aware: maybe"
            exit 1
          fi
          echo "PASS"
