name: Test health command (complexity analysis)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for health analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/health-project/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/health-project/package.json" <<'EOF'
          {
            "name": "health-test-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/health-project/src/index.js" <<'EOF'
          export function simpleFunction(a, b) {
            return a + b;
          }
          export function complexFunction(a, b, c, d, e) {
            if (a > 0) {
              if (b > 0) {
                if (c > 0) {
                  if (d > 0) {
                    if (e > 0) {
                      return a + b + c + d + e;
                    } else {
                      return a + b + c + d;
                    }
                  } else {
                    return a + b + c;
                  }
                } else {
                  return a + b;
                }
              } else {
                return a;
              }
            } else {
              return 0;
            }
          }
          simpleFunction(1, 2);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/health-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected issues to be a number, got: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"

      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file exists and is valid JSON"
