name: Test dead-code config and issue-types inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project with config file
        run: |
          mkdir -p /tmp/fallow-test-config
          cat > /tmp/fallow-test-config/package.json <<'EOF'
          {
            "name": "test-config-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-config/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
          cat > /tmp/fallow-test-config/.fallowrc.json <<'EOF'
          {
            "entry": ["index.js"]
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-config
          config: /tmp/fallow-test-config/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          issue-types: 'unused-exports,unused-files'
          changed-since: 'HEAD'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
