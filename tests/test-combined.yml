name: Test combined (all analyses) mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run with no command — runs all analyses (dead-code, architecture, dupes, health)
      - id: action
        uses: .
        with:
          root: tests/fixtures/js-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert results output is set
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          echo "PASS: results output is set to $RESULTS"

      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "Checking results file: $RESULTS"
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at $RESULTS"
            exit 1
          fi
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file exists and is valid JSON"

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a non-negative integer: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues output is a valid number: $ISSUES"

      - name: Assert changed-files-unavailable output is set
        env:
          CFU: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "changed-files-unavailable: $CFU"
          if [ -z "$CFU" ]; then
            echo "FAIL: changed-files-unavailable output is empty"
            exit 1
          fi
          echo "PASS: changed-files-unavailable is set to: $CFU"
