name: Test combined run rejects control characters in dupes-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          root: tests/fixtures/sample-project
          version: 3.35.0
          dupes-baseline: "bad\npath.json"
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-db-ctrl
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected dupes-baseline with a newline to be rejected"
            exit 1
          fi
          echo "PASS"
