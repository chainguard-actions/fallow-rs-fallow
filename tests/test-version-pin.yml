name: Test version pin input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pin to a specific fallow version matching the action release
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/js-project
          format: json
          version: '3.34.1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert results output is set
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          echo "PASS: results output is set to $RESULTS"

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a non-negative integer: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues output is a valid number: $ISSUES"

      - name: Assert fallow version matches pinned version
        run: |
          INSTALLED=$(fallow --version 2>/dev/null || echo "unknown")
          echo "installed fallow version: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q "3.34.1"; then
            echo "FAIL: expected fallow 3.34.1 but got: $INSTALLED"
            exit 1
          fi
          echo "PASS: fallow 3.34.1 is installed"
