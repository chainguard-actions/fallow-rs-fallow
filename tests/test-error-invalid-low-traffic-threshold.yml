name: Test runtime coverage inputs reject invalid low-traffic-threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          coverage: coverage/coverage-final.json
          coverage-root: /ci/build
          runtime-coverage: coverage/v8
          min-invocations-hot: '100'
          min-observation-volume: '50'
          low-traffic-threshold: not-a-number
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid low-traffic-threshold"
            exit 1
          fi
          echo "PASS"
