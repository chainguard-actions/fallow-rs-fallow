name: Test scoping inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project for scoping tests
        run: |
          mkdir -p /tmp/fallow-scope-project
          cat > /tmp/fallow-scope-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-scope-project/package.json << 'EOF'
          { "name": "scope-test", "version": "1.0.0", "type": "module" }
          EOF

      - id: action-changed-since
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-scope-project
          format: json
          fail-on-issues: 'false'
          changed-since: 'HEAD~1'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert changed-since step ran
        env:
          OUTCOME: ${{ steps.action-changed-since.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with changed-since (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Create a monorepo-style project for workspace test
        run: |
          mkdir -p /tmp/fallow-mono-project/packages/web
          mkdir -p /tmp/fallow-mono-project/packages/api
          cat > /tmp/fallow-mono-project/packages/web/index.js << 'EOF'
          export function webHello() { return 'web hello'; }
          EOF
          cat > /tmp/fallow-mono-project/packages/api/index.js << 'EOF'
          export function apiHello() { return 'api hello'; }
          EOF
          cat > /tmp/fallow-mono-project/packages/web/package.json << 'EOF'
          { "name": "web", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-mono-project/packages/api/package.json << 'EOF'
          { "name": "api", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-mono-project/package.json << 'EOF'
          { "name": "mono-test", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF

      - id: action-workspace
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono-project
          format: json
          fail-on-issues: 'false'
          workspace: 'web'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert workspace step ran
        env:
          OUTCOME: ${{ steps.action-workspace.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with workspace input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono-project
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD~1'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert changed-workspaces step ran
        env:
          OUTCOME: ${{ steps.action-changed-workspaces.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with changed-workspaces (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
