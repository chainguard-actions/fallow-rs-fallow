name: Test combined run with skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/combined-skip"
          mkdir -p "$P/src"
          echo '{"name":"combined-skip","version":"1.0.0","type":"module","main":"src/index.js","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          echo 'export function add(a, b) { return a + b; }' > "$P/src/index.js"

      - id: action
        uses: .
        with:
          root: fallow-fixtures/combined-skip
          format: json
          skip: dupes
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output and results file
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
