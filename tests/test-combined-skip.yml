name: Test combined run with skip selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-test/skip"
          mkdir -p "$P/src"
          echo '{"name":"skip-project","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          printf 'export function used() { return 1; }\nused();\n' > "$P/src/index.js"

      - id: action
        uses: .
        with:
          root: fallow-test/skip
          format: json
          skip: dupes
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
