name: Test audit with dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Save dead-code baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-ab-dead
      - name: Save health baseline
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-ab-health
      - name: Save dupes baseline
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-ab-dupes
      - name: Assert baselines exist
        run: |
          for f in dead-code health dupes; do
            p="$GITHUB_WORKSPACE/fallow-audit-baselines/$f.json"
            if [ ! -f "$p" ]; then
              echo "FAIL: $p missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-ab-audit
      - name: Assert audit verdict
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict must be pass/warn/fail"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
