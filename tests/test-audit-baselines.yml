name: Test audit with per-analysis baselines and gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: dc-base
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-dc-base
      - id: health-base
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          artifacts-dir: fallow-artifacts-health-base
      - id: dupes-base
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
          artifacts-dir: fallow-artifacts-dupes-base
      - name: Assert baselines exist
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-audit-baselines"
          for f in dead-code.json health.json dupes.json; do
            [ -s "$GITHUB_WORKSPACE/fallow-audit-baselines/$f" ] || { echo "FAIL: $f missing"; exit 1; }
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
          artifacts-dir: fallow-artifacts-audit
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
