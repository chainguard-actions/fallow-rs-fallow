name: Test audit with dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-bl/dead-code.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-out-bl-dc
      - uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-bl/health.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-out-bl-health
      - uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-bl/dupes.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-out-bl-dupes
      - name: Assert baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-bl"
          for f in dead-code health dupes; do
            if [ ! -f "$GITHUB_WORKSPACE/fallow-bl/$f.json" ]; then
              echo "FAIL: $f baseline missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/fallow-bl/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-bl/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-bl/dupes.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-bl-audit
      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
