name: Test audit with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: '3.43.1'
          format: json
          save-baseline: ${{ github.workspace }}/bl-dead-code.json
          fail-on-issues: 'false'
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.43.1'
          format: json
          save-baseline: ${{ github.workspace }}/bl-health.json
          fail-on-issues: 'false'
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.43.1'
          format: json
          save-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
      - name: Assert baselines saved
        run: |
          for f in bl-dead-code.json bl-health.json bl-dupes.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: '3.43.1'
          format: json
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/bl-dead-code.json
          health-baseline: ${{ github.workspace }}/bl-health.json
          dupes-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'true'
      - name: Assert audit passed
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
        run: |
          echo "verdict: '$VERDICT'"
          case "$VERDICT" in
            pass|warn) echo "PASS" ;;
            *) echo "FAIL: expected pass/warn verdict for clean project"; exit 1 ;;
          esac
