name: Test audit with gate, worsened and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/fallow-audit-baselines"
          mkdir -p "$GITHUB_WORKSPACE/fallow-audit-baselines"
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-save-dc
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-save-health
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-save-dupes
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
      - name: Assert baselines saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-audit-baselines"
          for f in dead-code.json health.json dupes.json; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-audit-baselines/$f" ]; then
              echo "FAIL: $f not saved"
              exit 1
            fi
          done
          echo "PASS"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          changed-since: HEAD
          artifacts-dir: fallow-out-audit
          gate: all
          worsened: error
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
      - name: Assert audit outputs
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
          GATE: ${{ steps.audit.outputs.gate }}
          ISSUES: ${{ steps.audit.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          ARGS_FILE="fallow-out-audit/fallow-analysis-args.sh"
          cat "$ARGS_FILE"
          for flag in --gate --worsened --dead-code-baseline --health-baseline --dupes-baseline; do
            if ! grep -q -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: $flag not forwarded"
              exit 1
            fi
          done
          echo "PASS"
