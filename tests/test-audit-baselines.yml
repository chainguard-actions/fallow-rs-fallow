name: Test audit command with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-save-dc
          save-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-save-health
          save-baseline: ${{ github.workspace }}/audit-health-baseline.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-audit-save-dupes
          save-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          changed-since: HEAD
          artifacts-dir: fallow-out-audit
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/audit-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
      - name: Assert audit outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME verdict: $VERDICT gate: $GATE issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: audit with fail-on-issues false should be a reporting run"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: gate output should reflect 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          echo "PASS"
