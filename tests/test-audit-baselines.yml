name: Test audit command with dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: dead
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: health
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/audit-health-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines exist
        run: |
          for f in audit-dead-code-baseline.json audit-health-baseline.json audit-dupes-baseline.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: '3.37.0'
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/audit-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
          fail-on-issues: 'false'
          type-aware: 'false'
      - name: Assert audit outputs
        env:
          ISSUES: ${{ steps.audit.outputs.issues }}
          VERDICT: ${{ steps.audit.outputs.verdict }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          echo "PASS"
