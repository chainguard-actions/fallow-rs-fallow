name: Test audit with dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Remove stale baselines
        run: rm -f "$GITHUB_WORKSPACE"/fallow-audit-*.json

      - id: dc
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ github.workspace }}/fallow-audit-dead-code.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: health
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          save-baseline: ${{ github.workspace }}/fallow-audit-health.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: dupes
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dupes
          root: tests/fixtures/simple-js
          save-baseline: ${{ github.workspace }}/fallow-audit-dupes.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baselines were saved
        run: |
          for f in dead-code health dupes; do
            p="$GITHUB_WORKSPACE/fallow-audit-$f.json"
            if [ ! -s "$p" ]; then
              echo "FAIL: missing baseline $p"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-dupes.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert audit produced a verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: '$VERDICT' issues: '$ISSUES'"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
