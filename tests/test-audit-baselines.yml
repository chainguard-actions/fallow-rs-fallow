name: Test audit with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
          rm -f "$GITHUB_WORKSPACE"/fallow-baselines/audit-*.json
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/audit-dead-code.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/audit-health.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/audit-dupes.json
      - name: Assert baselines saved
        run: |
          for f in dead-code health dupes; do
            p="$GITHUB_WORKSPACE/fallow-baselines/audit-$f.json"
            if [ ! -f "$p" ]; then
              echo "FAIL: $p missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-baselines/audit-dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-baselines/audit-health.json
          dupes-baseline: ${{ github.workspace }}/fallow-baselines/audit-dupes.json
      - name: Assert audit verdict
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          echo "PASS"
