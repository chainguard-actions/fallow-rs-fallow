name: Test audit with gate and per-analysis baselines
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Save dead-code baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/bl-dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          no-cache: 'true'

      - name: Save health baseline
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/bl-health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          no-cache: 'true'

      - name: Save dupes baseline
        uses: .
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          no-cache: 'true'

      - name: Assert baselines exist
        run: |
          for f in bl-dead-code.json bl-health.json bl-dupes.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ github.workspace }}/bl-dead-code.json
          health-baseline: ${{ github.workspace }}/bl-health.json
          dupes-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert audit outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "issues: $ISSUES verdict: $VERDICT gate: $GATE"
          echo "args: $FALLOW_ANALYSIS_ARGS_JSON"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          for flag in --gate --dead-code-baseline --health-baseline --dupes-baseline; do
            echo "$FALLOW_ANALYSIS_ARGS_JSON" | jq -e --arg f "$flag" 'index($f) != null' > /dev/null \
              || { echo "FAIL: $flag missing"; exit 1; }
          done
          echo "PASS"
