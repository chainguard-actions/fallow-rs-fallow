name: Test audit with per-analysis baselines and gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Clean baseline paths
        run: rm -f /tmp/fallow-audit-dc.json /tmp/fallow-audit-health.json /tmp/fallow-audit-dupes.json

      - id: dc
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-audit-dc
          save-baseline: /tmp/fallow-audit-dc.json

      - id: health
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-audit-health
          save-baseline: /tmp/fallow-audit-health.json

      - id: dupes
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-audit-dupes
          save-baseline: /tmp/fallow-audit-dupes.json

      - name: Assert baselines saved
        run: |
          for f in /tmp/fallow-audit-dc.json /tmp/fallow-audit-health.json /tmp/fallow-audit-dupes.json; do
            if [ ! -s "$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          artifacts-dir: fallow-audit
          changed-since: HEAD
          gate: all
          max-crap: '30'
          dead-code-baseline: /tmp/fallow-audit-dc.json
          health-baseline: /tmp/fallow-audit-health.json
          dupes-baseline: /tmp/fallow-audit-dupes.json

      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT gate: $GATE issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
