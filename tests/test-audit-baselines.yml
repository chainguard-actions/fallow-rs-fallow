name: Test audit with gate and dead-code/health/dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a JS project
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-audit"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "audit-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF

      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: fallow-proj-audit
          format: json
          save-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - id: save-health
        uses: .
        with:
          command: health
          root: fallow-proj-audit
          format: json
          save-baseline: ${{ github.workspace }}/audit-health-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: fallow-proj-audit
          format: json
          save-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - id: action
        uses: .
        with:
          command: audit
          root: fallow-proj-audit
          format: json
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/audit-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
          fail-on-issues: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT gate: $GATE issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
