name: Test audit with per-analysis baselines and gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Save dead-code baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/bl-dead-code.json
      - name: Save health baseline
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/bl-health.json
      - name: Save dupes baseline
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/bl-dupes.json
      - name: Assert baselines exist
        run: |
          for f in bl-dead-code.json bl-health.json bl-dupes.json; do
            if [ ! -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS: baselines saved"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          changed-since: HEAD
          gate: new-only
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/bl-dead-code.json
          health-baseline: ${{ github.workspace }}/bl-health.json
          dupes-baseline: ${{ github.workspace }}/bl-dupes.json
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict should be pass/warn/fail"; exit 1 ;;
          esac
          if [ "$GATE" != "new-only" ]; then
            echo "FAIL: expected gate 'new-only'"
            exit 1
          fi
          echo "PASS"
