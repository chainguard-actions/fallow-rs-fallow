name: Test audit with dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/dead-code-baseline.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/health-baseline.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          save-baseline: ${{ github.workspace }}/dupes-baseline.json
      - name: Assert baselines written
        run: |
          for f in dead-code-baseline.json health-baseline.json dupes-baseline.json; do
            if [ ! -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          changed-since: HEAD
          dead-code-baseline: ${{ github.workspace }}/dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/dupes-baseline.json
      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
