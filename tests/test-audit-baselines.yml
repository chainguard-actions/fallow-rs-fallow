name: Test audit with per-analysis baselines and gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: '3.37.0'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines written
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for f in dead-code health dupes; do
            if [ ! -f "$GITHUB_WORKSPACE/fallow-baselines/$f.json" ]; then
              echo "FAIL: $f baseline missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: '3.37.0'
          changed-since: HEAD
          gate: new-only
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn) ;;
            *) echo "FAIL: expected pass/warn verdict for unchanged code"; exit 1 ;;
          esac
          if [ "$GATE" != "new-only" ]; then
            echo "FAIL: expected gate new-only"
            exit 1
          fi
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 introduced findings"
            exit 1
          fi
          echo "PASS"
