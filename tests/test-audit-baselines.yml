name: Test audit with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Save dead-code baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          save-baseline: ${{ github.workspace }}/bl-dead-code.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-bl-dc
          type-aware: 'false'
      - name: Save health baseline
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          save-baseline: ${{ github.workspace }}/bl-health.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-bl-health
          type-aware: 'false'
      - name: Save dupes baseline
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          save-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-bl-dupes
          type-aware: 'false'
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          version: 3.40.0
          format: json
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/bl-dead-code.json
          health-baseline: ${{ github.workspace }}/bl-health.json
          dupes-baseline: ${{ github.workspace }}/bl-dupes.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-audit
          type-aware: 'false'
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          echo "PASS"
