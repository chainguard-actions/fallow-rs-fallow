name: Test audit with gate all and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Remove stale baselines
        run: rm -f "$GITHUB_WORKSPACE"/fallow-audit-*.json

      - id: save-dead-code
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-dead-code.json

      - id: save-health
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-health.json

      - id: save-dupes
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-dupes.json

      - name: Assert all three baselines were saved
        run: |
          for k in dead-code health dupes; do
            f="$GITHUB_WORKSPACE/fallow-audit-$k.json"
            if [ ! -f "$f" ]; then
              echo "FAIL: missing baseline $f"
              exit 1
            fi
          done
          echo "PASS"

      - id: audit
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-dupes.json

      - name: Assert audit verdict and gate outputs
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
          GATE: ${{ steps.audit.outputs.gate }}
          ISSUES: ${{ steps.audit.outputs.issues }}
        run: |
          echo "verdict: '$VERDICT' gate: '$GATE' issues: '$ISSUES'"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
