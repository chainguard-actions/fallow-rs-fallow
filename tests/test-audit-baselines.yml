name: Test audit with gate, worsened and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-audit-dc
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-audit-health
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/audit-health-baseline.json
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-audit-dupes
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
      - name: Assert baselines exist
        run: |
          for b in audit-dead-code-baseline.json audit-health-baseline.json audit-dupes-baseline.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$b" ]; then
              echo "FAIL: $b not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/unused-project
          version: 3.40.0
          format: json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-audit
          type-aware: 'false'
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/audit-dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/audit-health-baseline.json
          dupes-baseline: ${{ github.workspace }}/audit-dupes-baseline.json
      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict '$VERDICT' is not pass/warn/fail"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          echo "PASS"
