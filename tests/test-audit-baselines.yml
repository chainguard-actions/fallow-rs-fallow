name: Test audit with gate=all and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create project with a committed base and one change
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          P="$GITHUB_WORKSPACE/fx-audit-proj"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-audit-proj",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function oldUnused() { return 2; }
          EOF
          git add fx-audit-proj
          git commit -q -m "audit base"
          echo "export function addedUnused() { return 3; }" >> "$P/src/util.js"
          git add fx-audit-proj
          git commit -q -m "audit change"

      - name: Save dead-code baseline
        uses: .
        with:
          command: dead-code
          root: fx-audit-proj
          save-baseline: ${{ github.workspace }}/fx-audit-proj/dc-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Save health baseline
        uses: .
        with:
          command: health
          root: fx-audit-proj
          save-baseline: ${{ github.workspace }}/fx-audit-proj/health-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Save dupes baseline
        uses: .
        with:
          command: dupes
          root: fx-audit-proj
          save-baseline: ${{ github.workspace }}/fx-audit-proj/dupes-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - id: action
        uses: .
        with:
          command: audit
          root: fx-audit-proj
          changed-since: HEAD~1
          gate: all
          dead-code-baseline: ${{ github.workspace }}/fx-audit-proj/dc-baseline.json
          health-baseline: ${{ github.workspace }}/fx-audit-proj/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/fx-audit-proj/dupes-baseline.json
          max-crap: '30'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: verdict must be pass/warn/fail"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          echo "PASS"
