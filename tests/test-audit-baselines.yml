name: Test audit with per-analysis baselines and gate
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: dc
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/dc-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - id: hb
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/health-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - id: db
        uses: .
        with:
          command: dupes
          root: tests/fixtures/simple-js
          save-baseline: ${{ runner.temp }}/dupes-baseline.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert baselines were saved
        env:
          DIR: ${{ runner.temp }}
        run: |
          for f in dc-baseline.json health-baseline.json dupes-baseline.json; do
            if [ ! -f "$DIR/$f" ]; then
              echo "FAIL: missing $DIR/$f"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/simple-js
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ runner.temp }}/dc-baseline.json
          health-baseline: ${{ runner.temp }}/health-baseline.json
          dupes-baseline: ${{ runner.temp }}/dupes-baseline.json
          format: json
          fail-on-issues: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT gate: $GATE issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          echo "PASS"
