name: Test audit command with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/audit-bl-project"
          mkdir -p "$P/src"
          echo '{"name":"audit-bl-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
          cat > "$P/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/audit-baselines"

      - name: Save dead-code baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/audit-bl-project
          format: json
          save-baseline: ${{ github.workspace }}/audit-baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Save health baseline
        uses: .
        with:
          command: health
          root: tests/fixtures/audit-bl-project
          format: json
          save-baseline: ${{ github.workspace }}/audit-baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Save dupes baseline
        uses: .
        with:
          command: dupes
          root: tests/fixtures/audit-bl-project
          format: json
          save-baseline: ${{ github.workspace }}/audit-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert baselines exist
        run: |
          for f in dead-code health dupes; do
            F="$GITHUB_WORKSPACE/audit-baselines/$f.json"
            if [ ! -f "$F" ]; then
              echo "FAIL: missing $F"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/audit-bl-project
          format: json
          changed-since: HEAD
          gate: new-only
          dead-code-baseline: ${{ github.workspace }}/audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/audit-baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert audit verdict
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: $VERDICT"
          case "$VERDICT" in
            pass|warn|fail) echo "PASS" ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
