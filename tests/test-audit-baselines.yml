name: Test audit with dead-code, health and dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/bl-dead-code.json
          artifacts-dir: fallow-artifacts-bl-dc
      - uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/bl-health.json
          artifacts-dir: fallow-artifacts-bl-health
      - uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/bl-dupes.json
          artifacts-dir: fallow-artifacts-bl-dupes
      - name: Assert baselines written
        run: |
          for f in bl-dead-code.json bl-health.json bl-dupes.json; do
            if [ ! -s "$GITHUB_WORKSPACE/$f" ]; then
              echo "FAIL: $f missing"
              exit 1
            fi
          done
          echo "PASS"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          changed-since: HEAD
          gate: new-only
          dead-code-baseline: ${{ github.workspace }}/bl-dead-code.json
          health-baseline: ${{ github.workspace }}/bl-health.json
          dupes-baseline: ${{ github.workspace }}/bl-dupes.json
          artifacts-dir: fallow-artifacts-audit-baselines
      - name: Assert audit verdict produced
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
          ISSUES: ${{ steps.audit.outputs.issues }}
        run: |
          echo "verdict: $VERDICT issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          echo "PASS"
