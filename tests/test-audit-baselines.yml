name: Test audit with gate, worsened and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: dc
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/clean-project
          save-baseline: ${{ runner.temp }}/dc-baseline.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: hl
        uses: .
        with:
          command: health
          root: tests/fixtures/clean-project
          save-baseline: ${{ runner.temp }}/health-baseline.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: dp
        uses: .
        with:
          command: dupes
          root: tests/fixtures/clean-project
          save-baseline: ${{ runner.temp }}/dupes-baseline.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert baselines saved
        run: |
          for f in dc-baseline.json health-baseline.json dupes-baseline.json; do
            if [ ! -f "$RUNNER_TEMP/$f" ]; then
              echo "FAIL: $f not written"
              exit 1
            fi
          done
          echo "PASS"
      - id: action
        uses: .
        with:
          command: audit
          root: tests/fixtures/clean-project
          changed-since: HEAD
          gate: new-only
          worsened: warn
          dead-code-baseline: ${{ runner.temp }}/dc-baseline.json
          health-baseline: ${{ runner.temp }}/health-baseline.json
          dupes-baseline: ${{ runner.temp }}/dupes-baseline.json
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert audit output
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "new-only" ]; then
            echo "FAIL: expected gate new-only"
            exit 1
          fi
          echo "PASS"
