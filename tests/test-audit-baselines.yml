name: Test audit with per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save-health
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ runner.temp }}/health-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: save-dupes
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ runner.temp }}/dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - id: save-dead-code
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ runner.temp }}/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baselines exist
        env:
          DIR: ${{ runner.temp }}
        run: |
          ls -la "$DIR"
          for f in health-baseline.json dupes-baseline.json dead-code-baseline.json; do
            if [ ! -f "$DIR/$f" ]; then
              echo "FAIL: missing $DIR/$f"
              exit 1
            fi
          done
          echo "PASS"

      - id: audit
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          changed-since: HEAD
          gate: all
          dead-code-baseline: ${{ runner.temp }}/dead-code-baseline.json
          health-baseline: ${{ runner.temp }}/health-baseline.json
          dupes-baseline: ${{ runner.temp }}/dupes-baseline.json
          fail-on-issues: 'false'
          annotations: 'false'

      - name: Assert audit verdict and gate
        env:
          ISSUES: ${{ steps.audit.outputs.issues }}
          VERDICT: ${{ steps.audit.outputs.verdict }}
          GATE: ${{ steps.audit.outputs.gate }}
        run: |
          echo "issues: $ISSUES"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          echo "PASS"
