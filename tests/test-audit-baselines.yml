name: Test audit with gate, worsened and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-audit-baselines"
      - id: dc
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-audit-dc
      - id: health
        uses: .
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          artifacts-dir: fallow-artifacts-audit-health
      - id: dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
          artifacts-dir: fallow-artifacts-audit-dupes
      - name: Assert baselines written
        run: |
          for f in dead-code health dupes; do
            P="$GITHUB_WORKSPACE/fallow-audit-baselines/$f.json"
            if [ ! -s "$P" ]; then
              echo "FAIL: $P not written"
              exit 1
            fi
            jq empty "$P" || { echo "FAIL: $P invalid JSON"; exit 1; }
          done
          echo "PASS"
      - id: audit
        uses: .
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          changed-since: HEAD
          gate: all
          worsened: warn
          dead-code-baseline: ${{ github.workspace }}/fallow-audit-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-audit-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-audit-baselines/dupes.json
          artifacts-dir: fallow-artifacts-audit
      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
          GATE: ${{ steps.audit.outputs.gate }}
          ISSUES: ${{ steps.audit.outputs.issues }}
        run: |
          echo "verdict: $VERDICT  gate: $GATE  issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all'"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
