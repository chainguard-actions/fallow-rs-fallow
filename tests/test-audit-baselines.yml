name: Test audit with baselines and gate inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-audit-project
          cat > /tmp/fallow-audit-project/package.json <<'EOF'
          {
            "name": "audit-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-audit-project/index.js <<'EOF'
          export function main() {
            return 42;
          }
          EOF
          # Create empty baseline files
          echo '{}' > /tmp/dead-code-baseline.json
          echo '{}' > /tmp/health-baseline.json
          echo '{}' > /tmp/dupes-baseline.json
      - id: audit
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-audit-project
          format: json
          fail-on-issues: 'false'
          gate: new-only
          security-gate: new
          dead-code-baseline: /tmp/dead-code-baseline.json
          health-baseline: /tmp/health-baseline.json
          dupes-baseline: /tmp/dupes-baseline.json
          auto-changed-since: 'false'
      - name: Assert audit step ran
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
