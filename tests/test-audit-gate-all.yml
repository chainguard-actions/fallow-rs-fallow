name: Test audit command with gate=all, dead-code baseline and skip selector
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample git project with a change
        run: |
          set -e
          git config --global --add safe.directory '*'
          mkdir -p sample/src baselines
          cat > sample/package.json <<'EOF'
          {"name":"sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > sample/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          EOF
          cd sample
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm "initial"
          cat >> src/math.js <<'EOF'
          export function unusedHelper() { return 0; }
          EOF
          git add -A
          git commit -qm "add helper"

      - id: save
        uses: .
        with:
          command: dead-code
          root: sample
          save-baseline: ${{ github.workspace }}/baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: action
        uses: .
        with:
          command: audit
          root: sample
          gate: all
          changed-since: HEAD~1
          skip: dupes
          dead-code-baseline: ${{ github.workspace }}/baselines/dead-code.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          echo "issues: $ISSUES"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer issues, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"
