name: Test workspace and changed-workspaces inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal monorepo JS project
        run: |
          mkdir -p /tmp/fallow-workspace-test/packages/web
          mkdir -p /tmp/fallow-workspace-test/packages/admin
          cat > /tmp/fallow-workspace-test/package.json <<'EOF'
          {
            "name": "monorepo-test",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-workspace-test/packages/web/package.json <<'EOF'
          {
            "name": "web",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-workspace-test/packages/web/index.js <<'EOF'
          export function webMain() { return "web"; }
          EOF
          cat > /tmp/fallow-workspace-test/packages/admin/package.json <<'EOF'
          {
            "name": "admin",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-workspace-test/packages/admin/index.js <<'EOF'
          export function adminMain() { return "admin"; }
          EOF

      - id: action-workspace
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-workspace-test
          format: json
          fail-on-issues: 'false'
          workspace: 'web'
          auto-changed-since: 'false'

      - name: Assert workspace-scoped action ran
        env:
          OUTCOME: ${{ steps.action-workspace.outcome }}
          ISSUES: ${{ steps.action-workspace.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: workspace-scoped action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-workspace-test
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD'
          auto-changed-since: 'false'

      - name: Assert changed-workspaces action ran
        env:
          OUTCOME: ${{ steps.action-changed-workspaces.outcome }}
          ISSUES: ${{ steps.action-changed-workspaces.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: changed-workspaces action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
