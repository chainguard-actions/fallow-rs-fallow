name: Test dupes command with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with duplicated code
        run: |
          mkdir -p proj/src
          cat > proj/package.json <<'EOF'
          {"name":"fallow-fixture","version":"1.0.0","private":true,"main":"src/index.js","type":"module"}
          EOF
          cat > proj/src/index.js <<'EOF'
          import { a } from './a.js';
          import { b } from './b.js';
          console.log(a([1, 2, 3]), b([4, 5, 6]));
          EOF
          for f in a b; do
            cat > "proj/src/$f.js" <<EOF
          export function $f(items) {
            let total = 0;
            for (const item of items) {
              if (item % 2 === 0) {
                total += item * 2;
              } else {
                total += item * 3;
              }
            }
            return total;
          }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: proj
          min-tokens: '10'
          min-lines: '2'
          threshold: '100'
          top: '5'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
