name: Test dupes command with min-tokens, min-lines, threshold and top
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: dupes
          min-tokens: '100'
          min-lines: '10'
          threshold: '100'
          top: '3'
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json
          artifacts-dir: fallow-out-dupes-tuning

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert dupes flags were forwarded
        run: |
          ARGS_FILE=fallow-out-dupes-tuning/fallow-analysis-args.sh
          cat "$ARGS_FILE"
          for flag in "--min-tokens 100" "--min-lines 10" "--threshold 100" "--top 3" "--mode mild"; do
            if ! grep -qF -- "$flag" "$ARGS_FILE"; then
              echo "FAIL: missing '$flag'"
              exit 1
            fi
          done
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf fallow-out-dupes-tuning
