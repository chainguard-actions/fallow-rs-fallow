name: Test dupes tuning options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dupes
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          min-tokens: '30'
          min-lines: '3'
          threshold: '100'
          top: '5'

      - name: Assert issues numeric and results valid
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"

      - name: Assert tuning flags reached the CLI
        run: |
          ARGS_FILE=fallow-analysis-args.sh
          if [ -f "$ARGS_FILE" ]; then
            cat "$ARGS_FILE"
            for flag in --min-tokens --min-lines --threshold --top; do
              if ! grep -q -- "$flag" "$ARGS_FILE"; then
                echo "FAIL: $flag not found in recorded analysis args"
                exit 1
              fi
            done
          else
            echo "args file not present; skipping flag check"
          fi
          echo "PASS"
