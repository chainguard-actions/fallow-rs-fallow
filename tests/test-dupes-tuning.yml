name: Test dupes tuning inputs (min-tokens, min-lines, threshold, top)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with duplicated code
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","workspaces":["packages/*"]}' > "$P/package.json"
          printf '%s\n' '{"name":"web","version":"1.0.0","main":"src/index.ts"}' > "$P/packages/web/package.json"
          printf '%s\n' '{"name":"admin","version":"1.0.0","main":"src/index.ts"}' > "$P/packages/admin/package.json"
          for pkg in web admin; do
            printf '%s\n' \
              'export function compute(items: number[]): number {' \
              '  let total = 0;' \
              '  for (const item of items) {' \
              '    if (item > 10) { total += item * 2; } else { total += item; }' \
              '    if (total > 1000) { total = total - 500; }' \
              '  }' \
              '  const label = "total:" + String(total);' \
              '  console.log(label);' \
              '  return total;' \
              '}' \
              'console.log(compute([1, 2, 3]));' > "$P/packages/$pkg/src/index.ts"
          done

      - id: action
        uses: .
        with:
          command: dupes
          root: fx-project
          min-tokens: '10'
          min-lines: '3'
          threshold: '100'
          top: '5'
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert dupes outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          jq '.stats // {}' "$RESULTS"
          echo "PASS"
