name: Test changed-workspaces git-derived scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'true'
          format: json
          changed-workspaces: HEAD
      - name: Assert no workspace changed since HEAD
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues when no workspace changed"
            exit 1
          fi
          echo "PASS"
