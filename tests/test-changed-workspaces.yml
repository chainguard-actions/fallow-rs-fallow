name: Test dead-code with changed-workspaces scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          format: json
          changed-workspaces: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert run completed with numeric issues
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues=$ISSUES results=$RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
