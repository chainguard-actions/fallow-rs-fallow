name: Test dead-code scoped with changed-workspaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with git history touching one package
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/changed-workspaces-project"
          mkdir -p "$P/packages/pkg-a" "$P/packages/pkg-b"
          cd "$P"
          cat > package.json <<'EOF'
          {
            "name": "workspace-root",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for n in a b; do
            cat > "packages/pkg-$n/package.json" <<EOF
          {
            "name": "pkg-$n",
            "version": "1.0.0",
            "type": "module",
            "main": "index.js"
          }
          EOF
            cat > "packages/pkg-$n/index.js" <<'EOF'
          export function hello() { return 'hi'; }
          EOF
          done
          git init -q
          git add -A
          git -c user.email=test@example.com -c user.name="Test User" commit -q -m initial
          echo "export function bye() { return 'bye'; }" >> packages/pkg-a/index.js
          git add -A
          git -c user.email=test@example.com -c user.name="Test User" commit -q -m "change pkg-a"
          git log --oneline

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/changed-workspaces-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          changed-workspaces: HEAD~1

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON: $RESULTS"
            exit 1
          fi
          echo "PASS"
