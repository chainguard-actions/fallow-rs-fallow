name: Test changed-workspaces and save-baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/js-workspaces/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-workspaces/package.json" <<'EOF'
          {
            "name": "test-workspaces-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-workspaces/src/index.js" <<'EOF'
          export function usedFunction() {
            return 42;
          }
          export function unusedFunction() {
            return 'never called';
          }
          usedFunction();
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/js-workspaces
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          changed-workspaces: ''
          save-baseline: ''
          no-cache: 'true'

      - name: Assert action ran (changed-workspaces and save-baseline inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected on minimal fixture)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
