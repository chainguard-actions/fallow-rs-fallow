name: Test dead-code scoped with changed-workspaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FX: fallow-test-changed-workspaces
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create fixture monorepo
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$FX"
          rm -rf "$P"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          echo '{"name":"fallow-test-monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > "$P/package.json"
          for n in a b; do
            echo "{\"name\":\"pkg-$n\",\"version\":\"1.0.0\",\"main\":\"src/index.js\"}" > "$P/packages/pkg-$n/package.json"
            printf "import { helper } from './helper.js';\nconsole.log(helper());\n" > "$P/packages/pkg-$n/src/index.js"
            printf "export function helper() {\n  return '%s';\n}\n" "$n" > "$P/packages/pkg-$n/src/helper.js"
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: ${{ env.FX }}
          changed-workspaces: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not an integer: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/$FX"
