name: Test changed-workspaces input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Get a valid git ref for changed-workspaces
        id: git-ref
        run: |
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            echo "ref=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          fail-on-issues: 'false'
          format: json
          changed-workspaces: ${{ steps.git-ref.outputs.ref }}
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
