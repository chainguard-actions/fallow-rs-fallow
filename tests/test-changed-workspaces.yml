name: Test dead-code with git-derived changed-workspaces scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create monorepo fixture
        run: |
          set -e
          D=fx-chws
          rm -rf "$D"
          mkdir -p "$D/packages/pkg-a/src" "$D/packages/pkg-b/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-chws","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in pkg-a pkg-b; do
            cat > "$D/packages/$p/package.json" <<EOF
          {"name":"$p","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
            cat > "$D/packages/$p/src/index.js" <<'EOF'
          export function used(n) { return n + 1; }
          EOF
          done

      # A valid ref (HEAD) is given, so the action should forward the flag and
      # the CLI should derive an (possibly empty) workspace set from git.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: fx-chws
          changed-workspaces: HEAD
          artifacts-dir: fx-chws-artifacts
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert flag forwarded and run outcome
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          ARGS_FILE=fx-chws-artifacts/fallow-analysis-args.sh
          [ -f "$ARGS_FILE" ] || { echo "FAIL: analysis args not written"; exit 1; }
          cat "$ARGS_FILE"
          grep -q -- "--changed-workspaces HEAD" "$ARGS_FILE" || { echo "FAIL: --changed-workspaces not forwarded"; exit 1; }
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected non-negative integer, got '$ISSUES'"
              exit 1
            fi
            echo "PASS: scoped run succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: CLI rejected the untracked fixture workspace scope gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
