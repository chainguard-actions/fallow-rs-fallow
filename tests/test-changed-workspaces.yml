name: Test changed-workspaces scoping with no changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          changed-workspaces: HEAD
      - name: Assert unchanged workspaces produce no findings
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -f "$RESULTS" ] && grep -qE "orphan-(a|b)" "$RESULTS"; then
            echo "FAIL: no workspace changed since HEAD, so no orphan findings expected"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
