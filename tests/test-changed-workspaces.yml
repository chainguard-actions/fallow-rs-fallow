name: Test changed-workspaces input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal monorepo project for analysis
        run: |
          mkdir -p /tmp/fallow-mono/packages/app
          cat > /tmp/fallow-mono/package.json <<'EOF'
          {
            "name": "mono",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-mono/packages/app/package.json <<'EOF'
          {
            "name": "app",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-mono/packages/app/index.js <<'EOF'
          export function used() { return 42; }
          EOF
      - name: Run with changed-workspaces input
        id: changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono
          format: json
          fail-on-issues: 'false'
          changed-workspaces: HEAD
          auto-changed-since: 'false'
      - name: Assert changed-workspaces step ran
        env:
          OUTCOME: ${{ steps.changed-workspaces.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: changed-workspaces step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
