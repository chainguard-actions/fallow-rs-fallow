name: Test changed-workspaces git-derived monorepo scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create monorepo, commit, then change only @fx/app
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "test@example.com"
          git config user.name "Test User"
          P="$GITHUB_WORKSPACE/fx-mono-cw"
          mkdir -p "$P/packages/app/src" "$P/packages/lib/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-mono-cw-root",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for pkg in app lib; do
            cat > "$P/packages/$pkg/package.json" <<EOF
          {
            "name": "@fx/$pkg",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
            cat > "$P/packages/$pkg/src/index.js" <<EOF
          import { helper } from './helper.js';
          console.log(helper());
          EOF
            cat > "$P/packages/$pkg/src/helper.js" <<EOF
          export function helper() { return '$pkg'; }
          export function unused_$pkg() { return 0; }
          EOF
          done
          git add fx-mono-cw
          git commit -q -m "monorepo base"
          echo "export const appChange = 1;" >> "$P/packages/app/src/helper.js"
          git add fx-mono-cw
          git commit -q -m "change app only"

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-mono-cw
          changed-workspaces: HEAD~1
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert scoped to changed workspace
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'packages/lib/src/helper.js' "$RESULTS"; then
            echo "FAIL: unchanged @fx/lib workspace leaked into output"
            exit 1
          fi
          echo "PASS"
