name: Test dead-code scoped by changed-workspaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/changed-monorepo"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src"
          echo '{"name":"changed-monorepo","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > "$P/package.json"
          for w in web admin; do
            echo "{\"name\":\"$w\",\"version\":\"1.0.0\",\"type\":\"module\",\"main\":\"src/index.js\"}" > "$P/packages/$w/package.json"
            echo "export const value = '$w';" > "$P/packages/$w/src/index.js"
          done

      # HEAD is a valid ref in the checked-out repo, so the git-derived
      # workspace scoping must resolve without a hard error.
      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-fixtures/changed-monorepo
          format: json
          changed-workspaces: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert issues output and results file
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
