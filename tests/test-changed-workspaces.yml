name: Test dead-code with changed-workspaces scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-chws"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          cat > "$P/package.json" <<'EOF'
          { "name": "chws-root", "version": "1.0.0", "private": true, "workspaces": ["packages/*"] }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          { "name": "pkg-$n", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
            echo 'export const x = 1; console.log(x);' > "$P/packages/pkg-$n/src/index.js"
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-proj-chws
          changed-workspaces: HEAD
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert run completed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
