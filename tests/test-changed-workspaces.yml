name: Test changed-workspaces git-derived scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare scratch monorepo with a change in pkg-a
        run: |
          rm -rf scratch-mono
          mkdir scratch-mono
          cp -R tests/fixtures/monorepo/. scratch-mono/
          chmod -R u+w scratch-mono
          cd scratch-mono
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm "init"
          echo "export const changedA = 1;" >> packages/pkg-a/src/index.ts
          git commit -qam "change pkg-a"
      - id: action
        uses: .
        with:
          command: dead-code
          root: scratch-mono
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          changed-workspaces: HEAD~1
      - name: Assert output scoped to changed workspace
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ ! -s "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if grep -q "orphan-b" "$RESULTS"; then
            echo "FAIL: unchanged pkg-b findings leaked into changed-workspaces output"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
