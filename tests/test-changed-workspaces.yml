name: Test changed-workspaces input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          changed-workspaces: 'HEAD~1'
      - name: Assert action ran (changed-workspaces may fail if not a monorepo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ISSUES" ]; then
              echo "FAIL: action succeeded but issues output is empty"
              exit 1
            fi
            echo "PASS: got issues=$ISSUES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (not a monorepo or no workspaces found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
