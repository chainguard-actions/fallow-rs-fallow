name: Test changed-workspaces input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal monorepo-style project
        run: |
          mkdir -p /tmp/fallow-cw-project/packages/web
          cat > /tmp/fallow-cw-project/packages/web/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-cw-project/packages/web/package.json << 'EOF'
          { "name": "web", "version": "1.0.0" }
          EOF
          cat > /tmp/fallow-cw-project/package.json << 'EOF'
          { "name": "monorepo", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-cw-project
          fail-on-issues: 'false'
          format: json
          annotations: 'false'
          auto-changed-since: 'false'
          changed-workspaces: 'HEAD~1'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
