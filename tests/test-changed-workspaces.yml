name: Test changed-workspaces monorepo scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a monorepo with git history
        run: |
          P="$GITHUB_WORKSPACE/fallow-test/changed-ws"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          cd "$P"
          git -c init.defaultBranch=main init -q .
          echo '{"name":"mono-root","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > package.json
          for n in a b; do
            echo "{\"name\":\"pkg-$n\",\"version\":\"1.0.0\",\"type\":\"module\",\"main\":\"src/index.js\"}" > "packages/pkg-$n/package.json"
            printf 'export function f() { return 1; }\n' > "packages/pkg-$n/src/index.js"
          done
          git add -A
          git -c user.email=t@example.com -c user.name=Test commit -q -m base
          git tag base
          printf 'export function f() { return 1; }\nexport function g() { return 2; }\n' > packages/pkg-a/src/index.js
          git add -A
          git -c user.email=t@example.com -c user.name=Test commit -q -m change
          git log --oneline

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-test/changed-ws
          format: json
          changed-workspaces: base
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
