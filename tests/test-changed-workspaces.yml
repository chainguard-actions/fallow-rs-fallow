name: Test changed-workspaces git-derived scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create monorepo fixture with git history
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/packages/web/src" "$P/packages/admin/src"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","workspaces":["packages/*"]}' > "$P/package.json"
          printf '%s\n' '{"name":"web","version":"1.0.0","main":"src/index.ts"}' > "$P/packages/web/package.json"
          printf '%s\n' '{"name":"admin","version":"1.0.0","main":"src/index.ts"}' > "$P/packages/admin/package.json"
          printf '%s\n' 'import { used } from "./util";' 'console.log(used(1));' > "$P/packages/web/src/index.ts"
          printf '%s\n' 'export function used(x: number): number { return x + 1; }' > "$P/packages/web/src/util.ts"
          printf '%s\n' 'import { a } from "./lib";' 'console.log(a());' > "$P/packages/admin/src/index.ts"
          printf '%s\n' 'export function a(): number { return 1; }' 'export function adminUnused(): number { return 2; }' > "$P/packages/admin/src/lib.ts"
          cd "$P"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm initial
          printf '%s\n' 'export function webUnused(): string { return "w"; }' >> packages/web/src/util.ts
          git add -A
          git commit -qm "change web"
          git log --oneline

      - id: action
        uses: .
        with:
          command: dead-code
          root: fx-project
          changed-workspaces: HEAD~1
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert output scoped to changed workspace
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results invalid"
            exit 1
          fi
          if grep -q 'packages/admin/src/lib.ts' "$RESULTS"; then
            echo "FAIL: unchanged admin workspace findings present in scoped results"
            exit 1
          fi
          echo "PASS"
