name: Test changed-workspaces and workspace inputs
on:
  workflow_dispatch:
jobs:
  test-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-ws-test/packages/app
          cat > /tmp/fallow-ws-test/package.json << 'EOF'
          {
            "name": "monorepo",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-ws-test/packages/app/package.json << 'EOF'
          {
            "name": "app",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-ws-test/packages/app/index.js << 'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      - id: action-workspace
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-ws-test
          format: json
          fail-on-issues: 'false'
          workspace: 'app'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert workspace action ran
        env:
          OUTCOME: ${{ steps.action-workspace.outcome }}
          ISSUES: ${{ steps.action-workspace.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-changed-workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-cws-test/packages/app
          cat > /tmp/fallow-cws-test/package.json << 'EOF'
          {
            "name": "monorepo",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-cws-test/packages/app/package.json << 'EOF'
          {
            "name": "app",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-cws-test/packages/app/index.js << 'EOF'
          export function used() { return 42; }
          EOF

      - id: action-changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-cws-test
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert changed-workspaces action ran
        env:
          OUTCOME: ${{ steps.action-changed-workspaces.outcome }}
          ISSUES: ${{ steps.action-changed-workspaces.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
