name: Test changed-workspaces git-derived scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Touch a file in the web workspace (uncommitted change vs HEAD)
        run: |
          F="$GITHUB_WORKSPACE/tests/fixtures/monorepo/packages/web/src/index.js"
          chmod u+w "$F"
          echo "// touched by test" >> "$F"
          git -C "$GITHUB_WORKSPACE" status --short tests/fixtures/monorepo || true
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          changed-workspaces: HEAD
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Restore touched file
        if: always()
        run: git -C "$GITHUB_WORKSPACE" checkout -- tests/fixtures/monorepo/packages/web/src/index.js || true
      - name: Assert changed-workspaces run output
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
