name: Test changed-workspaces input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          changed-workspaces: 'HEAD~1'
          auto-changed-since: 'false'
          threads: '2'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: changed-workspaces input accepted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no workspace packages found for changed-workspaces)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
