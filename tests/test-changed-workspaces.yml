name: Test dead-code scoped by changed-workspaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a monorepo with two workspaces
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/changed-ws-mono"
          mkdir -p "$P/packages/pkg-a" "$P/packages/pkg-b"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "changed-ws-mono",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          {
            "name": "pkg-$n",
            "version": "1.0.0",
            "type": "module",
            "main": "index.js"
          }
          EOF
            cat > "$P/packages/pkg-$n/index.js" <<'EOF'
          export const value = 1;
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/changed-ws-mono
          format: json
          changed-workspaces: HEAD
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert run completed with a numeric count
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
