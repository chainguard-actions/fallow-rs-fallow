name: Test changed-workspaces git-derived monorepo scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create demo monorepo with git history
        run: |
          mkdir -p demo-cws/packages/a/src demo-cws/packages/b/src
          cd demo-cws
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > package.json <<'EOF'
          {"name":"demo-cws","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in a b; do
            cat > packages/$p/package.json <<EOF
          {"name":"@demo/$p","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
            echo "export const value_$p = 1;" > packages/$p/src/index.js
          done
          git add -A && git commit -q -m "base"
          git tag fallow-cws-base
          echo "export const extra_a = 2;" >> packages/a/src/index.js
          git commit -q -am "change package a"
          git log --oneline

      - id: action
        uses: .
        with:
          command: dead-code
          root: demo-cws
          changed-workspaces: fallow-cws-base
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert outputs
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          cat fallow-analysis-args.sh
          if ! grep -q -- '--changed-workspaces' fallow-analysis-args.sh; then
            echo "FAIL: --changed-workspaces not forwarded"
            exit 1
          fi
          echo "PASS"
