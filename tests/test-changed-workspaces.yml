name: Test changed-workspaces git-derived scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          changed-workspaces: HEAD
      - name: Assert changed-workspaces run succeeded
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
