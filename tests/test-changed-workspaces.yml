name: Test changed-workspaces scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal monorepo-style JS project
        run: |
          mkdir -p /tmp/fallow-ws-project/packages/app
          cat > /tmp/fallow-ws-project/packages/app/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-ws-project/packages/app/package.json << 'EOF'
          { "name": "app", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-ws-project/package.json << 'EOF'
          { "name": "monorepo", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-ws-project
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD'
          format: json
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
