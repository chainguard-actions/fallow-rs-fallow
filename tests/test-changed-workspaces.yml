name: Test dead-code with git-derived changed-workspaces scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create npm workspaces monorepo
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/changed-workspaces-monorepo"
          mkdir -p "$P/packages/pkg-a/src" "$P/packages/pkg-b/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "changed-workspaces-monorepo",
            "private": true,
            "workspaces": ["packages/*"]
          }
          EOF
          for n in a b; do
            cat > "$P/packages/pkg-$n/package.json" <<EOF
          {
            "name": "pkg-$n",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
            cat > "$P/packages/pkg-$n/src/index.js" <<'EOF'
          export const main = () => 1;
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/changed-workspaces-monorepo
          changed-workspaces: HEAD
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert action succeeded with valid results
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME results: $RESULTS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
