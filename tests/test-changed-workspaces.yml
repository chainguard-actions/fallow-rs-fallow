name: Test dead-code scoped with changed-workspaces
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create monorepo fixture with its own git history
        run: |
          set -e
          rm -rf mono
          mkdir -p mono/packages/web/src mono/packages/admin/src
          cd mono
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo '{"name":"mono-root","version":"1.0.0","private":true,"workspaces":["packages/*"]}' > package.json
          for p in web admin; do
            echo "{\"name\":\"@demo/$p\",\"version\":\"1.0.0\",\"main\":\"src/index.js\"}" > packages/$p/package.json
            echo "export const $p = '$p';" > packages/$p/src/index.js
          done
          git add -A
          git commit -q -m "base"
          git tag mono-base
          echo "export const extra = 1;" >> packages/web/src/index.js
          git add -A
          git commit -q -m "change web"

      - id: action
        uses: .
        with:
          root: mono
          command: dead-code
          changed-workspaces: mono-base
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
