name: Test changed-since beginning with a dash is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          changed-since: '--output=/tmp/pwned'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-invalid-changed-since
      - name: Assert action failed (option injection blocked)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected changed-since '--...' to be rejected"
            exit 1
          fi
          if [ -e /tmp/pwned ]; then
            echo "FAIL: injected option took effect"
            exit 1
          fi
          echo "PASS"
