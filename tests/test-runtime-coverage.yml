name: Test health command with runtime coverage (licensed feature)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Runtime coverage is a paid fallow feature that needs a license. The
      # harness has none, so the analysis may legitimately refuse to run.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert action ran (outputs set, or failed for missing license)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: action succeeded but issues output is not a number"
              exit 1
            fi
            echo "PASS: runtime coverage analysis ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (runtime coverage requires a license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
