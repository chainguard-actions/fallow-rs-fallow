name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Runtime coverage is a paid/licensed feature that needs an extra
      # sidecar; without a license the CLI is expected to refuse. Accept
      # either a successful analysis (strictly validated) or a clean failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /build
          min-invocations-hot: '50'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          type-aware: 'false'
          artifacts-dir: fallow-artifacts-runtime-coverage
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
              echo "FAIL: results file missing"
              exit 1
            fi
            jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage unavailable without license (failed cleanly)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
