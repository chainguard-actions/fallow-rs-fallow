name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul runtime coverage input
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fallow-runtime"
          cat > "$GITHUB_WORKSPACE/fallow-runtime/coverage-final.json" <<'EOF'
          {
            "/ci-build/src/math.js": {
              "path": "/ci-build/src/math.js",
              "statementMap": {"0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 15}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 26}, "end": {"line": 3, "column": 1}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 500},
              "f": {"0": 500},
              "b": {}
            }
          }
          EOF
      # Runtime coverage is a paid capability of fallow; without a license
      # the CLI may refuse it. Either a successful analysis or a clean
      # failure of the step is accepted; a skipped step is not.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/fallow-runtime/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          artifacts-dir: fallow-artifacts-runtime
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
              echo "FAIL: action succeeded but results file missing"
              exit 1
            fi
            jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
            echo "PASS: runtime coverage analysis ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (paid feature unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
