name: Test health with runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid fallow feature: without a license the CLI may
      # refuse it. Accept either a valid run or a clean failure, but never a skip.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/v8-coverage.json
          min-invocations-hot: '50'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert runtime coverage run outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: succeeded but issues output is not a number"
              exit 1
            fi
            if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: succeeded but results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage run succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected gracefully (license-gated feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
