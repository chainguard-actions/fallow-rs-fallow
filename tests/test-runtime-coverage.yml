name: Test health with runtime coverage input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Runtime coverage is a paid fallow feature: without a license the CLI
      # may refuse it. Accept either a successful run with valid outputs or a
      # failure that is explained in fallow's stderr log.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.37.0'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert runtime coverage run outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            F="$RESULTS"
            [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
            if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
              echo "FAIL: results file missing or invalid JSON"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            LOG="$GITHUB_WORKSPACE/fallow-stderr.log"
            if [ -f "$LOG" ]; then
              echo "--- fallow-stderr.log ---"
              head -c 4000 "$LOG"
            fi
            echo "PASS: runtime coverage rejected (paid feature without license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
