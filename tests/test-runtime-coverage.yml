name: Test health runtime-coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid (licensed) feature; without a license the
      # CLI may refuse it. Accept a clean failure, but validate output on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/build
          min-invocations-hot: '50'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert action ran
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: action succeeded but results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis produced results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (license required)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
