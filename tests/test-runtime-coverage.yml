name: Test health with runtime coverage (paid feature)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid Fallow feature: without a license the CLI
      # refuses it, so both a successful run and a graceful failure are valid.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /build
          min-invocations-hot: '10'
          min-observation-volume: '5'
          low-traffic-threshold: '0.01'
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert outcome
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: action succeeded but issues is not a number"
              exit 1
            fi
            echo "PASS: runtime coverage analysed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage refused (license required)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
