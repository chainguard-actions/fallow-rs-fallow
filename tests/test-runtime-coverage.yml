name: Test health with runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid feature that may require a license the
      # harness does not have, so the step may legitimately fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            f="$RESULTS"
            [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
            if [ -z "$RESULTS" ] || [ ! -f "$f" ]; then
              echo "FAIL: succeeded but results file missing"
              exit 1
            fi
            jq -e . "$f" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
            echo "PASS: runtime coverage analysis produced results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (paid feature unavailable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
