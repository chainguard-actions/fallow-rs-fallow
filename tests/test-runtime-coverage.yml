name: Test health with runtime coverage inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # runtime-coverage is a paid Fallow feature; without a license in the
      # harness the CLI may refuse it. Accept a graceful failure, but when the
      # run succeeds the outputs must be valid.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /build/project
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'

      - name: Assert action ran (outputs valid, or failed gracefully without license)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: issues output is not a number: '$ISSUES'"
              exit 1
            fi
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
              echo "FAIL: results file missing: '$RESULTS'"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage failed gracefully (paid feature unavailable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
