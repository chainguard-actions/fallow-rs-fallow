name: Test health runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /build
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-runtime-coverage
      # Runtime coverage is a paid fallow feature; without a license the CLI
      # may refuse it. Success must yield real results; failure must come from
      # fallow itself (stderr log recorded by the action), not a skipped step.
      - name: Assert runtime coverage run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues not numeric"
              exit 1
            fi
            case "$RESULTS" in
              /*) FILE="$RESULTS" ;;
              *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
            esac
            if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
              echo "FAIL: results file missing"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            ls -la "$GITHUB_WORKSPACE/fallow-artifacts-runtime-coverage" || true
            if [ ! -f "$GITHUB_WORKSPACE/fallow-artifacts-runtime-coverage/fallow-stderr.log" ]; then
              echo "FAIL: action failed before running fallow"
              exit 1
            fi
            cat "$GITHUB_WORKSPACE/fallow-artifacts-runtime-coverage/fallow-stderr.log"
            echo "PASS: fallow rejected runtime coverage (paid feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
