name: Test health runtime-coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project and runtime coverage file
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/src" "$P/coverage"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' 'export function add(a: number, b: number): number {' '  return a + b;' '}' 'console.log(add(1, 2));' > "$P/src/index.ts"
          SRC="$P/src/index.ts"
          jq -n --arg p "$SRC" '{($p): {path: $p,
            statementMap: {"0": {start: {line: 2, column: 2}, end: {line: 2, column: 15}}},
            fnMap: {"0": {name: "add", decl: {start: {line: 1, column: 16}, end: {line: 1, column: 19}},
                          loc: {start: {line: 1, column: 49}, end: {line: 3, column: 1}}, line: 1}},
            branchMap: {}, s: {"0": 500}, f: {"0": 500}, b: {}}}' > "$P/coverage/coverage-final.json"
          cat "$P/coverage/coverage-final.json"

      # Runtime coverage is a paid fallow feature; without a license the CLI may
      # refuse it. Accept either a successful run with valid outputs or a failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fx-project
          runtime-coverage: ${{ github.workspace }}/fx-project/coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert runtime coverage run outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: success but issues not numeric"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: success but results invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage (paid feature) rejected without a license"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
