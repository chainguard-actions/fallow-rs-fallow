name: Test health with runtime-coverage options (paid feature)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project and runtime coverage data
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-runtime"
          rm -rf "$D"
          mkdir -p "$D/src" "$D/coverage"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-runtime","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          echo 'export function add(a, b) { return a + b; }' > "$D/src/math.js"
          cat > "$D/coverage/coverage-final.json" <<EOF
          {
            "$D/src/math.js": {
              "path": "$D/src/math.js",
              "statementMap": {"0": {"start": {"line": 1, "column": 29}, "end": {"line": 1, "column": 42}}},
              "fnMap": {"0": {"name": "add", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 19}}, "loc": {"start": {"line": 1, "column": 27}, "end": {"line": 1, "column": 44}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 250},
              "f": {"0": 250},
              "b": {}
            }
          }
          EOF

      # Runtime coverage is a licensed (paid) feature. Without a license the
      # CLI may refuse it, so the step is allowed to fail; on success the
      # results must still be a valid envelope.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fx-runtime
          runtime-coverage: fx-runtime/coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action ran (valid results, or failed on missing license)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES' results: '$RESULTS'"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: succeeded but issues is not an integer"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: succeeded but results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (licensed feature unavailable in harness)"
            cat fallow-stderr.log 2>/dev/null | head -20 || true
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
