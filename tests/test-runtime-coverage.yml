name: Test health runtime-coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid/licensed fallow feature; without a license
      # the CLI may refuse it. Accept a graceful failure, but validate output
      # strictly when it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /build
          min-invocations-hot: '50'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert action ran or failed gracefully (license-gated)
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
              echo "FAIL: action succeeded but results file missing"
              exit 1
            fi
            echo "PASS: runtime coverage run produced results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected without license"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
