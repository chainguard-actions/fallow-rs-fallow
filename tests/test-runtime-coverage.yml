name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dead-code-project
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          artifacts-dir: runtime-artifacts
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /repo
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
      - name: Assert runtime coverage ran, or was rejected by the CLI (paid feature)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not a number"
              exit 1
            fi
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
              echo "FAIL: results file missing"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            # Runtime coverage is a paid feature; the CLI may reject it without a
            # license. The analysis must still have run and logged its stderr.
            if [ ! -d runtime-artifacts ]; then
              echo "FAIL: action failed before analysis wrote any artifacts"
              exit 1
            fi
            ls -la runtime-artifacts
            cat runtime-artifacts/fallow-stderr.log 2>/dev/null || true
            echo "PASS: runtime coverage rejected by the CLI after analysis started"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
