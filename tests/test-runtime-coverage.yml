name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid feature that requires a Fallow license, which
      # the harness does not have: the step may fail on licensing. Accept either
      # a validated success or a failure, but never a skipped step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci-build
          min-invocations-hot: '1'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-runtime
      - name: Assert outcome
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: success but issues not numeric"
              exit 1
            fi
            echo "PASS: runtime coverage analyzed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (license required)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
