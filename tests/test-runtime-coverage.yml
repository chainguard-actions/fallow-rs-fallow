name: Test health with runtime-coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FX: fallow-test-runtime-coverage
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture JS project with Istanbul coverage
        run: |
          set -e
          P="$GITHUB_WORKSPACE/$FX"
          rm -rf "$P"
          mkdir -p "$P/src" "$P/cov"
          cat > "$P/package.json" <<'EOF'
          {"name":"fallow-test-project","version":"1.0.0","private":true,"main":"src/index.js"}
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > "$P/src/used.js" <<'EOF'
          export function used() {
            return 42;
          }
          EOF
          cat > "$P/cov/coverage-final.json" <<EOF
          {
            "$P/src/used.js": {
              "path": "$P/src/used.js",
              "statementMap": {"0": {"start": {"line": 2, "column": 2}, "end": {"line": 2, "column": 12}}},
              "fnMap": {"0": {"name": "used", "decl": {"start": {"line": 1, "column": 16}, "end": {"line": 1, "column": 20}}, "loc": {"start": {"line": 1, "column": 23}, "end": {"line": 3, "column": 1}}, "line": 1}},
              "branchMap": {},
              "s": {"0": 500},
              "f": {"0": 500},
              "b": {}
            }
          }
          EOF
          jq empty "$P/cov/coverage-final.json"

      # Runtime coverage is a paid Fallow feature: without a license the CLI may
      # refuse it. Accept either a successful run with valid outputs or a clean
      # failure, but never a skipped step.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: ${{ env.FX }}
          runtime-coverage: ${{ github.workspace }}/${{ env.FX }}/cov/coverage-final.json
          min-invocations-hot: '10'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action ran (valid outputs, or failed on the paid feature)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES' results: '$RESULTS'"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: succeeded but issues not an integer: '$ISSUES'"
              exit 1
            fi
            if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: succeeded but results file missing or invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (paid feature unavailable without license)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/$FX"
