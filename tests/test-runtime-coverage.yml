name: Test health with runtime coverage inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # runtime-coverage is a paid feature that needs a Fallow license, which
      # the harness cannot provide. The run may legitimately fail on the
      # license check, so assert on the outcome instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/project
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert action ran (outputs set, or failed on license)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
              echo "FAIL: succeeded but issues output is not a number: '$ISSUES'"
              exit 1
            fi
            echo "PASS: issues=$ISSUES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected without a license"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
