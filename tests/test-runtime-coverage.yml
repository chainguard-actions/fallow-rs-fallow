name: Test health with runtime coverage input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Runtime coverage is a paid Fallow feature: without a license the CLI is
      # expected to refuse it, so accept either a real result or a graceful failure
      # after fallow actually ran (stderr log written).
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/project
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          artifacts-dir: fallow-artifacts-runtime-coverage
      - name: Assert runtime coverage run outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          ART="$GITHUB_WORKSPACE/fallow-artifacts-runtime-coverage"
          ls -la "$ART" 2>/dev/null || true
          if [ -f "$ART/fallow-stderr.log" ]; then
            echo "--- stderr ---"; cat "$ART/fallow-stderr.log"
          fi
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: success but issues output is not a number"
              exit 1
            fi
            echo "PASS: runtime coverage analysed"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ ! -d "$ART" ]; then
              echo "FAIL: action failed before running analysis"
              exit 1
            fi
            echo "PASS: runtime coverage rejected gracefully (paid feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
