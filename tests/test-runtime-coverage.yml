name: Test health with runtime coverage options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Runtime coverage is a paid/licensed feature; without a license the CLI
      # exits with a dedicated runtime-coverage/license code. Either outcome is
      # checked strictly below.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /build
          min-invocations-hot: '10'
          min-observation-volume: '100'
          low-traffic-threshold: '0.01'
      - name: Assert runtime coverage outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: success but issues output is not a number"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            LOG="$(find . -name 'fallow-stderr.log' -not -path './.git/*' | head -n1)"
            echo "stderr log: $LOG"
            [ -n "$LOG" ] && cat "$LOG"
            if [ -n "$LOG" ] && grep -qiE 'licen|runtime|coverage|trial|paid|subscription' "$LOG"; then
              echo "PASS: runtime coverage rejected for licensing/coverage reasons"
            else
              echo "FAIL: action failed for an unexpected reason"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
