name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid feature; without a license the CLI may refuse
      # it. Accept either a successful run with valid outputs or a clean failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /original-root
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
      - name: Assert runtime coverage run outcome
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: succeeded but issues not numeric"
              exit 1
            fi
            echo "PASS: runtime coverage analysis ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage refused (license required)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
