name: Test health with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # runtime-coverage is a paid, license-gated feature. Without a license the
      # CLI is expected to refuse; with one it must produce results.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          artifacts-dir: fallow-rt-artifacts
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: /ci/project
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert runtime coverage handled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME results: $RESULTS"
          LOG="$GITHUB_WORKSPACE/fallow-rt-artifacts/fallow-stderr.log"
          [ -f "$LOG" ] && cat "$LOG"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -s "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: success but results missing/invalid"
              exit 1
            fi
            echo "PASS: runtime coverage analysis produced results"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -f "$LOG" ] && ! grep -qiE 'licen|coverage|sidecar|paid|trial|runtime' "$LOG"; then
              echo "FAIL: action failed for an unrelated reason"
              exit 1
            fi
            echo "PASS: runtime coverage refused without a license"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
