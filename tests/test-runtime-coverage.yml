name: Test runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Istanbul coverage file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rtcov"
          cat > "$GITHUB_WORKSPACE/rtcov/coverage-final.json" <<'EOF'
          {
            "/ci/build/src/helper.ts": {
              "path": "/ci/build/src/helper.ts",
              "statementMap": {"0": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 10}}},
              "fnMap": {},
              "branchMap": {},
              "s": {"0": 5},
              "f": {},
              "b": {}
            }
          }
          EOF
      # Runtime coverage is a paid (licensed) feature; without a license the
      # CLI may refuse it, so the step is allowed to fail but a success must
      # still produce valid outputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          runtime-coverage: ${{ github.workspace }}/rtcov/coverage-final.json
          coverage-root: /ci/build
          min-invocations-hot: '10'
          min-observation-volume: '1'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          type-aware: 'false'
          format: json
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
              echo "FAIL: success but issues output is not a number"
              exit 1
            fi
            if [ -z "$RESULTS" ] || [ ! -s "$RESULTS" ]; then
              echo "FAIL: success but results file missing"
              exit 1
            fi
            echo "PASS: runtime coverage analysis succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (unlicensed paid feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
