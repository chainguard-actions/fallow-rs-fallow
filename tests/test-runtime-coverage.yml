name: Test health command with runtime coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create project and V8 coverage file
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/runtime-coverage-project"
          mkdir -p "$P/src" "$P/v8"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "runtime-coverage-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF
          jq -n --arg u "file://$P/src/index.js" '{result: [{
            scriptId: "1", url: $u,
            functions: [{functionName: "add", isBlockCoverage: false,
                         ranges: [{startOffset: 0, endOffset: 44, count: 250}]}]
          }]}' > "$P/v8/coverage-1.json"
          echo "RC_ROOT=$P" >> "$GITHUB_ENV"

      # Runtime coverage is a paid (license-gated) feature of fallow. Without a
      # license the CLI may refuse it, so the outcome is checked explicitly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/runtime-coverage-project
          format: json
          runtime-coverage: ${{ env.RC_ROOT }}/v8
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert action ran (results on success, or graceful license/feature failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME results: $RESULTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
              echo "FAIL: success but results missing/invalid"
              exit 1
            fi
            echo "PASS: results produced"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: runtime coverage rejected (license-gated feature)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
