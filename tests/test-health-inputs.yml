name: Test health command inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          max-cyclomatic: '25'
          max-cognitive: '20'
          max-crap: '50'
          min-severity: 'high'
          min-score: '0'
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '1'
          save-snapshot: ''
          trend: 'false'
          score: 'true'
          auto-changed-since: 'false'
          threads: '2'
      - name: Assert action ran
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          echo "PASS: health command with extended inputs completed"
