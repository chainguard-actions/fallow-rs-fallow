name: Test dead-code save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          config: .fallowrc.json
          save-baseline: fallow-test-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was written
        run: |
          if [ ! -f fallow-test-baseline.json ]; then
            echo "FAIL: fallow-test-baseline.json not written"
            exit 1
          fi
          if ! jq empty fallow-test-baseline.json; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      - id: compare
        uses: .
        with:
          command: dead-code
          config: .fallowrc.json
          baseline: fallow-test-baseline.json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert comparison outputs
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
          BPATH: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-entries: $ENTRIES"
          echo "baseline-path: $BPATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against a fresh baseline"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! echo "$ENTRIES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "fallow-test-baseline.json" ]; then
            echo "FAIL: unexpected baseline-path"
            exit 1
          fi
          echo "PASS"
