name: Test dead-code baseline save and load
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          issue-types: unused-exports,unused-files
          threads: '2'
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not found at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS: baseline saved"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          issue-types: unused-exports,unused-files
          threads: '2'
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json

      - name: Assert baseline suppressed findings
        env:
          SAVE_ISSUES: ${{ steps.save.outputs.issues }}
          LOAD_ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          BASELINE_ENTRIES: ${{ steps.load.outputs.baseline-entries }}
        run: |
          echo "issues without baseline: $SAVE_ISSUES"
          echo "issues with baseline: $LOAD_ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $BASELINE_ENTRIES"
          for v in "$SAVE_ISSUES" "$LOAD_ISSUES"; do
            if ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "FAIL: issues output is not numeric: '$v'"
              exit 1
            fi
          done
          if [ "$LOAD_ISSUES" -gt "$SAVE_ISSUES" ]; then
            echo "FAIL: baseline run reported more issues than the saved run"
            exit 1
          fi
          echo "PASS"
