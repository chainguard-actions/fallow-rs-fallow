name: Test dead-code save-baseline then baseline suppresses known issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-save-baseline
      - name: Assert baseline file was written
        run: |
          f="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -s "$f" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          cat "$f"
          jq empty "$f" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-load-baseline
      - name: Assert baseline suppressed all known issues
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "stale entries: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues with baseline applied"
            exit 1
          fi
          if [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path output does not match the baseline input"
            exit 1
          fi
          if [ -n "$STALE" ] && [ "$STALE" != "0" ]; then
            echo "FAIL: expected no stale baseline entries"
            exit 1
          fi
          echo "PASS"
