name: Test dead-code save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-save
      - name: Assert baseline file was written
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues (save run): $ISSUES"
          f="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -s "$f" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          cat "$f"
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-baseline-compare
      - name: Assert baseline suppressed known issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $AFTER"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issue counts are not numbers"
            exit 1
          fi
          if [ "$BEFORE" -lt 1 ]; then
            echo "FAIL: expected issues in the dirty fixture before baselining"
            exit 1
          fi
          if [ "$AFTER" -ge "$BEFORE" ]; then
            echo "FAIL: baseline did not reduce the issue count"
            exit 1
          fi
          echo "PASS"
