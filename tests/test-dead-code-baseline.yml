name: Test dead-code save and load baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          config: ${{ github.workspace }}/tests/fixtures/fallow-config/.fallowrc.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
          issue-types: unused-files,unused-exports
          save-baseline: ${{ github.workspace }}/fallow-out-baseline-save/baseline.json
          save-regression-baseline: ${{ github.workspace }}/fallow-out-baseline-save/regression.json
      - name: Assert baselines saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          ls -la fallow-out-baseline-save || true
          for f in baseline.json regression.json; do
            if [ ! -f "fallow-out-baseline-save/$f" ]; then
              echo "FAIL: $f not saved"
              exit 1
            fi
            if ! jq -e . "fallow-out-baseline-save/$f" > /dev/null; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          config: ${{ github.workspace }}/tests/fixtures/fallow-config/.fallowrc.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-load
          issue-types: unused-files,unused-exports
          baseline: ${{ github.workspace }}/fallow-out-baseline-save/baseline.json
          regression-baseline: ${{ github.workspace }}/fallow-out-baseline-save/regression.json
      - name: Assert baseline loaded
        env:
          OUTCOME: ${{ steps.load.outcome }}
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED: ${{ github.workspace }}/fallow-out-baseline-save/baseline.json
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path does not match the baseline input"
            exit 1
          fi
          echo "PASS"
