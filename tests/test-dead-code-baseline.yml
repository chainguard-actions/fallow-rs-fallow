name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          save-baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not saved at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          echo "PASS: baseline saved"

      # All current findings are in the baseline, so the gate must pass.
      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          baseline: ${{ github.workspace }}/fallow-dead-code-baseline.json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert baseline suppresses known findings
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against the freshly saved baseline"
            exit 1
          fi
          echo "PASS"
