name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write a minimal fallow config
        run: echo '{}' > "$GITHUB_WORKSPACE/fallow-test-config.json"

      - id: save
        uses: .
        with:
          command: dead-code
          config: fallow-test-config.json
          issue-types: unused-files,unused-exports
          save-baseline: fallow-test-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline not saved at $f"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          config: fallow-test-config.json
          issue-types: unused-files,unused-exports
          baseline: fallow-test-baseline.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert comparison run outputs
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues should be an integer"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "fallow-test-baseline.json" ]; then
            echo "FAIL: unexpected baseline-path"
            exit 1
          fi
          echo "PASS"
