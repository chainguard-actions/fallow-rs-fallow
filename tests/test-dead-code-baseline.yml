name: Test dead-code saving and loading baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with an unused export
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/dead-code-baseline"
          mkdir -p "$P/src"
          echo '{"name":"dead-code-baseline","version":"1.0.0","type":"module","main":"src/index.js","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './lib.js';
          console.log(used());
          EOF
          cat > "$P/src/lib.js" <<'EOF'
          export function used() { return 1; }
          export function neverUsed() { return 2; }
          EOF
          mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-fixtures/dead-code-baseline
          format: json
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code-baseline.json
          save-regression-baseline: ${{ github.workspace }}/fallow-baselines/regression-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline files were saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines" || true
          for f in dead-code-baseline.json regression-baseline.json; do
            if [ ! -s "$GITHUB_WORKSPACE/fallow-baselines/$f" ]; then
              echo "FAIL: $f was not saved"
              exit 1
            fi
            if ! jq empty "$GITHUB_WORKSPACE/fallow-baselines/$f"; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS"

      # Same code, so loading the baselines must show no regression.
      - id: load
        uses: .
        with:
          command: dead-code
          root: fallow-fixtures/dead-code-baseline
          format: json
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code-baseline.json
          regression-baseline: ${{ github.workspace }}/fallow-baselines/regression-baseline.json
          fail-on-regression: 'true'
          tolerance: '0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert baseline run produced results
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          RESULTS: ${{ steps.load.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
