name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.44.0
          fail-on-issues: 'false'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json
      - name: Assert baseline saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline file not written"
            exit 1
          fi
          jq -e . "$f" > /dev/null || { echo "FAIL: baseline not JSON"; exit 1; }
          echo "PASS"
      - id: compare
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.44.0
          fail-on-issues: 'false'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json
      - name: Assert baseline reduces issues
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          AFTER: ${{ steps.compare.outputs.issues }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
        run: |
          echo "before: $BEFORE after: $AFTER entries: '$ENTRIES'"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ ]] || ! [[ "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "FAIL: baseline run reported more issues than without baseline"
            exit 1
          fi
          echo "PASS"
