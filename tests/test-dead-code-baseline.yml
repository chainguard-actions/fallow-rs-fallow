name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-baseline"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-baseline","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used(2));
          EOF
          cat > "$D/src/util.js" <<'EOF'
          export function used(n) { return n * 2; }
          export function unusedHelper(n) { return n + 1; }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fx-baseline
          save-baseline: fx-baseline/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fx-baseline/dead-code-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline not saved at $F"
            exit 1
          fi
          if ! jq empty "$F"; then
            echo "FAIL: baseline is not valid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fx-baseline
          baseline: fx-baseline/dead-code-baseline.json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline suppressed known issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          ENTRIES: ${{ steps.compare.outputs.baseline-entries }}
        run: |
          echo "issues: $ISSUES baseline-path: '$BASELINE_PATH' entries: '$ENTRIES'"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues when comparing against a fresh baseline"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "fx-baseline/dead-code-baseline.json" ]; then
            echo "FAIL: unexpected baseline-path"
            exit 1
          fi
          echo "PASS"
