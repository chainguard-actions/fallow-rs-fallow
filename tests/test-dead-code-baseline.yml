name: Test dead-code save-baseline then compare against baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline file was saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-test-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline not saved at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS: baseline saved"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          baseline: ${{ github.workspace }}/fallow-test-baseline.json

      - name: Assert baseline comparison
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          BASELINE_PATH: ${{ steps.compare.outputs.baseline-path }}
          EXPECTED_PATH: ${{ github.workspace }}/fallow-test-baseline.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against freshly saved baseline"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path mismatch"
            exit 1
          fi
          echo "PASS"
