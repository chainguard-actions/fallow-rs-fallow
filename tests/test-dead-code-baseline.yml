name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          mkdir -p fallow-sample/src
          echo '{"name":"fallow-sample","version":"1.0.0","private":true,"main":"src/index.js"}' > fallow-sample/package.json
          cat > fallow-sample/src/index.js <<'EOF'
          import { add } from './util.js';
          console.log(add(1, 2));
          EOF
          cat > fallow-sample/src/util.js <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          export function unusedHelper(x) {
            return x * 2;
          }
          EOF

      - id: save
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          save-baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline file was saved
        run: |
          f="$GITHUB_WORKSPACE/fallow-baseline.json"
          if [ ! -f "$f" ]; then
            echo "FAIL: baseline not saved at $f"
            exit 1
          fi
          jq empty "$f" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        uses: .
        with:
          command: dead-code
          root: fallow-sample
          baseline: ${{ github.workspace }}/fallow-baseline.json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline suppresses existing issues
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
          PATH_OUT: ${{ steps.compare.outputs.baseline-path }}
        run: |
          echo "issues: $ISSUES baseline-path: $PATH_OUT"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues against baseline"
            exit 1
          fi
          echo "PASS"
