name: Test dead-code save-baseline then baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: save
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-save
      - name: Assert baseline file saved
        run: |
          F="$GITHUB_WORKSPACE/fallow-baselines/dead-code.json"
          if [ ! -f "$F" ] || ! jq -e . "$F" > /dev/null; then
            echo "FAIL: baseline file missing or invalid JSON"
            exit 1
          fi
          cat "$F"
          echo "PASS"
      - id: load
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-baseline-load
      - name: Assert baseline outputs
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BPATH: ${{ steps.load.outputs.baseline-path }}
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          EXPECTED: ${{ github.workspace }}/fallow-baselines/dead-code.json
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BPATH"
          echo "baseline-entries: $ENTRIES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ -n "$BPATH" ] && [ "$BPATH" != "$EXPECTED" ]; then
            echo "FAIL: baseline-path should echo the input"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
