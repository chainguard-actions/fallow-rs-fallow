name: Test dead-code save-baseline then baseline comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with unused code
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/dead-code-baseline-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "dead-code-baseline-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > "$P/src/used.js" <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF

      - id: save
        name: Save a baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-baseline-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-baseline: ${{ github.workspace }}/fallow-baseline.json

      - name: Assert baseline file was written
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          F="$GITHUB_WORKSPACE/fallow-baseline.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: baseline file not found at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: baseline is not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        name: Compare against the baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-baseline-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          baseline: ${{ github.workspace }}/fallow-baseline.json

      - name: Assert baseline run reports no more issues than the saved run
        env:
          BEFORE: ${{ steps.save.outputs.issues }}
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "before: $BEFORE after: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || ! [[ "$BEFORE" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues"
            exit 1
          fi
          if [ "$ISSUES" -gt "$BEFORE" ]; then
            echo "FAIL: baseline run reported more issues than the saved run"
            exit 1
          fi
          echo "PASS"
