name: Test dead-code save and load baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: save
        uses: .
        with:
          command: dead-code
          save-baseline: fallow-test-baseline.json
          save-regression-baseline: fallow-test-regression.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline files saved
        run: |
          ls -la fallow-test-*.json || true
          for f in fallow-test-baseline.json fallow-test-regression.json; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f was not written"
              exit 1
            fi
            if ! jq empty "$f" 2>/dev/null; then
              echo "FAIL: $f is not valid JSON"
              exit 1
            fi
          done
          echo "PASS"

      - id: load
        uses: .
        with:
          command: dead-code
          baseline: fallow-test-baseline.json
          regression-baseline: fallow-test-regression.json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baseline was loaded
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "stale entries: $STALE"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "fallow-test-baseline.json" ]; then
            echo "FAIL: unexpected baseline-path"
            exit 1
          fi
          echo "PASS"
