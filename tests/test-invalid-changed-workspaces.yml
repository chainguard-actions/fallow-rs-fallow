name: Test changed-workspaces with a missing git ref fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/act-fixtures/monorepo
          changed-workspaces: refs/heads/this-ref-does-not-exist-xyz
          fail-on-issues: 'false'
          artifacts-dir: fallow-out-changed-ws
      - name: Assert hard error on missing ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          ARGS_FILE="fallow-out-changed-ws/fallow-analysis-args.sh"
          if [ -f "$ARGS_FILE" ]; then
            cat "$ARGS_FILE"
            grep -qF -- "--changed-workspaces" "$ARGS_FILE" || { echo "FAIL: --changed-workspaces not forwarded"; exit 1; }
          else
            echo "FAIL: action did not reach the fallow invocation"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: a missing changed-workspaces ref must be a hard error"
            exit 1
          fi
          echo "PASS"
