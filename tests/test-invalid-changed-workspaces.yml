name: Test changed-workspaces with a missing ref is a hard error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-changed-ws
          changed-workspaces: refs/heads/fallow-ref-that-does-not-exist-xyz
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected a hard error for a missing changed-workspaces ref"
            exit 1
          fi
          if ! grep -q -- '--changed-workspaces' fallow-out-changed-ws/fallow-analysis-args.sh; then
            echo "FAIL: --changed-workspaces was not forwarded to fallow"
            exit 1
          fi
          echo "PASS"
