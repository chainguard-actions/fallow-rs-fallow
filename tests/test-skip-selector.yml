name: Test skip selector input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-skip
          cat > /tmp/fallow-test-skip/package.json <<'EOF'
          {
            "name": "test-skip-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-test-skip/index.js <<'EOF'
          export function used() { return 1; }
          export function unused() { return 2; }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          root: /tmp/fallow-test-skip
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          skip: 'dupes,health'
          annotations: 'false'
      - name: Assert action ran with skip selector
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip selector"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
