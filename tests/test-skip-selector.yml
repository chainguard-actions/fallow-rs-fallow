name: Test skip selector on combined run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          root: tests/fixtures/simple-js
          skip: dupes,health
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert issues output and skip flag
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty for combined run"
            exit 1
          fi
          if [ -f fallow-analysis-args.sh ]; then
            cat fallow-analysis-args.sh
            if ! grep -q -- "--skip" fallow-analysis-args.sh; then
              echo "FAIL: --skip not passed"
              exit 1
            fi
          fi
          echo "PASS"
