name: Test skip selector input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-skip-project
          cat > /tmp/fallow-skip-project/package.json <<'EOF'
          {
            "name": "skip-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-skip-project/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
      - name: Run with skip selector (skip dupes and health, run only dead-code)
        id: skip-selector
        uses: .
        continue-on-error: true
        with:
          root: /tmp/fallow-skip-project
          format: json
          fail-on-issues: 'false'
          skip: 'dupes,health'
          auto-changed-since: 'false'
      - name: Assert skip-selector step ran
        env:
          OUTCOME: ${{ steps.skip-selector.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: skip-selector step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
