name: Test combined run with skip, save-snapshot then trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: snapshot
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-snapshot
          skip: dupes
          score: 'true'
          save-snapshot: 'true'
      - name: Assert snapshot run outputs
        env:
          ISSUES: ${{ steps.snapshot.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          find tests/fixtures/sample-project/.fallow -maxdepth 3 2>/dev/null || true
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          echo "PASS"
      - id: trend
        uses: .
        with:
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-trend
          skip: dupes
          score: 'true'
          trend: 'true'
      - name: Assert trend run outputs
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
