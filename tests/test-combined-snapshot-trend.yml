name: Test combined run with skip, snapshot and trend
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: snapshot
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          skip: dupes
          score: 'true'
          save-snapshot: 'true'

      - name: Assert snapshot run outputs and skip applied
        env:
          ISSUES: ${{ steps.snapshot.outputs.issues }}
          RESULTS: ${{ steps.snapshot.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          DUPES=$(jq -r 'if .dupes == null then "absent" else "present" end' "$RESULTS")
          echo "dupes section: $DUPES"
          if [ "$DUPES" = "present" ]; then
            CG=$(jq -r '(.dupes.clone_groups // []) | length' "$RESULTS")
            if [ "$CG" != "0" ]; then
              echo "FAIL: dupes was skipped but clone groups were reported"
              exit 1
            fi
          fi
          echo "PASS"

      - name: Assert a snapshot was saved
        run: |
          for SNAPDIR in "$GITHUB_WORKSPACE/tests/fixtures/simple-js/.fallow/snapshots" "$GITHUB_WORKSPACE/.fallow/snapshots"; do
            if [ -n "$(ls -A "$SNAPDIR" 2>/dev/null)" ]; then
              ls -la "$SNAPDIR"
              echo "PASS: snapshot found in $SNAPDIR"
              exit 0
            fi
          done
          echo "FAIL: no snapshot found under .fallow/snapshots"
          exit 1

      - id: trend
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          skip: dupes
          score: 'true'
          trend: 'true'

      - name: Assert trend run outputs
        env:
          ISSUES: ${{ steps.trend.outputs.issues }}
          RESULTS: ${{ steps.trend.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
