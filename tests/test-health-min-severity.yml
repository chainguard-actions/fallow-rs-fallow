name: Test health command with min-severity gate
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project with trivial functions
        run: |
          rm -rf sample-app && mkdir -p sample-app/src
          cat > sample-app/package.json <<'EOF'
          {"name":"sample-app","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample-app/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          EOF
          cat > sample-app/src/index.js <<'EOF'
          import { add } from './math.js';
          export function main() { return add(1, 2); }
          EOF

      - id: action
        uses: .
        with:
          version: '3.34.0'
          root: sample-app
          command: health
          min-severity: critical
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"
