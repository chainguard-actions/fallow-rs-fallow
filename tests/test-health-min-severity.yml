name: Test health min-severity gate on a trivial project
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          min-severity: critical

      - name: Assert no critical findings in trivial fixture
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (no critical complexity in fixture)"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          echo "PASS"
