name: Test health min-severity gate with lenient thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Thresholds are high enough that no finding is produced, so a
      # min-severity: critical gate has nothing to trip on and must pass.
      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          max-cyclomatic: '100'
          max-cognitive: '100'
          max-crap: '10000'
          min-severity: critical

      - name: Assert no findings and gate passed
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 findings with thresholds of 100, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"
