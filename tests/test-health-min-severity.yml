name: Test health min-severity gate on a simple project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/min-severity-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "min-severity-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          add(1, 2);
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/min-severity-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          min-severity: critical

      - name: Assert no critical findings
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number: '$ISSUES'"
            exit 1
          fi
          if echo "$FAILED" | grep -q 'health-min-severity'; then
            echo "FAIL: min-severity gate failed on a trivial project"
            exit 1
          fi
          echo "PASS"
