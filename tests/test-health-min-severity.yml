name: Test health min-severity gate on simple project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          min-severity: critical
      - name: Assert min-severity gate did not fail
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          GATES_FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $GATES_FAILED"
          case ",$GATES_FAILED," in
            *,health-min-severity,*) echo "FAIL: no critical complexity expected in trivial fixture"; exit 1 ;;
          esac
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          echo "PASS"
