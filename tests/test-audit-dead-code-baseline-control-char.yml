name: Test audit rejects control characters in dead-code-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/sample-project
          version: 3.35.0
          dead-code-baseline: "bad\npath.json"
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-dcb-ctrl
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected dead-code-baseline with a newline to be rejected"
            exit 1
          fi
          echo "PASS"
