name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/monorepo
          format: json
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert results valid and not mentioning pkg-b
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if jq -r '.. | .path? // empty' "$RESULTS" 2>/dev/null | grep -q 'packages/pkg-b/'; then
            echo "FAIL: pkg-b findings leaked into workspace-scoped output"
            exit 1
          fi
          echo "PASS"
