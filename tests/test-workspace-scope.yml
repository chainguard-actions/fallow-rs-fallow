name: Test workspace scoping and misc inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-mono/packages/web
          mkdir -p /tmp/fallow-mono/packages/admin
          cat > /tmp/fallow-mono/package.json <<'EOF'
          {
            "name": "mono-root",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-mono/packages/web/package.json <<'EOF'
          {
            "name": "web",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-mono/packages/web/index.js <<'EOF'
          export function webMain() { return 'web'; }
          EOF
          cat > /tmp/fallow-mono/packages/admin/package.json <<'EOF'
          {
            "name": "admin",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-mono/packages/admin/index.js <<'EOF'
          export function adminMain() { return 'admin'; }
          EOF
      - id: workspace-scoped
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono
          format: json
          fail-on-issues: 'false'
          workspace: 'web'
          threads: '2'
          skip: 'dupes,health'
          auto-changed-since: 'false'
      - name: Assert workspace-scoped step ran
        env:
          OUTCOME: ${{ steps.workspace-scoped.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
