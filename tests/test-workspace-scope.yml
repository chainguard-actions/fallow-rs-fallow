name: Test dead-code scoped to one workspace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create monorepo fixture
        run: |
          mkdir -p mono/packages/app mono/packages/lib
          cat > mono/package.json <<'EOF'
          {"name":"mono-root","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          cat > mono/packages/app/package.json <<'EOF'
          {"name":"app","version":"1.0.0","main":"index.js","type":"module"}
          EOF
          cat > mono/packages/app/index.js <<'EOF'
          export function run() { return 1; }
          run();
          EOF
          cat > mono/packages/lib/package.json <<'EOF'
          {"name":"lib","version":"1.0.0","main":"index.js","type":"module"}
          EOF
          cat > mono/packages/lib/index.js <<'EOF'
          export function helper() { return 2; }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: mono
          workspace: app
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          echo "PASS"
