name: Test dead-code scoped to a single workspace package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample monorepo
        run: |
          set -e
          mkdir -p mono/packages/a/src mono/packages/b/src
          cat > mono/package.json <<'EOF'
          {"name":"mono","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          cat > mono/packages/a/package.json <<'EOF'
          {"name":"@sample/a","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
          cat > mono/packages/a/src/index.js <<'EOF'
          export function a() { return 1; }
          EOF
          cat > mono/packages/a/src/orphan.js <<'EOF'
          export const orphanA = 1;
          EOF
          cat > mono/packages/b/package.json <<'EOF'
          {"name":"@sample/b","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
          cat > mono/packages/b/src/index.js <<'EOF'
          export function b() { return 2; }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: mono
          workspace: '@sample/a'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert workspace-scoped run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
