name: Test workspace scoping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal monorepo-style JS project
        run: |
          mkdir -p /tmp/fallow-workspace-project/packages/web
          mkdir -p /tmp/fallow-workspace-project/packages/admin
          cat > /tmp/fallow-workspace-project/packages/web/index.js << 'EOF'
          export function webHello() { return 'hello from web'; }
          EOF
          cat > /tmp/fallow-workspace-project/packages/web/package.json << 'EOF'
          { "name": "web", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-workspace-project/packages/admin/index.js << 'EOF'
          export function adminHello() { return 'hello from admin'; }
          EOF
          cat > /tmp/fallow-workspace-project/packages/admin/package.json << 'EOF'
          { "name": "admin", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-workspace-project/package.json << 'EOF'
          { "name": "monorepo", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-workspace-project
          fail-on-issues: 'false'
          workspace: 'web'
          format: json
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
