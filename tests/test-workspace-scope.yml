name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample monorepo
        run: |
          mkdir -p fallow-mono/packages/pkg-a fallow-mono/packages/pkg-b
          echo '{"name":"fallow-mono","private":true,"workspaces":["packages/*"]}' > fallow-mono/package.json
          echo '{"name":"pkg-a","version":"1.0.0","main":"index.js"}' > fallow-mono/packages/pkg-a/package.json
          echo 'export const a = 1;' > fallow-mono/packages/pkg-a/index.js
          echo 'export const aOrphan = 1;' > fallow-mono/packages/pkg-a/orphan-a.js
          echo '{"name":"pkg-b","version":"1.0.0","main":"index.js"}' > fallow-mono/packages/pkg-b/package.json
          echo 'export const b = 1;' > fallow-mono/packages/pkg-b/index.js
          echo 'export const bOrphan = 1;' > fallow-mono/packages/pkg-b/orphan-b.js

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-mono
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert output is scoped to pkg-a
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          if grep -q 'orphan-b.js' "$RESULTS"; then
            echo "FAIL: pkg-b finding reported despite workspace: pkg-a"
            exit 1
          fi
          echo "PASS"
