name: Test workspace scope inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-workspace/packages/web
          mkdir -p /tmp/fallow-workspace/packages/admin
          cat > /tmp/fallow-workspace/package.json <<'EOF'
          {
            "name": "monorepo",
            "version": "1.0.0",
            "workspaces": ["packages/*"]
          }
          EOF
          cat > /tmp/fallow-workspace/packages/web/package.json <<'EOF'
          {
            "name": "web",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-workspace/packages/web/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
          cat > /tmp/fallow-workspace/packages/admin/package.json <<'EOF'
          {
            "name": "admin",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-workspace/packages/admin/index.js <<'EOF'
          export function adminUsed() { return 1; }
          export function adminUnused() { return 2; }
          EOF
      - name: Run with workspace scope
        id: workspace-scope
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-workspace
          format: json
          fail-on-issues: 'false'
          workspace: 'web'
          auto-changed-since: 'false'
      - name: Assert workspace-scope step ran
        env:
          OUTCOME: ${{ steps.workspace-scope.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: workspace step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Run with changed-workspaces
        id: changed-workspaces
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-workspace
          format: json
          fail-on-issues: 'false'
          changed-workspaces: 'HEAD'
          auto-changed-since: 'false'
      - name: Assert changed-workspaces step ran
        env:
          OUTCOME: ${{ steps.changed-workspaces.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: changed-workspaces step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
