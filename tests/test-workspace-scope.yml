name: Test workspace scoping in a monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample monorepo
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-mono"
          rm -rf "$S"; mkdir -p "$S/packages/pkg-a/src" "$S/packages/pkg-b/src"
          cat > "$S/package.json" <<'EOF'
          {"name":"fallow-mono","version":"1.0.0","private":true,"workspaces":["packages/*"]}
          EOF
          for p in pkg-a pkg-b; do
            cat > "$S/packages/$p/package.json" <<EOF
          {"name":"$p","version":"1.0.0","type":"module","main":"src/index.js"}
          EOF
            cat > "$S/packages/$p/src/index.js" <<'EOF'
          import { used } from './util.js';
          console.log(used());
          EOF
            cat > "$S/packages/$p/src/util.js" <<'EOF'
          export function used() { return 1; }
          export function unusedHelper() { return 2; }
          EOF
          done

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-mono
          workspace: pkg-a
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results scoped to pkg-a
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if grep -q 'packages/pkg-b/src' "$RESULTS"; then
            echo "FAIL: results include pkg-b findings despite workspace: pkg-a"
            exit 1
          fi
          echo "PASS"
