name: Test workspace scoping in a small monorepo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a small npm-workspaces monorepo
        run: |
          set -e
          M=fallow-test-mono
          rm -rf "$M"
          mkdir -p "$M/packages/web/src" "$M/packages/admin/src"
          cat > "$M/package.json" <<'EOF'
          {"name":"mono-root","private":true,"workspaces":["packages/*"]}
          EOF
          cat > "$M/packages/web/package.json" <<'EOF'
          {"name":"web","version":"1.0.0","main":"src/index.js"}
          EOF
          cat > "$M/packages/admin/package.json" <<'EOF'
          {"name":"admin","version":"1.0.0","main":"src/index.js"}
          EOF
          printf 'export const used = 1;\nexport const unusedWeb = 2;\n' > "$M/packages/web/src/index.js"
          printf 'export const unusedAdmin = 3;\n' > "$M/packages/admin/src/index.js"
          printf 'export const orphan = 4;\n' > "$M/packages/web/src/orphan.js"

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-test-mono
          workspace: web
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results are scoped to the web workspace
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS issues: $ISSUES"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not a number"
            exit 1
          fi
          if grep -q 'packages/admin' "$RESULTS"; then
            echo "FAIL: admin workspace findings leaked into web-scoped results"
            exit 1
          fi
          echo "PASS"
