name: Test audit command options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for audit analysis
        run: |
          mkdir -p /tmp/fallow-audit-project
          cat > /tmp/fallow-audit-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          export function world() { return 'world'; }
          EOF
          cat > /tmp/fallow-audit-project/package.json << 'EOF'
          { "name": "audit-test-project", "version": "1.0.0", "type": "module" }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: /tmp/fallow-audit-project
          fail-on-issues: 'false'
          gate: 'new-only'
          security-gate: 'new'
          format: json
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          echo "gate: $GATE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
