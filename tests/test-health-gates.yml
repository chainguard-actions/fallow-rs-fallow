name: Test health gates min-score and min-severity on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple project
        run: |
          P="$GITHUB_WORKSPACE/fx-health-gates"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "fx-health-gates",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js"
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          export function add(a, b) {
            return a + b;
          }
          console.log(add(1, 2));
          EOF

      - id: action
        uses: .
        with:
          command: health
          root: fx-health-gates
          min-score: '0'
          min-severity: critical
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert gates passed and results written
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES"
          echo "gates-failed: $FAILED"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if [ -n "$FAILED" ]; then
            echo "FAIL: no gate should fail for min-score 0 on trivial code"
            exit 1
          fi
          echo "PASS"

  min-score-wrong-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          min-score: '50'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
      - name: Assert min-score is rejected on non-health command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected min-score with dead-code to be rejected"
            exit 1
          fi
          echo "PASS"
