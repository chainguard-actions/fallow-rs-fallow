name: Test health gates (min-score, min-severity) pass on simple code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create simple fixture project
        run: |
          set -e
          P="$GITHUB_WORKSPACE/fx-project"
          rm -rf "$P"
          mkdir -p "$P/src"
          printf '%s\n' '{"name":"fx-project","private":true,"version":"1.0.0","main":"src/index.ts"}' > "$P/package.json"
          printf '%s\n' 'function add(a: number, b: number): number { return a + b; }' 'console.log(add(1, 2));' > "$P/src/index.ts"

      - id: action
        uses: .
        with:
          command: health
          root: fx-project
          min-score: '0'
          min-severity: critical
          version: '3.34.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert gates passed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
          FAILED: ${{ steps.action.outputs.gates-failed }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES gates-failed: '$FAILED'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results invalid"
            exit 1
          fi
          echo "score section:"
          jq '.health_score // .summary.score // empty' "$RESULTS" || true
          echo "PASS"
