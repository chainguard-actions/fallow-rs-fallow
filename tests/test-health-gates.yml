name: Test health min-severity and min-score gates (passing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fx-gates"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fx-gates","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > "$D/src/index.js" <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > "$D/src/math.js" <<'EOF'
          export function add(a, b) { return a + b; }
          EOF

      - id: severity
        uses: .
        with:
          command: health
          root: fx-gates
          max-cyclomatic: '50'
          max-cognitive: '50'
          min-severity: critical
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert min-severity run succeeded
        env:
          ISSUES: ${{ steps.severity.outputs.issues }}
          FAILED: ${{ steps.severity.outputs.gates-failed }}
        run: |
          echo "issues: $ISSUES gates-failed: '$FAILED'"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if echo "$FAILED" | grep -q 'health-min-severity'; then
            echo "FAIL: min-severity gate unexpectedly failed"
            exit 1
          fi
          echo "PASS"

      - id: score
        uses: .
        with:
          command: health
          root: fx-gates
          min-score: '0'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert min-score run succeeded and results contain a score
        env:
          RESULTS: ${{ steps.score.outputs.results }}
          FAILED: ${{ steps.score.outputs.gates-failed }}
        run: |
          echo "results: $RESULTS gates-failed: '$FAILED'"
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if echo "$FAILED" | grep -q 'health-min-score'; then
            echo "FAIL: min-score 0 gate should never fail"
            exit 1
          fi
          if ! grep -qi 'score' "$RESULTS"; then
            echo "FAIL: expected a health score in results"
            exit 1
          fi
          echo "PASS"
