name: Test runtime-coverage inputs reject non-numeric min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/runtime-coverage"
          mkdir -p "$P/src" "$P/v8"
          echo '{"name":"runtime-coverage","version":"1.0.0","type":"module"}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: act-fixtures/runtime-coverage
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          runtime-coverage: act-fixtures/runtime-coverage/v8
          min-invocations-hot: not-a-number
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-numeric min-invocations-hot"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation rejects inputs"
            exit 1
          fi
          echo "PASS"
