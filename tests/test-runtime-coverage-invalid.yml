name: Test runtime coverage inputs reject an invalid low-traffic-threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/runtime-project"
          mkdir -p "$P/src" "$P/v8-coverage"
          echo '{"name":"runtime-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/runtime-project
          format: json
          runtime-coverage: tests/fixtures/runtime-project/v8-coverage
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: not-a-number
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert action rejected the invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail validation of low-traffic-threshold"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run (issues='$ISSUES')"
            exit 1
          fi
          echo "PASS"
