name: Test runtime-coverage inputs reject a non-integer hot-path threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # min-invocations-hot must be a positive integer; the action validates it
      # before invoking fallow and exits 2.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/js-project
          format: json
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: 'not-a-number'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          type-aware: 'false'
          no-cache: 'true'
          version: '3.33.0'

      - name: Assert the action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer min-invocations-hot"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: issues output should be empty when validation fails"
            exit 1
          fi
          echo "PASS"
