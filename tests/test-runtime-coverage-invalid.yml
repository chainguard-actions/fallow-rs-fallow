name: Test runtime-coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/rc-project/src"
          echo '{"name":"rc-project","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' \
            > "$GITHUB_WORKSPACE/tests/fixtures/rc-project/package.json"
          echo 'export const x = 1;' > "$GITHUB_WORKSPACE/tests/fixtures/rc-project/src/index.js"
          mkdir -p "$GITHUB_WORKSPACE/rc-data"
          echo '{}' > "$GITHUB_WORKSPACE/rc-data/coverage-final.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/rc-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          runtime-coverage: rc-data/coverage-final.json
          min-invocations-hot: 'not-a-number'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid min-invocations-hot"
            exit 1
          fi
          if [ -n "$RESULTS" ]; then
            echo "FAIL: expected no results output when validation fails"
            exit 1
          fi
          echo "PASS"
