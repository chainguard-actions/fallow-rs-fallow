name: Test runtime-coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project and V8 coverage dir
        run: |
          P="$GITHUB_WORKSPACE/fallow-proj-runtime"
          mkdir -p "$P/src" "$P/v8-coverage"
          cat > "$P/package.json" <<'EOF'
          { "name": "runtime-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          echo 'console.log(1);' > "$P/src/index.js"
          echo '{"result":[]}' > "$P/v8-coverage/coverage-1.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: fallow-proj-runtime
          format: json
          runtime-coverage: ${{ github.workspace }}/fallow-proj-runtime/v8-coverage
          min-invocations-hot: 'not-a-number'
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert the action rejected the invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail validation for min-invocations-hot"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no issues output when validation fails"
            exit 1
          fi
          echo "PASS: invalid min-invocations-hot rejected"
