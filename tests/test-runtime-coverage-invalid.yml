name: Test runtime-coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src fx/coverage
          echo '{"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}' > fx/package.json
          echo 'console.log(1);' > fx/src/index.js
          echo '{}' > fx/coverage/coverage-final.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          root: fx
          command: health
          runtime-coverage: fx/coverage/coverage-final.json
          min-invocations-hot: not-a-number
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid min-invocations-hot, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
