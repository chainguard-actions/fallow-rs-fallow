name: Test runtime-coverage with an invalid threshold is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a placeholder V8 coverage directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fx-rtcov/v8"
          echo '{"result": []}' > "$GITHUB_WORKSPACE/fx-rtcov/v8/coverage-1.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          runtime-coverage: ${{ github.workspace }}/fx-rtcov/v8
          min-invocations-hot: '100'
          min-observation-volume: lots
          low-traffic-threshold: '0.1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert non-integer min-observation-volume is rejected
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected min-observation-volume=lots to be rejected"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: validation should stop before analysis produces issues"
            exit 1
          fi
          echo "PASS"
