name: Test runtime-coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/runtime-cov-project"
          mkdir -p "$P/src" "$P/coverage"
          cat > "$P/package.json" <<'EOF'
          { "name": "runtime-cov-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }
          EOF
          echo 'export const x = 1;' > "$P/src/index.js"
          echo '{}' > "$P/coverage/coverage-final.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/runtime-cov-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          runtime-coverage: tests/fixtures/runtime-cov-project/coverage/coverage-final.json
          min-invocations-hot: not-a-number
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'

      - name: Assert the action rejected the invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer min-invocations-hot"
            exit 1
          fi
          echo "PASS"
