name: Test runtime-coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/runtime-coverage-project"
          mkdir -p "$P/src" "$P/v8-coverage"
          echo '{"name":"runtime-coverage-project","version":"1.0.0","main":"src/index.js"}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/runtime-coverage-project
          runtime-coverage: tests/fixtures/runtime-coverage-project/v8-coverage
          min-invocations-hot: not-a-number
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert validation failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer min-invocations-hot"
            exit 1
          fi
          echo "PASS"
