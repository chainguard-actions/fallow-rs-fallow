name: Test runtime coverage options reject a non-numeric min-invocations-hot
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'
          runtime-coverage: tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: not-a-number
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'

      - name: Assert action rejected invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected validation failure for non-numeric min-invocations-hot"
            exit 1
          fi
          echo "PASS"
