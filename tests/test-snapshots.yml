name: Test save-snapshot and trend inputs
on:
  workflow_dispatch:
jobs:
  test-save-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          save-snapshot: /tmp/fallow-snapshot
          auto-changed-since: 'false'

      - name: Assert action ran with save-snapshot
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with save-snapshot"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          trend: 'true'
          auto-changed-since: 'false'

      - name: Assert action ran with trend
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with trend"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
