name: Test changed-since and changed-workspaces inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          changed-since: HEAD~1
      - name: Assert action ran with changed-since
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
  test-changed-workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Create a minimal monorepo project
        run: |
          mkdir -p /tmp/fallow-mono/packages/app
          cat > /tmp/fallow-mono/packages/app/index.js << 'EOF'
          export function hello() { return 'hello'; }
          EOF
          cat > /tmp/fallow-mono/packages/app/package.json << 'EOF'
          { "name": "app", "version": "1.0.0", "type": "module" }
          EOF
          cat > /tmp/fallow-mono/package.json << 'EOF'
          { "name": "mono", "version": "1.0.0", "workspaces": ["packages/*"] }
          EOF
      - id: action-cw
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-mono
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          changed-workspaces: HEAD~1
      - name: Assert action ran with changed-workspaces
        env:
          OUTCOME: ${{ steps.action-cw.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
