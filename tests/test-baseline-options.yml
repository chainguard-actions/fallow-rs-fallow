name: Test baseline options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          baseline: /tmp/nonexistent-baseline.json
          save-baseline: /tmp/fallow-baseline-out.json
          dead-code-baseline: /tmp/nonexistent-dc-baseline.json
          health-baseline: /tmp/nonexistent-health-baseline.json
          dupes-baseline: /tmp/nonexistent-dupes-baseline.json
      - name: Assert action ran (baseline inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with baseline inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with nonexistent baseline paths)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
