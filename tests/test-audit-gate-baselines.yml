name: Test audit with gate, changed-since and per-analysis baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project with git history
        run: |
          set -e
          git config --global --add safe.directory '*'
          D="$GITHUB_WORKSPACE/fx-audit"
          rm -rf "$D"
          mkdir -p "$D/src"
          cd "$D"
          cat > package.json <<'EOF'
          {"name":"fx-audit","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { used } from './util.js';
          console.log(used(2));
          EOF
          echo 'export function used(n) { return n * 2; }' > src/util.js
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add -A
          git commit -qm "base"
          git tag fx-audit-base
          echo 'export function addedHelper(n) { return n + 1; }' >> src/util.js
          git commit -qam "add unused export"
          git log --oneline

      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: fx-audit
          save-baseline: fx-audit/dc-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-health
        uses: .
        with:
          command: health
          root: fx-audit
          save-baseline: fx-audit/health-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: fx-audit
          save-baseline: fx-audit/dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert baselines saved
        run: |
          for f in dc-baseline.json health-baseline.json dupes-baseline.json; do
            if [ ! -f "$GITHUB_WORKSPACE/fx-audit/$f" ]; then
              echo "FAIL: missing $f"
              exit 1
            fi
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          command: audit
          root: fx-audit
          gate: all
          changed-since: fx-audit-base
          dead-code-baseline: fx-audit/dc-baseline.json
          health-baseline: fx-audit/health-baseline.json
          dupes-baseline: fx-audit/dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert audit verdict and gate
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
          GATE: ${{ steps.action.outputs.gate }}
          ISSUES: ${{ steps.action.outputs.issues }}
          CHANGED_UNAVAILABLE: ${{ steps.action.outputs.changed-files-unavailable }}
        run: |
          echo "verdict: '$VERDICT' gate: '$GATE' issues: '$ISSUES' changed-files-unavailable: '$CHANGED_UNAVAILABLE'"
          case "$VERDICT" in
            pass|warn|fail) ;;
            *) echo "FAIL: unexpected verdict '$VERDICT'"; exit 1 ;;
          esac
          if [ -n "$GATE" ] && [ "$GATE" != "all" ]; then
            echo "FAIL: expected gate 'all', got '$GATE'"
            exit 1
          fi
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not an integer"
            exit 1
          fi
          if [ "$CHANGED_UNAVAILABLE" != "false" ]; then
            echo "FAIL: expected changed-files-unavailable=false"
            exit 1
          fi
          echo "PASS"
