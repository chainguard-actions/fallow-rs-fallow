name: Test combined run with only, skip and threads selectors
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: only
        uses: .
        with:
          root: tests/fixtures/simple-js
          format: json
          only: dead-code,health
          threads: '2'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - id: skip
        uses: .
        with:
          root: tests/fixtures/simple-js
          format: json
          skip: dupes
          threads: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert both combined runs produced results
        env:
          ONLY_ISSUES: ${{ steps.only.outputs.issues }}
          ONLY_RESULTS: ${{ steps.only.outputs.results }}
          SKIP_ISSUES: ${{ steps.skip.outputs.issues }}
          SKIP_RESULTS: ${{ steps.skip.outputs.results }}
        run: |
          echo "only: issues=$ONLY_ISSUES results=$ONLY_RESULTS"
          echo "skip: issues=$SKIP_ISSUES results=$SKIP_RESULTS"
          for v in "$ONLY_ISSUES" "$SKIP_ISSUES"; do
            if ! echo "$v" | grep -qE '^[0-9]+$'; then
              echo "FAIL: issues output is not a number: '$v'"
              exit 1
            fi
          done
          for f in "$ONLY_RESULTS" "$SKIP_RESULTS"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "FAIL: results file missing: '$f'"
              exit 1
            fi
          done
          echo "PASS"
