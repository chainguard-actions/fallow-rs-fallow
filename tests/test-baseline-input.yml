name: Test baseline input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p /tmp/fallow-baseline-input-test
          cat > /tmp/fallow-baseline-input-test/package.json << 'EOF'
          {
            "name": "baseline-input-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-baseline-input-test/index.js << 'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF

      # First run: save a baseline
      - id: save
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-baseline-input-test
          format: json
          fail-on-issues: 'false'
          save-baseline: /tmp/fallow-baseline-input.json
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert save step ran
        env:
          OUTCOME: ${{ steps.save.outcome }}
        run: |
          echo "save outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: save step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      # Second run: use the baseline input for comparison
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-baseline-input-test
          format: json
          fail-on-issues: 'false'
          baseline: /tmp/fallow-baseline-input.json
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action ran with baseline input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          BASELINE_PATH: ${{ steps.action.outputs.baseline-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with baseline input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
