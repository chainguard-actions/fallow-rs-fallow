name: Test health hotspots with since and min-commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample git project with history
        run: |
          set -e
          S="$GITHUB_WORKSPACE/fallow-sample"
          rm -rf "$S"; mkdir -p "$S/src"
          cd "$S"
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > package.json <<'EOF'
          {"name":"fallow-sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > src/index.js <<'EOF'
          import { calc } from './calc.js';
          console.log(calc(1));
          EOF
          for i in 1 2 3; do
            printf 'export function calc(x) {\n  if (x > %s) { return x * %s; }\n  return x;\n}\n' "$i" "$i" > src/calc.js
            git add -A
            git commit -q -m "change $i"
          done
          git log --oneline

      - id: action
        uses: .
        with:
          command: health
          root: fallow-sample
          hotspots: 'true'
          since: 1y
          min-commits: '1'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert results valid JSON
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: issues is not a non-negative integer"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
