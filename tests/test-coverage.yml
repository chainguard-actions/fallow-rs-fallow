name: Test coverage and health threshold inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          coverage: ''
          coverage-root: ''
          runtime-coverage: ''
          max-crap: '30'
          max-cyclomatic: '20'
          max-cognitive: '15'
          min-severity: 'moderate'
          min-score: ''
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
