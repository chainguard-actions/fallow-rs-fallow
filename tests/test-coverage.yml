name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake coverage file
        run: |
          mkdir -p /tmp/fallow-coverage
          echo '{}' > /tmp/fallow-coverage/coverage-final.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: .
          fail-on-issues: 'false'
          format: json
          coverage: /tmp/fallow-coverage/coverage-final.json
          coverage-root: /tmp/fallow-coverage
          runtime-coverage: /tmp/fallow-coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '1000'
          low-traffic-threshold: '0.01'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
