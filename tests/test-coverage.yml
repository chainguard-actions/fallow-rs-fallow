name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-test-coverage
          cat > /tmp/fallow-test-coverage/package.json <<'EOF'
          {
            "name": "test-coverage",
            "version": "1.0.0",
            "scripts": { "start": "node index.js" }
          }
          EOF
          cat > /tmp/fallow-test-coverage/index.js <<'EOF'
          function hello() { return 'hello'; }
          function world() { return 'world'; }
          module.exports = { hello, world };
          EOF
          cat > /tmp/fallow-test-coverage/coverage-final.json <<'EOF'
          {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-test-coverage
          coverage: /tmp/fallow-test-coverage/coverage-final.json
          coverage-root: /tmp/fallow-test-coverage
          runtime-coverage: /tmp/fallow-test-coverage/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '1000'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          format: json
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
