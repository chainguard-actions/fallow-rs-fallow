name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with Istanbul coverage data
        run: |
          mkdir -p /tmp/fallow-coverage-project
          cat > /tmp/fallow-coverage-project/index.js << 'EOF'
          export function add(a, b) { return a + b; }
          export function subtract(a, b) { return a - b; }
          export function multiply(a, b) { return a * b; }
          EOF
          cat > /tmp/fallow-coverage-project/package.json << 'EOF'
          { "name": "coverage-test", "version": "1.0.0", "type": "module" }
          EOF
          # Create a minimal Istanbul coverage-final.json
          cat > /tmp/fallow-coverage-project/coverage-final.json << 'EOF'
          {
            "/tmp/fallow-coverage-project/index.js": {
              "path": "/tmp/fallow-coverage-project/index.js",
              "statementMap": {
                "0": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 50}},
                "1": {"start": {"line": 2, "column": 0}, "end": {"line": 2, "column": 50}}
              },
              "fnMap": {
                "0": {"name": "add", "decl": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 50}}, "loc": {"start": {"line": 1, "column": 0}, "end": {"line": 1, "column": 50}}, "line": 1},
                "1": {"name": "subtract", "decl": {"start": {"line": 2, "column": 0}, "end": {"line": 2, "column": 50}}, "loc": {"start": {"line": 2, "column": 0}, "end": {"line": 2, "column": 50}}, "line": 2}
              },
              "branchMap": {},
              "s": {"0": 10, "1": 0},
              "f": {"0": 10, "1": 0},
              "b": {}
            }
          }
          EOF

      - id: action-coverage
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-coverage-project
          format: json
          fail-on-issues: 'false'
          coverage: /tmp/fallow-coverage-project/coverage-final.json
          coverage-root: /tmp/fallow-coverage-project
          runtime-coverage: /tmp/fallow-coverage-project/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.1'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert coverage step ran
        env:
          OUTCOME: ${{ steps.action-coverage.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with coverage inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
