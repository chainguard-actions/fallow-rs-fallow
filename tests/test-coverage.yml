name: Test coverage inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project with coverage data
        run: |
          mkdir -p /tmp/fallow-cov-project
          cat > /tmp/fallow-cov-project/index.js << 'EOF'
          export function hello(a, b) {
            if (a) return 1;
            if (b) return 2;
            return 0;
          }
          EOF
          cat > /tmp/fallow-cov-project/package.json << 'EOF'
          { "name": "cov-project", "version": "1.0.0" }
          EOF
          # Create a minimal Istanbul coverage-final.json
          cat > /tmp/fallow-cov-project/coverage-final.json << 'EOF'
          {
            "/tmp/fallow-cov-project/index.js": {
              "path": "/tmp/fallow-cov-project/index.js",
              "statementMap": {"0": {"start":{"line":1,"column":0},"end":{"line":1,"column":40}}},
              "fnMap": {"0": {"name":"hello","decl":{"start":{"line":1,"column":0},"end":{"line":1,"column":40}},"loc":{"start":{"line":1,"column":0},"end":{"line":5,"column":1}},"line":1}},
              "branchMap": {},
              "s": {"0": 1},
              "f": {"0": 1},
              "b": {}
            }
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: /tmp/fallow-cov-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          coverage: /tmp/fallow-cov-project/coverage-final.json
          coverage-root: /tmp/fallow-cov-project
          runtime-coverage: /tmp/fallow-cov-project/coverage-final.json
          min-invocations-hot: '100'
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
