name: Test health with Istanbul coverage and coverage-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          format: json
          fail-on-issues: 'false'
          coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          coverage-root: '/original'
      - name: Assert coverage-aware health run succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: health with coverage failed"
            exit 1
          fi
          if [ -z "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results missing or invalid"
            exit 1
          fi
          echo "PASS"
