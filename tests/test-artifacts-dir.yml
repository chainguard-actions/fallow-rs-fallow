name: Test artifacts-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project and artifacts directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/artifacts-project/src"
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/artifacts-output"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/artifacts-project/package.json" <<'EOF'
          {
            "name": "artifacts-test-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/artifacts-project/src/index.js" <<'EOF'
          export function main() { return 1; }
          export function unused() { return 2; }
          main();
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/artifacts-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          artifacts-dir: tests/fixtures/artifacts-output

      - name: Assert results file is in the artifacts directory
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results path: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at: $RESULTS"
            exit 1
          fi
          # Check that the results file is inside the artifacts-dir
          if [[ "$RESULTS" != *"tests/fixtures/artifacts-output"* ]]; then
            echo "FAIL: results file '$RESULTS' is not in the expected artifacts-dir"
            exit 1
          fi
          echo "PASS: results file is in the artifacts directory"

      - name: Assert issues output is a number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected issues to be a number, got: '$ISSUES'"
            exit 1
          fi
          echo "PASS: issues=$ISSUES"
