name: Test artifacts-dir output
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create artifacts directory
        run: mkdir -p fallow-artifacts

      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/js-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          artifacts-dir: fallow-artifacts

      - name: Assert results output points into artifacts-dir
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: results output is empty"
            exit 1
          fi
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file does not exist at $RESULTS"
            exit 1
          fi
          # Verify the file is in the artifacts directory
          if ! echo "$RESULTS" | grep -q "fallow-artifacts"; then
            echo "FAIL: results file '$RESULTS' is not in fallow-artifacts"
            exit 1
          fi
          echo "PASS: results file is in the artifacts directory: $RESULTS"

      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          if ! jq empty "$RESULTS" 2>/dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS: results file is valid JSON"
