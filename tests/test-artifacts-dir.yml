name: Test custom artifacts-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/unused-project
          version: '3.43.1'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts
      - name: Assert results written into artifacts-dir
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          ls -la fallow-artifacts || true
          case "$RESULTS" in
            *fallow-artifacts/*) ;;
            *) echo "FAIL: results path not inside artifacts-dir"; exit 1 ;;
          esac
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected issues"
            exit 1
          fi
          echo "PASS"
