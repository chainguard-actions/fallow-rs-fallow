name: Test custom artifacts-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare artifacts dir
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-artifacts"
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts
      - name: Assert results written to artifacts-dir
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          ls -la "$GITHUB_WORKSPACE/fallow-artifacts" || true
          case "$RESULTS" in
            *fallow-artifacts/*) ;;
            *) echo "FAIL: results path not under fallow-artifacts"; exit 1 ;;
          esac
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$f" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq -e . "$f" > /dev/null || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
