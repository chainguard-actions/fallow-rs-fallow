name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project with config file
        run: |
          mkdir -p /tmp/fallow-config-project
          cat > /tmp/fallow-config-project/package.json <<'EOF'
          {
            "name": "config-test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-config-project/index.js <<'EOF'
          export function used() { return 42; }
          export function unused() { return 0; }
          EOF
          cat > /tmp/fallow-config-project/.fallowrc.json <<'EOF'
          {
            "ignore": []
          }
          EOF

      - name: Run dead-code with config input
        id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-config-project
          config: /tmp/fallow-config-project/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
