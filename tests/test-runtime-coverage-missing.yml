name: Test runtime-coverage with a missing input path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: health
          root: tests/fixtures/clean-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          runtime-coverage: ${{ github.workspace }}/does-not-exist/coverage
          min-invocations-hot: '100'
          min-observation-volume: '1000'
          low-traffic-threshold: '0.01'
          artifacts-dir: fallow-artifacts-runtime-coverage
      - name: Assert the action failed on the missing runtime coverage input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent runtime-coverage path"
            exit 1
          fi
          echo "PASS"
      - name: Assert fallow itself was installed (failure came from analysis)
        run: |
          fallow --version || { echo "FAIL: install did not complete"; exit 1; }
          echo "PASS"
