name: Test dupes advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project with duplicated code
        run: |
          mkdir -p /tmp/fallow-dupes-test
          cat > /tmp/fallow-dupes-test/package.json << 'EOF'
          {
            "name": "dupes-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dupes-test/a.js << 'EOF'
          export function processData(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push({ id: item.id, name: item.name, value: item.value * 2 });
              }
            }
            return result;
          }
          EOF
          cat > /tmp/fallow-dupes-test/b.js << 'EOF'
          export function processItems(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push({ id: item.id, name: item.name, value: item.value * 2 });
              }
            }
            return result;
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-test
          format: json
          fail-on-issues: 'false'
          min-tokens: '50'
          min-lines: '3'
          threshold: '0'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
