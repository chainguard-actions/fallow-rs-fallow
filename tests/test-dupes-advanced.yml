name: Test dupes advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with duplicated code
        run: |
          mkdir -p /tmp/fallow-dupes-project
          cat > /tmp/fallow-dupes-project/a.js << 'EOF'
          export function processData(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push({ id: item.id, name: item.name, value: item.value });
              }
            }
            return result;
          }
          EOF
          cat > /tmp/fallow-dupes-project/b.js << 'EOF'
          export function filterData(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push({ id: item.id, name: item.name, value: item.value });
              }
            }
            return result;
          }
          EOF
          cat > /tmp/fallow-dupes-project/package.json << 'EOF'
          { "name": "dupes-test", "version": "1.0.0", "type": "module" }
          EOF

      - id: action-dupes-advanced
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-project
          format: json
          fail-on-issues: 'false'
          min-tokens: '20'
          min-lines: '3'
          threshold: '0'
          annotations: 'false'
          auto-changed-since: 'false'

      - name: Assert dupes advanced step ran
        env:
          OUTCOME: ${{ steps.action-dupes-advanced.outcome }}
          ISSUES: ${{ steps.action-dupes-advanced.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with min-tokens/min-lines/threshold (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
