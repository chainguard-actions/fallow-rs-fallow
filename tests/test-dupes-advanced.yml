name: Test advanced dupes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project with duplicated code
        run: |
          mkdir -p /tmp/fallow-test-project
          cat > /tmp/fallow-test-project/a.js << 'EOF'
          export function processData(data) {
            const result = [];
            for (const item of data) {
              if (item.active) {
                result.push({ id: item.id, name: item.name });
              }
            }
            return result;
          }
          EOF
          cat > /tmp/fallow-test-project/b.js << 'EOF'
          export function processItems(items) {
            const result = [];
            for (const item of items) {
              if (item.active) {
                result.push({ id: item.id, name: item.name });
              }
            }
            return result;
          }
          EOF
          cat > /tmp/fallow-test-project/package.json << 'EOF'
          { "name": "test-project", "version": "1.0.0", "type": "module" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-test-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          min-tokens: '50'
          min-lines: '3'
          threshold: '0'
      - name: Assert action ran with dupes advanced inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
