name: Test dupes advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create JS files with duplication for analysis
        run: |
          mkdir -p /tmp/fallow-dupes-project
          cat > /tmp/fallow-dupes-project/a.js << 'EOF'
          export function doSomething(x, y, z) {
            const result = x + y + z;
            const doubled = result * 2;
            return doubled;
          }
          EOF
          cat > /tmp/fallow-dupes-project/b.js << 'EOF'
          export function doSomethingElse(x, y, z) {
            const result = x + y + z;
            const doubled = result * 2;
            return doubled;
          }
          EOF
          cat > /tmp/fallow-dupes-project/package.json << 'EOF'
          { "name": "dupes-project", "version": "1.0.0" }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-project
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          min-tokens: '20'
          min-lines: '2'
          threshold: '0'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
