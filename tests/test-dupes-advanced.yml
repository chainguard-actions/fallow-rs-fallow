name: Test dupes advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for duplication analysis
        run: |
          mkdir -p /tmp/fallow-dupes-project
          cat > /tmp/fallow-dupes-project/package.json <<'EOF'
          {
            "name": "dupes-test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-dupes-project/index.js <<'EOF'
          export function alpha(a, b, c) {
            const x = a + b;
            const y = b + c;
            const z = a + c;
            return x + y + z;
          }
          EOF
          cat > /tmp/fallow-dupes-project/other.js <<'EOF'
          export function beta(a, b, c) {
            const x = a + b;
            const y = b + c;
            const z = a + c;
            return x + y + z;
          }
          EOF

      - name: Run dupes with advanced inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: /tmp/fallow-dupes-project
          format: json
          fail-on-issues: 'false'
          threshold: '50'
          min-tokens: '20'
          min-lines: '3'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
