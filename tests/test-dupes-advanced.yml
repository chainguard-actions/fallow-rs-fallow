name: Test dupes advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal JS project for analysis
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/js-dupes-adv/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-dupes-adv/package.json" <<'EOF'
          {
            "name": "test-dupes-adv-project",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node src/index.js"
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/js-dupes-adv/src/index.js" <<'EOF'
          export function functionA(x, y, z) {
            const result = x * 2 + y * 3 + z * 4;
            const extra = result + x + y + z;
            return extra;
          }
          export function functionB(x, y, z) {
            const result = x * 2 + y * 3 + z * 4;
            const extra = result + x + y + z;
            return extra;
          }
          functionA(1, 2, 3);
          functionB(4, 5, 6);
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dupes
          root: tests/fixtures/js-dupes-adv
          format: json
          fail-on-issues: 'false'
          fail-on-empty-analysis: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          min-tokens: '50'
          min-lines: '5'
          threshold: '0'
          workspace: ''
          no-cache: 'true'

      - name: Assert action ran (dupes advanced inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected on minimal fixture)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
