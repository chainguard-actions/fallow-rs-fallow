name: Test runtime coverage inputs reject a non-integer min-invocations-hot
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # min-invocations-hot must be a positive integer; analyze.sh exits 2
      # before invoking the (paid) runtime coverage analysis.
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: health
          root: tests/fixtures/simple-js
          format: json
          runtime-coverage: ${{ github.workspace }}/tests/fixtures/coverage/coverage-final.json
          min-invocations-hot: not-a-number
          min-observation-volume: '10'
          low-traffic-threshold: '0.01'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer min-invocations-hot"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: expected no analysis to run"
            exit 1
          fi
          echo "PASS"
