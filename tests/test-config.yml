name: Test explicit config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          config: ${{ github.workspace }}/tests/fixtures/configs/ignore-orphan.json
          version: '3.39.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
          threads: '2'
      - name: Assert config applied (orphan.js ignored)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if grep -q 'orphan.js' "$RESULTS"; then
            echo "FAIL: orphan.js should be ignored by the config"
            head -c 4000 "$RESULTS"
            exit 1
          fi
          if ! grep -qE 'unusedHelper|UNUSED_CONSTANT' "$RESULTS"; then
            echo "FAIL: expected unused exports still reported"
            head -c 4000 "$RESULTS"
            exit 1
          fi
          echo "PASS"
