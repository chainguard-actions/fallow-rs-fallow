name: Test config and selector inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project with config file
        run: |
          mkdir -p /tmp/fallow-config-test
          cat > /tmp/fallow-config-test/package.json << 'EOF'
          {
            "name": "config-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-config-test/index.js << 'EOF'
          export function used() { return 42; }
          export function alsoUsed() { return 'hello'; }
          EOF
          cat > /tmp/fallow-config-test/.fallowrc.json << 'EOF'
          {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-config-test
          config: /tmp/fallow-config-test/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          issue-types: 'unused-exports,unused-files'
          threads: '2'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-skip-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          mkdir -p /tmp/fallow-skip-test
          cat > /tmp/fallow-skip-test/package.json << 'EOF'
          {
            "name": "skip-test",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-skip-test/index.js << 'EOF'
          export function used() { return 42; }
          EOF

      - id: action-skip
        uses: .
        continue-on-error: true
        with:
          root: /tmp/fallow-skip-test
          format: json
          fail-on-issues: 'false'
          skip: 'dupes,health'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert skip action ran
        env:
          OUTCOME: ${{ steps.action-skip.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-only
        uses: .
        continue-on-error: true
        with:
          root: /tmp/fallow-skip-test
          format: json
          fail-on-issues: 'false'
          only: 'dead-code'
          workspace: ''
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert only action ran
        env:
          OUTCOME: ${{ steps.action-only.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
