name: Test config and selector inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fallow config file
        run: |
          cat > /tmp/fallowrc.json << 'EOF'
          {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: .
          fail-on-issues: 'false'
          format: json
          config: /tmp/fallowrc.json
          issue-types: 'unused-exports,unused-files'
          threads: '2'
          auto-changed-since: 'false'
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
