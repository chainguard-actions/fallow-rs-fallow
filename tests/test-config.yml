name: Test dead-code with explicit config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project with a config file
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/config"
          mkdir -p "$P/src"
          echo '{"name":"config","version":"1.0.0","type":"module","scripts":{"start":"node src/index.js"}}' > "$P/package.json"
          cat > "$P/src/index.js" <<'EOF'
          export function used() { return 1; }
          export function unused() { return 2; }
          used();
          EOF
          echo '{}' > "$P/.fallowrc.json"

      - id: action
        uses: .
        with:
          command: dead-code
          root: act-fixtures/config
          config: ${{ github.workspace }}/act-fixtures/config/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'

      - name: Assert results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not a number"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid JSON"
            exit 1
          fi
          echo "PASS"
