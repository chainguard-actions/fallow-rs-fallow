name: Test explicit config file ignores orphan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          config: ${{ github.workspace }}/tests/fixtures/config/fallowrc.json
          version: '3.37.0'
          issue-types: unused-files
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert orphan.js ignored via config
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if [ ! -f "$F" ]; then
            echo "FAIL: results file not found"
            exit 1
          fi
          if jq -r '.. | objects | .path? // empty' "$F" 2>/dev/null | grep -q 'orphan.js'; then
            echo "FAIL: orphan.js should be ignored by config"
            exit 1
          fi
          echo "PASS"
