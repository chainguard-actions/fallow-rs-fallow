name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/config-project
          config: ${{ github.workspace }}/tests/fixtures/config-project/custom-fallow.json
          version: '3.38.0'
          fail-on-issues: 'true'
          type-aware: 'false'
          format: json
      - name: Assert config ignore pattern applied
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          [ -f "$RESULTS" ] && cat "$RESULTS"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues with orphan ignored via config"
            exit 1
          fi
          if grep -q "orphan.ts" "$RESULTS"; then
            echo "FAIL: orphan.ts should be ignored by the custom config"
            exit 1
          fi
          echo "PASS"
