name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal JS project with config file
        run: |
          mkdir -p /tmp/fallow-config-test
          cat > /tmp/fallow-config-test/package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat > /tmp/fallow-config-test/index.js <<'EOF'
          export function used() { return 42; }
          EOF
          cat > /tmp/fallow-config-test/.fallowrc.json <<'EOF'
          {
            "ignore": []
          }
          EOF
      - name: Run with config input
        id: with-config
        uses: .
        continue-on-error: true
        with:
          command: dead-code
          root: /tmp/fallow-config-test
          config: /tmp/fallow-config-test/.fallowrc.json
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
      - name: Assert config step ran
        env:
          OUTCOME: ${{ steps.with-config.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: config step ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
