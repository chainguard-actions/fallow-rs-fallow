name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FALLOW_SKIP_BINARY_VERIFY: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          gate: not-a-gate
          dead-code-baseline: dead-code-baseline.json
          health-baseline: health-baseline.json
          dupes-baseline: dupes-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          sarif: 'false'
          annotations: 'false'
          comment: 'false'
          no-cache: 'true'

      - name: Assert the invalid gate was rejected
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES' verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for gate=not-a-gate, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ISSUES" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
