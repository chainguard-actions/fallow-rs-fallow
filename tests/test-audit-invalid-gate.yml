name: Test audit command rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          gate: everything
          dead-code-baseline: baselines/dead-code.json
          health-baseline: baselines/health.json
          dupes-baseline: baselines/dupes.json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed on invalid gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for gate 'everything'"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: expected empty verdict when validation fails"
            exit 1
          fi
          echo "PASS"
