name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          gate: not-a-gate
          dead-code-baseline: fallow-dead-code-baseline.json
          health-baseline: fallow-health-baseline.json
          dupes-baseline: fallow-dupes-baseline.json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert the action failed on gate validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: no verdict expected when validation fails"
            exit 1
          fi
          echo "PASS"
