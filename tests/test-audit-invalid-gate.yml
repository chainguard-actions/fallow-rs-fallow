name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project and baseline files
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/audit-project"
          mkdir -p "$P/src"
          echo '{ "name": "audit-project", "version": "1.0.0", "type": "module", "main": "src/index.js" }' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"
          echo '{}' > "$GITHUB_WORKSPACE/dead-code-baseline.json"
          echo '{}' > "$GITHUB_WORKSPACE/health-baseline.json"
          echo '{}' > "$GITHUB_WORKSPACE/dupes-baseline.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/audit-project
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          gate: not-a-valid-gate
          dead-code-baseline: ${{ github.workspace }}/dead-code-baseline.json
          health-baseline: ${{ github.workspace }}/health-baseline.json
          dupes-baseline: ${{ github.workspace }}/dupes-baseline.json

      - name: Assert the action rejected the invalid gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          echo "PASS"
