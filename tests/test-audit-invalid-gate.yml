name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project and baseline files
        run: |
          P="$GITHUB_WORKSPACE/fallow-fixtures/audit-gate"
          mkdir -p "$P/src"
          echo '{"name":"audit-gate","version":"1.0.0","type":"module","main":"src/index.js"}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"
          echo '{}' > "$P/dead-code-baseline.json"
          echo '{}' > "$P/health-baseline.json"
          echo '{}' > "$P/dupes-baseline.json"

      # gate must be new-only or all; anything else is rejected with exit 2
      # before fallow runs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: fallow-fixtures/audit-gate
          format: json
          gate: everything
          dead-code-baseline: fallow-fixtures/audit-gate/dead-code-baseline.json
          health-baseline: fallow-fixtures/audit-gate/health-baseline.json
          dupes-baseline: fallow-fixtures/audit-gate/dupes-baseline.json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'

      - name: Assert the action failed on validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: $ISSUES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
