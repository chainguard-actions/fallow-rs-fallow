name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          P="$GITHUB_WORKSPACE/act-fixtures/audit"
          mkdir -p "$P/src"
          echo '{"name":"audit","version":"1.0.0","type":"module"}' > "$P/package.json"
          echo 'export const x = 1;' > "$P/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: act-fixtures/audit
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          gate: everything
          dead-code-baseline: act-fixtures/audit/dead-code-baseline.json
          health-baseline: act-fixtures/audit/health-baseline.json
          dupes-baseline: act-fixtures/audit/dupes-baseline.json

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate value"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: expected no verdict when validation rejects inputs"
            exit 1
          fi
          echo "PASS"
