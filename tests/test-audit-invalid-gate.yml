name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D"
          mkdir -p "$D/src"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          echo 'export const x = 1;' > "$D/src/index.ts"
          echo '{}' > "$D/dead-code-baseline.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: fallow-test-sample
          gate: not-a-valid-gate
          dead-code-baseline: ${{ github.workspace }}/fallow-test-sample/dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed on invalid gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: expected no verdict when validation rejects the gate"
            exit 1
          fi
          echo "PASS"
