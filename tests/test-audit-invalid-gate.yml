name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/dirty-project
          version: '3.46.0'
          gate: bogus
          dead-code-baseline: dead-code-baseline.json
          health-baseline: health-baseline.json
          dupes-baseline: dupes-baseline.json
          artifacts-dir: fallow-artifacts-audit-gate
      - name: Assert validation rejected the gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME issues: '$ISSUES' verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on gate=bogus"
            exit 1
          fi
          if [ -n "$ISSUES" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: analysis should not have run"
            exit 1
          fi
          echo "PASS"
