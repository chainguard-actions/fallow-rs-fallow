name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fixture project
        run: |
          set -e
          rm -rf fx
          mkdir -p fx/src
          echo '{"name":"fx-project","version":"1.0.0","private":true,"main":"src/index.js"}' > fx/package.json
          echo 'console.log(1);' > fx/src/index.js

      - id: action
        uses: .
        continue-on-error: true
        with:
          root: fx
          command: audit
          gate: bogus-gate
          dead-code-baseline: fx/dead-code-baseline.json
          health-baseline: fx/health-baseline.json
          dupes-baseline: fx/dupes-baseline.json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: no verdict expected when validation fails"
            exit 1
          fi
          echo "PASS"
