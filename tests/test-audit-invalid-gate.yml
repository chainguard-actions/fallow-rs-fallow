name: Test audit rejects invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: audit
          root: tests/fixtures/simple-js
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          gate: bogus
          dead-code-baseline: dead-code-baseline.json
          health-baseline: health-baseline.json
          dupes-baseline: dupes-baseline.json

      - name: Assert action failed gate validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "FAIL: audit should not have produced a verdict"
            exit 1
          fi
          echo "PASS: invalid gate rejected"
