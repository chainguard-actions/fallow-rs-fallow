name: Test audit rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal JS project
        run: |
          R="$GITHUB_WORKSPACE/tests/fixtures/audit-project"
          mkdir -p "$R/src"
          echo '{"name":"audit-project","version":"1.0.0","type":"module","main":"src/index.js"}' > "$R/package.json"
          echo 'export const x = 1;' > "$R/src/index.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          root: tests/fixtures/audit-project
          format: json
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          gate: bogus-gate
          dead-code-baseline: baselines/dead-code.json
          health-baseline: baselines/health.json
          dupes-baseline: baselines/dupes.json

      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULTS: ${{ steps.action.outputs.results }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "results: $RESULTS"
          echo "verdict: $VERDICT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid gate"
            exit 1
          fi
          if [ -n "$RESULTS" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: expected no results/verdict when validation fails"
            exit 1
          fi
          echo "PASS"
