name: Test audit command rejects an invalid gate value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: audit
          gate: sometimes
          dead-code-baseline: fallow-dead-code-baseline.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert action rejected the gate
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES' verdict: '$VERDICT'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for gate=sometimes"
            exit 1
          fi
          if [ -n "$ISSUES" ] || [ -n "$VERDICT" ]; then
            echo "FAIL: expected no issues/verdict output after validation error"
            exit 1
          fi
          echo "PASS"
