name: Test explicit config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          config: ${{ github.workspace }}/tests/fixtures/fallow-config/.fallowrc.json
          version: '3.36.0'
          fail-on-issues: 'false'
          artifacts-dir: fallow-artifacts-config
      - name: Assert analysis ran with config
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one issue (orphan.ts)"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          if [ -z "$RESULTS" ] || [ ! -s "$FILE" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
