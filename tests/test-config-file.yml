name: Test dead-code with an explicit config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project and config
        run: |
          set -e
          D="$GITHUB_WORKSPACE/fallow-test-sample"
          rm -rf "$D"
          mkdir -p "$D/src/ignored"
          cat > "$D/package.json" <<'EOF'
          {"name":"fallow-test-sample","version":"1.0.0","private":true,"main":"src/index.ts"}
          EOF
          cat > "$D/src/index.ts" <<'EOF'
          export function main(): number {
            return 1;
          }
          main();
          EOF
          echo 'export const ignoredThing = 1;' > "$D/src/ignored/thing.ts"
          cat > "$D/.fallowrc.json" <<'EOF'
          {
            "entry": ["src/index.ts"],
            "ignorePatterns": ["src/ignored/**"]
          }
          EOF

      - id: action
        uses: .
        with:
          command: dead-code
          root: fallow-test-sample
          config: ${{ github.workspace }}/fallow-test-sample/.fallowrc.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert run succeeded with config
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES results: $RESULTS"
          if ! echo "$ISSUES" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected a non-negative integer, got '$ISSUES'"
            exit 1
          fi
          if [ ! -f "$RESULTS" ] || ! jq empty "$RESULTS"; then
            echo "FAIL: results file missing or invalid"
            exit 1
          fi
          if grep -q 'ignored/thing.ts' "$RESULTS"; then
            echo "FAIL: ignored file appears in results despite ignorePatterns"
            exit 1
          fi
          echo "PASS"
