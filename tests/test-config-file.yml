name: Test dead-code with explicit config file ignoring a file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
          issue-types: unused-files
          version: '3.37.0'
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert orphan.js ignored via config
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 unused files after ignoring orphan.js"
            exit 1
          fi
          echo "PASS"
