name: Test explicit config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/project-clean
          version: 3.42.0
          type-aware: 'false'
          fail-on-issues: 'true'
          config: ${{ github.workspace }}/tests/fixtures/config/.fallowrc.json
      - name: Assert clean run with config
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 issues"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          echo "PASS"
