name: Test saving baselines and loading them in a combined run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare baseline directory
        run: mkdir -p "$GITHUB_WORKSPACE/fallow-baselines"
      - id: save-dead-code
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          artifacts-dir: fallow-artifacts-save-dc
      - id: save-health
        uses: .
        with:
          command: health
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          artifacts-dir: fallow-artifacts-save-health
      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          save-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          artifacts-dir: fallow-artifacts-save-dupes
      - name: Assert baseline files saved
        run: |
          ls -la "$GITHUB_WORKSPACE/fallow-baselines"
          for f in dead-code health dupes; do
            p="$GITHUB_WORKSPACE/fallow-baselines/$f.json"
            if [ ! -f "$p" ]; then
              echo "FAIL: $p not saved"
              exit 1
            fi
            jq empty "$p" || { echo "FAIL: $p is not valid JSON"; exit 1; }
          done
          echo "PASS"
      - id: combined
        uses: .
        with:
          root: tests/fixtures/dirty-project
          version: '3.38.1'
          type-aware: 'false'
          fail-on-issues: 'false'
          baseline: ${{ github.workspace }}/fallow-baselines/dead-code.json
          health-baseline: ${{ github.workspace }}/fallow-baselines/health.json
          dupes-baseline: ${{ github.workspace }}/fallow-baselines/dupes.json
          artifacts-dir: fallow-artifacts-combined-baseline
      - name: Assert combined run loaded the baseline
        env:
          RESULTS: ${{ steps.combined.outputs.results }}
          ISSUES: ${{ steps.combined.outputs.issues }}
          BASELINE_PATH: ${{ steps.combined.outputs.baseline-path }}
          ENTRIES: ${{ steps.combined.outputs.baseline-entries }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ -n "$ENTRIES" ] && ! [[ "$ENTRIES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: baseline-entries is not numeric"
            exit 1
          fi
          echo "PASS"
