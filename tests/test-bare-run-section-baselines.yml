name: Test combined run with only selector and health/dupes baselines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project
        run: |
          set -e
          mkdir -p sample/src baselines
          cat > sample/package.json <<'EOF'
          {"name":"sample","version":"1.0.0","private":true,"type":"module","main":"src/index.js"}
          EOF
          cat > sample/src/index.js <<'EOF'
          import { add } from './math.js';
          console.log(add(1, 2));
          EOF
          cat > sample/src/math.js <<'EOF'
          export function add(a, b) { return a + b; }
          EOF

      - id: save-health
        uses: .
        with:
          command: health
          root: sample
          save-baseline: ${{ github.workspace }}/baselines/health.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - id: save-dupes
        uses: .
        with:
          command: dupes
          root: sample
          save-baseline: ${{ github.workspace }}/baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert section baselines saved
        run: |
          ls -la baselines || true
          for f in baselines/health.json baselines/dupes.json; do
            [ -f "$f" ] || { echo "FAIL: $f missing"; exit 1; }
          done
          echo "PASS"

      - id: action
        uses: .
        with:
          root: sample
          only: health,dupes
          health-baseline: ${{ github.workspace }}/baselines/health.json
          dupes-baseline: ${{ github.workspace }}/baselines/dupes.json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          format: json

      - name: Assert combined run produced results
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if [ -z "$ISSUES" ]; then
            echo "FAIL: issues output empty"
            exit 1
          fi
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          jq empty "$RESULTS" || { echo "FAIL: invalid JSON"; exit 1; }
          echo "PASS"
