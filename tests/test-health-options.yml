name: Test health command options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          command: health
          root: .
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          max-cyclomatic: '30'
          max-cognitive: '20'
          max-crap: '50'
          min-severity: 'high'
          min-score: ''
          sort: 'cyclomatic'
          top: '10'
          since: '1y'
          min-commits: '3'
          save-snapshot: ''
          trend: ''
          min-invocations-hot: '100'
          min-observation-volume: ''
          low-traffic-threshold: ''
      - name: Assert issues output is set
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ -z "$ISSUES" ]; then
            echo "FAIL: expected issues output to be set"
            exit 1
          fi
          echo "PASS"
