name: Test dead-code report without failing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.44.0
          fail-on-issues: 'false'
          sarif: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert issues output is a positive number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused-code issue (orphan.ts / subtract)"
            exit 1
          fi
          echo "PASS"
      - name: Assert results file is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq -e '.total_issues' "$RESULTS" > /dev/null; then
            echo "FAIL: results file lacks total_issues"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
      - name: Assert verdict empty for non-audit command
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: '$VERDICT'"
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty for dead-code"
            exit 1
          fi
          echo "PASS"
