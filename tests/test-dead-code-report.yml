name: Test dead-code report (fail-on-issues false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-deadcode
      - name: Assert issues output is a positive number
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues is not numeric"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused code issue (orphan.ts / unused export)"
            exit 1
          fi
          echo "PASS"
      - name: Assert results file exists and is valid JSON
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *fallow-out-deadcode/fallow-results.json) ;;
            *) echo "FAIL: results path not under artifacts-dir"; exit 1 ;;
          esac
          if [ ! -f "$RESULTS" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! jq -e . "$RESULTS" > /dev/null; then
            echo "FAIL: results file is not valid JSON"
            exit 1
          fi
          echo "PASS"
      - name: Assert verdict empty for non-audit command
        env:
          VERDICT: ${{ steps.action.outputs.verdict }}
        run: |
          echo "verdict: '$VERDICT'"
          if [ -n "$VERDICT" ]; then
            echo "FAIL: verdict should be empty for dead-code"
            exit 1
          fi
          echo "PASS"
