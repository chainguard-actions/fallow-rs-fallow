name: Test invalid threads input is rejected (workspace scoping inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # threads must be a positive integer; analyze.sh rejects it with exit 2
      # before invoking fallow, regardless of the workspace scoping inputs.
      - id: action
        uses: .
        continue-on-error: true
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          workspace: 'apps/*'
          changed-workspaces: HEAD
          threads: 'many'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'

      - name: Assert action rejected invalid threads
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues: '$ISSUES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for threads='many'"
            exit 1
          fi
          if [ -n "$ISSUES" ]; then
            echo "FAIL: issues should be empty when validation fails"
            exit 1
          fi
          echo "PASS"
