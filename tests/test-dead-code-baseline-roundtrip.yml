name: Test dead-code baseline save and load roundtrip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          issue-types: 'unused-exports,unused-files'
          threads: '2'
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-baseline: ${{ runner.temp }}/fallow-dead-code-baseline.json
          save-regression-baseline: ${{ runner.temp }}/fallow-regression-baseline.json

      - name: Assert baselines were saved
        env:
          ISSUES: ${{ steps.save.outputs.issues }}
          BASELINE: ${{ runner.temp }}/fallow-dead-code-baseline.json
          REGRESSION: ${{ runner.temp }}/fallow-regression-baseline.json
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number: '$ISSUES'"
            exit 1
          fi
          for f in "$BASELINE" "$REGRESSION"; do
            echo "checking $f"
            if [ ! -f "$f" ]; then
              echo "FAIL: baseline file not written: $f"
              exit 1
            fi
            if ! jq empty "$f" 2>/dev/null; then
              echo "FAIL: baseline file is not valid JSON: $f"
              cat "$f"
              exit 1
            fi
          done
          echo "PASS: both baselines saved"

      - id: load
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          config: ${{ github.workspace }}/tests/fixtures/simple-js/.fallowrc.json
          issue-types: 'unused-exports,unused-files'
          format: json
          fail-on-issues: 'true'
          auto-changed-since: 'false'
          annotations: 'false'
          baseline: ${{ runner.temp }}/fallow-dead-code-baseline.json
          regression-baseline: ${{ runner.temp }}/fallow-regression-baseline.json

      - name: Assert baseline suppressed existing findings
        env:
          ISSUES: ${{ steps.load.outputs.issues }}
          BASELINE_PATH: ${{ steps.load.outputs.baseline-path }}
          EXPECTED_PATH: ${{ runner.temp }}/fallow-dead-code-baseline.json
          ENTRIES: ${{ steps.load.outputs.baseline-entries }}
          STALE: ${{ steps.load.outputs.baseline-stale-entries }}
        run: |
          echo "issues: $ISSUES"
          echo "baseline-path: $BASELINE_PATH"
          echo "baseline-entries: $ENTRIES stale: $STALE"
          if [ "$ISSUES" != "0" ]; then
            echo "FAIL: expected 0 new issues with baseline loaded"
            exit 1
          fi
          if [ "$BASELINE_PATH" != "$EXPECTED_PATH" ]; then
            echo "FAIL: baseline-path output does not echo the baseline input"
            exit 1
          fi
          echo "PASS"
