name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - id: save
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json

      - name: Assert regression baseline saved
        run: |
          cat fallow-analysis-args.sh
          grep -q -- '--save-regression-baseline' fallow-analysis-args.sh || { echo "FAIL: flag not forwarded"; exit 1; }
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not saved at $F"
            exit 1
          fi
          echo "PASS"

      - id: compare
        uses: .
        env:
          FALLOW_SKIP_BINARY_VERIFY: '1'
        with:
          command: dead-code
          root: tests/fixtures/simple-js
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json

      - name: Assert regression comparison ran
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          cat fallow-analysis-args.sh
          grep -q -- '--regression-baseline' fallow-analysis-args.sh || { echo "FAIL: flag not forwarded"; exit 1; }
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues not numeric"
            exit 1
          fi
          echo "PASS"
