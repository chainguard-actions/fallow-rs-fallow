name: Test dead-code save-regression-baseline then regression-baseline
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a JS project with unused code
        run: |
          P="$GITHUB_WORKSPACE/tests/fixtures/dead-code-regression-project"
          mkdir -p "$P/src"
          cat > "$P/package.json" <<'EOF'
          {
            "name": "dead-code-regression-project",
            "version": "1.0.0",
            "type": "module",
            "main": "src/index.js",
            "scripts": { "start": "node src/index.js" }
          }
          EOF
          cat > "$P/src/index.js" <<'EOF'
          import { used } from './used.js';
          console.log(used());
          EOF
          cat > "$P/src/used.js" <<'EOF'
          export function used() { return 1; }
          export function unusedExport() { return 2; }
          EOF

      - id: save
        name: Save a regression baseline
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-regression-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          save-regression-baseline: ${{ github.workspace }}/fallow-regression.json

      - name: Assert regression baseline file was written
        run: |
          F="$GITHUB_WORKSPACE/fallow-regression.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: regression baseline not found at $F"
            exit 1
          fi
          jq empty "$F" || { echo "FAIL: not valid JSON"; exit 1; }
          echo "PASS"

      - id: compare
        name: Compare against the regression baseline (no regression)
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-regression-project
          format: json
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          annotations: 'false'
          sarif: 'false'
          no-cache: 'true'
          fail-on-regression: 'true'
          regression-baseline: ${{ github.workspace }}/fallow-regression.json

      - name: Assert comparison ran
        env:
          ISSUES: ${{ steps.compare.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: expected numeric issues, got '$ISSUES'"
            exit 1
          fi
          echo "PASS"
