name: Test issue-types restricts to unused-files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.38.0'
          type-aware: 'false'
          fail-on-issues: 'false'
          format: json
          issue-types: unused-files
      - name: Assert only unused files reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused file"
            exit 1
          fi
          if ! grep -q 'orphan' "$RESULTS"; then
            echo "FAIL: expected orphan.ts as unused file"
            exit 1
          fi
          if grep -q 'neverUsedHelper' "$RESULTS"; then
            echo "FAIL: unused export reported despite issue-types=unused-files"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
