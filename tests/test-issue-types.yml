name: Test issue-types input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: .
          format: json
          fail-on-issues: 'false'
          annotations: 'false'
          auto-changed-since: 'false'
          issue-types: 'unused-exports,unused-files'
      - name: Assert issues output is set
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues: $ISSUES"
          if [ -z "$ISSUES" ]; then
            echo "FAIL: expected issues output to be set"
            exit 1
          fi
          echo "PASS"
