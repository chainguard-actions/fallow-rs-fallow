name: Test dead-code restricted issue types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          version: '3.36.0'
          fail-on-issues: 'false'
          issue-types: unused-files
          threads: '2'
          artifacts-dir: fallow-artifacts-issue-types
      - name: Assert unused file reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          echo "results: $RESULTS"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues output is not a number"
            exit 1
          fi
          if [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected orphan.ts as unused file"
            exit 1
          fi
          case "$RESULTS" in
            /*) FILE="$RESULTS" ;;
            *) FILE="$GITHUB_WORKSPACE/$RESULTS" ;;
          esac
          jq empty "$FILE" || { echo "FAIL: invalid JSON"; exit 1; }
          if ! grep -q "orphan" "$FILE"; then
            echo "FAIL: orphan.ts not reported"
            cat "$FILE"
            exit 1
          fi
          echo "PASS"
