name: Test dead-code with issue-types filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/act-fixtures/sample-project
          issue-types: unused-files
          fail-on-issues: 'false'
          artifacts-dir: fallow-out-issue-types
      - name: Assert issue-types forwarded and orphan file reported
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          ARGS_FILE="fallow-out-issue-types/fallow-analysis-args.sh"
          cat "$ARGS_FILE"
          grep -qF -- "--unused-files" "$ARGS_FILE" || { echo "FAIL: --unused-files not forwarded"; exit 1; }
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused file"
            exit 1
          fi
          if ! grep -q 'orphan' "$RESULTS"; then
            echo "FAIL: orphan.ts not reported as unused file"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
