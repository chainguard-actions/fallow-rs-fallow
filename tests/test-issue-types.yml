name: Test dead-code filtered by issue-types
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: all
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dead-code-project
          version: '3.37.0'
          issue-types: unused-files
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          type-aware: 'false'
      - name: Assert issue-types filter applied
        env:
          ALL: ${{ steps.all.outputs.issues }}
          FILTERED: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "all: $ALL filtered: $FILTERED"
          if ! [[ "$ALL" =~ ^[0-9]+$ ]] || ! [[ "$FILTERED" =~ ^[0-9]+$ ]]; then
            echo "FAIL: issues outputs are not numbers"
            exit 1
          fi
          if [ "$FILTERED" -lt 1 ]; then
            echo "FAIL: expected unused-files finding (orphan.js)"
            exit 1
          fi
          if [ "$FILTERED" -gt "$ALL" ]; then
            echo "FAIL: filtered count must not exceed unfiltered count"
            exit 1
          fi
          F="$RESULTS"
          [ -f "$F" ] || F="$GITHUB_WORKSPACE/$RESULTS"
          if ! grep -q 'orphan' "$F"; then
            echo "FAIL: expected orphan.js in unused-files results"
            exit 1
          fi
          echo "PASS"
