name: Test issue-types filter (unused-deps)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/sample-project
          issue-types: unused-deps
          version: 3.35.0
          fail-on-issues: 'false'
          auto-changed-since: 'false'
          artifacts-dir: fallow-out-issue-types
      - name: Assert left-pad is reported as unused dependency
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "issues: $ISSUES"
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one issue"
            exit 1
          fi
          if ! grep -q 'left-pad' "$RESULTS"; then
            echo "FAIL: left-pad not reported"
            cat "$RESULTS"
            exit 1
          fi
          echo "PASS"
