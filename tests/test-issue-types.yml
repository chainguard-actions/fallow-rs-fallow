name: Test dead-code restricted to unused-files issue type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: dead-code
          root: tests/fixtures/dirty-project
          version: '3.41.0'
          format: json
          type-aware: 'false'
          auto-changed-since: 'false'
          fail-on-issues: 'false'
          annotations: 'false'
          issue-types: unused-files
      - name: Assert orphan file reported
        env:
          RESULTS: ${{ steps.action.outputs.results }}
          ISSUES: ${{ steps.action.outputs.issues }}
        run: |
          echo "results: $RESULTS"
          echo "issues: $ISSUES"
          f="$RESULTS"
          [ -f "$f" ] || f="$GITHUB_WORKSPACE/$RESULTS"
          if [ -z "$RESULTS" ] || [ ! -f "$f" ]; then
            echo "FAIL: results file missing"
            exit 1
          fi
          if ! [[ "$ISSUES" =~ ^[0-9]+$ ]] || [ "$ISSUES" -lt 1 ]; then
            echo "FAIL: expected at least one unused file"
            exit 1
          fi
          if ! grep -q "orphan" "$f"; then
            echo "FAIL: expected orphan.ts in unused files"
            head -c 4000 "$f"
            exit 1
          fi
          echo "PASS"
